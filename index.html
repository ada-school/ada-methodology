<script type="text/markdown" data-path="examples/growth-mindset-micro-credential/atoms/atom-5-failure-resume-feedback.md">## ⚛ Learning Atom 5 — *Failure Résumé & Feedback Seeking*

**Phase:** 🙊 3 (*do*) → 🐵 4 (*share*) · **KSA:** 🌱 Ability · **Target level:** L2→L3
· **Component id:** `A-growth-mindset` (+ `A-adaptability`)

### 🎯 Learning objective

- **Demonstrate** growth-mindset *behavior*: reinterpret real failures as learning, and
  proactively seek challenging feedback — across more than one occasion, with peers watching.

### 🧩 Prerequisites

- Atoms 1–4. Willingness to be a little uncomfortable in front of peers (that's the point).

### 🧭 Atom description

You can't quiz your way to an attitude. This atom builds the **Ability** through two authentic,
slightly vulnerable acts that high performers do on purpose: writing a **failure résumé** and
**actively soliciting hard feedback** — then sharing both with a peer group. This is your first
*behavioral* evidence, assessed across occasions.

---

### 📖 Reading — *Why the best professionals collect their failures* (≈ 5 min)

> Author: ADA Methodology.

Most résumés are highlight reels. A **failure résumé** (popularized by Stanford's Tina Seelig
and economist Johannes Haushofer, who published his own) is the inverse: a deliberate record of
rejections, flops, and dead ends — *plus what each one taught you.* Writing one does three
things. It **normalizes failure** as the cost of attempting hard things (if your résumé has no
failures, you haven't reached far enough). It **converts events into data** — the core
growth-mindset move from Atom 1, now applied to your own history. And it **builds the muscle of
saying it out loud**, which is what makes feedback-seeking possible.

**Feedback seeking** is the second behavior, and it's a stronger signal of a growth mindset than
feedback *receiving*. Research on feedback-seeking behavior shows that people who actively ask
for critical input learn and adapt faster — but most of us avoid it because, in the moment, it
threatens our competence image (the fixed trigger from Atom 2). The fix is structural: ask a
**specific** question to a **specific** person at a **specific** time, so it's easy to give and
hard to dodge. *"What's one thing I could have done better in that review?"* beats *"any
feedback?"* every time.

The workplace stakes are real: McKinsey, BCG, and Accenture all tie organizational performance
to a *learning culture* where people surface mistakes and ask for help without fear. You can't
control the whole culture — but you can be the person who models it.

**Key takeaways**

- [ ] A failure résumé turns your own history into learning data and normalizes reaching far.
- [ ] **Seeking** feedback signals growth mindset more than passively receiving it.
- [ ] Make feedback easy to give: specific question + specific person + specific moment.
- [ ] Modeling this behavior quietly upgrades your team's psychological safety.

---

### 🎬 Watch — Failure & feedback as fuel

```youtube
https://www.youtube.com/watch?v=H14bBuluwB8
Angela Duckworth — "Grit: the power of passion and perseverance" (TED) — persistence + learning.
```

```youtube
https://www.youtube.com/watch?v=FWTNMzK9vG4
Sheila Heen — "How to use others' feedback to learn and grow" (receiving feedback well).
```

---

### 🖼️ See — Template: the Failure Résumé

![Failure résumé template — generated graphic](../img/atom-5-failure-resume-feedback.png)

> 🖼️ *Generated image — produced from the prompt below.*

```prompt
Design a clean one-page "Failure Résumé" template graphic. Header with a small phoenix/spark
icon and title "Failure Résumé — a record of reaches and lessons". Below, a 3-column table
styled like a résumé: column 1 "The reach / attempt", column 2 "What went wrong", column 3
"What it taught me → next reach". Add a sidebar callout: "If there are no failures here, aim
higher." Use ADA brand colors (Indigo #1E2A6E headers, Turquoise #15B5C6 rules, Gold #E0A53C
accent on the callout) on white, flat vector, professional, legible. A4 portrait.
```

---

### 🧪 Practice — Two behavioral acts (Project Task + Study Group)

**Act 1 — Write your Failure Résumé (occasion 1).** List 4–6 real reaches that didn't work out
(a rejected proposal, a missed deadline, a skill you bailed on). For each, add *what it taught
you* and *the next reach it points to.* No sugar-coating, no false modesty.

| The reach / attempt | What went wrong | What it taught me → next reach |
| ------------------- | --------------- | ------------------------------ |
| | | |
| | | |
| | | |

**Act 2 — Run a real feedback-seeking ask (occasion 2).** Pick something you did recently. Ask
**one specific person** a **specific** question within 48 hours. Record: the question you asked,
what you heard, and the one change you'll make. Resist defending yourself — your job is to
collect data.

**Share (Study Group).** Bring both to a small peer group (3–5 people). Each person reads one
failure-résumé line aloud and shares one piece of feedback they sought. Peers give *supportive
challenge*, not comfort. (occasion 3)

---

### ✅ Evaluate — Behavioral assessment (`ability-behavioral`)

| Criterion | Excellent (3) | Adequate (2) | Needs improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Failure as data** | Names real failures *and* the specific learning + next reach | Lists failures, thin on learning | Vague, defensive, or sanitized |
| **Feedback seeking** | Specific ask to a specific person; acted on it | Asked, but generic or unacted | Avoided / only received passively |
| **Out-loud vulnerability** | Shared candidly; gave peers supportive challenge | Shared with hedging | Withheld / deflected |
| **Across occasions** | Behavior consistent across all 3 occasions | 2 of 3 | Only when pushed |

> This produces **behavioral evidence** toward `A-growth-mindset` **L2→L3**. The Ability is not
> certified here alone — Atom 6 sustains it across weeks.

---

### 📦 Deliverable

- Failure résumé (4–6 lines) + a feedback-seeking log (question / response / change) + a
  one-line peer reflection from the study group.

### 🧠 Final reflection

- Which was harder — writing the failures or asking for the feedback? What does that tell you
  about your fixed-mindset triggers?

### 🔗 Sources to verify

- Tina Seelig (Stanford d.school) on the "failure résumé" · Johannes Haushofer's published "CV
  of Failures" · Stone & Heen, *Thanks for the Feedback* · feedback-seeking behavior research
  (Ashford et al.).

### 🧩 Connections

- **Predecessors:** Atoms 1–4. **Successors:** Atom 6 / capstone (sustain across 21 days + 360).
</script>
<script type="text/markdown" data-path="examples/growth-mindset-micro-credential/atoms/atom-6-growth-in-the-wild-capstone.md">## ⚛ Learning Atom 6 — *Growth in the Wild (21-Day Challenge)* · 🚀 Capstone

**Phase:** 🐵 4 · Collaboration & Reflection (*share*) · **KSA:** 🌱 Ability · **Target level:** L3
· **Component id:** `A-growth-mindset` (+ `A-adaptability`)

### 🎯 Learning objective

- **Sustain and evidence** a growth mindset on a *real* stretch goal over 21 days — running
  deliberate-practice loops, reframing setbacks, seeking feedback, and reflecting — culminating
  in a peer-reviewed showcase.

### 🧩 Prerequisites

- All prior atoms. A genuine, slightly scary stretch goal you can move on for three weeks.

### 🧭 Atom description

An attitude is proven by **behavior across time**, so the capstone is not a presentation you make
*about* growth mindset — it's three weeks of *living it* on something that matters, documented as
you go. This is the atom that turns the badge from "knows about" into "does." It integrates every
KSA in the course.

> 📄 The full grading brief is in [`../capstone.md`](../capstone.md); rubrics in
> [`../rubrics.md`](../rubrics.md).

---

### 🧪 The challenge

1. **Choose a stretch goal (Day 0).** Real and uncomfortable: *"run my first design review,"
   "ship a feature in an unfamiliar language," "give a talk at the team demo."* It must have a
   visible outcome and room to fail.
2. **Design the loop (Day 0).** Define your stretch targets, your feedback source(s), and a
   daily 20–40 min practice block. (Reuses Atom 4.)
3. **Run it for 21 days.** Each session: one deliberate-practice rep + capture feedback. Each
   time you hit a wall, run the **YET Loop** and log it. (Reuses Atoms 3–4.)
4. **Seek feedback weekly (×3 occasions).** A specific ask to a specific person each week.
   (Reuses Atom 5.)
5. **Keep a growth journal.** A short daily/most-days entry: what you attempted, what failed,
   what you learned, the next reach. (`read: Journal / Diary` modality.)
6. **Showcase (Demo Day).** A 5-minute share to the cohort: the goal, your biggest *useful*
   failure, what the feedback changed, and your evidence. Then a **peer + mentor 360**.

This gives the **5 assessed occasions** the primary Ability requires: the curveball reframes,
three feedback asks, the sustained journal, and the showcase.

---

### 📖 Read — Growth journal (your own, Journal / Diary)

Use this lightweight daily template (most days for 21 days):

```text
Day __ / 21   ·   Goal: ____________________
- Attempted today:
- Where it got hard (and my YET Loop reframe):
- Feedback / data I got:
- What I learned → next reach:
- Mindset self-rating (1 fixed ··· 5 growth): __
```

---

### 🖼️ See — The 21-day growth arc

![The 21-day growth arc — generated graphic](../img/atom-6-growth-in-the-wild-capstone.png)

> 🖼️ *Generated image — produced from the prompt below.*

```prompt
Create an inspiring but professional "21-Day Growth Arc" graphic. A horizontal timeline from
Day 0 to Day 21 shaped as a gently rising, jagged line (ups AND downs — show 3–4 dips labeled
"setback → reframe"). Mark "Week 1 / 2 / 3" checkpoints with small feedback-loop icons, and 3
gold stars at the weekly "feedback ask" points. End at a gold flag "Showcase + 360". Use ADA
brand colors (Indigo #1E2A6E line on light, Turquoise #15B5C6 checkpoints, Gold #E0A53C accents)
flat vector, clean sans-serif, high contrast. 16:9.
```

```mermaid
flowchart LR
  D0["Day 0<br/>Pick goal + design loop"] --> W1["Week 1<br/>reps · reframe · feedback #1"]
  W1 --> W2["Week 2<br/>reps · reframe · feedback #2"]
  W2 --> W3["Week 3<br/>reps · reframe · feedback #3"]
  W3 --> SHOW["🎤 Showcase + 360"]
  SHOW --> BADGE["🏅 Growth Mindset Practitioner"]
```

---

### 🤝 Collaborate — Showcase / Demo Day + 360

- **5-min showcase** per learner (template in `capstone.md`).
- **Peer 360:** each learner rates 2 peers on the behavioral rubric and gives one strength + one
  stretch.
- **Mentor review:** validates evidence against the rubric (human-in-the-loop sign-off).

---

### ✅ Evaluate — Behavioral rubric + Capstone-5

Graded with the **behavioral rubric** (consistency across the 5 occasions, self-awareness,
response to setback/feedback) **and** the standard **Capstone-5** rubric. Full tables in
[`../rubrics.md`](../rubrics.md).

> **Badge issued** when evidence from `atom-3`, `atom-4`, `atom-5`, and this capstone is verified
> → sets `A-growth-mindset = 3`, `A-adaptability = 2`, plus the two L2 Skills in the learner's
> [skills map](../skills-map.md).

---

### 📦 Deliverable

- 21-day growth journal + deliberate-practice logs + 3 feedback-ask records + a 5-minute
  showcase (slides or recording) + completed peer 360 forms.

### 🧠 Final reflection

- Compare your Day-0 and Day-21 mindset self-ratings. What *behavior* changed — and what will
  you keep doing after the badge?

### 🔗 Sources to verify

- Stanford Mindset Kit · Ericsson, *Peak* · McKinsey *Intentional learning* · YC Startup School.

### 🧩 Connections

- **Predecessors:** all atoms. **Successors:** the learner's [skills map](../skills-map.md) and
  job match.
</script>
<script type="text/markdown" data-path="guides/curriculum-design-guide.md"># 🗺️ ADA Curriculum Designer Guide

### Step-by-Step Manual for Designing ADA-Aligned Microcourses and Learning Atoms

This guide provides a **practical workflow** for instructors, mentors, and course designers to create **job-ready micro-credentials** using the **Applied Digital Apprenticeship (ADA) methodology**.

---

## 1. Define the Competency

Identify a **real-world job competency** that the learner must develop. Connect it to recognized frameworks when possible:

* [SFIA – Skills Framework for the Information Age.](https://sfia-online.org/en/framework)

* [O\*NET Online – Occupational Information Network (US).](https://www.onetonline.org/)

* [ESCO – European Skills, Competences, Qualifications and Occupations.](https://esco.ec.europa.eu/en)

* [ILO – International Labour Organization Skills and Employability.](https://www.ilo.org/skills/lang--en/index.htm)


---

## 2. Map Learning Objectives

Write **Bloom’s taxonomy-aligned objectives** that scaffold from lower-order (remember, understand) to higher-order (analyze, evaluate, create). Each objective should be measurable.

### Bloom’s Taxonomy Quick Reference

| Level      | Sample Verbs                     |
| ---------- | -------------------------------- |
| Remember   | list, define, recall             |
| Understand | explain, summarize, describe     |
| Apply      | use, implement, demonstrate      |
| Analyze    | differentiate, compare, organize |
| Evaluate   | critique, justify, assess        |
| Create     | design, construct, formulate     |

**Example:**

* **Remember**: "List the primary colors."
* **Understand**: "Explain how complementary colors interact."
* **Apply**: "Create a color wheel demonstrating complementary pairs."
* **Analyze**: "Compare traditional vs. digital color models."
* **Evaluate**: "Assess the effectiveness of a brand’s color palette."
* **Create**: "Design a color scheme for a new product launch."

---

## 3. Design Learning Atoms ⚛

Each **learning atom** focuses on a single learning objective and integrates **Concept → Example → Practice → Evaluation**.

### Atom Components

* **Read** – Articles, guides, infographics, case studies.
* **Listen** – Podcasts, expert interviews, narrated content.
* **Watch** – Videos, animations, demos, simulations.
* **Practice** – Labs, coding challenges, design tasks.
* **Evaluate** – Quizzes, rubrics, AI-driven checks.
* **Collaborate** – Peer feedback, discussions, mentor check-ins.

👉 Use the [Learning Atom Template](../templates/learning-atom-template.md) to design each atom.

---

## 4. Assemble Modules (Microcourse Structure)

Group **4–8 learning atoms** into modules with a clear theme. Each module should:

* Introduce a **theoretical foundation**.
* Include a **lab or applied challenge**.
* End with an **evaluation or reflection**.

👉 Use the [Microcourse Template](../templates/micro-credential-ada-template.md) for structuring.

---

## 5. Plan Assessment Strategy

Assessments should combine **formative (ongoing)** and **summative (final)** methods.

* **Labs & Atoms** → Mini-Rubric (3 criteria: Accuracy, Application, Clarity).
* **Capstone Project** → Standard Rubric (5 criteria: Relevance, Application, Problem-Solving & Creativity, Clarity & Communication, Collaboration & Reflection).

---

## 6. Define Deliverables

Clearly describe what learners will produce and how it demonstrates the competency.

* Examples: *Code repository, business plan, design prototype, research report, video pitch.*
* Deliverables must be **portfolio-ready** and **job-relevant**.

---

## 7. Human & Collaborative Interaction

Integrate opportunities for mentorship, feedback, and community learning.

* 🧑‍🏫 Mentor sessions / office hours
* 👥 Group challenges or peer reviews
* 🌐 Forums or Slack/Discord communities
* 🎤 Project presentations and showcases

---

## 8. Align with ADA Phases

Make sure your course flows through the **4 ADA learning phases**:

1. **🙉 Self-Guided Introduction** → readings, videos, quizzes.
2. **🙈 Visual Exploration** → demos, role-play, walkthroughes.
3. **🙊 Applied Practice** → labs, tools, simulations.
4. **🐵 Collaboration & Reflection** → peer interaction, project sharing.

---

## 9. Example Workflow

1. **Competency**: *Data Visualization with Python*.
2. **Objectives**: *Understand charts → Apply libraries → Create dashboard.*
3. **Atoms**: *Intro to matplotlib, Case study, Lab on bar charts.*
4. **Module**: *Data Visualization Basics.*
5. **Assessment**: *Mini-rubric for labs, capstone dashboard with rubric.*
6. **Deliverable**: *Interactive dashboard shared on GitHub.*
7. **Human Interaction**: *Peer feedback on dashboard design.*
8. **Phases**: *Concept (Self-study) → Demo (Visual) → Lab (Practice) → Peer Showcase (Collaboration).*

---

## ✅ Checklist for Designers

Use this checklist to ensure your micro-credential is ADA-aligned. Examples are included in italics for clarity.

* [ ] **Defined a real-world competency**
  *Example: "Ability to design a customer journey map for digital marketing."*
* [ ] **Linked to frameworks/standards (SFIA, O\*NET, ESCO, ILO)**
  *Example: "ESCO: Marketing Specialist – Customer Journey Design."*
* [ ] **Wrote Bloom-aligned learning objectives**
  *Example: "Analyze user behavior using funnel metrics."*
* [ ] **Designed 4–8 learning atoms**
  *Example: Atoms on customer personas, analytics dashboards, A/B testing.*
* [ ] **Assembled atoms into modules**
  *Example: Module = "User Analytics Basics" with 3 atoms + a lab.*
* [ ] **Defined assessments with rubrics**
  *Example: Mini-rubric for analytics lab; capstone rubric for final marketing strategy.*
* [ ] **Specified deliverables (portfolio-ready)**
  *Example: A customer journey map PDF and a data-driven marketing report.*
* [ ] **Planned human/collaborative elements**
  *Example: Weekly mentor Q\&A and peer review of reports.*
* [ ] **Mapped phases (Hear → See → Do → Share)**
  *Example: Self-study readings → Demo videos → Analytics lab → Peer showcase.*

---

> For inspiration, see the [Art Learning Atom Example](../examples/learning-atom-art.md) or [Art Learning Micro-Credential Example](../examples/art_microcredential_template.md).
</script>
<script type="text/markdown" data-path="guides/guia-design-curriculo.md"># 🗺️ Guia do Designer de Currículo ADA

### Manual Passo a Passo para Projetar Microcursos e Átomos de Aprendizado Alinhados com ADA

Este guia fornece um **fluxo de trabalho prático** para instrutores, mentores e designers de curso para criar **micro-credenciais prontas para o trabalho** usando a **metodologia de Aprendizado Digital Aplicado (ADA)**.

---

## 1. Definir a Competência

Identifique uma **competência profissional do mundo real** que o aprendiz deve desenvolver. Conecte-a com frameworks reconhecidos quando possível:

* [SFIA – Framework de Habilidades para a Era da Informação.](https://sfia-online.org/en/framework)

* [O\*NET Online – Rede de Informação Ocupacional (EUA).](https://www.onetonline.org/)

* [ESCO – Habilidades, Competências, Qualificações e Ocupações Europeias.](https://esco.ec.europa.eu/en)

* [OIT – Organização Internacional do Trabalho Habilidades e Empregabilidade.](https://www.ilo.org/skills/lang--en/index.htm)

---

## 2. Mapear Objetivos de Aprendizado

Escreva **objetivos alinhados com a taxonomia de Bloom** que progridam de ordem inferior (lembrar, compreender) para ordem superior (analisar, avaliar, criar). Cada objetivo deve ser mensurável.

### Referência Rápida da Taxonomia de Bloom

| Nível      | Verbos de Exemplo                           |
| ---------- | ------------------------------------------- |
| Lembrar    | listar, definir, recordar                  |
| Compreender| explicar, resumir, descrever               |
| Aplicar    | usar, implementar, demonstrar              |
| Analisar   | diferenciar, comparar, organizar           |
| Avaliar    | criticar, justificar, avaliar              |
| Criar      | projetar, construir, formular              |

**Exemplo:**

* **Lembrar**: "Listar as cores primárias."
* **Compreender**: "Explicar como as cores complementares interagem."
* **Aplicar**: "Criar um círculo cromático demonstrando pares complementares."
* **Analisar**: "Comparar modelos de cor tradicionais vs. digitais."
* **Avaliar**: "Avaliar a eficácia da paleta de cores de uma marca."
* **Criar**: "Projetar um esquema de cores para o lançamento de um novo produto."

---

## 3. Projetar Átomos de Aprendizado ⚛

Cada **átomo de aprendizado** foca em um único objetivo de aprendizado e integra **Conceito → Exemplo → Prática → Avaliação**.

### Componentes do Átomo

* **Ler** – Artigos, guias, infográficos, estudos de caso.
* **Escutar** – Podcasts, entrevistas de especialistas, conteúdo narrado.
* **Assistir** – Vídeos, animações, demonstrações, simulações.
* **Praticar** – Laboratórios, desafios de código, tarefas de design.
* **Avaliar** – Questionários, rubricas, verificações com IA.
* **Colaborar** – Feedback entre pares, discussões, check-ins com mentores.

👉 Use o [Modelo de Átomo de Aprendizado](../templates/learning-atom-template.md) para projetar cada átomo.

---

## 4. Montar Módulos (Estrutura de Microcurso)

Agrupe **4–8 átomos de aprendizado** em módulos com um tema claro. Cada módulo deve:

* Introduzir uma **base teórica**.
* Incluir um **laboratório ou desafio aplicado**.
* Terminar com uma **avaliação ou reflexão**.

👉 Use o [Modelo de Microcurso](../templates/micro-credential-ada-template.md) para estruturar.

---

## 5. Planejar Estratégia de Avaliação

As avaliações devem combinar métodos **formativos (contínuos)** e **somativos (finais)**.

* **Laboratórios e Átomos** → Mini-Rubrica (3 critérios: Precisão, Aplicação, Clareza).
* **Projeto Capstone** → Rubrica Padrão (5 critérios: Relevância, Aplicação, Resolução de Problemas e Criatividade, Clareza e Comunicação, Colaboração e Reflexão).

---

## 6. Definir Entregáveis

Descreva claramente o que os aprendizes produzirão e como isso demonstra a competência.

* Exemplos: *Repositório de código, plano de negócios, protótipo de design, relatório de pesquisa, pitch em vídeo.*
* Os entregáveis devem estar **prontos para portfólio** e ser **relevantes para o trabalho**.

---

## 7. Interação Humana e Colaborativa

Integre oportunidades para mentoria, feedback e aprendizado comunitário.

* 🧑‍🏫 Sessões de mentor / horário de atendimento
* 👥 Desafios em grupo ou revisões entre pares
* 🌐 Fóruns ou comunidades Slack/Discord
* 🎤 Apresentações de projetos e showcases

---

## 8. Alinhar com as Fases ADA

Certifique-se de que seu curso flua através das **4 fases de aprendizado ADA**:

1. **🙉 Introdução Autoguiada** → leituras, vídeos, questionários.
2. **🙈 Exploração Visual** → demonstrações, interpretação, percursos.
3. **🙊 Prática Aplicada** → laboratórios, ferramentas, simulações.
4. **🐵 Colaboração e Reflexão** → interação entre pares, compartilhamento de projetos.

---

## 9. Exemplo de Fluxo de Trabalho

1. **Competência**: *Visualização de Dados com Python*.
2. **Objetivos**: *Compreender gráficos → Aplicar bibliotecas → Criar dashboard.*
3. **Átomos**: *Introdução ao matplotlib, Estudo de caso, Laboratório sobre gráficos de barras.*
4. **Módulo**: *Fundamentos de Visualização de Dados.*
5. **Avaliação**: *Mini-rubrica para laboratórios, dashboard capstone com rubrica.*
6. **Entregável**: *Dashboard interativo compartilhado no GitHub.*
7. **Interação Humana**: *Feedback entre pares sobre design do dashboard.*
8. **Fases**: *Conceito (Autoestudo) → Demo (Visual) → Laboratório (Prática) → Showcase entre Pares (Colaboração).*

---

## ✅ Lista de Verificação para Designers

Use esta lista de verificação para garantir que sua micro-credencial esteja alinhada com ADA. Exemplos são incluídos em itálico para clareza.

* [ ] **Definiu uma competência do mundo real**
  *Exemplo: "Capacidade de projetar um mapa de jornada do cliente para marketing digital."*
* [ ] **Vinculado a frameworks/padrões (SFIA, O\*NET, ESCO, OIT)**
  *Exemplo: "ESCO: Especialista em Marketing – Design de Jornada do Cliente."*
* [ ] **Escreveu objetivos de aprendizado alinhados com Bloom**
  *Exemplo: "Analisar comportamento do usuário usando métricas de funil."*
* [ ] **Projetou 4–8 átomos de aprendizado**
  *Exemplo: Átomos sobre personas de clientes, dashboards de analytics, testes A/B.*
* [ ] **Montou átomos em módulos**
  *Exemplo: Módulo = "Fundamentos de Analytics do Usuário" com 3 átomos + um laboratório.*
* [ ] **Definiu avaliações com rubricas**
  *Exemplo: Mini-rubrica para laboratório de analytics; rubrica capstone para estratégia de marketing final.*
* [ ] **Especificou entregáveis (prontos para portfólio)**
  *Exemplo: Um PDF de mapa de jornada do cliente e um relatório de marketing baseado em dados.*
* [ ] **Planejou elementos humanos/colaborativos**
  *Exemplo: Q&A semanal com mentor e revisão entre pares de relatórios.*
* [ ] **Mapeou fases (Ouvir → Ver → Fazer → Compartilhar)**
  *Exemplo: Leituras de autoestudo → Vídeos de demonstração → Laboratório de analytics → Showcase entre pares.*

---

<script type="text/markdown" data-path="guides/guia-diseno-curriculos.md"># 🗺️ Guía del Diseñador de Currículos ADA

### Manual Paso a Paso para Diseñar Microcursos y Átomos de Aprendizaje Alineados con ADA

Esta guía proporciona un **flujo de trabajo práctico** para instructores, mentores y diseñadores de cursos para crear **micro-credenciales listas para el trabajo** usando la **metodología de Aprendizaje Digital Aplicado (ADA)**.

---

## 1. Definir la Competencia

Identifica una **competencia laboral del mundo real** que el estudiante debe desarrollar. Conéctala con marcos reconocidos cuando sea posible:

* [SFIA – Marco de Habilidades para la Era de la Información.](https://sfia-online.org/en/framework)

* [O\*NET Online – Red de Información Ocupacional (EE.UU.).](https://www.onetonline.org/)

* [ESCO – Habilidades, Competencias, Cualificaciones y Ocupaciones Europeas.](https://esco.ec.europa.eu/en)

* [OIT – Organización Internacional del Trabajo Habilidades y Empleabilidad.](https://www.ilo.org/skills/lang--en/index.htm)

---

## 2. Mapear Objetivos de Aprendizaje

Redacta **objetivos alineados con la taxonomía de Bloom** que progresen desde orden inferior (recordar, comprender) hasta orden superior (analizar, evaluar, crear). Cada objetivo debe ser medible.

### Referencia Rápida de la Taxonomía de Bloom

| Nivel      | Verbos de Ejemplo                           |
| ---------- | ------------------------------------------- |
| Recordar   | enumerar, definir, recordar                |
| Comprender | explicar, resumir, describir               |
| Aplicar    | usar, implementar, demostrar               |
| Analizar   | diferenciar, comparar, organizar           |
| Evaluar    | criticar, justificar, evaluar              |
| Crear      | diseñar, construir, formular               |

**Ejemplo:**

* **Recordar**: "Enumerar los colores primarios."
* **Comprender**: "Explicar cómo interactúan los colores complementarios."
* **Aplicar**: "Crear un círculo cromático que demuestre pares complementarios."
* **Analizar**: "Comparar modelos de color tradicionales vs. digitales."
* **Evaluar**: "Evaluar la efectividad de la paleta de colores de una marca."
* **Crear**: "Diseñar un esquema de colores para el lanzamiento de un nuevo producto."

---

## 3. Diseñar Átomos de Aprendizaje ⚛

Cada **átomo de aprendizaje** se enfoca en un único objetivo de aprendizaje e integra **Concepto → Ejemplo → Práctica → Evaluación**.

### Componentes del Átomo

* **Leer** – Artículos, guías, infografías, casos de estudio.
* **Escuchar** – Podcasts, entrevistas de expertos, contenido narrado.
* **Ver** – Videos, animaciones, demostraciones, simulaciones.
* **Practicar** – Laboratorios, desafíos de código, tareas de diseño.
* **Evaluar** – Cuestionarios, rúbricas, verificaciones con IA.
* **Colaborar** – Retroalimentación entre pares, discusiones, revisiones con mentores.

👉 Usa la [Plantilla de Átomo de Aprendizaje](../templates/learning-atom-template.md) para diseñar cada átomo.

---

## 4. Ensamblar Módulos (Estructura de Microcurso)

Agrupa **4–8 átomos de aprendizaje** en módulos con un tema claro. Cada módulo debe:

* Introducir una **base teórica**.
* Incluir un **laboratorio o desafío aplicado**.
* Terminar con una **evaluación o reflexión**.

👉 Usa la [Plantilla de Microcurso](../templates/micro-credential-ada-template.md) para estructurar.

---

## 5. Planificar Estrategia de Evaluación

Las evaluaciones deben combinar métodos **formativos (continuos)** y **sumativos (finales)**.

* **Laboratorios y Átomos** → Mini-Rúbrica (3 criterios: Precisión, Aplicación, Claridad).
* **Proyecto Capstone** → Rúbrica Estándar (5 criterios: Relevancia, Aplicación, Resolución de Problemas y Creatividad, Claridad y Comunicación, Colaboración y Reflexión).

---

## 6. Definir Entregables

Describe claramente lo que los estudiantes producirán y cómo demuestra la competencia.

* Ejemplos: *Repositorio de código, plan de negocios, prototipo de diseño, informe de investigación, video pitch.*
* Los entregables deben estar **listos para portafolio** y ser **relevantes para el trabajo**.

---

## 7. Interacción Humana y Colaborativa

Integra oportunidades para mentoría, retroalimentación y aprendizaje comunitario.

* 🧑‍🏫 Sesiones de mentor / horas de oficina
* 👥 Desafíos grupales o revisiones entre pares
* 🌐 Foros o comunidades Slack/Discord
* 🎤 Presentaciones de proyectos y exhibiciones

---

## 8. Alinear con las Fases ADA

Asegúrate de que tu curso fluya a través de las **4 fases de aprendizaje ADA**:

1. **🙉 Introducción Autoguiada** → lecturas, videos, cuestionarios.
2. **🙈 Exploración Visual** → demostraciones, juego de roles, recorridos.
3. **🙊 Práctica Aplicada** → laboratorios, herramientas, simulaciones.
4. **🐵 Colaboración y Reflexión** → interacción entre pares, compartir proyectos.

---

## 9. Ejemplo de Flujo de Trabajo

1. **Competencia**: *Visualización de Datos con Python*.
2. **Objetivos**: *Comprender gráficos → Aplicar librerías → Crear dashboard.*
3. **Átomos**: *Introducción a matplotlib, Caso de estudio, Laboratorio sobre gráficos de barras.*
4. **Módulo**: *Fundamentos de Visualización de Datos.*
5. **Evaluación**: *Mini-rúbrica para laboratorios, dashboard capstone con rúbrica.*
6. **Entregable**: *Dashboard interactivo compartido en GitHub.*
7. **Interacción Humana**: *Retroalimentación entre pares sobre diseño de dashboard.*
8. **Fases**: *Concepto (Autoestudio) → Demo (Visual) → Laboratorio (Práctica) → Exhibición entre Pares (Colaboración).*

---

## ✅ Lista de Verificación para Diseñadores

Usa esta lista de verificación para asegurar que tu micro-credencial esté alineada con ADA. Los ejemplos se incluyen en cursiva para mayor claridad.

* [ ] **Definió una competencia del mundo real**
  *Ejemplo: "Capacidad de diseñar un mapa de recorrido del cliente para marketing digital."*
* [ ] **Vinculado a marcos/estándares (SFIA, O\*NET, ESCO, OIT)**
  *Ejemplo: "ESCO: Especialista en Marketing – Diseño del Recorrido del Cliente."*
* [ ] **Redactó objetivos de aprendizaje alineados con Bloom**
  *Ejemplo: "Analizar el comportamiento del usuario usando métricas de embudo."*
* [ ] **Diseñó 4–8 átomos de aprendizaje**
  *Ejemplo: Átomos sobre personas de clientes, dashboards de analíticas, pruebas A/B.*
* [ ] **Ensamblió átomos en módulos**
  *Ejemplo: Módulo = "Fundamentos de Analíticas de Usuario" con 3 átomos + un laboratorio.*
* [ ] **Definió evaluaciones con rúbricas**
  *Ejemplo: Mini-rúbrica para laboratorio de analíticas; rúbrica capstone para estrategia de marketing final.*
* [ ] **Especificó entregables (listos para portafolio)**
  *Ejemplo: Un PDF de mapa de recorrido del cliente y un informe de marketing basado en datos.*
* [ ] **Planificó elementos humanos/colaborativos**
  *Ejemplo: P&R semanal con mentor y revisión entre pares de informes.*
* [ ] **Mapeó fases (Oír → Ver → Hacer → Compartir)**
  *Ejemplo: Lecturas de autoestudio → Videos de demostración → Laboratorio de analíticas → Exhibición entre pares.*

---

> Para inspiración, ve el [Ejemplo de Átomo de Aprendizaje de Arte](../examples/learning-atom-art.md) o [Ejemplo de Micro-Credencial de Arte](../examples/art_microcredential_template.md).</script>
<script type="text/markdown" data-path="templates/codelab-ada-template.md"># 🧪 ADA Codelab Template

This codelab template is designed following the ADA Methodology and Learning Atoms structure. Each codelab should combine explanation, code demonstration, and guided exercises.

---

## 🧠 Title
Example: Build Your First REST API with Flask

## 🎯 Learning Objective
By the end of this codelab, learners will be able to:
- Create a basic REST API using Flask
- Handle HTTP methods and routes
- Run and test an API locally

---

## 🛠️ Requirements
- Python 3.8+
- `pip`
- IDE or code editor (e.g., VS Code)

Install Flask:
```bash
pip install flask
```

---

## 🚀 Step 1: Hello World API
### 🔍 Explanation
We’ll start by building a minimal Flask application.

### 💻 Code Example
```python
from flask import Flask
app = Flask(__name__)

@app.route('/')
def home():
    return "Hello, world!"

if __name__ == '__main__':
    app.run(debug=True)
```

### 🧪 Exercise
- Run the app locally
- Visit `http://127.0.0.1:5000/`
- Change the response text to your name

---

## 📨 Step 2: Add a New Route
### 🔍 Explanation
Let’s create a new route that returns user info.

### 💻 Code Example
```python
@app.route('/user')
def user():
    return {'name': 'Jane Doe', 'age': 28}
```

### 🧪 Exercise
- Add another route `/about` that returns a short message about you.

---

## 🧪 Final Challenge
Create an endpoint `/greet/<name>` that returns `Hello, <name>!`.

Example:
```python
@app.route('/greet/<name>')
def greet(name):
    return f"Hello, {name}!"
```

Test it with: `http://127.0.0.1:5000/greet/Ada`

---

## ✅ Completion Criteria
- [ ] App runs without errors
- [ ] All endpoints work as expected
- [ ] Personalized route returns dynamic content

---

## 🏁 Next Steps
- Add JSON responses using `jsonify`
- Deploy the app with Replit or Render
- Explore Flask Blueprints for modular APIs

---

> You can duplicate this template to build your own ADA-aligned codelabs in any domain.

<script type="text/markdown" data-path="templates/micro-credential-ada-template.md"># 🚀ADA Micro Credential Template

This template is designed to help you **create modular, job-ready micro-credentials**. Each section includes **\[instructions in brackets]** so you can adapt it to your domain.

---

## 🎓 Micro Credential Title

\[Write a clear, competency-aligned title.]
**Example:** *Business Resilience: Strategies to Adapt and Thrive*

---

## ⏳ Estimated Duration

\[Define the length: hours or weeks. ADA micro-credentials are usually 10–30 hours.]
**Example:** *15 hours · 3 weeks (5h/week)*

---

## 🎯 Target Job Competency

\[Identify the real-world job skill the course develops, referencing frameworks like SFIA, O\*NET, or ESCO.]
**Example:** *Ability to design and implement business continuity and resilience strategies.*

---

## 🔑 Prerequisites

\[List the knowledge, skills, or tools learners should already have. If none, write “None.”]

* [ ] \[Skill or knowledge #1]
* [ ] \[Skill or knowledge #2]

---

## 📘 Learning Objectives

\[Define 3–5 objectives using **Bloom’s taxonomy verbs**. Each will be supported by Learning Atoms.]

**Example:**

* **Understand** models of organizational resilience.
* **Analyze** vulnerabilities in changing environments.
* **Design** resilience strategies for crisis response.
* **Evaluate** leadership approaches in uncertain contexts.

---

## 💡 Skills to Be Developed (Workforce Competencies)

\[List 1– 3 specific, measurable skills learners will be able to demonstrate.]

**Example:**

* Diagnose organizational resilience levels.
* Apply adaptive decision-making in uncertain contexts.
* Create a resilience framework for crisis management.
* Foster collaborative and resilient organizational cultures.

---

## ⚛ Learning Atoms

Each **Learning Atom** = *Concept + Example + Practice + Evaluation*
\[Design 4–8 atoms, one per learning objective. Fill in details using the table below.]

| Atom   | Objective       | Concept (Read/Listen/Watch)       | Example               | Practice                | Evaluate                         |   |
| ------ | --------------- | --------------------------------- | --------------------- | ----------------------- | -------------------------------- | - |
| Atom 1 | \[Objective #1] | \[Article, guide, video, podcast] | \[Case study or demo] | \[Mini-lab or exercise] | \[Quiz, reflection, mini-rubric] |   |
| Atom 2 | \[Objective #2] | …                                 | …                     | …                       | …                                | … |

---

## 🔍 ADA Learning Phases

Each phase uses **Learning Atoms** and follows Confucius’ progression: 

*hear → see → do → share*.

---

### 🙉 Phase 1: Self-Guided Introduction

> *“I hear and I forget.”  — Confucius*

**Goal:** Introduce concepts through self-learning.
Includes: 📖 readings · 🎥 videos · 🎧 podcasts · 📚 case studies · ❓ quizzes

---

### 🙈 Phase 2: Visual Exploration

> *“I see and I remember.”  — Confucius*

**Goal:** Reinforce learning visually and experimentally.
Includes: 🧩 demos · 🎞️ walkthroughs · 🧪 role-play · 📊 scenario exploration

---

### 🙊 Phase 3: Applied Practice

> *“I do and I understand.”  — Confucius*

**Goal:** Apply knowledge in practical challenges.
Includes: 🧪 hands-on labs · 💻 coding tasks · 🛠️ simulations · 📝 rubric-based evaluation

---

### 🐵 Phase 4: Collaboration and Reflection

> *“I share and I multiply.”  — ADA Methodology*

**Goal:** Promote collaborative learning and reflection.
Includes: 👥 peer feedback · 🗣️ co-creation projects · 🌐 forums · 🎤 showcase presentations.

---

## 📋 Phase Content Planner (Editable Table)

\[Use this table to **list the content, activities, and assessments** for each phase. Replace placeholders with your course details.]

| Phase                               | Learning Atom(s)    | Content & Resources                      | Activity/Practice                       | Assessment Method                  |
| ----------------------------------- | ------------------- | ---------------------------------------- | --------------------------------------- | ---------------------------------- |
| Phase 1: Self-Guided Introduction   | \[Atom #1, Atom #2] | \[Articles, videos, podcasts]            | \[Reflection prompt, short quiz]        | \[Quiz, AI Q\&A check]             |
| Phase 2: Visual Exploration         | \[Atom #2, Atom #3] | \[Animations, demos, role-play scenario] | \[Guided walkthrough, group discussion] | \[Formative feedback]              |
| Phase 3: Applied Practice           | \[Atom #3, Atom #4] | \[Lab manual, tools, datasets]           | \[Hands-on lab, coding challenge]       | \[Mini-rubric + feedback]          |
| Phase 4: Collaboration & Reflection | \[Atom #4]          | \[Project brief, peer forum]             | \[Capstone presentation, peer review]   | \[Capstone rubric + peer feedback] |

---

## 🚀 Capstone Project

\[Design a **portfolio-ready project** that integrates all course skills. It should simulate a real job task and be evaluated with the rubric below.]

**Example:**
*Learners will create a **Business Resilience Plan** for a company, including:*

1. **Relevance** → Alignment with business continuity needs.
2. **Application of Skills** → Use of resilience frameworks.
3. **Problem-Solving & Creativity** → Innovative approaches to crises.
4. **Clarity & Communication** → Clear, professional deliverable.
5. **Collaboration & Reflection** → Peer feedback and reflection documented.

---

## 📊 Assessment & Evaluation

* ✅ Quizzes and reflection prompts per atom (formative)
* ✅ Feedback on labs and mini-projects (mini-rubric)
* ✅ Capstone project graded with rubric (summative)
* ✅ Peer and/or mentor review (optional)

---

| Criterion       | Excellent (3)                                 | Adequate (2)                    | Needs Improvement (1)       |
| --------------- | --------------------------------------------- | ------------------------------- | --------------------------- |
| **Accuracy**    | Task completed correctly with no major errors | Mostly correct, minor errors    | Incorrect or incomplete     |
| **Application** | Demonstrates correct use of concept/tool      | Partial application, some gaps  | Weak or missing application |
| **Clarity**     | Clear, well-organized submission              | Some clarity, needs improvement | Unclear or hard to follow   |

## 🧠 Título

## 🎯 Objetivo de Aprendizaje
Al finalizar este codelab, el estudiante será capaz de:

- Manejar métodos y rutas HTTP
- Ejecutar y probar una API localmente

---

## 🛠️ Requisitos
- Python 3.8+
- `pip`
- IDE o editor de código (por ejemplo, VS Code)

Instalar Flask:
```bash
pip install flask
```

---

## 🚀 Paso 1: API Hola Mundo
### 🔍 Explicación
Comenzaremos creando una aplicación mínima con Flask.

### 💻 Código de ejemplo
```python
from flask import Flask
app = Flask(__name__)

@app.route('/')
def home():
    return "¡Hola, mundo!"

if __name__ == '__main__':
    app.run(debug=True)
```

### 🧪 Ejercicio
- Ejecuta la app localmente
- Visita `http://127.0.0.1:5000/`
- Cambia el texto de respuesta por tu nombre

---

## 📨 Paso 2: Agregar una nueva ruta
### 🔍 Explicación

### 💻 Código de ejemplo
```python
@app.route('/usuario')
def usuario():
    return {'nombre': 'Jane Doe', 'edad': 28}
```

---

Crea una ruta `/saludo/<nombre>` que devuelva `¡Hola, <nombre>!`.

```python
@app.route('/saludo/<nombre>')
def saludo(nombre):
    return f"¡Hola, {nombre}!"
```

Pruébalo en: `http://127.0.0.1:5000/saludo/Ada`

---

## ✅ Criterios de Finalización
- [ ] La aplicación corre sin errores
- [ ] Todas las rutas funcionan correctamente
- [ ] La ruta personalizada responde dinámicamente

---

### 🔹 Mini-Rubrica para Laboratórios/Átomos (3 Critérios)

| **Precisão**    | Tarefa completada corretamente sem erros maiores | Principalmente correto, erros menores | Incorreto ou incompleto     |
| **Aplicação**   | Demonstra uso correto do conceito/ferramenta | Aplicação parcial, algumas lacunas | Aplicação fraca ou ausente  |
| **Clareza**     | Entrega clara e bem organizada              | Alguma clareza, precisa de melhorias | Pouco claro ou difícil de seguir |

      var p=[]; while(i<lines.length && lines[i].trim()!=="" &&
            !/^\u0000\d+\u0000$/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i]) &&
            !/^\s*>/.test(lines[i]) && !/^(\s*)([-*+]|\d+\.)\s+/.test(lines[i]) &&
            !/^<(\/?)([a-zA-Z][\w-]*)(\s|>|\/)/.test(lines[i]) &&
            !/^(\s*)(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])){p.push(lines[i]);i++;}
      if(p.length) out.push("<p>"+inline(p.join(" "))+"</p>");

      s.onload=function(){ window.mermaid?res(window.mermaid):loadScript(i+1).then(res,rej); };

  // The diagram source is the single source of truth (stored in data-src). We never
  // re-parse a node's live DOM, because after a successful render it holds SVG, not source.
  function diagramSrc(n){

  function mermaidFallback(nodes){

        '<div style="font-size:11px;color:var(--text-faint);margin-top:6px">⚠️ Diagram source shown — Mermaid could not be loaded.</div>';
    });

  // ----- pan + zoom for a diagram canvas (drag to pan, ctrl/cmd+wheel to zoom) -----
  function attachZoom(canvas, svg, onZoom){
    var st={s:1,x:0,y:0}, drag=null, MIN=0.4, MAX=5;
    function apply(){ if(svg){svg.style.transform="translate("+st.x+"px,"+st.y+"px) scale("+st.s+")";}
      if(onZoom) onZoom(Math.round(st.s*100)); }
    function zoomTo(ns){ st.s=Math.min(MAX,Math.max(MIN,ns)); apply(); }
    canvas.addEventListener("wheel",function(e){
      if(!(e.ctrlKey||e.metaKey)) return;            // plain scroll keeps scrolling the page
      e.preventDefault(); zoomTo(st.s*(e.deltaY<0?1.12:0.892)); },{passive:false});
    canvas.addEventListener("pointerdown",function(e){
      drag={px:e.clientX,py:e.clientY,ox:st.x,oy:st.y};
      canvas.classList.add("grabbing","dragging");
      try{canvas.setPointerCapture(e.pointerId);}catch(_){} });
    canvas.addEventListener("pointermove",function(e){ if(!drag)return;
      st.x=drag.ox+(e.clientX-drag.px); st.y=drag.oy+(e.clientY-drag.py); apply(); });
    function end(){ drag=null; canvas.classList.remove("grabbing","dragging"); }
    canvas.addEventListener("pointerup",end);
    canvas.addEventListener("pointercancel",end);
    canvas.addEventListener("dblclick",function(){ st={s:1,x:0,y:0}; apply(); });
    apply();
    return { zin:function(){zoomTo(st.s*1.25);}, zout:function(){zoomTo(st.s*0.8);},
             reset:function(){st={s:1,x:0,y:0};apply();} };
  }

  // ----- turn a rendered SVG into an interactive figure (toolbar + pan/zoom) -----
  function enhanceDiagram(n, svgString, bind){

    n.innerHTML='<div class="diagram">'+
        '<div class="diagram-toolbar">'+

  var _mmSeq=0;
  // ---- find the root node(s) of a flowchart: declared but never an edge target ----
  function detectRoots(src){
    try{
      var lines=src.split(/\r?\n/);
      if(!/^\s*(flowchart|graph)\b/i.test(lines[0]||"")) return [];
      var all={}, targets={};
      for(var i=1;i<lines.length;i++){
        var ln=lines[i], tt=(ln||"").trim();
        if(!tt||/^%%/.test(tt)) continue;
        if(/^(classdef|class|style|linkstyle|click|direction|subgraph|end)\b/i.test(tt)) continue;
        var s=ln;
        for(var k=0;k<8;k++){
          s=s.replace(/\(\([^()]*\)\)/g," ").replace(/\[\[[^\[\]]*\]\]/g," ")
             .replace(/\[\([^\[\]]*\)\]/g," ").replace(/\(\[[^\[\]]*\]\)/g," ")
             .replace(/\[[^\[\]]*\]/g," ").replace(/\{[^{}]*\}/g," ").replace(/\([^()]*\)/g," ");
        }
        s=s.replace(/\|[^|]*\|/g," ");                 // inline edge labels |..|
        if(s.indexOf("--")<0 && s.indexOf("==")<0) continue;
        var ids=s.split(/\s*(?:-{2,}>?|={2,}>?|-\.->?|<-{2,})\s*/)
                 .map(function(x){return (x.trim().match(/^[A-Za-z0-9_]+/)||[""])[0];})
                 .filter(Boolean);
        for(var j=0;j<ids.length;j++){ all[ids[j]]=1; if(j>0) targets[ids[j]]=1; }
      }
      var roots=Object.keys(all).filter(function(id){return !targets[id];});
      return roots.length && roots.length<=4 ? roots : [];
    }catch(e){ return []; }
  }
  function withRootEmphasis(src){

      "class "+roots.join(",")+" adaRootNode;";
  }

    if(!q){renderSidebar();afterSidebar();return;}
    var matches=ORDER.filter(function(p){
      return p.toLowerCase().indexOf(q)>-1 || prettyName(p).toLowerCase().indexOf(q)>-1 ||
             DOCS[p].toLowerCase().indexOf(q)>-1;
    });
    var nav=document.getElementById("nav");
    nav.innerHTML='<div class="group-head" style="cursor:default">🔎 '+matches.length+' '+(matches.length===1?t("result"):t("results"))+'</div>';
    matches.forEach(function(p,idx){
      var a=document.createElement("div");a.className="navlink";a.setAttribute("data-path",p);
      a.style.animationDelay=(idx*18)+"ms";
      var hit="";
      var ci=DOCS[p].toLowerCase().indexOf(q);
      if(ci>-1){var snip=DOCS[p].slice(Math.max(0,ci-20),ci+40).replace(/\n/g," ");
        hit='<div style="font-size:11px;color:var(--text-faint);margin-top:2px">…'+escapeHtml(snip)+'…</div>';}
      a.innerHTML='<span class="ic">'+fileIcon(p)+'</span><span>'+prettyName(p)+hit+'</span>';
      a.addEventListener("click",function(){go(p);closeMobile();});
      nav.appendChild(a);
    });
    if(!matches.length) nav.innerHTML+='<div class="empty" style="padding:30px 10px;font-size:13px">'+escapeHtml(t("noMatches"))+'</div>';
    setActive(currentPath);
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="/"&&document.activeElement!==searchInput){e.preventDefault();searchInput.focus();}
    if(e.key==="Escape"){searchInput.value="";searchInput.blur();renderSidebar();afterSidebar();}
  });

  // =====================================================================
  // Theme
  // =====================================================================
  var themeBtn=document.getElementById("theme");
  function applyTheme(t){document.documentElement.setAttribute("data-theme",t);
    themeBtn.textContent=t==="light"?"🌙":"☀️"; try{localStorage.setItem("ada-theme",t);}catch(e){}}
  themeBtn.addEventListener("click",function(){
    applyTheme(document.documentElement.getAttribute("data-theme")==="light"?"dark":"light");
    if(content.querySelector(".mermaid")) render(currentPath, window.__anchor);});
  var saved; try{saved=localStorage.getItem("ada-theme");}catch(e){}
  applyTheme(saved|| (window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"));

  // =====================================================================
  // Language switcher (i18n)
  // =====================================================================
  var langSel=document.getElementById("lang");
  function setLangStatic(lang){
    if(!I18N[lang]) lang="en";
    LANG=lang;
    document.documentElement.setAttribute("lang", lang==="pt"?"pt-br":lang);
    var sub=document.querySelector('[data-i18n="subtitle"]'); if(sub) sub.textContent=t("subtitle");
    if(searchInput) searchInput.placeholder=t("search");
    if(langSel&&langSel.value!==lang) langSel.value=lang;
    try{localStorage.setItem("ada-lang",lang);}catch(e){}
  }
  function applyLang(lang){ setLangStatic(lang); render(currentPath, window.__anchor); }
  if(langSel) langSel.addEventListener("change",function(){applyLang(this.value);});
  var savedLang; try{savedLang=localStorage.getItem("ada-lang");}catch(e){}
  if(!savedLang){ var nl=((navigator&&navigator.language)||"en").toLowerCase();
    savedLang= nl.indexOf("es")===0?"es":(nl.indexOf("pt")===0?"pt":"en"); }
  setLangStatic(savedLang);

  // =====================================================================
  // Progress bar, scroll-top, scrollspy
  // =====================================================================
  var bar=document.getElementById("progress"), topBtn=document.getElementById("top");
  window.addEventListener("scroll",function(){
    var st=document.documentElement.scrollTop||document.body.scrollTop;
    var h=(document.documentElement.scrollHeight-document.documentElement.clientHeight)||1;
    bar.style.width=(st/h*100)+"%";
    topBtn.classList.toggle("show",st>400);
    // scrollspy
    var links=toc.querySelectorAll("a"); var cur=null;
    links.forEach(function(a){var el=document.getElementById(a.getAttribute("data-id"));
      if(el&&el.getBoundingClientRect().top<140)cur=a;});
    links.forEach(function(a){a.classList.toggle("active",a===cur);});
  },{passive:true});
  topBtn.addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"});});

  // mobile
  var sidebar=document.getElementById("sidebar"), overlay=document.getElementById("overlay");
  document.getElementById("menuBtn").addEventListener("click",function(){
    sidebar.classList.toggle("open");overlay.classList.toggle("show");});
  function closeMobile(){sidebar.classList.remove("open");overlay.classList.remove("show");}
  overlay.addEventListener("click",closeMobile);
  document.getElementById("homeLink").addEventListener("click",function(){go("__home__");});

  function afterSidebar(){setActive(currentPath);}

  // init
  renderSidebar();
  route();
})();

</script>
</body>
</html>
