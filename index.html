<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADA Methodology · Docs Browser</title>
<meta name="description" content="Interactive browser for the ADA Methodology repository.">
<meta name="theme-color" content="#0A1124">
<link rel="icon" type="image/png" href="img/Isotipo.png">
<style>

/* ADA School brand palette: Indigo #1E2A6E · Turquoise #15B5C6 · Gold #E0A53C · Ink #0A1124 */
:root{
  --bg:#0A1124; --bg-soft:#121c3a; --bg-elev:#1a2548; --border:#2a3663;
  --text:#e9edfb; --text-dim:#a3afd6; --text-faint:#6c79a6;
  --brand:#1E2A6E; --brand-bright:#4256c4;
  --accent:#15B5C6; --accent-2:#15B5C6; --accent-3:#1E2A6E; --gold:#E0A53C;
  --code-bg:#0c1430; --link:#3fc8d6;
  --grad-fill:linear-gradient(135deg,#15B5C6,#1E2A6E 90%);
  --grad-text:linear-gradient(120deg,#5fd6e3,#9fb0f0);
  --shadow:0 12px 44px rgba(2,6,23,.55);
  --sidebar-w:300px; --toc-w:230px; --radius:14px;
}
html[data-theme="light"]{
  --bg:#f3f6fc; --bg-soft:#ffffff; --bg-elev:#ffffff; --border:#dde3f2;
  --text:#1E2A6E; --text-dim:#4a5588; --text-faint:#8893b5;
  --brand:#1E2A6E; --brand-bright:#1E2A6E;
  --accent:#15B5C6; --accent-2:#15B5C6; --accent-3:#1E2A6E; --gold:#E0A53C;
  --code-bg:#eef2fa; --link:#1E2A6E;
  --grad-fill:linear-gradient(135deg,#15B5C6,#1E2A6E 90%);
  --grad-text:linear-gradient(120deg,#1E2A6E,#0f7d8a);
  --shadow:0 12px 44px rgba(30,42,110,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.65;
  -webkit-font-smoothing:antialiased; transition:background .4s ease,color .4s ease;
}
a{color:var(--link); text-decoration:none}
a:hover{text-decoration:underline}

/* progress bar */
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:60;
  background:linear-gradient(90deg,#15B5C6,#1E2A6E,#E0A53C);
  background-size:200% 100%; animation:flow 6s linear infinite; transition:width .1s ease;}
@keyframes flow{0%{background-position:0 0}100%{background-position:200% 0}}

/* header */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:rgba(10,17,36,.78);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border); transition:background .4s ease;}
html[data-theme="light"] header{background:rgba(255,255,255,.82)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.iso-spin{width:42px;height:42px;flex:0 0 auto;display:block;border-radius:50%;
  background:#0A1124;box-shadow:0 0 0 2px var(--border),0 4px 14px rgba(21,181,198,.28);
  transition:box-shadow .3s ease}
.brand:hover .iso-spin{box-shadow:0 0 0 2px var(--accent),0 6px 20px rgba(21,181,198,.5)}
.iso-spin.spin-once{animation:isospin .8s ease}
@keyframes isospin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.iso-spin.spin-once{animation:none}}
.brand h1{font-size:15px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.brand small{display:block;color:var(--accent);font-size:11px;font-weight:600;letter-spacing:.3px}
html[data-theme="light"] .brand small{color:var(--brand)}
.spacer{flex:1}
.search{position:relative;display:flex;align-items:center}
.search input{background:var(--bg-soft);border:1px solid var(--border);color:var(--text);
  padding:9px 12px 9px 34px;border-radius:10px;width:230px;font-size:13px;outline:none;
  transition:width .25s ease,border-color .2s ease,box-shadow .2s ease}
.search input:focus{width:300px;border-color:var(--accent);box-shadow:0 0 0 3px rgba(21,181,198,.22)}
.search svg{position:absolute;left:10px;width:15px;height:15px;color:var(--text-faint);pointer-events:none}
.iconbtn{background:var(--bg-soft);border:1px solid var(--border);color:var(--text);
  width:38px;height:38px;border-radius:10px;cursor:pointer;display:grid;place-items:center;
  font-size:17px;transition:transform .2s ease,background .2s ease,border-color .2s ease}
.iconbtn:hover{transform:translateY(-2px) rotate(-6deg);border-color:var(--accent)}
.iconbtn:active{transform:scale(.92)}
.langsel{background:var(--bg-soft);border:1px solid var(--border);color:var(--text);
  height:38px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;
  padding:0 8px;outline:none;transition:border-color .2s ease,box-shadow .2s ease}
.langsel:hover{border-color:var(--accent)}
.langsel:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(21,181,198,.22)}
#menuBtn{display:none}

/* layout */
.layout{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr) var(--toc-w);
  max-width:1500px;margin:0 auto;align-items:start}

/* sidebar */
#sidebar{position:sticky;top:63px;height:calc(100vh - 63px);overflow-y:auto;
  padding:18px 12px 60px;border-right:1px solid var(--border);scrollbar-width:thin}
.nav-group{margin-bottom:6px}
.group-head{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;
  border-radius:9px;color:var(--text-dim);font-size:12px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;user-select:none;transition:background .2s ease,color .2s ease}
.group-head:hover{background:var(--bg-soft);color:var(--text)}
.group-head .caret{margin-left:auto;transition:transform .3s ease;font-size:10px}
.group.collapsed .caret{transform:rotate(-90deg)}
.group-items{overflow:hidden;transition:max-height .35s ease,opacity .3s ease;opacity:1}
.group.collapsed .group-items{max-height:0!important;opacity:0}
.navlink{display:flex;align-items:center;gap:9px;padding:7px 10px 7px 12px;border-radius:9px;
  color:var(--text);font-size:13.5px;cursor:pointer;position:relative;
  transition:background .2s ease,transform .15s ease,color .2s ease;
  animation:slideIn .4s ease backwards}
.navlink .ic{opacity:.8;font-size:14px;width:16px;text-align:center;flex:0 0 auto}
.navlink:hover{background:var(--bg-soft);transform:translateX(4px);text-decoration:none}
.navlink.active{background:linear-gradient(90deg,rgba(21,181,198,.20),transparent);color:#fff;font-weight:600}
html[data-theme="light"] .navlink.active{color:var(--brand)}
.navlink.active::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;
  border-radius:3px;background:linear-gradient(var(--accent),var(--accent-2))}
.navlink.nested{padding-left:26px;font-size:13px;color:var(--text-dim)}
.subfolder{padding:5px 10px 3px 18px;font-size:11px;color:var(--text-faint);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}

/* content */
main{min-width:0;padding:34px 46px 120px;animation:fadeUp .5s ease}
#content{max-width:860px;margin:0 auto}
#content.swap{animation:fadeUp .45s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.crumbs{color:var(--text-faint);font-size:12.5px;margin-bottom:18px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.crumbs span{color:var(--text-dim)}

/* markdown typography */
.md{font-size:15.5px}
.md h1,.md h2,.md h3,.md h4{line-height:1.3;margin:1.6em 0 .6em;font-weight:700;scroll-margin-top:80px}
.md h1{font-size:2em;background:linear-gradient(120deg,var(--text),var(--text-dim));-webkit-background-clip:text;background-clip:text}
.md h2{font-size:1.5em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
.md h3{font-size:1.2em}.md h4{font-size:1.05em;color:var(--text-dim)}
.md p{margin:.8em 0}
.md ul,.md ol{margin:.6em 0;padding-left:1.5em}
.md li{margin:.3em 0}
.md li input[type=checkbox]{margin-right:8px;accent-color:var(--accent)}
.md a{border-bottom:1px solid transparent;transition:border-color .2s}
.md a:hover{border-color:var(--link);text-decoration:none}
.md code{background:var(--code-bg);border:1px solid var(--border);padding:.12em .42em;
  border-radius:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em}
.md pre{background:var(--code-bg);border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;overflow:auto;margin:1.1em 0;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02)}
.md pre code{background:none;border:none;padding:0;font-size:13px;line-height:1.6;display:block}
.md pre .lang-tag{position:absolute;top:8px;right:12px;font-size:10px;letter-spacing:1px;
  text-transform:uppercase;color:var(--text-faint)}
.md blockquote{margin:1em 0;padding:.5em 1.1em;border-left:4px solid var(--accent);
  background:var(--bg-soft);border-radius:0 10px 10px 0;color:var(--text-dim)}
.md blockquote p{margin:.35em 0}
.md hr{border:none;height:1px;background:var(--border);margin:2em 0}
.md table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:13.5px;
  border:1px solid var(--border);border-radius:12px;overflow:hidden;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:9px 13px;text-align:left;vertical-align:top}
.md th{background:var(--bg-soft);font-weight:700}
.md tr{transition:background .15s ease}
.md tbody tr:hover{background:var(--bg-soft)}
.md img{max-width:100%;border-radius:10px}
.yt{margin:1.4em 0;border-radius:var(--radius);overflow:hidden;background:#0A1124;box-shadow:var(--shadow);border:1px solid var(--border)}
.yt .yt-play{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;cursor:pointer;
  background:radial-gradient(circle at 50% 45%,#243069,#0A1124);background-size:cover;background-position:center;color:#fff}
.yt .yt-play::after{content:"";position:absolute;inset:0;background:rgba(10,17,36,.38)}
.yt-tri{position:relative;z-index:1;font-size:42px;color:#fff;background:rgba(225,165,60,.95);width:84px;height:58px;
  border-radius:16px;display:grid;place-items:center;margin:0 auto;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:transform .2s}
.yt .yt-play:hover .yt-tri{transform:scale(1.08)}
.yt iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.yt-meta{padding:10px 14px;font-size:13px;background:var(--bg-soft);border-top:1px solid var(--border)}
.yt-meta a{color:var(--link);word-break:break-all}
.yt-cap{color:var(--text-dim);margin-top:4px}
.md h2,.md h3{position:relative}
.anchor{opacity:0;margin-left:8px;font-size:.7em;color:var(--link);transition:opacity .2s}
.md h2:hover .anchor,.md h3:hover .anchor{opacity:1}

/* TOC */
#toc{position:sticky;top:63px;height:calc(100vh - 63px);overflow-y:auto;padding:30px 16px;
  border-left:1px solid var(--border);scrollbar-width:thin}
#toc .toc-title{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-faint);
  font-weight:700;margin-bottom:12px}
#toc a{display:block;color:var(--text-dim);font-size:12.5px;padding:4px 10px;border-left:2px solid var(--border);
  margin-left:2px;transition:all .2s ease}
#toc a:hover{color:var(--text);border-color:var(--text-dim);text-decoration:none}
#toc a.lvl3{padding-left:22px;font-size:12px}
#toc a.active{color:var(--link);border-color:var(--accent);background:var(--bg-soft)}

/* home */
.hero{padding:30px 0 10px;animation:fadeUp .6s ease}
.hero .badge{display:inline-block;padding:5px 12px;border-radius:30px;font-size:12px;font-weight:600;
  background:var(--bg-soft);border:1px solid var(--border);color:var(--link);margin-bottom:16px}
.hero h2{font-size:2.4em;margin:.1em 0 .2em;line-height:1.15;border:none}
.hero .grad{background:var(--grad-text);
  -webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 200%;animation:flow 7s ease infinite}
.hero p.lead{font-size:1.15em;color:var(--text-dim);max-width:640px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin:28px 0}
.stat{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius);padding:18px;
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.stat:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:var(--shadow)}
.stat .num{font-size:1.9em;font-weight:800;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .lbl{color:var(--text-dim);font-size:12.5px;margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:24px 0}
.card{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  cursor:pointer;transition:transform .25s ease,border-color .25s,box-shadow .25s;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(21,181,198,.14),transparent 60%);
  opacity:0;transition:opacity .3s}
.card:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:var(--shadow)}
.card:hover::after{opacity:1}
.card .ic{font-size:26px}.card h3{margin:10px 0 6px;font-size:1.05em}
.card p{color:var(--text-dim);font-size:13px;margin:0}
.pipeline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:26px 0;padding:20px;
  background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius)}
.pnode{padding:9px 14px;border-radius:10px;font-size:12.5px;font-weight:600;
  background:var(--bg-elev);border:1px solid var(--border);transition:transform .2s,border-color .2s}
.pnode:hover{transform:scale(1.06);border-color:var(--accent)}
.pnode.gold{border-color:var(--gold);color:var(--gold);background:rgba(224,165,60,.10);font-weight:800}
.parrow{color:var(--link);font-weight:800}

/* scroll top */
#top{position:fixed;right:24px;bottom:24px;width:46px;height:46px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#15B5C6,#1E2A6E);color:#fff;font-size:20px;cursor:pointer;
  display:grid;place-items:center;opacity:0;pointer-events:none;transform:translateY(20px) scale(.8);
  transition:all .3s ease;box-shadow:0 8px 24px rgba(21,181,198,.42);z-index:40}
#top.show{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
#top:hover{transform:translateY(-4px) scale(1.08)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;
  transition:opacity .3s;z-index:45}
.overlay.show{opacity:1;pointer-events:auto}
.empty{color:var(--text-faint);text-align:center;padding:60px 20px}

/* ===== mermaid diagram viewer ===== */
.mermaid{margin:1.5em 0;animation:fadeUp .5s ease}
/* pre-render state: hide raw source, show a loading shimmer */
.mermaid:not([data-processed]):not(.fallback){display:block;position:relative;min-height:120px;
  border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-soft);
  color:transparent;font-size:0;overflow:hidden}
.mermaid:not([data-processed]):not(.fallback)::after{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 20%,rgba(21,181,198,.12) 50%,transparent 80%);
  background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.mermaid:not([data-processed]):not(.fallback)::before{content:"⚛ rendering diagram\2026";
  position:absolute;inset:0;display:grid;place-items:center;color:var(--text-faint);
  font-family:inherit;font-size:13px;z-index:1}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.mermaid.fallback{display:block;background:var(--bg-soft);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;text-align:left}

.diagram{position:relative;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg-soft);overflow:hidden}
.diagram-canvas{overflow:hidden;display:flex;align-items:center;justify-content:center;
  padding:20px;min-height:120px;cursor:grab;touch-action:none;
  background:radial-gradient(circle at 50% 0,rgba(21,181,198,.06),transparent 60%)}
.diagram-canvas.grabbing{cursor:grabbing}
.diagram-canvas svg{max-width:100%;height:auto;transform-origin:center center;
  transition:transform .12s cubic-bezier(.2,.7,.3,1);will-change:transform}
.diagram-canvas.dragging svg{transition:none}
.diagram-canvas svg .nodeLabel,.diagram-canvas svg .label{font-weight:600}
.diagram-canvas svg .cluster .nodeLabel,.diagram-canvas svg .cluster-label .nodeLabel{font-weight:700}
/* edge labels reuse mermaid's .nodeLabel class, so force a readable (non-white) color */
.diagram-canvas svg .edgeLabel,.diagram-canvas svg .edgeLabel p,
.diagram-canvas svg .edgeLabel .nodeLabel,.diagram-canvas svg .edgeLabel .label,
.diagram-canvas svg .edgeLabel foreignObject *{color:#e9edfb !important;font-weight:600}
html[data-theme="light"] .diagram-canvas svg .edgeLabel,
html[data-theme="light"] .diagram-canvas svg .edgeLabel p,
html[data-theme="light"] .diagram-canvas svg .edgeLabel .nodeLabel,
html[data-theme="light"] .diagram-canvas svg .edgeLabel .label,
html[data-theme="light"] .diagram-canvas svg .edgeLabel foreignObject *{color:#1E2A6E !important}
.diagram-toolbar{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:3;
  opacity:0;transform:translateY(-4px);transition:opacity .2s ease,transform .2s ease}
.diagram:hover .diagram-toolbar,.diagram:focus-within .diagram-toolbar{opacity:1;transform:none}
.dzlabel{position:absolute;left:10px;bottom:8px;z-index:3;font-size:11px;font-weight:600;
  color:var(--text-faint);background:var(--bg);border:1px solid var(--border);
  border-radius:20px;padding:2px 9px;opacity:0;transition:opacity .2s ease;pointer-events:none}
.diagram:hover .dzlabel{opacity:1}
.dbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--bg);
  color:var(--text);cursor:pointer;display:grid;place-items:center;font-size:14px;line-height:1;
  transition:transform .15s ease,background .15s ease,border-color .15s ease,color .15s ease}
.dbtn:hover{transform:translateY(-1px);border-color:var(--accent);background:var(--bg-soft)}
.dbtn:active{transform:scale(.88)}
.dbtn.ok{border-color:var(--gold);color:var(--gold)}

/* fullscreen diagram modal */
.dmodal{position:fixed;inset:0;z-index:200;background:rgba(10,17,36,.94);display:none;
  flex-direction:column;backdrop-filter:blur(8px)}
.dmodal.open{display:flex;animation:fadeIn .22s ease}
.dmodal .dm-bar{display:flex;align-items:center;gap:6px;justify-content:flex-end;
  padding:12px 16px;border-bottom:1px solid var(--border)}
.dmodal .dm-stage{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;
  padding:14px;cursor:grab;touch-action:none}
.dmodal .dm-stage.grabbing{cursor:grabbing}
.dmodal .dm-stage svg{max-width:94vw;max-height:82vh;height:auto;transform-origin:center center;
  transition:transform .12s cubic-bezier(.2,.7,.3,1)}
.dmodal .dm-stage.dragging svg{transition:none}
.dmodal-hint,.dm-hint{color:var(--text-faint);font-size:12px;margin-right:auto;padding-left:4px}

/* responsive */
@media(max-width:1080px){.layout{grid-template-columns:var(--sidebar-w) minmax(0,1fr)}#toc{display:none}}
@media(max-width:760px){
  .layout{grid-template-columns:1fr}
  #sidebar{position:fixed;left:0;top:63px;z-index:46;width:84%;max-width:330px;background:var(--bg);
    transform:translateX(-104%);transition:transform .32s cubic-bezier(.4,0,.2,1)}
  #sidebar.open{transform:translateX(0);box-shadow:var(--shadow)}
  #menuBtn{display:grid}
  main{padding:24px 20px 100px}
  .search input{width:110px}.search input:focus{width:160px}
  .langsel{padding:0 4px;font-size:12px}
  .brand small{display:none}
}
@media(max-width:480px){.brand h1{display:none}.search input{width:84px}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint)}

</style>
</head>
<body>
<div id="progress"></div>
<header>
  <button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
  <div class="brand" id="homeLink" style="cursor:pointer">
    <img class="iso-spin" src="img/Isotipo.png" alt="ADA" title="ADA Methodology — home">
    <div><h1>ADA Methodology</h1><small data-i18n="subtitle">Applied Digital Apprenticeship</small></div>
  </div>
  <div class="spacer"></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="Search docs…  ( / )" autocomplete="off">
  </div>
  <select id="lang" class="langsel" aria-label="Language">
    <option value="en">🇬🇧 EN</option>
    <option value="es">🇪🇸 ES</option>
    <option value="pt">🇧🇷 PT</option>

## 🎯 Principio Pedagógico

> "Lo oigo y lo olvido, lo veo y lo recuerdo, lo hago y lo entiendo, lo comparto y lo multiplico."

La **metodología ADA** promueve el **aprendizaje experiencial y progresivo**, enfocada en desarrollar **competencias laborales del mundo real**. El aprendizaje está estructurado en **micro-credenciales modulares**, cada una compuesta por **átomos de aprendizaje**, la unidad instruccional más pequeña soportada por espacios de aprendizaje colaborativo y reflexivo.

---

## 🗺️ La Metodología de un Vistazo

<p align="center">
  <img alt="La Metodología ADA: Construyendo Talento Digital Listo para el Trabajo — infografía general" src="img/ada-methodology-overview.png" width="900">
</p>

**ADA es un marco holístico que va más allá de las limitaciones de la evaluación tradicional
para construir competencias listas para el trabajo mediante un aprendizaje estructurado,
experiencial y colaborativo.** Funciona en dos niveles:

- **La filosofía guía** — el aprendizaje es un viaje del **consumo pasivo → la creación
  activa**, expresado en cuatro fases progresivas (*oír → ver → hacer → compartir*). Cada
  fase eleva deliberadamente la autonomía del estudiante: de la introducción autoguiada, a
  la exploración visual, a la práctica aplicada, a la colaboración y la reflexión.
- **Los bloques de construcción** — los **Átomos de Aprendizaje** (la unidad instruccional
  más pequeña, cada una con un solo objetivo) se combinan en **Micro-Credenciales** (10–30 h,
  unidades listas para el trabajo). Esta estructura modular hace el contenido **flexible,
  reutilizable y enfocado en habilidades laborales específicas**, y cada átomo recorre un
  flujo multiformato (**Leer → Escuchar → Ver → Visualizar → Practicar → Evaluar →
  Colaborar**) para que los conceptos se introduzcan, demuestren, apliquen y comprueben.

> En la **v2**, cada átomo y credencial se tipifica además con el **marco KSA**
> (Conocimientos · Habilidades · Aptitudes) y se mapea en un **mapa de habilidades** para que
> los estudiantes alcancen el mínimo requerido por una oportunidad laboral real. Ver [`specs/`](specs/).

---

##  ⚛ Átomo de Aprendizaje: La Unidad Modular Fundamental

Cada **átomo de aprendizaje** aborda un **único objetivo de aprendizaje** e integra teoría, práctica y evaluación alineadas con la Taxonomía de Bloom. Piénsalo como la **unidad de conocimiento autónoma más pequeña — un solo bloque de Lego**: un bloque tiene una forma y un color y ayuda a construir un castillo; un átomo aporta una habilidad específica.

<p align="center">
  <img alt="Dentro del Átomo de Aprendizaje — Leer y Escuchar, Ver y Practicar, Evaluar" src="img/ada-learning-atom-structure.png" width="760">
</p>

Un átomo se construye con **7 modalidades** agrupadas como **Adquirir → Aplicar → Evaluar → Amplificar**:

| Modalidad | Grupo | Propósito Pedagógico | Ejemplos de Subtipos |
| --------- | ----- | -------------------- | -------------------- |
| 📖 **Leer** | Adquirir | Introducir y contextualizar conceptos | Artículo, Artículo Técnico, Paper Científico, Caso de Estudio, Crónica, Diario |
| 🎧 **Escuchar** | Adquirir | Reforzar conceptos emocionalmente | Podcast, Narración, Audiorrelato, Musical, Entrevista |
| 🎬 **Ver** | Adquirir | Demostrar ideas o procesos | Explicativo, Short, Reel, Tutorial/Screencast, Documental, Serie |
| 🖼️ **Visualizar** | Adquirir | Codificar estructura y relaciones | Diagrama, Modelo Mental, Marco, Infografía, Mapa Mental, Diagrama de Flujo |
| 🧪 **Practicar** | Aplicar | Aplicar habilidades en contextos realistas | Laboratorio, Codelab, Reto de Prueba, Simulación, Juego de Roles, Pregunta de Prompt IA |
| ✅ **Evaluar** | Evaluar | Medir y evidenciar el aprendizaje | Pop Quiz (formativo), Cuestionario (sumativo), Mini-Rúbrica, Capstone, Evaluación Conductual |
| 🤝 **Colaborar** | Amplificar | Aprender socialmente; mostrar disposiciones | Programación en Pareja, Taller, Hackathon, Club de Lectura, Showcase, Mentoría |

```mermaid
flowchart TD
  A(["⚛ Átomo de Aprendizaje"]) --> R["📖 Leer"]
  A --> L["🎧 Escuchar"]
  A --> W["🎬 Ver"]
  A --> S["🖼️ Visualizar"]
  A --> P["🧪 Practicar"]
  A --> E["✅ Evaluar"]
  A --> C["🤝 Colaborar"]
  R --> R1["Artículo · Caso de Estudio · Artículo Técnico"]
  L --> L1["Podcast · Narración"]
  W --> W1["Explicativo · Screencast · Documental"]
  S --> S1["Diagrama · Modelo Mental · Marco"]
  P --> P1["Codelab · Simulación · Pregunta de Prompt IA"]
  E --> E1["Pop Quiz · Capstone · Evaluación Conductual"]
  C --> C1["Programación en Pareja · Taller · Hackathon"]
```

> 🔗 Ver el **mapa completo y detallado** de cada subtipo con diagramas: [**Topología del Átomo de Aprendizaje**](specs/learning-atom-topology.md).
> 🔗 Ver también: [Plantilla de Átomo de Aprendizaje](templates/es/plantilla-atomo-aprendizaje.md)

## 🧱 Estructura de Micro-Credencial ADA

Las micro-credenciales ADA son experiencias de aprendizaje cortas (10-30 horas) diseñadas para desarrollar habilidades específicas de alto impacto laboral. Cada una incluye 4-8 **átomos de aprendizaje** y sigue un diseño instruccional estructurado.

```mermaid
flowchart TD
  JOB["💼 Competencia Laboral<br/>(SFIA · O*NET · ESCO · ILO)"] --> MC["🎓 Micro-credencial<br/>10–30h"]
  MC --> OBJ["📘 Objetivos de Bloom"]
  MC --> ATOMS["⚛ 4–8 Átomos de Aprendizaje"]
  ATOMS --> MODS["🧱 Modalidades<br/>Leer · Escuchar · Ver · Visualizar · Practicar · Evaluar · Colaborar"]
  MC --> PHASES["🔄 4 Fases<br/>🙉 oír → 🙈 ver → 🙊 hacer → 🐵 compartir"]
  MC --> CAP["🚀 Capstone + Rúbrica"]
  CAP --> BADGE["🏅 Insignia Digital"]
  BADGE --> MAP["🗺️ Mapa de Habilidades → Match Laboral (v2)"]
```

### Componentes Estándar:

1. **Título de micro-credencial**: Claro, alineado con competencias.
2. **Competencia laboral objetivo**: Basada en marcos como SFIA, O*NET, ESCO.
3. **Prerrequisitos**: Conocimientos o habilidades requeridas.
4. **Objetivos de aprendizaje**: Basados en la Taxonomía de Bloom.
5. **Átomos de aprendizaje**: Unidades modulares y reutilizables.
6. **Laboratorio o experiencia práctica**: Aprendizaje aplicado.
7. **Evaluación**: Basada en rúbricas con evaluación Humana o IA.
8. **Proyecto capstone**: Un entregable compartible, listo para portafolio.

> 🔗 Ver: [Plantilla de Micro-Credencial](templates/es/plantilla-microcredencial-ada.md)

## 🔄 Fases del Aprendizaje ADA

### 🙉 Fase 1: *Introducción Autoguiada*

> "Lo oigo y lo olvido." — Confucio

> **Objetivo:** Introducir conceptos a través de contenido autodirigido
> Incluye: lecturas, podcasts, videos, casos de estudio cortos y verificaciones de comprensión.

---

### 🙈 Fase 2: *Exploración Visual*

> "Lo veo y lo recuerdo." — Confucio

> **Objetivo:** Reforzar el aprendizaje visual y experimentalmente
> Incluye: animaciones, escenarios de juego de roles, recorridos de casos y demostraciones guiadas.

---

### 🙊 Fase 3: *Práctica Aplicada*

> "Lo hago y lo entiendo." — Confucio

> **Objetivo:** Aplicar el conocimiento en desafíos prácticos
> Incluye: laboratorios prácticos, herramientas, simulaciones y evaluaciones basadas en rúbricas.

---

### 🐵 Fase 4: *Colaboración y Reflexión*

> "Lo comparto y lo multiplico." — Metodología ADA

> **Objetivo:** Promover el aprendizaje colaborativo y social
> Incluye: retroalimentación entre pares, co-creación, encuentros virtuales, foros y presentaciones de proyectos.

---

## 🌀 Flujo de Aprendizaje Basado en Átomos ADA

```mermaid
flowchart LR
  ACQ["📖🎧🎬🖼️ ADQUIRIR<br/>Leer · Escuchar · Ver · Visualizar"] --> APP["🧪 APLICAR<br/>Practicar"]
  APP --> ASS["✅ EVALUAR<br/>Evaluación"]
  ASS --> AMP["🤝 AMPLIFICAR<br/>Colaborar"]
  AMP -. retroalimentación social .-> ACQ
  ASS -. remediar .-> APP
```

Esta secuencia crea **experiencias de aprendizaje adaptativas, inclusivas y enfocadas en habilidades**.

## 🧬 ADA v2 — Marco KSA y Match Laboral

ADA está evolucionando a una **v2** que hace la metodología **precisa en competencias** y
**emparejable con empleos**, sin eliminar nada de la v1. Añade el **marco KSA —
Conocimientos, Habilidades, Aptitudes (Knowledge, Skills, Abilities)** — para que cada
objetivo esté *tipificado* y se enseñe/evalúe en consecuencia, además de un **mapa de
habilidades** que le dice al estudiante exactamente qué debe ganar para alcanzar el mínimo de
un empleo específico, y un **flujo de autoría con IA Generativa** para diseñarlo todo.

* 🧠 **Conocimiento (Knowledge)** — el *saber-qué / saber-por qué* (conceptos, hechos) → Leer · Escuchar · Ver.
* 🛠️ **Habilidad (Skill)** — el *saber-cómo* (procedimientos técnicos **y** humanos) → Practicar · laboratorios.
* 🌱 **Aptitud (Ability)** — el *poder-hacer / querer-hacer* (disposiciones duraderas y **actitudes**) → Colaborar · reflexionar, en múltiples ocasiones.

```
OFERTA LABORAL → [IA Generativa + validación humana] → PERFIL KSA OBJETIVO
              → diferencia con el estudiante → MAPA DE HABILIDADES (qué ganar) → % DE MATCH
              → diseñar micro-credenciales y átomos → ganar insignias verificadas → LISTO PARA EL TRABAJO
```

> 🔗 Especificaciones: [**`specs/`**](specs/) · Comienza por el
> [Marco KSA de ADA v2](specs/ada-v2-ksa-framework.md).

## 🧭 Del Perfil del Cargo a la Ruta de Aprendizaje

ADA es un **sistema de aprendizaje dinámico**: eliges un **cargo real con demanda de
contratación** (p. ej. *Científico/a de Datos*) y la metodología lo **descompone en una ruta
conectada de micro-credenciales**, de modo que las habilidades que ganas suman ese cargo.

La práctica clave es **cómo descubrimos las habilidades en primer lugar** — *triangulamos*
tres fuentes y dejamos que la **IA sintetice** mientras los **humanos validan**:

1. 📚 **Marcos** — O\*NET, ESCO, SFIA, ILO ISCO para una base canónica y citable.
2. 📈 **Mercado en vivo** — ofertas laborales reales y señales de demanda de lo que piden hoy.
3. 👀 **Observación del trabajo de altos desempeños** — paneles DACUM, acompañamiento (shadowing)
   y Entrevistas de Eventos Conductuales para capturar lo que los expertos *realmente hacen* y
   los **diferenciadores** (a menudo Aptitudes/actitudes duraderas) que definen el desempeño real.

Un cargo se convierte así en un **árbol medible**:

```
CARGO → DEBERES → TAREAS → KSA (al nivel de alto desempeño, 0–4)
      → ÁTOMOS DE APRENDIZAJE (unidades medibles + evidencia) → MICRO-CREDENCIALES
      → RUTA secuenciada → MAPA DE HABILIDADES + % DE MATCH (tu brecha medible)
```

Cada KSA lleva un **nivel objetivo y criterios de desempeño observables** tomados del trabajo
real, así que "aprobar" significa *poder hacer el trabajo como un alto desempeño* — y la
**brecha de habilidades siempre es un número** que indica al estudiante exactamente qué ganar
a continuación.

> 🔗 Metodología y prompts de IA: [**Mapeo de Cargo a Credencial**](specs/role-to-credential-mapping.md)
> · Ejemplo aplicado: [**Procesamiento de Datos → ruta a Científico/a de Datos**](examples/role-data-scientist-pathway.md).

## 🛠 Cómo Construir una Micro-Credencial ADA

1. Identificar una **competencia laboral del mundo real**.
2. Definir **objetivos de aprendizaje** a través de los niveles de Bloom.
3. Diseñar **átomos de aprendizaje** para cada objetivo.
4. Desarrollar **laboratorios prácticos o simulaciones**.
5. Crear **evaluaciones formativas y sumativas**.
6. Especificar un **entregable final**.
7. Integrar **oportunidades colaborativas**.

> 🔗 Usar la [Guía Paso a Paso](guides/guia-diseno-curriculos.md)

## 🎯 Princípio Pedagógico

> "Eu ouço e esqueço, eu vejo e me lembro, eu faço e entendo, eu compartilho e multiplico."

A **metodologia ADA** promove **aprendizado experiencial e progressivo**, focada no desenvolvimento de **competências profissionais do mundo real**. O aprendizado é estruturado em **micro-credenciais modulares**, cada uma composta por **átomos de aprendizado**, a menor unidade instrucional apoiada por espaços de aprendizado colaborativo e reflexivo.

---

## 🗺️ A Metodologia em um Relance

<p align="center">
  <img alt="A Metodologia ADA: Construindo Talentos Digitais Prontos para o Trabalho — infográfico geral" src="img/ada-methodology-overview.png" width="900">
</p>

**ADA é um framework holístico que vai além das limitações da avaliação tradicional para
construir competências prontas para o trabalho por meio de aprendizado estruturado,
experiencial e colaborativo.** Ele funciona em dois níveis:

- **A filosofia guia** — o aprendizado é uma jornada do **consumo passivo → à criação
  ativa**, expressa em quatro fases progressivas (*ouvir → ver → fazer → compartilhar*). Cada
  fase eleva deliberadamente a autonomia do estudante: da introdução autoguiada, à exploração
  visual, à prática aplicada, à colaboração e reflexão.
- **Os blocos de construção** — os **Átomos de Aprendizado** (a menor unidade instrucional,
  cada uma com um único objetivo) se combinam em **Micro-Credenciais** (10–30 h, unidades
  prontas para o trabalho). Essa estrutura modular torna o conteúdo **flexível, reutilizável e
  focado em habilidades profissionais específicas**, e cada átomo percorre um fluxo
  multiformato (**Ler → Escutar → Assistir → Visualizar → Praticar → Avaliar →
  Colaborar**) para que os conceitos sejam introduzidos, demonstrados, aplicados e comprovados.

> Na **v2**, cada átomo e credencial é também tipificado com o **framework KSA**
> (Conhecimentos · Habilidades · Aptidões) e mapeado em um **mapa de habilidades** para que
> os estudantes atinjam o mínimo exigido por uma oportunidade de trabalho real. Ver [`specs/`](specs/).

##  ⚛ Átomo de Aprendizado: A Unidade Modular Fundamental

Cada **átomo de aprendizado** aborda um **único objetivo de aprendizado** e integra teoria, prática e avaliação alinhadas à Taxonomia de Bloom. Pense nele como a **menor unidade autônoma de conhecimento — um único bloco de Lego**: um bloco tem uma forma e uma cor e ajuda a construir um castelo; um átomo fornece uma habilidade específica.

<p align="center">
  <img alt="Dentro do Átomo de Aprendizado — Ler e Escutar, Assistir e Praticar, Avaliar" src="img/ada-learning-atom-structure.png" width="760">
</p>

Um átomo é construído a partir de **7 modalidades** agrupadas como **Adquirir → Aplicar → Avaliar → Amplificar**:

| Modalidade | Grupo | Propósito Pedagógico | Exemplos de Subtipos |
| ---------- | ----- | -------------------- | -------------------- |
| 📖 **Ler** | Adquirir | Introduzir e contextualizar conceitos | Artigo, Artigo Técnico, Paper Científico, Estudo de Caso, Crônica, Diário |
| 🎧 **Escutar** | Adquirir | Reforçar conceitos emocionalmente | Podcast, Narração, Audiodrama, Musical, Entrevista |
| 🎬 **Assistir** | Adquirir | Demonstrar ideias ou processos | Explicativo, Short, Reel, Tutorial/Screencast, Documentário, Série |
| 🖼️ **Visualizar** | Adquirir | Codificar estrutura e relações | Diagrama, Modelo Mental, Framework, Infográfico, Mapa Mental, Fluxograma |
| 🧪 **Praticar** | Aplicar | Aplicar habilidades em contextos realistas | Laboratório, Codelab, Desafio de Teste, Simulação, Role-Play, Pergunta de Prompt IA |
| ✅ **Avaliar** | Avaliar | Medir e evidenciar o aprendizado | Pop Quiz (formativo), Questionário (somativo), Mini-Rubrica, Capstone, Avaliação Comportamental |
| 🤝 **Colaborar** | Amplificar | Aprender socialmente; mostrar disposições | Programação em Par, Workshop, Hackathon, Clube de Leitura, Showcase, Mentoria |

```mermaid
flowchart TD
  A(["⚛ Átomo de Aprendizado"]) --> R["📖 Ler"]
  A --> L["🎧 Escutar"]
  A --> W["🎬 Assistir"]
  A --> S["🖼️ Visualizar"]
  A --> P["🧪 Praticar"]
  A --> E["✅ Avaliar"]
  A --> C["🤝 Colaborar"]
  R --> R1["Artigo · Estudo de Caso · Artigo Técnico"]
  L --> L1["Podcast · Narração"]
  W --> W1["Explicativo · Screencast · Documentário"]
  S --> S1["Diagrama · Modelo Mental · Framework"]
  P --> P1["Codelab · Simulação · Pergunta de Prompt IA"]
  E --> E1["Pop Quiz · Capstone · Avaliação Comportamental"]
  C --> C1["Programação em Par · Workshop · Hackathon"]
```

> 🔗 Ver o **mapa completo e detalhado** de cada subtipo com diagramas: [**Topologia do Átomo de Aprendizado**](specs/learning-atom-topology.md).
> 🔗 Ver também: [Modelo de Átomo de Aprendizado](templates/pt-br/modelo-atomo-aprendizado.md)

## 🧱 Estrutura de Micro-Credencial ADA

As micro-credenciais ADA são experiências de aprendizado curtas (10-30 horas) projetadas para desenvolver habilidades específicas de alto impacto profissional. Cada uma inclui 4-8 **átomos de aprendizado** e segue um design instrucional estruturado.

```mermaid
flowchart TD
  JOB["💼 Competência Profissional<br/>(SFIA · O*NET · ESCO · ILO)"] --> MC["🎓 Micro-credencial<br/>10–30h"]
  MC --> OBJ["📘 Objetivos de Bloom"]
  MC --> ATOMS["⚛ 4–8 Átomos de Aprendizado"]
  ATOMS --> MODS["🧱 Modalidades<br/>Ler · Escutar · Assistir · Visualizar · Praticar · Avaliar · Colaborar"]
  MC --> PHASES["🔄 4 Fases<br/>🙉 ouvir → 🙈 ver → 🙊 fazer → 🐵 compartilhar"]
  MC --> CAP["🚀 Capstone + Rubrica"]
  CAP --> BADGE["🏅 Distintivo Digital"]
  BADGE --> MAP["🗺️ Mapa de Habilidades → Match de Vaga (v2)"]
```

### Componentes Padrão:

1. **Título da micro-credencial**: Claro, alinhado com competências.
2. **Competência profissional alvo**: Baseada em frameworks como SFIA, O*NET, ESCO.
3. **Pré-requisitos**: Conhecimentos ou habilidades necessários.
4. **Objetivos de aprendizado**: Baseados na Taxonomia de Bloom.
5. **Átomos de aprendizado**: Unidades modulares e reutilizáveis.
6. **Laboratório ou experiência prática**: Aprendizado aplicado.
7. **Avaliação**: Baseada em rubricas com avaliação Humana ou IA.
8. **Projeto capstone**: Uma entrega compartilhável, pronta para portfólio.

> 🔗 Ver: [Modelo de Micro-Credencial](templates/pt-br/modelo-microcredencial-ada.md)

## 🔄 Fases do Aprendizado ADA

### 🙉 Fase 1: *Introdução Autoguiada*

> "Eu ouço e esqueço." — Confúcio

> **Objetivo:** Introduzir conceitos através de conteúdo autodirigido
> Inclui: leituras, podcasts, vídeos, estudos de caso curtos e verificações de compreensão.

---

### 🙈 Fase 2: *Exploração Visual*

> "Eu vejo e me lembro." — Confúcio

> **Objetivo:** Reforçar o aprendizado visual e experimentalmente
> Inclui: animações, cenários de interpretação, percursos de casos e demonstrações guiadas.

---

### 🙊 Fase 3: *Prática Aplicada*

> "Eu faço e entendo." — Confúcio

> **Objetivo:** Aplicar conhecimento em desafios práticos
> Inclui: laboratórios práticos, ferramentas, simulações e avaliações baseadas em rubricas.

---

### 🐵 Fase 4: *Colaboração e Reflexão*

> "Eu compartilho e multiplico." — Metodologia ADA

> **Objetivo:** Promover aprendizado colaborativo e social
> Inclui: feedback entre pares, cocriação, encontros virtuais, fóruns e apresentações de projetos.

## 🌀 Fluxo de Aprendizado Baseado em Átomos ADA

```mermaid
flowchart LR
  ACQ["📖🎧🎬🖼️ ADQUIRIR<br/>Ler · Escutar · Assistir · Visualizar"] --> APP["🧪 APLICAR<br/>Praticar"]
  APP --> ASS["✅ AVALIAR<br/>Avaliação"]
  ASS --> AMP["🤝 AMPLIFICAR<br/>Colaborar"]
  AMP -. feedback social .-> ACQ
  ASS -. remediar .-> APP
```

Esta sequência cria **experiências de aprendizado adaptativas, inclusivas e focadas em habilidades**.

## 🧬 ADA v2 — Framework KSA e Match de Vagas

A ADA está evoluindo para uma **v2** que torna a metodologia **precisa em competências** e
**combinável com vagas**, sem remover nada da v1. Ela adiciona o **framework KSA —
Conhecimentos, Habilidades, Aptidões (Knowledge, Skills, Abilities)** — para que cada
objetivo seja *tipificado* e ensinado/avaliado de acordo, além de um **mapa de habilidades**
que diz ao estudante exatamente o que precisa conquistar para atingir o mínimo de uma vaga
específica, e um **fluxo de autoria com IA Generativa** para projetar tudo isso.

* 🧠 **Conhecimento (Knowledge)** — o *saber-o quê / saber-por quê* (conceitos, fatos) → Ler · Escutar · Assistir.
* 🛠️ **Habilidade (Skill)** — o *saber-como* (procedimentos técnicos **e** humanos) → Praticar · laboratórios.
* 🌱 **Aptidão (Ability)** — o *poder-fazer / querer-fazer* (disposições duradouras e **atitudes**) → Colaborar · refletir, em múltiplas ocasiões.

```
VAGA DE EMPREGO → [IA Generativa + validação humana] → PERFIL KSA ALVO
                → diferença com o estudante → MAPA DE HABILIDADES (o que conquistar) → % DE MATCH
                → projetar micro-credenciais e átomos → conquistar distintivos verificados → PRONTO PARA O TRABALHO
```

> 🔗 Especificações: [**`specs/`**](specs/) · Comece pelo
> [Framework KSA da ADA v2](specs/ada-v2-ksa-framework.md).
> 🔗 Para assistentes de IA que trabalham neste repositório: [**`CLAUDE.md`**](CLAUDE.md).

## 🧭 Do Perfil da Vaga à Trilha de Aprendizado

A ADA é um **sistema de aprendizado dinâmico**: você escolhe uma **vaga real com demanda de
contratação** (ex.: *Cientista de Dados*) e a metodologia a **decompõe em uma trilha conectada
de micro-credenciais**, de modo que as habilidades conquistadas somem essa vaga.

A prática-chave é **como descobrimos as habilidades antes de tudo** — *triangulamos* três
fontes e deixamos a **IA sintetizar** enquanto os **humanos validam**:

1. 📚 **Frameworks** — O\*NET, ESCO, SFIA, ILO ISCO para uma base canônica e citável.
2. 📈 **Mercado ao vivo** — vagas reais e sinais de demanda do que os empregadores pedem hoje.
3. 👀 **Observação do trabalho de alto desempenho** — painéis DACUM, acompanhamento (shadowing)
   e Entrevistas de Eventos Comportamentais para capturar o que os especialistas *realmente fazem*
   e os **diferenciais** (muitas vezes Aptidões/atitudes duradouras) que definem o desempenho real.

Uma vaga torna-se assim uma **árvore mensurável**:

```
VAGA → ATRIBUIÇÕES → TAREFAS → KSA (no nível de alto desempenho, 0–4)
     → ÁTOMOS DE APRENDIZADO (unidades mensuráveis + evidência) → MICRO-CREDENCIAIS
     → TRILHA sequenciada → MAPA DE HABILIDADES + % DE MATCH (sua lacuna mensurável)
```

Cada KSA carrega um **nível-alvo e critérios de desempenho observáveis** retirados do trabalho
real, então "passar" significa *conseguir fazer o trabalho como um alto desempenho* — e a
**lacuna de habilidades é sempre um número** que diz ao estudante exatamente o que conquistar
em seguida.

> 🔗 Metodologia e prompts de IA: [**Mapeamento de Vaga para Credencial**](specs/role-to-credential-mapping.md)
> · Exemplo aplicado: [**Processamento de Dados → trilha de Cientista de Dados**](examples/role-data-scientist-pathway.md).

## 🛠 Como Construir uma Micro-Credencial ADA

1. Identificar uma **competência profissional do mundo real**.
2. Definir **objetivos de aprendizado** através dos níveis de Bloom.
3. Projetar **átomos de aprendizado** para cada objetivo.
4. Desenvolver **laboratórios práticos ou simulações**.
5. Criar **avaliações formativas e somativas**.
6. Especificar uma **entrega final**.
7. Integrar **oportunidades colaborativas**.

> 🔗 Usar o [Guia Passo a Passo](guides/guia-design-curriculo.md)

## 🎯 Pedagogical Principle

> “I hear and I forget, I see and I remember, I do and I understand, I share and I multiply.”

The **ADA methodology** promotes **experiential and progressive learning**, focused on developing **real-world job competencies**. Learning is structured in **modular micro-credentials**, each composed of **learning atoms**, the smallest instructional unit supported by collaborative and reflective learning spaces.

---

## 🗺️ The Methodology at a Glance

<p align="center">
  <img alt="The ADA Methodology: Building Job-Ready Digital Talent — overview infographic" src="img/ada-methodology-overview.png" width="900">
</p>

**ADA is a holistic framework that moves beyond traditional assessment limitations to build
job-ready competencies through structured, experiential, and collaborative learning.** It
works at two levels:

- **The guiding philosophy** — learning is a journey from **passive consumption → active
  creation**, expressed through four progressive phases (*hear → see → do → share*). Each
  phase deliberately raises the learner's agency: from self-guided introduction, to visual
  exploration, to applied practice, to collaboration and reflection.
- **The building blocks** — **Learning Atoms** (the smallest instructional unit, each with
  one objective) combine into **Micro-Credentials** (10–30h, job-ready units). This modular
  structure makes content **flexible, reusable, and focused on specific job skills**, and
  every atom runs a multi-format flow (**Read → Listen → Watch → See → Practice →
  Evaluate → Collaborate**) so concepts are introduced, demonstrated, applied, and proven.

> In **v2**, each atom and credential is additionally typed with the **KSA framework**
> (Knowledge · Skills · Abilities) and mapped to a **skills map** so learners can match the
> minimum bar for a real job opportunity. See [`specs/`](specs/).

---

##  ⚛ Learning Atom: The Foundational Modular Unit

Each **learning atom** addresses a **single learning objective**, and integrates theory, practice, and evaluation aligned to Bloom’s Taxonomy. Think of it as the **smallest self-contained unit of knowledge — a single Lego brick**: one brick has one shape and color and helps build a castle; one atom provides one specific skill.

<p align="center">
  <img alt="Inside the Learning Atom — Read & Listen, Watch & Practice, Evaluate" src="img/ada-learning-atom-structure.png" width="760">
</p>

An atom is built from **7 modalities** grouped as **Acquire → Apply → Assess → Amplify**:

| Modality | Group | Pedagogical Purpose | Sub-type Examples |
| -------- | ----- | ------------------- | ----------------- |
| 📖 **Read** | Acquire | Introduce and contextualize concepts | Article, Technical Article, Scientific Paper, Case Study, Chronicle, Journal |
| 🎧 **Listen** | Acquire | Reinforce concepts emotionally | Podcast, Narration, Audio Story, Musical, Interview |
| 🎬 **Watch** | Acquire | Demonstrate ideas or processes | Explainer, Short, Reel, Tutorial/Screencast, Documentary, Series |
| 🖼️ **See** | Acquire | Encode structure & relationships | Diagram, Mental Model, Framework, Infographic, Mind Map, Flowchart |
| 🧪 **Practice** | Apply | Apply skills in realistic contexts | Lab, Codelab, Test Challenge, Simulation, Role-Play, AI Prompt Question |
| ✅ **Evaluate** | Assess | Measure & evidence learning | Pop Quiz (formative), Quiz (summative), Mini-Rubric, Capstone, Behavioral Assessment |
| 🤝 **Collaborate** | Amplify | Learn socially; show dispositions | Pair Programming, Workshop, Hackathon, Reading Club, Showcase, Mentorship |

```mermaid
flowchart TD
  A(["⚛ Learning Atom"]) --> R["📖 Read"]
  A --> L["🎧 Listen"]
  A --> W["🎬 Watch"]
  A --> S["🖼️ See"]
  A --> P["🧪 Practice"]
  A --> E["✅ Evaluate"]
  A --> C["🤝 Collaborate"]
  R --> R1["Article · Case Study · Technical Article"]
  L --> L1["Podcast · Narration"]
  W --> W1["Explainer · Screencast · Documentary"]
  S --> S1["Diagram · Mental Model · Framework"]
  P --> P1["Codelab · Simulation · AI Prompt Question"]
  E --> E1["Pop Quiz · Capstone · Behavioral Assessment"]
  C --> C1["Pair Programming · Workshop · Hackathon"]
```

> 🔗 See the **full, detailed map** of every sub-type with diagrams: [**Learning Atom Topology**](specs/learning-atom-topology.md).
> 🔗 See also: [Learning Atom Template](templates/learning-atom-template.md)

## 🧱 ADA Micro-Credential Structure

ADA micro-credentials are short learning experiences (10–30 hours) designed to develop specific, high-impact job skills. Each includes 4–8 **learning atoms** and follows a structured instructional design.

```mermaid
flowchart TD
  JOB["💼 Job Competency<br/>(SFIA · O*NET · ESCO · ILO)"] --> MC["🎓 Micro-credential<br/>10–30h"]
  MC --> OBJ["📘 Bloom Objectives"]
  MC --> ATOMS["⚛ 4–8 Learning Atoms"]
  ATOMS --> MODS["🧱 Modalities<br/>Read · Listen · Watch · See · Practice · Evaluate · Collaborate"]
  MC --> PHASES["🔄 4 Phases<br/>🙉 hear → 🙈 see → 🙊 do → 🐵 share"]
  MC --> CAP["🚀 Capstone + Rubric"]
  CAP --> BADGE["🏅 Digital Badge"]
  BADGE --> MAP["🗺️ Skills Map → Job Match (v2)"]
```

### Standard Components:

1. **Micro-credential title**: Clear, competency-aligned.
2. **Target job competency**: Based on frameworks like SFIA, O\*NET, ESCO.
3. **Prerequisites**: Required knowledge or skills.
4. **Learning objectives**: Based on Bloom’s Taxonomy.
5. **Learning atoms**: Modular and reusable units.
6. **Lab or practical experience**: Applied learning.
7. **Assessment**: Rubric-based with Human or AI evaluation.
8. **Capstone project**: A shareable, portfolio-ready deliverable.

> 🔗 See: [Micro-Credential Template](templates/micro-credential-ada-template.md)

## 🔄 ADA Learning Phases

### 🙉 Phase 1: *Self-Guided Introduction*

> “I hear and I forget.” — Confucius

> **Goal:** Introduce concepts through self-directed content
> Includes: readings, podcasts, videos, short case studies, and comprehension checks.

---

### 🙈 Phase 2: *Visual Exploration*

> “I see and I remember.” — Confucius

> **Goal:** Reinforce learning visually and experimentally
> Includes: animations, role-play scenarios, case walkthroughs, and guided demos.

---

### 🙊 Phase 3:  *Applied Practice*

> “I do and I understand.” — Confucius

> **Goal:** Apply knowledge in practical challenges
> Includes: hands-on labs, tools, simulations, and rubric-based assessments.

---

### 🐵 Phase 4: *Collaboration and Reflection*

> “I share and I multiply.” — ADA Methodology

> **Goal:** Promote collaborative and social learning
> Includes: peer feedback, co-creation, virtual meetups, forums, and project showcases.

---

## 🌀 ADA Atom-Based Learning Flow

```mermaid
flowchart LR
  ACQ["📖🎧🎬🖼️ ACQUIRE<br/>Read · Listen · Watch · See"] --> APP["🧪 APPLY<br/>Practice"]
  APP --> ASS["✅ ASSESS<br/>Evaluate"]
  ASS --> AMP["🤝 AMPLIFY<br/>Collaborate"]
  AMP -. social feedback .-> ACQ
  ASS -. remediate .-> APP
```

This sequence creates **adaptive, inclusive, and skill-focused learning experiences**.

## 🧬 ADA v2 — KSA Framework & Job Matching

ADA is evolving to a **v2** that makes the methodology **competency-precise** and
**job-matchable**, without removing anything from v1. It adds the **KSA framework —
Knowledge, Skills, Abilities** — so every objective is *typed* and taught/assessed
accordingly, plus a **skills map** that tells a learner exactly what to earn to meet a
specific job's minimum bar, and a **Gen AI authoring workflow** to design it all.

* 🧠 **Knowledge** — the *know-what / know-why* (concepts, facts) → Read · Listen · Watch.
* 🛠️ **Skill** — the *know-how* (technical **and** human procedures) → Practice · labs.
* 🌱 **Ability** — the *can-do / will-do* (durable dispositions & **attitudes**) → Collaborate · reflect, across multiple occasions.

```
JOB POSTING → [Gen AI + human validation] → TARGET KSA PROFILE
            → diff with learner → SKILLS MAP (what to earn) → JOB-MATCH %
            → design micro-credentials & atoms → earn verified badges → JOB-READY
```

## 🧭 From Job Profile to Learning Pathway

ADA is a **dynamic learning system**: you pick a **real role with placement demand** (e.g.
*Data Scientist*) and the methodology **deconstructs it into a connected pathway of
micro-credentials** so the skills you earn add up to that role.

The key practice is **how we discover the skills in the first place** — we *triangulate* three
sources and let **AI synthesize** while **humans validate**:

1. 📚 **Frameworks** — O\*NET, ESCO, SFIA, ILO ISCO for a canonical, citable baseline.
2. 📈 **Live market** — real job postings and demand signals for what employers ask *now*.
3. 👀 **Real work observation of high performers** — DACUM panels, work shadowing, and
   Behavioral Event Interviews to capture what experts *actually do* and the **differentiators**
   (often durable Abilities/attitudes) that decide real performance.

A role then becomes a **measurable tree**:

```
ROLE → DUTIES → TASKS → KSA (at a high-performer bar, 0–4)
     → LEARNING ATOMS (measurable units + evidence) → MICRO-CREDENTIALS
     → sequenced PATHWAY → SKILLS MAP + JOB-MATCH % (your measurable gap)
```

Each KSA carries a **target level and observable performance criteria** drawn from real work,
so a "pass" means *can do the job like a strong performer* — and the **skills gap is always a
number** that tells the learner exactly what to earn next.

> 🔗 Methodology & AI prompts: [**Role-to-Credential Mapping**](specs/role-to-credential-mapping.md)
> · Worked example: [**Data Processing → Data Scientist pathway**](examples/role-data-scientist-pathway.md).

## 1. What this repository is

This repo holds the **ADA Methodology (Applied Digital Apprenticeship)** — an open,
CC BY-SA 4.0 instructional-design framework created by [Ada School](https://ada-school.org/)
to develop **job-ready digital talent**.

It is **a documentation / curriculum-design repository, not a software project.** There is
no build step, no dependencies, no test suite. The "source code" is Markdown: methodology
docs, reusable templates, designer guides, and worked examples, maintained in three
languages.

The core idea: learning is packaged as **micro-credentials** (10–30h job-ready units),
each made of **learning atoms** (the smallest instructional unit), sequenced through
**4 learning phases** modeled on the Confucius progression *hear → see → do → share*.

This repo is being extended to a **v2** that adds the **KSA framework
(Knowledge, Skills, Abilities)** and a **skills-map → job-matching** model, with a
**Gen AI authoring workflow**. The specifications for v2 live in [`specs/`](specs/).

  Ada Lovelace mark — used as the spinning app/menu icon and favicon in `index.html`).

---

## 4. How to create new content

1. **Start from a template** in `templates/` — never hand-roll structure.
   - New atom → `templates/learning-atom-template.md`
   - New micro-credential → `templates/micro-credential-ada-template.md`
   - New codelab → `templates/codelab-ada-template.md`
   - New v2 (KSA-aware) micro-credential → `specs/micro-credential-v2-schema.md`
   - Whole **role/job → pathway** of micro-credentials → follow
     [`specs/role-to-credential-mapping.md`](specs/role-to-credential-mapping.md) (triangulate
     frameworks + postings + high-performer observation; AI proposes, humans validate).
2. **Anchor to a real job competency** and link it to SFIA/O\*NET/ESCO/ILO.
3. **Write Bloom-aligned objectives** (measurable verbs).
4. **(v2) Tag each objective/atom with its KSA type** (K / S / A) — see
   [`specs/ksa-taxonomy.md`](specs/ksa-taxonomy.md).
5. **Design 4–8 atoms**, each with Concept → Example → Practice → Evaluation. Pick concrete
   modality sub-types from [`specs/learning-atom-topology.md`](specs/learning-atom-topology.md)
   that match the atom's KSA type.
6. **Add a capstone + rubric** (mini-rubric for atoms, 5-criteria rubric for capstone).
7. **Include collaborative/human elements** (mentor sessions, peer review, showcase).
8. **Validate** against the checklist in `guides/curriculum-design-guide.md`.

### Authoring with Gen AI

The end-to-end "prompt → micro-credential" workflow (job posting in → skills map +
atoms + rubrics out) is specified in
[`specs/genai-authoring-workflow.md`](specs/genai-authoring-workflow.md). Use that spec's
prompts and JSON schemas so generated output stays structurally consistent and reviewable.

## 5. Guardrails

- **Do not** invent certifications, accreditations, or partnerships that aren't documented.
- **Do not** present AI-generated competency mappings as authoritative without flagging
  them for human (mentor/employer) validation — the methodology requires a human-in-the-loop.
- **Do not** break the trilingual parallelism or drop the framework citations.
- **Do not** add build tooling, package files, or code dependencies — this is a docs repo.
- **Keep examples portfolio-ready and realistic**: prefer free/accessible tools.
- **Preserve the existing structure** when extending; v2 should *layer onto* v1, not
  replace it.

---

## 6. Commit / PR conventions

- Commit messages in this repo are short and descriptive (e.g.
  `docs: add curriculum design guide`, `Updated spanish version.`). Match that style.
- Only commit when explicitly asked.
- Group related content changes; when methodology substance changes, mention translation
  follow-ups needed.

# 🙉 Atom 1 — The ADA Big Picture

**Phase:** 🙉 1 (*hear*) · **KSA:** 🧠 Knowledge · **Target:** L2 · **Component:** `K-ada-architecture`

### 🎯 Objective
- **Explain** how ADA's building blocks fit together, from a job skill to a verifiable badge.

### 📖 Reading — *The ADA stack* (≈ 6 min)

ADA (**Applied Digital Apprenticeship**) packages learning as **micro-credentials**: focused,
**10–30-hour, job-ready units**. Each micro-credential is built from **4–8 Learning Atoms** and
sequenced through **4 Learning Phases** that follow the Confucius progression
*hear → see → do → share*. Every atom develops one **objective**, typed by **KSA** and aimed at a
**proficiency level**, taught through **modalities** from the topology, and proven by a
**deliverable + rubric**. The micro-credential ends in a **capstone** (an integrative, job-like
task), which earns a **badge**, which writes proven KSA levels into the learner's **skills map** —
the graph that gets **matched against real jobs**.

```mermaid
flowchart TD
  NEED["🏢 Real skill need<br/>(a task someone must do)"] --> MC["🎓 Micro-credential<br/>10–30h, job-ready"]
  MC --> PH["🔄 4 Phases<br/>hear → see → do → share"]
  MC --> AT["⚛ 4–8 Learning Atoms"]
  AT --> OBJ["🎯 One objective (Bloom verb)"]
  AT --> KSA["🧬 KSA type + level"]
  AT --> MOD["🧱 Modalities (topology)"]
  AT --> DEL["📦 Deliverable + rubric"]
  MC --> CAP["🚀 Capstone (5-criteria rubric)"]
  CAP --> BADGE["🏅 Badge"]
  BADGE --> MAP["🗺️ Skills map → job match"]
```

The four phases, and what each is for:

| Phase | Confucius | Goal | Typical content |
| ----- | --------- | ---- | --------------- |
| 🙉 1 Self-Guided Introduction | *I hear and I forget* | meet the concepts | readings, podcasts, videos, comprehension checks |
| 🙈 2 Visual Exploration | *I see and I remember* | make it concrete | diagrams, mental models, demos, case walkthroughs |
| 🙊 3 Applied Practice | *I do and I understand* | build the skill | labs, codelabs, simulations, rubric-scored practice |
| 🐵 4 Collaboration & Reflection | *I share and I multiply* | prove & transfer | peer review, showcase, capstone, reflection |

### ✅ Evaluate — Pop quiz
1. How many hours and how many atoms define a typical micro-credential?
2. Put the four phases in order with their Confucius lines.
3. What does a badge write into, and what is that used for?

<details><summary>Answer key</summary>

1. **10–30 hours**; **4–8 atoms**.
2. 🙉 hear → 🙈 see → 🙊 do → 🐵 share.
3. Into the **skills map** (proven KSA levels), used for **job matching**.
</details>

### 📦 Deliverable
- A 4–5 sentence "explain-back" of the ADA stack in your own words + a quick sketch of the diagram.

### 🔗 Sources
- [`README.md`](README.md) · [`specs/ada-v2-ksa-framework.md`](specs/ada-v2-ksa-framework.md).

# 🙉 Atom 2 — KSA in Depth (Knowledge · Skills · Abilities)

**Phase:** 🙉 1 (*hear*) · **KSA:** 🧠 Knowledge · **Target:** L3 · **Component:** `K-ksa-framework`

### 🎯 Objective
- **Classify** any competency as Knowledge, Skill, or Ability, and set a **0–4** target level.

### 📖 Reading — *The competency spine* (≈ 10 min)

KSA gives every objective a **type**, so it's taught and assessed the way it actually develops.

**🧠 Knowledge — the *know-what* / *know-why*.** Cognitive, factual, conceptual understanding you
can recall and reason with (HTTP status codes; color theory; what psychological safety is).
*Develops through* Read · Listen · Watch · See. *Assessed with* quizzes, concept checks, "explain
it back". *Bloom home:* Remember, Understand.

**🛠️ Skill — the *know-how*.** Procedural proficiency built through **deliberate, repeated
practice**; observable and improvable. Can be technical (build a REST endpoint) or human
(facilitate a retro). *Develops through* Practice — labs, codelabs, simulations, role-play, reps.
*Assessed with* performance tasks and rubrics on a produced artifact. *Bloom home:* Apply, Analyze,
Create.

**🌱 Ability — the *can-do* / *will-do* (durable capacities & attitudes).** Enduring dispositions
that shape *how consistently and how well* someone applies knowledge and skills across changing
contexts: adaptability, resilience, collaboration, growth mindset, attention to detail. *Develops
through* repeated authentic practice **+ reflection + feedback over time**. *Assessed with*
behavioral rubrics, reflective journals, and peer/mentor **360** across **multiple occasions** —
**never a single quiz**. *Bloom home:* all levels, paired with the **affective domain**.

> **Skill vs. Ability — the practical test:** if it improves mainly through *reps and procedure*,
> it's a **Skill**. If it's a *disposition expressed consistently across situations* (and reads as
> an "attitude" in a job posting), it's an **Ability**. Many competencies have both layers — model
> both when it matters.

**🪜 The shared 0–4 proficiency scale** (so gaps are computable):

| Level | Label | Knowledge | Skill | Ability |
| ----- | ----- | --------- | ----- | ------- |
| 0 | None | no exposure | cannot perform | not observed |
| 1 | Aware | recalls basics | performs with full guidance | shows it occasionally, prompted |
| 2 | Working | explains & relates | performs routine cases solo | reliable in familiar contexts |
| 3 | Proficient | reasons about trade-offs | handles novel/complex; mentors | shows it under pressure / new contexts |
| 4 | Expert | synthesizes, teaches | sets best practice | role-models & develops it in others |

> **Job-readiness rule of thumb:** most entry roles need **L2** on core KSA and **L1** on adjacent.

**🌀 The affective domain (for Abilities):** Receive → Respond → Value → Organize → Internalize.
This is how an attitude *deepens* — from noticing it, to acting when prompted, to valuing it, to
organizing your behavior around it, to it becoming "who you are."

### 🖼️ See — classify with the decision flow

```mermaid
flowchart TD
  Q1{"Information you must<br/>recall or reason with?"} -->|yes| K["🧠 KNOWLEDGE"]
  Q1 -->|no| Q2{"A procedure that improves<br/>with reps / makes an artifact?"}
  Q2 -->|yes| S["🛠️ SKILL"]
  Q2 -->|no| Q3{"A disposition shown<br/>consistently across situations?"}
  Q3 -->|yes| A["🌱 ABILITY"]
```

For each, write **K / S / A** and a **0–4** target. (Tie-breakers: a tool/method/task → S; an
adjective about the person → A; a concept/standard → K.)

4. "Explains what idempotency means"  5. "Facilitates a sprint retro"  6. "Coachable / takes feedback"
7. "Builds a Figma prototype"  8. "Understands GDPR principles"

1. K·L2 2. S·L2 3. A·L2 4. K·L2 5. S·L2 (+A empathy) 6. A·L2 7. S·L2 8. K·L1–2.
</details>

### ✅ Evaluate — Mini-rubric (`knowledge-mini`)
Accuracy of type · correct tie-breaker reasoning · sensible level. Pass = 2+ on each.

### 📦 Deliverable

# 🙉 Atom 3 — Bloom's Taxonomy & Measurable Objectives

**Phase:** 🙉 1 (*hear*) · **KSA:** 🧠 K → 🛠️ S · **Target:** L2 · **Components:** `K-bloom`, `S-write-objectives`

### 🎯 Objective
- **Write** measurable learning objectives using Bloom verbs, each **tagged with a KSA type**.

### 📖 Reading — *Bloom, the verb engine of objectives* (≈ 9 min)

**Bloom's revised taxonomy (cognitive domain, 2001)** orders thinking from simple to complex.
Each level has signature **verbs** you use to write objectives you can actually measure:

| Level | Means | Sample verbs | Pairs with KSA |
| ----- | ----- | ------------ | -------------- |
| **Remember** | recall facts | define, list, name, recall, label | 🧠 K |
| **Understand** | explain meaning | explain, summarize, classify, compare | 🧠 K |
| **Apply** | use it in a new situation | use, implement, run, solve, demonstrate | 🛠️ S |
| **Analyze** | break down, find structure | differentiate, debug, compare, test | 🛠️ S / 🧠 K |
| **Evaluate** | judge against criteria | critique, justify, assess, review | 🛠️ S |
| **Create** | produce something new | design, build, compose, assemble | 🛠️ S |

A good objective = **a Bloom verb + an observable thing + (often) a condition/standard**. Avoid
fuzzy verbs that can't be measured: *know, understand-as-feeling, be familiar with, appreciate,
learn about.* Replace them with what the learner will **do**.

- 👎 "Understand variables." → 👍 "**Explain** how a name is bound to a value." (Understand · 🧠 K)
- 👎 "Know testing." → 👍 "**Write** a unit test that verifies a function." (Apply · 🛠️ S)

**The affective domain (Krathwohl)** is Bloom's companion for **Abilities/attitudes**:
Receive → Respond → Value → Organize → Internalize. Use it when the objective is a disposition:
*"**Values** feedback as fuel and seeks it proactively."* (Value · 🌱 A).

> **Rule:** the Bloom level should match the KSA type. Knowledge lives in Remember/Understand;
> Skills in Apply/Analyze/Create; Abilities span all levels **plus** the affective domain — and are
> never assessed by a recall quiz.

### 🖼️ See — Bloom ↔ KSA alignment

```mermaid
flowchart LR
  REM["Remember"] --> UND["Understand"] --> APP["Apply"] --> ANA["Analyze"] --> EVA["Evaluate"] --> CRE["Create"]
  REM -.-> K["🧠 Knowledge"]
  UND -.-> K
  APP -.-> S["🛠️ Skill"]
  ANA -.-> S
  CRE -.-> S
  AFF["🌀 Affective:<br/>Receive→Respond→Value→Organize→Internalize"] -.-> A["🌱 Ability"]
```

### 🧪 Practice — *Rewrite & tag*

Rewrite these into measurable objectives, then tag **Bloom level + KSA**:
1. "Students will know about REST."  2. "Learners get good at giving feedback."
3. "Understand Python data types."  4. "Be adaptable."

<details><summary>Sample key</summary>

1. "**Explain** what makes an API RESTful." (Understand · 🧠 K)
2. "**Structure** a feedback message using SBI." (Apply · 🛠️ S) + "**Value** candor delivered with
   care." (Value · 🌱 A)
3. "**Identify** core types and **predict** `type()` results." (Understand · 🧠 K)
4. "**Re-plan** calmly when requirements change, across ≥3 occasions." (affective Value · 🌱 A)
</details>

### ✅ Evaluate — Mini-rubric (`skill`)
Verb is measurable · level matches KSA · objective is observable. Pass = 2+ each.

### 📦 Deliverable
- **5 objectives** for a topic you care about, each tagged `Bloom · KSA · level`. (You'll reuse
  these in the capstone.)

### 🔗 Sources
- [`specs/ksa-taxonomy.md`](specs/ksa-taxonomy.md) §"Bloom home" rows · the
  [Micro-Credential Template](templates/micro-credential-ada-template.md) objectives section.

# 🙈 Atom 4 — The Learning Atom Topology

**Phase:** 🙈 2 (*see*) · **KSA:** 🧠 Knowledge · **Target:** L2 · **Component:** `K-topology`

### 🎯 Objective
- **Select** topology modalities (and sub-types) that fit an atom's **KSA type and phase**.

### 📖 Reading — *The menu you design from* (≈ 8 min)

A Learning Atom is the **smallest instructional unit**: one objective, taught through a chosen mix
of **modalities**, producing a deliverable assessed by a rubric. The topology organizes learning
into **7 modalities** in four purpose-groups:

| Group | Modality | Verb | Purpose | KSA affinity |
| ----- | -------- | ---- | ------- | ------------ |
| **Acquire** | 📖 Read | I read | concepts via text | 🧠 K |
| **Acquire** | 🎧 Listen | I hear | concepts via sound | 🧠 K · 🌱 A |
| **Acquire** | 🎬 Watch | I see | ideas/processes in motion | 🧠 K |
| **Acquire** | 🖼️ See | I picture | structure & relationships | 🧠 K |
| **Apply** | 🧪 Practice | I do | build skill by doing | 🛠️ S |
| **Assess** | ✅ Evaluate | I prove | measure & evidence | all |
| **Amplify** | 🤝 Collaborate | I share | learn socially, show dispositions | 🌱 A · 🛠️ S |

Each modality has many **sub-types** (the leaves). A few per modality: Read → *Article, Technical
Article, Case Study, Documentation, Cheat Sheet*; Listen → *Podcast, Narration, Guided Reflection*;
Watch → *Explainer, Tutorial/Screencast, Documentary*; See → *Diagram, Mental Model, Framework,
Infographic, Flowchart*; Practice → *Lab, Codelab, Simulation, Role-Play, AI Prompt Question,
Project Task*; Evaluate → *(Diagnostic / Formative / Summative)* *Pop Quiz, Mini-Rubric, Performance
Task, Behavioral Assessment, Capstone*; Collaborate → *Pair Programming, Workshop, Hackathon,
Mentorship, Showcase, Retrospective*.

> **AI is cross-cutting**, not a dimension: Gen AI can power a *Practice* atom (AI Prompt Question),
> an *Evaluate* atom (AI Q&A check), or a tutor in any modality.

### 🖼️ See — the full topology (mind map)

```mermaid
mindmap
  root((⚛ Learning Atom))
    📖 Read
      Article
      Technical Article
      Case Study
      Documentation
    🎧 Listen
      Podcast
      Narration
      Guided Reflection
    🎬 Watch
      Explainer
      Tutorial / Screencast
      Documentary
    🖼️ See
      Diagram
      Mental Model
      Framework
      Infographic
    🧪 Practice
      Lab
      Codelab
      Simulation
      Role-Play
      AI Prompt Question
    ✅ Evaluate
      Pop Quiz
      Mini-Rubric
      Performance Task
      Behavioral Assessment
      Capstone
    🤝 Collaborate
      Pair Programming
      Workshop
      Mentorship
      Showcase
```

**Choosing modalities by KSA type** (the rule that matters most):

| KSA target | Lead modalities | Evaluation |
| ---------- | --------------- | ---------- |
| 🧠 Knowledge | Read · Listen · Watch · See (offer ≥2 for accessibility) | Pop Quiz / AI Q&A |
| 🛠️ Skill | Watch a demo → **Practice** (lab/codelab) | Performance Task + Mini-Rubric |
| 🌱 Ability | **See** (model it) + **Practice** (role-play) + **Collaborate** | Behavioral Assessment (≥3) + Reflection |

### 🧪 Practice — *Design exercise: pick modalities*

For each atom goal, list 2–3 modality **sub-types** and the evaluation:
1. 🧠 "Explain HTTP status codes."  2. 🛠️ "Build a CRUD endpoint."  3. 🌱 "Collaborate across disciplines."

<details><summary>Sample key</summary>

1. 📖 Technical Article + 🖼️ Infographic + ✅ Pop Quiz.
2. 🎬 Screencast + 🧪 Codelab + ✅ Performance Task (+ Mini-Rubric).
3. 🖼️ Mental Model + 🧪 Role-Play + 🤝 Group Project + ✅ Behavioral Assessment ×3.
</details>

### ✅ Evaluate — Pop quiz
- Name the 7 modalities and their KSA affinity. Why never assess an Ability with a quiz?

### 📦 Deliverable
- A modality plan (sub-types + evaluation) for **3 atom goals** of different KSA types.

### 🔗 Sources
- [`specs/learning-atom-topology.md`](specs/learning-atom-topology.md) (the complete catalog).

# 🙊 Atom 5 — Build One Atom of Each KSA Type

**Phase:** 🙊 3 (*do*) · **KSA:** 🛠️ Skill + 🌱 Ability · **Target:** L3 · **Components:** `S-design-atoms`, `A-design-judgment`

### 🎯 Objective
- **Design** three complete learning atoms — one **Knowledge**, one **Skill**, one **Ability** —
  each with topology-correct modalities and a matching evaluation.

### 🧭 What to do

Pick a single subject you know well (e.g. "Git basics", "writing emails", "data viz"). Using the
[Learning Atom Template](templates/learning-atom-template.md), author **three atoms** about it:

```mermaid
flowchart LR
  SUBJ["🎯 Your subject"] --> KA["🧠 Knowledge atom<br/>Read/Watch/See + Pop Quiz"]
  SUBJ --> SA["🛠️ Skill atom<br/>Demo → Practice + Performance rubric"]
  SUBJ --> AA["🌱 Ability atom<br/>Model + Role-Play + Collaborate + Behavioral ×3"]
  KA --> REV["🤝 Peer review (checklist)"]
  SA --> REV
  AA --> REV
```

For **each** atom, fill in: objective (Bloom + KSA + level) · prerequisites · modalities (from the
topology) · learning activities · deliverable · evaluation · reflection. Match the modality to the
KSA type — that's what's being assessed.

### 🤝 Collaborate — peer review (or self-review against the checklist)

- [ ] Exactly **one objective** with a Bloom verb + KSA type + level.
- [ ] Modalities are **from the topology** and **fit the KSA type**.
- [ ] Knowledge atom offers **≥2 Acquire options**; Skill atom pairs **Demo + Practice**;
      Ability atom uses **See + Practice + Collaborate** with a **behavioral** evaluation (≥3).
- [ ] The evaluation actually measures the objective (no quiz for an Ability).

### ✅ Evaluate — Performance task (`skill`)
Scored with the `skill` mini-rubric (correct mechanics · modality–KSA fit · evaluation match).

### 📦 Deliverable
- **3 finished atoms** (K, S, A) + the peer-review checklist you applied. These become atoms in
  your capstone credential.

### 🔗 Sources
- [Learning Atom Template](templates/learning-atom-template.md) · imitate the atoms in the
  [Growth Mindset](examples/growth-mindset-micro-credential/atoms) and
  [Python Variables](examples/python-variables-micro-credential/atoms) courses.

# 🙊 Atom 6 — Design the Assessment

**Phase:** 🙊 3 (*do*) · **KSA:** 🛠️ Skill · **Target:** L2 · **Component:** `S-build-rubric`

### 🎯 Objective
- **Build** the standard 5-criteria **Assessment Rubric**, plus the evidence → badge → skills-map map.

### 📖 Reading — *Right tool for each KSA* (≈ 5 min)

Match the instrument to the type: **Knowledge** → quiz / concept check; **Skill** → performance
task + mini-rubric on an artifact; **Ability** → **behavioral rubric across ≥3 occasions** +
reflection + 360. The **capstone** is summative and graded with the **5-criteria Assessment
Rubric**, weighted to 100 points across four proficiency bands.

### 🧪 Practice — build the standard Assessment Rubric

Tailor the descriptors to your subject (keep the bands and weights):

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | \[describe mastery] | \[describe] | \[describe] | \[describe] | **20 pts** |
| **Application of skills** | \[describe] | \[describe] | \[describe] | \[describe] | **25 pts** |
| **Problem-solving & creativity** | \[describe] | \[describe] | \[describe] | \[describe] | **20 pts** |
| **Clarity & communication** | \[describe] | \[describe] | \[describe] | \[describe] | **15 pts** |
| **Collaboration & reflection** | \[describe] | \[describe] | \[describe] | \[describe] | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

Then write the **evidence → badge** logic and the **skills-map** fragment:

```mermaid
flowchart LR
  A5["Atom: Skill ✔"] --> BADGE
  A6["Rubric applied ✔"] --> BADGE
  CAP["Capstone ✔"] --> BADGE
  MENTOR["🧑‍🏫 Mentor verification"] --> BADGE
  BADGE["🏅 Your badge<br/>K/S/A levels certified"] --> MAP["🗺️ Skills map → job match"]
```

```yaml
badge:
  name: "[Your badge]"
  evidence_required: ["[atom-x]", "capstone"]
  issued_on: verified-evidence
  components: { "[K-id]": 2, "[S-id]": 2, "[A-id]": 2 }
```

### ✅ Evaluate — Performance task (`skill`)
Bands are distinct & observable · weights total 100 · pass rule stated · badge maps to KSA levels.

### 📦 Deliverable
- A completed Assessment Rubric + mini-rubrics + the badge/skills-map fragment for your subject.

### 🔗 Sources
- The standardized rubric in the [Micro-Credential Template](templates/micro-credential-ada-template.md) ·
  [`specs/skills-map-and-job-matching.md`](specs/skills-map-and-job-matching.md).

# 🐵 Atom 7 — Capstone: Assemble the Full ADA Credential

**Phase:** 🐵 4 (*share*) · **KSA:** 🛠️ Skill + 🌱 Ability · **Target:** L3 · **Components:** `S-assemble-mc`, `A-design-judgment`

### 🎯 Objective
- **Create** a complete, job-ready ADA micro-credential for a **real organizational skill need**,
  using **all** the templates, then **showcase** it for peer + mentor review.

### 🧭 The build (use every template)

```mermaid
flowchart LR
  S0["🏢 Step 0<br/>Skill-need intake"] --> S1["🎯 Competency<br/>(SFIA/O*NET/ESCO)"]
  S1 --> S2["🧬 KSA breakdown<br/>+ 0–4 targets"]
  S2 --> S3["📘 Objectives<br/>(Bloom + KSA)"]
  S3 --> S4["⚛ 4–8 atoms<br/>(topology modalities)"]
  S4 --> S5["🚀 Capstone<br/>+ Assessment Rubric"]
  S5 --> S6["🏅 Badge → 🗺️ skills map"]
```

1. **Open the [Micro-Credential Template](templates/micro-credential-ada-template.md)** and complete
   **Step 0 (skill-need intake)** → **Step 1 (competency)** → **Step 2 (KSA breakdown)** →
   **Step 3 (objectives)**. Reuse your Atom 3 objectives.
2. **Design 4–8 atoms** using the [Learning Atom Template](templates/learning-atom-template.md)
   (reuse and extend your three atoms from Atom 5). Add a
   [Codelab](templates/codelab-ada-template.md) if your skill is technical.
3. **Add the capstone + the 5-criteria Assessment Rubric** from Atom 6.
4. **Define the badge → skills map** so completion is job-matchable.
5. **Run the Design Conformance Checklist** at the end of the template.
6. **Showcase** (5 min): the skill need, your KSA breakdown, one atom you're proud of, and how the
   badge closes a real job gap. Exchange a **peer review**.

### 📦 What to submit
- [ ] A completed **micro-credential** doc (Step 0 → badge), 4–8 **atoms**, a **capstone brief**,
      a **5-criteria Assessment Rubric**, and a **badge → skills-map** fragment.
- [ ] Conformance checklist passed; one **peer review** given; a **showcase**.
- [ ] Re-take the **Atom 0 self-assessment** and note your deltas.

### 🚀 Capstone brief & 📊 Assessment Rubric

Your capstone is graded with the standard rubric below (weighted to 100; pass ≥ 70% with at least
*Developing* on every criterion, mentor-verified — human-in-the-loop).

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | Anchored to a real skill need + framework; tight throughout. | Relevant; minor gaps. | Loosely relevant; notable gaps. | Off-target or unanchored. | **20 pts** |
| **Application of skills** | KSA typing, Bloom objectives, modality fit all correct and consistent. | Mostly correct, minor errors. | Several gaps (mistyped KSA, fuzzy verbs, modality mismatch). | Minimal or incorrect application. | **25 pts** |
| **Problem-solving & creativity** | Atoms are well-sequenced and inventive; capstone simulates the real task. | Sound, conventional design. | Uneven sequence; thin capstone. | Incoherent or missing capstone. | **20 pts** |
| **Clarity & communication** | Docs are clear, on-template, professional; showcase crisp. | Generally clear. | Uneven clarity / off-template. | Unclear or incomplete. | **15 pts** |
| **Collaboration & reflection** | Insightful peer review + honest reflection + human-in-the-loop flagged. | Adequate review + reflection. | Minimal. | Missing. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

### 🏅 Badge → skills map

On verified completion you earn **🏅 ADA Course Designer**, certifying `S-design-atoms` and
`S-assemble-mc` at **L3**, the four Knowledge components at L2–L3, and `A-design-judgment` at L2 —
the components an L&D / instructional-design role lists as must-haves.
