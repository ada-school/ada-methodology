## 1) `knowledge-mini` — for Knowledge atoms (Atoms 1–2)

Formative checks for understanding (used by the pop quizzes).

| Criterion | Pass (✓) | Not yet (✗) |
| --------- | -------- | ----------- |
| **Comprehension** | Explains the concept (process>answer, CRAAP, LLM limits) in own words | Recites without understanding |
| **Application** | Judges a source / spots a likely hallucination in a scenario | Cannot transfer to a new case |
| **Reflection** | Connects the idea to a real learning situation | No connection made |

Pass = all ✓. Retake allowed.

---

## 2) `skill` — for Skill atoms (Atoms 3–4)

| Criterion | Excellent (3) | Adequate (2) | Needs work (1) |
| --------- | ------------- | ------------ | -------------- |
| **Search research (Atom 3)** | Precise queries + operators; reaches & triangulates reputable sources | Workable queries; some cross-checking | First link; single low-quality source |
| **Learn with AI (Atom 4)** | Structured prompts that force retrieval; sources opened & verified | Some active use + checking | Passive copy-paste; no verification |
| **Critical judgment** | Articulates source quality & AI limitations | Some awareness | Takes results at face value |

Pass = 2+ on each relevant row → **L2** for the targeted Skill.

---

## 3) `behavioral` — for the Abilities (Atom 5, capstone, across the course)

Scored by **observation across ≥3 occasions** (Atom 5 loop + learning log, the capstone, and general
participation). The Ability is credited only if it shows up **consistently.**

| Ability | Looks like (✓) | Doesn't look like (✗) | Occasions |
| ------- | -------------- | --------------------- | --------- |
| **Curiosity & learner agency (`A-curiosity`)** | Asks own questions, chases understanding, self-starts | Waits to be told; does the minimum | Atom 5, capstone, throughout |
| **Resilience / failing forward (`A-resilience-failure`)** | Treats stuck/wrong as data; documents lessons; persists & adapts | Quits when stuck; hides or repeats failures | Atom 5, capstone, throughout |

Credit at **L2** = observed ✓ in **at least 3 occasions** (the capstone alone is not enough).

---

## 4) `capstone-5` — summative Assessment Rubric (the badge gate)

The standard ADA 5-criteria / 4-band / 100-point rubric. Identical to the table in
[`capstone.md`](capstone.md):

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | A new, well-scoped skill learned to a demonstrable level via online + AI + search. | Relevant; mostly demonstrable. | Too easy/vague or weakly demonstrated. | Off-target / pre-known. | **20 pts** |
| **Application of skills** | Search, AI-with-verification, and the full loop used correctly & naturally. | Most used correctly. | Several gaps. | Minimal/incorrect. | **25 pts** |
| **Problem-solving (learn by failing)** | Real failures mined for lessons; clear failing-forward. | Some failures + lessons. | Vague struggle. | Hidden / gave up. | **20 pts** |
| **Clarity & communication (teach-back)** | Beginner-ready teach-back; process explained well. | Generally clear. | Uneven. | Unclear/missing. | **15 pts** |
| **Collaboration & reflection** | Curiosity + sharp source/AI audit + insightful review & reflection. | Adequate. | Minimal. | Missing. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

---

## 🏅 Badge issuance — *Self-Directed Learner*

Issued when **all** hold (mentor-verified — human-in-the-loop):

- [ ] **Knowledge:** Atoms 1–2 pop quizzes passed.
- [ ] **Skills:** Atom 3 (search) + Atom 4 (learn-with-AI) performance tasks ≥ 2 each → **L2**.
- [ ] **Abilities:** `A-curiosity` & `A-resilience-failure` observed ✓ across **≥3 occasions**.
- [ ] **Capstone:** Assessment Rubric weighted score **≥ 70%** (≥ *Developing* on each criterion).
- [ ] **Collaboration:** teach-back delivered + peer review given + reflection submitted.

The badge writes these KSA components (with levels) into the learner's **skills map** —
see [`skills-map.md`](skills-map.md).
</script>
<script type="text/markdown" data-path="examples/self-learning-micro-credential/skills-map.md"># 🗺️ Skills Map — *Self-Directed Learner*

How earning this badge updates a learner's **skills map** and why it's the highest-leverage credential
in the whole catalog — it makes every *other* credential faster to earn.

> Concept reference: [`../../specs/skills-map-job-matching.md`](../../specs/skills-map-job-matching.md).

---

## 🧩 What the badge writes to the skills map

On issuance, these KSA components are recorded with evidence and level:

| Component | Type | Level | Evidence |
| --------- | ---- | ----- | -------- |
| `K-learning-process` — how learning works | 🧠 Knowledge | L2 | Atom 1 quiz |
| `K-sources-and-ai-limits` — sources & LLM limits | 🧠 Knowledge | L2 | Atom 2 quiz + audit |
| `S-search-research` — research with search | 🛠️ Skill | **L2** | Atom 3 performance task + capstone |
| `S-learn-with-ai` — learn with AI (+ verify) | 🛠️ Skill | **L2** | Atom 4 performance task + capstone |
| `S-learning-loop` — run a self-learning loop | 🛠️ Skill | L2 | Atom 5 log + capstone |
| `A-curiosity` — curiosity & learner agency | 🌱 Ability | L2 | Behavioral, ≥3 occasions |
| `A-resilience-failure` — learn by failing forward | 🌱 Ability | L2 | Behavioral, ≥3 occasions |

---

## 🎯 Why this badge is a force multiplier

```mermaid
flowchart TD
  SL["🏅 Self-Directed Learner"] --> TECH["🐍 Technical pathways<br/>learn tools/languages faster"]
  SL --> HUMAN["🗣️ Human-skill pathways<br/>self-study + practice"]
  SL --> AI["🤖 AI-era work<br/>use AI well, verify, stay current"]
  SL --> CAREER["📈 Lifelong career agility<br/>re-skill as roles change"]
```

Most badges boost one role. **Self-Directed Learner boosts your ability to earn *every other badge***
— and to keep learning after formal training ends. Employers increasingly screen for **learning
agility** and **responsible AI use**; this credential evidences both. It maps to O\*NET process skills
(Active Learning, Learning Strategies, Critical Thinking), ESCO *"learn to learn"*, and DigComp area 1
(information & data literacy), which appear, in some form, in almost every modern role.

---

## 🧭 How it fits a learning pathway

| Stage | Credential | What it adds |
| ----- | ---------- | ------------ |
| **Foundation (do this first)** | 🏅 **Self-Directed Learner** *(this one)* | learn anything online + with AI, safely |
| Pairs with | 🏅 [Growth Mindset](../growth-mindset-micro-credential/skills-map.md) | the belief that effort & failure grow ability |
| Pairs with | 🏅 [Effective Communication](../effective-communication-micro-credential/skills-map.md) | turn what you learn into shared understanding |
| Accelerates | 🐍 [Python Variables](../python-variables-micro-credential/skills-map.md) & all technical badges | self-study makes technical pathways faster |
| Builds toward | *Research Skills · Critical Thinking · AI Literacy* | (future credentials) deeper information work |

> **Job-matching note:** because self-learning is a *transversal, foundational* competency, it rarely
> appears alone in a role's minimums — it **multiplies** the others. The recommended sequence is to
> earn this **first**, then stack role-specific badges on top. Matching against a specific job's
> minimum bar still requires **human (mentor/employer) validation** — AI-suggested mappings are a
> starting point, not a verdict (see [`../../CLAUDE.md`](../../CLAUDE.md) §5).
</script>
<script type="text/markdown" data-path="examples/ada-methodology-designer-micro-credential/atoms/atom-1-the-ada-big-picture.md">## ⚛ Learning Atom 1 — *The ADA Big Picture*

**Phase:** 🙉 1 · Self-Guided Introduction (*hear*) · **KSA:** 🧠 Knowledge · **Target level:** L2
· **Component id:** `K-ada-architecture`

### 🎯 Learning objective

- **Explain** how ADA's building blocks fit together — from a real job skill all the way to a
  verifiable badge written into a learner's skills map.

### 🧩 Prerequisites

- None. Curiosity about how learning gets designed, and ideally one skill you know well (you'll
  design a credential about it later).

### 🧭 Atom description

Before you can design ADA credentials, you need the map: what the pieces are and how they connect.
This atom gives you that mental model so every later decision (which KSA type, which Bloom verb,
which modality, which rubric) has a place to live.

---

### 📖 Reading — *The ADA stack* (≈ 6 min)

ADA (**Applied Digital Apprenticeship**) packages learning as **micro-credentials**: focused,
**10–30-hour, job-ready units**. Each micro-credential is built from **4–8 Learning Atoms** and
sequenced through **4 Learning Phases** that follow the Confucius progression
*hear → see → do → share*.

Every **atom** develops one **objective**, typed by **KSA** and aimed at a **proficiency level**,
taught through **modalities** chosen from the topology, and proven by a **deliverable + rubric**. The
micro-credential ends in a **capstone** (an integrative, job-like task), which earns a **badge**,
which writes proven KSA levels into the learner's **skills map** — the graph that gets **matched
against real jobs**.

```mermaid
flowchart TD
  NEED["🏢 Real skill need<br/>(a task someone must do)"] --> MC["🎓 Micro-credential<br/>10–30h, job-ready"]
  MC --> PH["🔄 4 Phases<br/>hear → see → do → share"]
  MC --> AT["⚛ 4–8 Learning Atoms"]
  AT --> OBJ["🎯 One objective (Bloom verb)"]
  AT --> KSA["🧬 KSA type + level"]
  AT --> MOD["🧱 Modalities (topology)"]
  AT --> DEL["📦 Deliverable + rubric"]
  MC --> CAP["🚀 Capstone (5-criteria rubric)"]
  CAP --> BADGE["🏅 Badge"]
  BADGE --> MAP["🗺️ Skills map → job match"]
```

The four phases, and what each is for:

| Phase | Confucius | Goal | Typical content |
| ----- | --------- | ---- | --------------- |
| 🙉 1 Self-Guided Introduction | *I hear and I forget* | meet the concepts | readings, podcasts, videos, comprehension checks |
| 🙈 2 Visual Exploration | *I see and I remember* | make it concrete | diagrams, mental models, demos, case walkthroughs |
| 🙊 3 Applied Practice | *I do and I understand* | build the skill | labs, codelabs, simulations, rubric-scored practice |
| 🐵 4 Collaboration & Reflection | *I share and I multiply* | prove & transfer | peer review, showcase, capstone, reflection |

**Key takeaways**

- [ ] A micro-credential is a **10–30h, job-ready unit** made of **4–8 atoms**.
- [ ] An **atom** = one objective · a KSA type+level · modalities · a deliverable + rubric.
- [ ] The **4 phases** move the learner from passive to active: hear → see → do → share.
- [ ] A **capstone → badge → skills map** turns learning into **job-matchable evidence**.

---

### 🖼️ See — the path from skill need to job match

```mermaid
flowchart LR
  A["🏢 Skill need"] --> B["🎓 Micro-credential"]
  B --> C["⚛ Atoms (4 phases)"]
  C --> D["🚀 Capstone"]
  D --> E["🏅 Badge"]
  E --> F["🗺️ Skills map"]
  F --> G["💼 Job match"]
```

---

### ✅ Evaluate — Pop quiz (formative, `knowledge-mini`)

1. How many hours and how many atoms define a typical micro-credential?
2. Put the four phases in order with their Confucius lines.
3. What does a badge write into, and what is that used for?

<details>
<summary>Answer key</summary>

1. **10–30 hours**; **4–8 atoms**.
2. 🙉 hear (*I hear and I forget*) → 🙈 see (*I see and I remember*) → 🙊 do (*I do and I
   understand*) → 🐵 share (*I share and I multiply*).
3. Into the **skills map** (proven KSA levels), used for **job matching**.

</details>

---

### 📦 Deliverable

- A 4–5 sentence "explain-back" of the ADA stack in your own words, plus a quick sketch (or copy) of
  the architecture diagram annotated with where *your* future credential's pieces will go.

### 🧠 Final reflection

- Which piece feels least familiar right now — KSA, Bloom, the topology, or rubrics? You'll meet
  each in the next atoms; note your starting question for each.

### 🔗 Sources to verify (human-in-the-loop)

- [`../../../README.md`](../../../README.md) — the canonical ADA methodology.
- [`../../../specs/ada-v2-ksa-framework.md`](../../../specs/ada-v2-ksa-framework.md) — the v2 spine.

### 🧩 Connections

- **Successors:** Atom 2 (KSA in depth), then Atom 3 (Bloom) and Atom 4 (topology).
</script>
<script type="text/markdown" data-path="examples/ada-methodology-designer-micro-credential/atoms/atom-2-ksa-in-depth.md">## ⚛ Learning Atom 2 — *KSA in Depth (Knowledge · Skills · Abilities)*

**Phase:** 🙉 1 · Self-Guided Introduction (*hear*) · **KSA:** 🧠 Knowledge · **Target level:** L3
· **Component id:** `K-ksa-framework`

### 🎯 Learning objective

- **Classify** any competency as Knowledge, Skill, or Ability, and set a **0–4** target level using
  the shared proficiency scale.

### 🧩 Prerequisites

- Atom 1 (the ADA big picture).

### 🧭 Atom description

KSA is the competency *spine* of ADA v2. Mistype a competency and everything downstream breaks — you
end up "teaching" an attitude with a quiz, or "assessing" a skill by asking the learner to define a
term. This atom builds the classification engine you'll use in every design from now on.

---

### 📖 Reading — *The competency spine* (≈ 10 min)

KSA gives every objective a **type**, so it's taught and assessed the way it actually develops.

**🧠 Knowledge — the *know-what* / *know-why*.** Cognitive, factual, conceptual understanding you
can recall and reason with (HTTP status codes; color theory; what psychological safety is).
*Develops through* Read · Listen · Watch · See. *Assessed with* quizzes, concept checks, "explain it
back". *Bloom home:* Remember, Understand.

**🛠️ Skill — the *know-how*.** Procedural proficiency built through **deliberate, repeated
practice**; observable and improvable. Technical (build a REST endpoint) or human (facilitate a
retro). *Develops through* Practice — labs, codelabs, simulations, role-play, reps. *Assessed with*
performance tasks and rubrics on a produced artifact. *Bloom home:* Apply, Analyze, Create.

**🌱 Ability — the *can-do* / *will-do* (durable capacities & attitudes).** Enduring dispositions
that shape *how consistently and how well* someone applies knowledge and skills across changing
contexts: adaptability, resilience, collaboration, growth mindset, attention to detail. *Develops
through* repeated authentic practice **+ reflection + feedback over time**. *Assessed with*
behavioral rubrics, reflective journals, peer/mentor **360** across **multiple occasions** — **never
a single quiz**. *Bloom home:* all levels, paired with the **affective domain**.

> **Skill vs. Ability — the practical test:** if it improves mainly through *reps and procedure*,
> it's a **Skill**. If it's a *disposition expressed consistently across situations* (and reads as
> an "attitude" in a job posting), it's an **Ability**. Many competencies have both layers — model
> both when it matters.

**🪜 The shared 0–4 proficiency scale** (so gaps are computable):

| Level | Label | Knowledge | Skill | Ability |
| ----- | ----- | --------- | ----- | ------- |
| 0 | None | no exposure | cannot perform | not observed |
| 1 | Aware | recalls basics | performs with full guidance | shows it occasionally, prompted |
| 2 | Working | explains & relates | performs routine cases solo | reliable in familiar contexts |
| 3 | Proficient | reasons about trade-offs | handles novel/complex; mentors | shows it under pressure / new contexts |
| 4 | Expert | synthesizes, teaches | sets best practice | role-models & develops it in others |

> **Job-readiness rule of thumb:** most entry roles need **L2** on core KSA and **L1** on adjacent.

**🌀 The affective domain (for Abilities):** Receive → Respond → Value → Organize → Internalize.
This is how an attitude *deepens* — from noticing it, to acting when prompted, to valuing it, to
organizing behavior around it, to it becoming "who you are."

**Key takeaways**

- [ ] **K** = know-what/why · **S** = know-how · **A** = durable disposition/attitude.
- [ ] One **0–4 scale** across all three makes gaps computable for job matching.
- [ ] Abilities are assessed **behaviorally across ≥3 occasions**, never a quiz.
- [ ] Tag each atom's **primary** KSA type; list secondaries.

---

### 🖼️ See — classify with the decision flow

```mermaid
flowchart TD
  Q1{"Information you must<br/>recall or reason with?"} -->|yes| K["🧠 KNOWLEDGE"]
  Q1 -->|no| Q2{"A procedure that improves<br/>with reps / makes an artifact?"}
  Q2 -->|yes| S["🛠️ SKILL"]
  Q2 -->|no| Q3{"A disposition shown<br/>consistently across situations?"}
  Q3 -->|yes| A["🌱 ABILITY"]
```

![Is it Knowledge, Skill, or Ability? — generated decision tree](../img/atom-2-ksa-in-depth.png)

> 🖼️ *Generated image — produced from the prompt below.*

A reusable prompt to generate an on-brand version of this diagram:

```prompt
Create a clean, modern educational decision-tree infographic titled "Is it Knowledge, Skill, or
Ability?". Three diamond decision nodes leading to three labeled outcomes: 🧠 Knowledge (a brain /
book icon), 🛠️ Skill (a wrench / hands icon), 🌱 Ability (a growing plant icon). Use ADA brand
colors (Indigo #1E2A6E, Turquoise #15B5C6, Gold #E0A53C accents) on a light background, flat vector
style, generous white space, legible sans-serif. 16:9.
```

---

### 🧪 Practice — *Worksheet: classify 8 competencies* (Design Exercise)

For each, write **K / S / A** and a **0–4** target, with one sentence of reasoning. Tie-breakers: a
tool/method/task → **S** (with a **K** prerequisite); an adjective about the person → **A**; a
concept/standard → **K**.

1. "Knows SQL join types"  2. "Writes a SQL query that answers a question"  3. "Detail-oriented"
4. "Explains what idempotency means"  5. "Facilitates a sprint retro"  6. "Coachable / takes
feedback"  7. "Builds a Figma prototype"  8. "Understands GDPR principles"

<details>
<summary>Sample key</summary>

1. K · L2 — a concept to recall/relate.
2. S · L2 — a procedure that makes an artifact.
3. A · L2 — an adjective about the person.
4. K · L2 — explain a concept.
5. S · L2 (+ A empathy/facilitation) — a repeatable procedure with a dispositional layer.
6. A · L2 — a disposition shown across situations.
7. S · L2 — a tool-based procedure.
8. K · L1–2 — principles to understand.

</details>

---

### ✅ Evaluate — Mini-rubric (`knowledge-mini`)

Accuracy of type · correct tie-breaker reasoning · sensible level. **Pass = 2+ on each.**

### 📦 Deliverable

- Your 8 classifications **with one sentence of reasoning each**, applying the tie-breakers.

### 🧠 Final reflection

- Pick a competency from a real job posting you've seen. Was it actually K, S, or A — and would the
  posting's "assessment" (if any) have matched the type?

### 🔗 Sources to verify (human-in-the-loop)

- [`../../../specs/ksa-taxonomy.md`](../../../specs/ksa-taxonomy.md) — the canonical KSA reference.
- O\*NET Content Model (Knowledge / Skills / Abilities descriptors).

### 🧩 Connections

- **Predecessor:** Atom 1. **Successors:** Atom 3 (Bloom verbs by type), Atom 5 (build one of each).
</script>
<script type="text/markdown" data-path="examples/ada-methodology-designer-micro-credential/atoms/atom-3-blooms-taxonomy-objectives.md">## ⚛ Learning Atom 3 — *Bloom's Taxonomy & Measurable Objectives*

**Phase:** 🙉 1 · Self-Guided Introduction (*hear*) · **KSA:** 🧠 Knowledge → 🛠️ Skill ·
**Target level:** L2 · **Component ids:** `K-bloom`, `S-write-objectives`

### 🎯 Learning objective

- **Write** measurable learning objectives using Bloom verbs, each **tagged with a KSA type** and a
  target level.

### 🧩 Prerequisites

- Atom 2 (KSA in depth) — you'll tag each objective with a KSA type.

### 🧭 Atom description

Objectives are the contract of a credential: they say exactly what the learner will be able to *do*.
Bloom gives you the verbs that make objectives measurable, and the KSA tag keeps each objective
honest about how it must be taught and assessed. This is the first atom where you start **producing**
design artifacts.

---

### 📖 Reading — *Bloom, the verb engine of objectives* (≈ 9 min)

**Bloom's revised taxonomy (cognitive domain, 2001)** orders thinking from simple to complex. Each
level has signature **verbs** you use to write objectives you can actually measure:

| Level | Means | Sample verbs | Pairs with KSA |
| ----- | ----- | ------------ | -------------- |
| **Remember** | recall facts | define, list, name, recall, label | 🧠 K |
| **Understand** | explain meaning | explain, summarize, classify, compare | 🧠 K |
| **Apply** | use it in a new situation | use, implement, run, solve, demonstrate | 🛠️ S |
| **Analyze** | break down, find structure | differentiate, debug, compare, test | 🛠️ S / 🧠 K |
| **Evaluate** | judge against criteria | critique, justify, assess, review | 🛠️ S |
| **Create** | produce something new | design, build, compose, assemble | 🛠️ S |

A good objective = **a Bloom verb + an observable thing + (often) a condition/standard**. Avoid
fuzzy verbs that can't be measured: *know, understand-as-feeling, be familiar with, appreciate,
learn about.* Replace them with what the learner will **do**.

- 👎 "Understand variables." → 👍 "**Explain** how a name is bound to a value." (Understand · 🧠 K)
- 👎 "Know testing." → 👍 "**Write** a unit test that verifies a function." (Apply · 🛠️ S)

**The affective domain (Krathwohl)** is Bloom's companion for **Abilities/attitudes**:
Receive → Respond → Value → Organize → Internalize. Use it when the objective is a disposition:
*"**Values** feedback as fuel and seeks it proactively."* (Value · 🌱 A).

> **Rule:** the Bloom level should match the KSA type. Knowledge lives in Remember/Understand;
> Skills in Apply/Analyze/Create; Abilities span all levels **plus** the affective domain — and are
> never assessed by a recall quiz.

**Key takeaways**

- [ ] Every objective needs a **measurable Bloom verb** + an **observable** result.
- [ ] Tag each objective with its **KSA type** and **target level**.
- [ ] Match the Bloom level to the KSA type (K→Remember/Understand, S→Apply/Analyze/Create).
- [ ] For Abilities, reach for the **affective** verbs (Value, Internalize).

---

### 🖼️ See — Bloom ↔ KSA alignment

```mermaid
flowchart LR
  REM["Remember"] --> UND["Understand"] --> APP["Apply"] --> ANA["Analyze"] --> EVA["Evaluate"] --> CRE["Create"]
  REM -.-> K["🧠 Knowledge"]
  UND -.-> K
  APP -.-> S["🛠️ Skill"]
  ANA -.-> S
  CRE -.-> S
  AFF["🌀 Affective:<br/>Receive→Respond→Value→Organize→Internalize"] -.-> A["🌱 Ability"]
```

---

### 🧪 Practice — *Rewrite & tag* (Design Exercise)

Rewrite these into measurable objectives, then tag **Bloom level + KSA**:

1. "Students will know about REST."  2. "Learners get good at giving feedback."
3. "Understand Python data types."  4. "Be adaptable."

<details>
<summary>Sample key</summary>

1. "**Explain** what makes an API RESTful." (Understand · 🧠 K)
2. "**Structure** a feedback message using SBI." (Apply · 🛠️ S) + "**Value** candor delivered with
   care." (Value · 🌱 A)
3. "**Identify** core types and **predict** `type()` results." (Understand · 🧠 K)
4. "**Re-plan** calmly when requirements change, across ≥3 occasions." (affective Value · 🌱 A)

</details>

---

### ✅ Evaluate — Mini-rubric (`skill`)

Verb is measurable · level matches the KSA type · objective is observable. **Pass = 2+ on each.**

### 📦 Deliverable

- **5 objectives** for a topic you care about (ideally the subject of your future capstone
  credential), each tagged `Bloom · KSA · level`. Keep these — you'll reuse them in Atom 7.

### 🧠 Final reflection

- Which of your 5 objectives is hardest to *assess*? Often that signals a mistyped KSA (e.g. an
  Ability hiding inside a "Skill" objective).

### 🔗 Sources to verify (human-in-the-loop)

- Anderson & Krathwohl (2001), *A Taxonomy for Learning, Teaching, and Assessing* (revised Bloom).
- [`../../../specs/ksa-taxonomy.md`](../../../specs/ksa-taxonomy.md) — "Bloom home" rows.
- [`../../../templates/micro-credential-ada-template.md`](../../../templates/micro-credential-ada-template.md) — objectives section.

### 🧩 Connections

- **Predecessor:** Atom 2. **Successor:** Atom 4 (choose modalities to teach each objective).
</script>
<script type="text/markdown" data-path="examples/ada-methodology-designer-micro-credential/atoms/atom-4-learning-atom-topology.md">## ⚛ Learning Atom 4 — *The Learning Atom Topology*

**Phase:** 🙈 2 · Visual Exploration (*see*) · **KSA:** 🧠 Knowledge · **Target level:** L2
· **Component id:** `K-topology`

### 🎯 Learning objective

- **Select** topology modalities (and sub-types) that fit an atom's **KSA type and phase**.

### 🧩 Prerequisites

- Atoms 2–3 (KSA + objectives) — modality choice follows from the KSA type.

### 🧭 Atom description

The topology is the **menu** you design atoms from. Knowing it well is the difference between
defaulting to "a video and a quiz" for everything and deliberately choosing modalities that actually
develop the target KSA. This atom is in Phase 2 (*see*) because the best way to internalize the
topology is visually.

---

### 📖 Reading — *The menu you design from* (≈ 8 min)

A Learning Atom is the **smallest instructional unit**: one objective, taught through a chosen mix of
**modalities**, producing a deliverable assessed by a rubric. The topology organizes learning into
**7 modalities** in four purpose-groups:

| Group | Modality | Verb | Purpose | KSA affinity |
| ----- | -------- | ---- | ------- | ------------ |
| **Acquire** | 📖 Read | I read | concepts via text | 🧠 K |
| **Acquire** | 🎧 Listen | I hear | concepts via sound | 🧠 K · 🌱 A |
| **Acquire** | 🎬 Watch | I see | ideas/processes in motion | 🧠 K |
| **Acquire** | 🖼️ See | I picture | structure & relationships | 🧠 K |
| **Apply** | 🧪 Practice | I do | build skill by doing | 🛠️ S |
| **Assess** | ✅ Evaluate | I prove | measure & evidence | all |
| **Amplify** | 🤝 Collaborate | I share | learn socially, show dispositions | 🌱 A · 🛠️ S |

Each modality has many **sub-types** (the leaves). A few per modality: Read → *Article, Technical
Article, Case Study, Documentation, Cheat Sheet*; Listen → *Podcast, Narration, Guided Reflection*;
Watch → *Explainer, Tutorial/Screencast, Documentary*; See → *Diagram, Mental Model, Framework,
Infographic, Flowchart*; Practice → *Lab, Codelab, Simulation, Role-Play, AI Prompt Question, Project
Task*; Evaluate → *(Diagnostic / Formative / Summative)* *Pop Quiz, Mini-Rubric, Performance Task,
Behavioral Assessment, Capstone*; Collaborate → *Pair Programming, Workshop, Hackathon, Mentorship,
Showcase, Retrospective*.

> **AI is cross-cutting**, not a dimension: Gen AI can power a *Practice* atom (AI Prompt Question),
> an *Evaluate* atom (AI Q&A check), or a tutor in any modality.

**Key takeaways**

- [ ] There are **7 modalities** grouped as Acquire · Apply · Assess · Amplify.
- [ ] Each modality has many **sub-types** — pick the specific leaf, not just the group.
- [ ] **Match modality to KSA type**: K→Acquire, S→Practice, A→See+Practice+Collaborate.
- [ ] Offer **≥2 Acquire options** on Knowledge atoms for accessibility.

---

### 🖼️ See — the full topology (mind map)

```mermaid
flowchart TD
  ROOT(["⚛ Learning Atom"])
  ROOT --> READ["📖 Read"]
  ROOT --> LISTEN["🎧 Listen"]
  ROOT --> WATCH["🎬 Watch"]
  ROOT --> SEE["🖼️ See"]
  ROOT --> PRACTICE["🧪 Practice"]
  ROOT --> EVAL["✅ Evaluate"]
  ROOT --> COLLAB["🤝 Collaborate"]

  READ --> R1["Article"] & R2["Technical Article"] & R3["Case Study"] & R4["Documentation"]
  LISTEN --> L1["Podcast"] & L2["Narration"] & L3["Guided Reflection"]
  WATCH --> W1["Explainer"] & W2["Tutorial / Screencast"] & W3["Documentary"]
  SEE --> S1["Diagram"] & S2["Mental Model"] & S3["Framework"] & S4["Infographic"]
  PRACTICE --> P1["Lab"] & P2["Codelab"] & P3["Simulation"] & P4["Role-Play"] & P5["AI Prompt Question"]
  EVAL --> E1["Pop Quiz"] & E2["Mini-Rubric"] & E3["Performance Task"] & E4["Behavioral Assessment"] & E5["Capstone"]
  COLLAB --> C1["Pair Programming"] & C2["Workshop"] & C3["Mentorship"] & C4["Showcase"]
```

**Choosing modalities by KSA type** (the rule that matters most):

| KSA target | Lead modalities | Evaluation |
| ---------- | --------------- | ---------- |
| 🧠 Knowledge | Read · Listen · Watch · See (offer ≥2 for accessibility) | Pop Quiz / AI Q&A |
| 🛠️ Skill | Watch a demo → **Practice** (lab/codelab) | Performance Task + Mini-Rubric |
| 🌱 Ability | **See** (model it) + **Practice** (role-play) + **Collaborate** | Behavioral Assessment (≥3) + Reflection |

---

### 🧪 Practice — *Design exercise: pick modalities*

For each atom goal, list 2–3 modality **sub-types** and the evaluation:

1. 🧠 "Explain HTTP status codes."  2. 🛠️ "Build a CRUD endpoint."  3. 🌱 "Collaborate across
disciplines."

<details>
<summary>Sample key</summary>

1. 📖 Technical Article + 🖼️ Infographic + ✅ Pop Quiz.
2. 🎬 Screencast + 🧪 Codelab + ✅ Performance Task (+ Mini-Rubric).
3. 🖼️ Mental Model + 🧪 Role-Play + 🤝 Group Project + ✅ Behavioral Assessment ×3.

</details>

---

### ✅ Evaluate — Pop quiz (formative, `knowledge-mini`)

1. Name the 7 modalities and their KSA affinity.
2. Why should you never assess an Ability with a quiz?
3. What's the minimum you should pair on a Skill atom?

<details>
<summary>Answer key</summary>

1. 📖 Read, 🎧 Listen, 🎬 Watch, 🖼️ See (all 🧠 K) · 🧪 Practice (🛠️ S) · ✅ Evaluate (all) ·
   🤝 Collaborate (🌱 A · 🛠️ S).
2. Abilities are dispositions shown **across situations**; a one-shot recall quiz can't evidence
   consistency — use behavioral assessment across ≥3 occasions.
3. At least one **Acquire/Demo** modality paired with one **Practice** sub-type.

</details>

---

### 📦 Deliverable

- A modality plan (sub-types + evaluation) for **3 atom goals** of different KSA types — ideally
  three of the objectives you wrote in Atom 3.

### 🧠 Final reflection

- Which modality do you over-rely on? Designers have defaults; naming yours helps you diversify.

### 🔗 Sources to verify (human-in-the-loop)

- [`../../../specs/learning-atom-topology.md`](../../../specs/learning-atom-topology.md) — the
  complete catalog with every sub-type and decision flow.

### 🧩 Connections

- **Predecessor:** Atom 3. **Successor:** Atom 5 (turn these plans into real atoms).
</script>
<script type="text/markdown" data-path="examples/ada-methodology-designer-micro-credential/atoms/atom-5-build-atoms-of-each-ksa-type.md">## ⚛ Learning Atom 5 — *Build One Atom of Each KSA Type*

**Phase:** 🙊 3 · Applied Practice (*do*) · **KSA:** 🛠️ Skill + 🌱 Ability · **Target level:** L3
· **Component ids:** `S-design-atoms`, `A-design-judgment`

### 🎯 Learning objective

- **Design** three complete learning atoms — one **Knowledge**, one **Skill**, one **Ability** —
  each with topology-correct modalities and a matching evaluation.

### 🧩 Prerequisites

- Atoms 2–4 (KSA, objectives, topology). Have the [Learning Atom
  Template](../../../templates/learning-atom-template.md) open.

### 🧭 Atom description

This is the core craft of an ADA designer: authoring atoms. You'll feel the difference between the
three KSA types in your hands — a Knowledge atom is built to *acquire and check*, a Skill atom to
*demo and do*, an Ability atom to *model, practice, collaborate, and observe over time*. This is also
the first of three occasions where your **design judgment** (`A-design-judgment`) is observed.

---

### 🧭 What to do (Design Exercise)

Pick a single subject you know well (e.g. "Git basics", "writing clear emails", "data viz"). Using
the [Learning Atom Template](../../../templates/learning-atom-template.md), author **three atoms**
about it — one per KSA type:

```mermaid
flowchart LR
  SUBJ["🎯 Your subject"] --> KA["🧠 Knowledge atom<br/>Read/Watch/See + Pop Quiz"]
  SUBJ --> SA["🛠️ Skill atom<br/>Demo → Practice + Performance rubric"]
  SUBJ --> AA["🌱 Ability atom<br/>Model + Role-Play + Collaborate + Behavioral ×3"]
  KA --> REV["🤝 Peer review (checklist)"]
  SA --> REV
  AA --> REV
```

For **each** atom, fill in: objective (Bloom + KSA + level) · prerequisites · modalities (from the
topology) · learning activities · deliverable · evaluation · reflection. Match the modality to the
KSA type — that's what's being assessed.

---

### 🤝 Collaborate — peer review (Async Peer Review)

Trade your three atoms with a peer (or self-review against this checklist):

- [ ] Exactly **one objective** with a Bloom verb + KSA type + level.
- [ ] Modalities are **from the topology** and **fit the KSA type**.
- [ ] Knowledge atom offers **≥2 Acquire options**; Skill atom pairs **Demo + Practice**;
      Ability atom uses **See + Practice + Collaborate** with a **behavioral** evaluation (≥3).
- [ ] The evaluation actually measures the objective (no quiz for an Ability).

---

### ✅ Evaluate — Performance task (`skill`)

Your three atoms are scored with the `skill` mini-rubric (correct mechanics · modality–KSA fit ·
evaluation match). The peer review you *give* is one of the 3 observed occasions for
`A-design-judgment` (did you center the learner and give specific, kind, useful feedback?).

### 📦 Deliverable

- **3 finished atoms** (K, S, A) on one subject + the peer-review checklist you applied. These
  become atoms in your capstone credential (Atom 7).

### 🧠 Final reflection

- Which KSA type was hardest to design for? Most new designers find **Ability** atoms hardest —
  they require modeling, repetition, and behavioral evidence rather than content delivery.

### 🔗 Sources to verify (human-in-the-loop)

- [`../../../templates/learning-atom-template.md`](../../../templates/learning-atom-template.md) —
  the template you fill.
- Imitate real atoms in the
  [Growth Mindset](../../growth-mindset-micro-credential/atoms) and
  [Python Variables](../../python-variables-micro-credential/atoms) courses.

### 🧩 Connections

- **Predecessor:** Atom 4. **Successor:** Atom 6 (how to assess the atoms you just built).
</script>
<script type="text/markdown" data-path="examples/ada-methodology-designer-micro-credential/atoms/atom-6-design-the-assessment.md">## ⚛ Learning Atom 6 — *Design the Assessment*

**Phase:** 🙊 3 · Applied Practice (*do*) · **KSA:** 🛠️ Skill · **Target level:** L2
· **Component id:** `S-build-rubric`

### 🎯 Learning objective

- **Build** the standard 5-criteria **Assessment Rubric**, plus the evidence → badge → skills-map map
  for a credential.

### 🧩 Prerequisites

- Atom 5 (you'll assess the atoms you designed). Atom 2 (KSA → instrument fit).

### 🧭 Atom description

A credential is only as fair and useful as its assessment. This atom turns "I think they learned it"
into evidence: the right instrument per KSA type, a weighted capstone rubric with distinct bands, and
a badge that writes specific KSA levels into the skills map.

---

### 📖 Reading — *Right tool for each KSA* (≈ 5 min)

Match the instrument to the type: **Knowledge** → quiz / concept check; **Skill** → performance task
+ mini-rubric on an artifact; **Ability** → **behavioral rubric across ≥3 occasions** + reflection +
360. The **capstone** is summative and graded with the **5-criteria Assessment Rubric**, weighted to
100 points across four proficiency bands.

| KSA | Best instrument | Evidence |
| --- | --------------- | -------- |
| 🧠 Knowledge | Pop quiz / concept check / AI Q&A | correct recall & explanation |
| 🛠️ Skill | Performance task + mini-rubric | a working artifact |
| 🌱 Ability | Behavioral rubric (≥3 occasions) + reflection + 360 | consistent behavior over time |
| 🚀 Capstone (all) | 5-criteria Assessment Rubric (100 pts) | integrative, job-like deliverable |

**Key takeaways**

- [ ] Pick the instrument from the **KSA type**, not habit.
- [ ] Capstone rubric = **5 criteria × 4 bands**, weighted to **100 pts**.
- [ ] Bands must be **distinct and observable** (a grader can tell them apart).
- [ ] The badge writes **specific KSA levels** into the skills map.

---

### 🧪 Practice — build the standard Assessment Rubric (Design Exercise)

Tailor the descriptors to your subject (keep the bands and weights):

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | [describe mastery] | [describe] | [describe] | [describe] | **20 pts** |
| **Application of skills** | [describe] | [describe] | [describe] | [describe] | **25 pts** |
| **Problem-solving & creativity** | [describe] | [describe] | [describe] | [describe] | **20 pts** |
| **Clarity & communication** | [describe] | [describe] | [describe] | [describe] | **15 pts** |
| **Collaboration & reflection** | [describe] | [describe] | [describe] | [describe] | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

Then write the **evidence → badge** logic and the **skills-map** fragment:

```mermaid
flowchart LR
  A5["Skill atom ✔"] --> BADGE
  A6["Rubric applied ✔"] --> BADGE
  CAP["Capstone ✔"] --> BADGE
  MENTOR["🧑‍🏫 Mentor verification"] --> BADGE
  BADGE["🏅 Your badge<br/>K/S/A levels certified"] --> MAP["🗺️ Skills map → job match"]
```

```yaml
badge:
  name: "[Your badge]"
  evidence_required: ["[atom-x]", "capstone"]
  issued_on: verified-evidence
  components: { "[K-id]": 2, "[S-id]": 2, "[A-id]": 2 }
```

---

### ✅ Evaluate — Performance task (`skill`)

Bands are distinct & observable · weights total 100 · a pass rule is stated · the badge maps to KSA
levels. This is a second observed occasion for `A-design-judgment` (is the assessment *fair* and
learner-respecting?).

### 📦 Deliverable

- A completed Assessment Rubric + at least one mini-rubric + the badge/skills-map fragment for your
  subject. Reuse these in the capstone (Atom 7).

### 🧠 Final reflection

- Could two different graders use your rubric and land within ~10%? If not, your bands aren't
  distinct enough yet.

### 🔗 Sources to verify (human-in-the-loop)

- The standardized rubric in
  [`../../../templates/micro-credential-ada-template.md`](../../../templates/micro-credential-ada-template.md).
- [`../../../specs/skills-map-and-job-matching.md`](../../../specs/skills-map-and-job-matching.md).

### 🧩 Connections

- **Predecessor:** Atom 5. **Successor:** Atom 7 (assemble everything into one credential).
</script>
<script type="text/markdown" data-path="examples/ada-methodology-designer-micro-credential/atoms/atom-7-capstone-assemble-the-credential.md">## ⚛ Learning Atom 7 — *Capstone: Assemble the Full ADA Credential*

**Phase:** 🐵 4 · Collaboration & Reflection (*share*) · **KSA:** 🛠️ Skill + 🌱 Ability ·
**Target level:** L3 · **Component ids:** `S-assemble-mc`, `A-design-judgment`

### 🎯 Learning objective

- **Create** a complete, job-ready ADA micro-credential for a **real organizational skill need**,
  using **all** the templates, then **showcase** it for peer + mentor review.

### 🧩 Prerequisites

- All prior atoms. You should already have: 5 tagged objectives (Atom 3), 3 atoms (Atom 5), and an
  Assessment Rubric + badge fragment (Atom 6).

### 🧭 Atom description

This is where the course pays off: you assemble your accumulated artifacts into one coherent,
deliverable credential — the same artifact a working ADA designer ships. It's a Phase 4 atom because
the work is proven socially: a showcase and a peer review, validated by a mentor.

---

### 🧭 The build (use every template)

```mermaid
flowchart LR
  S0["🏢 Step 0<br/>Skill-need intake"] --> S1["🎯 Competency<br/>(SFIA/O*NET/ESCO)"]
  S1 --> S2["🧬 KSA breakdown<br/>+ 0–4 targets"]
  S2 --> S3["📘 Objectives<br/>(Bloom + KSA)"]
  S3 --> S4["⚛ 4–8 atoms<br/>(topology modalities)"]
  S4 --> S5["🚀 Capstone<br/>+ Assessment Rubric"]
  S5 --> S6["🏅 Badge → 🗺️ skills map"]
```

1. **Open the [Micro-Credential Template](../../../templates/micro-credential-ada-template.md)** and
   complete **Step 0 (skill-need intake)** → **Step 1 (competency)** → **Step 2 (KSA breakdown)** →
   **Step 3 (objectives)**. Reuse your Atom 3 objectives.
2. **Design 4–8 atoms** using the
   [Learning Atom Template](../../../templates/learning-atom-template.md) (reuse and extend your
   three atoms from Atom 5). Add a [Codelab](../../../templates/codelab-ada-template.md) if your
   skill is technical.
3. **Add the capstone + the 5-criteria Assessment Rubric** from Atom 6.
4. **Define the badge → skills map** so completion is job-matchable.
5. **Run the Design Conformance Checklist** at the end of the template.
6. **Showcase** (5 min): the skill need, your KSA breakdown, one atom you're proud of, and how the
   badge closes a real job gap. Exchange a **peer review**.

---

### 📦 What to submit

- [ ] A completed **micro-credential** doc (Step 0 → badge), **4–8 atoms**, a **capstone brief**, a
      **5-criteria Assessment Rubric**, and a **badge → skills-map** fragment.
- [ ] Conformance checklist passed; one **peer review** given; a **showcase** delivered.
- [ ] Re-take the diagnostic from [`../micro-credential.md`](../micro-credential.md) and note your
      deltas.

---

### 🎤 Showcase structure (≈ 5 minutes)

1. **The skill need** (45s) — whose job, which task, why now.
2. **KSA breakdown** (60s) — the components and target levels.
3. **One atom** (90s) — the one you're proudest of, and why its modalities fit its KSA type.
4. **Badge → job gap** (60s) — what the skills map writes, and the requirement it closes.
5. **Human-in-the-loop** (15s) — what a mentor/employer must validate before it counts.

---

### ✅ Evaluate — Capstone (`capstone-5`)

Graded with the standard 5-criteria Assessment Rubric in [`../rubrics.md`](../rubrics.md) /
[`../capstone.md`](../capstone.md). This is the third and decisive observed occasion for
`A-design-judgment` (learner empathy + framework rigor + honest human-in-the-loop flags).

### 📦 Deliverable

- Your **complete, portfolio-ready ADA micro-credential** + showcase + the peer review you gave.

### 🧠 Final reflection

- Compare your before/after diagnostic. Which component moved most? What would you redesign on a
  second pass — and what does that tell you about your design defaults?

### 🔗 Sources to verify (human-in-the-loop)

- All three templates in [`../../../templates/`](../../../templates/).
- [`../capstone.md`](../capstone.md) · [`../rubrics.md`](../rubrics.md) · [`../skills-map.md`](../skills-map.md).

### 🧩 Connections

- **Predecessor:** Atom 6. **Outcome:** 🏅 *ADA Methodology Designer* badge → an L&D /
  instructional-design pathway (see [`../skills-map.md`](../skills-map.md)).
</script>
<script type="text/markdown" data-path="examples/critical-thinking-micro-credential/atoms/atom-1-what-is-critical-thinking.md">## ⚛ Learning Atom 1 — *What Critical Thinking Is*

**Phase:** 🙉 1 · Self-Guided Introduction (*hear*) · **KSA:** 🧠 Knowledge · **Target level:** L2
· **Component id:** `K-reasoning`

### 🎯 Learning objective

- **Explain** the parts of an argument and **distinguish** validity from soundness, using the standards
  of good thinking.

### 🧩 Prerequisites

- None. Bring one belief you hold strongly — we'll examine *why* you hold it.

### 🧭 Atom description

"Critical thinking" gets used to mean "disagreeing" or "being negative." It's neither. It's the
disciplined habit of **evaluating reasoning** — yours and others' — against clear standards, so your
conclusions track what's actually true and well-supported. This atom gives you the vocabulary and the
mental model the whole course builds on.

---

### 📖 Reading — *Reasoning has parts you can inspect* (≈ 7 min)

Critical thinking is **thinking about thinking in order to improve it.** Instead of accepting a
conclusion because it's loud, familiar, or flattering, you examine *how it was reached.* To do that you
need to see the moving parts.

**The anatomy of an argument.** An *argument* (in this sense) isn't a quarrel — it's a **claim
supported by reasons**:

- **Claim (conclusion):** what someone wants you to accept. *"We should switch tools."*
- **Premises (reasons):** the support offered. *"The new tool is cheaper and faster."*
- **Assumptions:** unstated things that must be true for the argument to work. *"Cheaper + faster
  matters more than the switching cost."* Hidden assumptions are where most bad arguments hide.
- **Inference:** the logical step *from* premises *to* claim. Is the jump justified?
- **Evidence:** the data backing the premises. Is it real, relevant, and sufficient?

**Validity vs. soundness** (a crucial distinction):

- An argument is **valid** if the conclusion *follows logically* from the premises — *regardless of
  whether the premises are true.* ("All cats can fly; Felix is a cat; therefore Felix can fly" is
  **valid** but false.)
- An argument is **sound** if it is valid **and** its premises are actually **true.** Sound arguments
  are the goal. So you check two separate things: *Is the logic good?* and *Are the premises true?*

**Deductive vs. inductive.** *Deductive* reasoning aims for certainty (if premises true + valid →
conclusion guaranteed). *Inductive* reasoning aims for probability (evidence makes the conclusion
*likely* — most real-world reasoning is inductive, so you weigh **strength**, not proof).

**Standards of good thinking.** When you assess any reasoning, check it against (after Paul & Elder):
**clarity** (is it clear?), **accuracy** (is it true?), **relevance** (does it bear on the issue?),
**logic** (does it hang together?), **depth & breadth** (does it handle complexity and other views?),
and **fairness** (is it free of distortion and self-interest?).

> **The mindset:** critical thinking starts with a question, not a conclusion. *"What's the claim?
> What's the evidence? Does the conclusion really follow? What am I assuming?"*

**Key takeaways**

- [ ] An argument = **claim + premises + (hidden) assumptions + inference + evidence.**
- [ ] **Validity** = the logic holds; **soundness** = valid **and** premises are true.
- [ ] Most real reasoning is **inductive** — judge **strength**, not proof.
- [ ] Assess thinking against **clarity, accuracy, relevance, logic, depth, fairness.**

---

### 🎬 Watch — critical thinking, explained (pick one, ~5–6 min)

```youtube
https://www.youtube.com/watch?v=dItUGF8GdTw
TED-Ed — "5 tips to improve your critical thinking" (Samantha Agoos).
```

```youtube
https://www.youtube.com/watch?v=6OLPL5p0fMg
"Critical thinking / what it is and isn't" — a short explainer (verify before delivery).
```

---

### 🖼️ See — the anatomy of an argument

```mermaid
flowchart TD
  EV["📊 Evidence"] --> PREM["📌 Premises (reasons)"]
  ASSUM["🫥 Hidden assumptions"] --> INF
  PREM --> INF["➡️ Inference<br/>(does it follow?)"]
  INF --> CLAIM["🎯 Claim (conclusion)"]
```

![Anatomy of an argument — generated diagram](../img/atom-1-what-is-critical-thinking.png)

> 🖼️ *Generated image — produced from the prompt below.*

A reusable prompt to generate an on-brand version of this diagram:

```prompt
Create a clean, modern educational infographic titled "Anatomy of an Argument": Evidence feeds
Premises; Hidden Assumptions feed the Inference; Premises + Inference lead to the Claim (conclusion).
Add a caption: "Validity = the logic holds · Soundness = valid AND premises true." Use ADA brand
colors (Indigo #1E2A6E, Turquoise #15B5C6, Gold #E0A53C accents) on a light background, flat vector
style, legible sans-serif, no text errors. 16:9.
```

---

### ✅ Evaluate — Pop quiz (formative, `knowledge-mini`)

1. What's the difference between a valid argument and a sound one?
2. Why are *hidden assumptions* so important to find?
3. Give two of the standards you'd use to judge a piece of reasoning.

<details>
<summary>Answer key</summary>

1. **Valid** = the conclusion follows logically from the premises (even if premises are false);
   **sound** = valid **and** the premises are actually true.
2. Because an argument can look fine on the surface while resting on an unstated assumption that is
   false or contested — that's where reasoning quietly breaks.
3. Any two of: **clarity, accuracy, relevance, logic, depth, breadth, fairness.**

</details>

---

### 📦 Deliverable

- Take your strongly-held belief. Write it as an **argument**: state the **claim**, your **premises**,
  one **hidden assumption**, and the **evidence**. Note whether it's deductive or inductive.

### 🧠 Final reflection

- Which standard (clarity/accuracy/relevance/logic/depth/fairness) does your own reasoning most often
  skip?

### 🔗 Sources to verify (human-in-the-loop)

- Paul & Elder, *The Miniature Guide to Critical Thinking* (standards & elements of reasoning).
- Walton, *Informal Logic* (arguments, premises, inference).
- Stanford Encyclopedia of Philosophy — *Critical Thinking* entry.

### 🧩 Connections

- **Successors:** Atom 2 (how reasoning fails), Atom 3 (evaluate real arguments).
</script>
<script type="text/markdown" data-path="examples/critical-thinking-micro-credential/atoms/atom-2-fallacies-and-biases.md">## ⚛ Learning Atom 2 — *Logical Fallacies & Reasoning Biases*

**Phase:** 🙉 1 · Self-Guided Introduction (*hear*) · **KSA:** 🧠 Knowledge · **Target level:** L2
· **Component id:** `K-fallacies-biases`

### 🎯 Learning objective

- **Recognize** common logical fallacies and reasoning biases and **explain** how each distorts an
  argument.

### 🧩 Prerequisites

- Atom 1 (the anatomy of an argument). Fallacies are specific ways the inference or premises go wrong.

### 🧭 Atom description

Bad reasoning often *sounds* convincing — that's exactly why it works. This atom is a field guide to
the most common ways arguments fail: **fallacies** (flaws in the logic) and **biases** (flaws in the
thinker). Once you can name them, you'll start seeing them everywhere: in ads, headlines, debates,
AI output, and your own first drafts.

---

### 📖 Reading — *A field guide to bad arguments* (≈ 8 min)

**Logical fallacies** — flaws in the *argument*:

- **Ad hominem** — attacking the person, not their argument. *"You can't trust her budget analysis,
  she's young."*
- **Straw man** — distorting someone's position into a weaker one and attacking that. (The antidote,
  *steelmanning*, comes in Atom 4.)
- **False dilemma** — presenting two options as the only ones. *"Either we cut the budget or we go
  bankrupt."* (Usually there are more.)
- **Slippery slope** — claiming one step inevitably leads to an extreme outcome, with no support.
- **Appeal to authority (misused)** — "an expert said so" when the person isn't a relevant expert, or
  experts disagree. (Real expertise *is* evidence — misuse is citing irrelevant or fake authority.)
- **Appeal to emotion / popularity** — using fear, pity, or "everyone's doing it" instead of reasons.
- **Hasty generalization** — a sweeping conclusion from too few examples (anecdote ≠ data).
- **Circular reasoning (begging the question)** — the conclusion is hidden in the premises. *"It's the
  best because nothing's better."*
- **Post hoc / correlation–causation** — assuming that because B followed A, A caused B.
- **Whataboutism / red herring** — dodging by pointing at something irrelevant.

**Reasoning biases** — flaws in the *thinker* (these attack you before you even build the argument):

- **Confirmation bias** — seeking/believing what fits your existing view; ignoring the rest.
- **Motivated reasoning** — reasoning toward the conclusion you *want* to be true.
- **Anchoring** — over-relying on the first piece of information.
- **Availability** — overweighting vivid or recent examples.
- **Dunning–Kruger / overconfidence** — the less you know, the more certain you can feel.
- **In-group bias** — trusting claims from "your side" and discounting "the other side."

**Two meta-points:**

1. **It's easiest to spot fallacies in arguments you disagree with — and hardest in your own.** The
   real skill is turning the lens on *yourself*. (That's the intellectual-humility Ability, built in
   Atoms 5–6.)
2. **Spotting a fallacy doesn't make the conclusion false.** A badly-argued claim can still be true —
   it just hasn't been *supported*. ("Fallacy fallacy": rejecting a conclusion only because one
   argument for it was weak.)

> **The move:** when something is persuasive, pause and ask *"is this a reason, or a trick?"* — then
> name the specific fallacy or bias.

**Key takeaways**

- [ ] **Fallacies** are flaws in the argument (ad hominem, straw man, false dilemma, slippery slope…).
- [ ] **Biases** are flaws in the thinker (confirmation, motivated reasoning, anchoring, overconfidence…).
- [ ] You spot flaws fastest in *others'* arguments — train the lens on **your own.**
- [ ] A weak argument doesn't prove the conclusion **false** (avoid the "fallacy fallacy").

---

### 🎬 Watch — how reasoning goes wrong (~5–11 min)

```youtube
https://www.youtube.com/watch?v=AmM1qWAjQEk
"Logical fallacies, explained" — a short explainer (verify before delivery).
```

---

### 🖼️ See — fallacy vs. bias

```mermaid
flowchart TD
  ARG["🗣️ A persuasive claim"] --> Q{"Is the flaw in the<br/>argument or the thinker?"}
  Q -->|argument| FAL["🎭 Fallacy<br/>ad hominem · straw man ·<br/>false dilemma · slippery slope"]
  Q -->|thinker| BIA["🧠 Bias<br/>confirmation · motivated reasoning ·<br/>anchoring · overconfidence"]
  FAL --> NAME["🏷️ Name it → discount the 'support'"]
  BIA --> NAME
```

![Fallacy vs. bias — generated diagram](../img/atom-2-fallacies-and-biases.png)

> 🖼️ *Generated image — produced from the prompt below.*

A reusable prompt to generate an on-brand version:

```prompt
Create a clean, modern infographic titled "Spot the Flaw": a persuasive claim branches into "Fallacy
(flaw in the argument)" listing ad hominem, straw man, false dilemma, slippery slope, and "Bias (flaw
in the thinker)" listing confirmation, motivated reasoning, anchoring, overconfidence; both lead to
"Name it". Use ADA brand colors (Indigo #1E2A6E, Turquoise #15B5C6, Gold #E0A53C), light background,
flat vector, legible sans-serif. 16:9.
```

---

### ✅ Evaluate — Pop quiz (formative, `knowledge-mini`)

1. Name the fallacy: *"We either ban phones in class or grades will collapse."*
2. What's the difference between a fallacy and a bias?
3. What is the "fallacy fallacy"?

<details>
<summary>Answer key</summary>

1. **False dilemma** (false dichotomy) — it presents only two options when others exist.
2. A **fallacy** is a flaw in the *argument's* logic/structure; a **bias** is a systematic flaw in how
   the *thinker* processes information.
3. Concluding a claim is **false** just because one argument for it was fallacious — a weak argument
   doesn't disprove the conclusion.

</details>

---

### 📦 Deliverable

- Find **three** real examples (ad, headline, social post, or AI answer) and label the **fallacy or
  bias** in each, with one sentence explaining why.

### 🧠 Final reflection

- Which bias most often shapes *your* conclusions (confirmation? motivated reasoning?)? When did it
  last cost you?

### 🔗 Sources to verify (human-in-the-loop)

- *Your Logical Fallacy Is* (yourlogicalfallacyis.com) and *Thou Shalt Not Commit Logical Fallacies*.
- Kahneman, *Thinking, Fast and Slow* (reasoning biases).
- Walton, *Informal Logic* (fallacy theory — note context matters).

### 🧩 Connections

- **Predecessor:** Atom 1. **Successors:** Atom 3 (evaluate real arguments), Atom 4 (steelman instead
  of straw man).
