### 🧪 AI Prompt Question (practice with AI, then verify)

Ask an AI assistant:

```prompt
"Explain step by step why this Python code raises a TypeError, and give the corrected version:

    age = input('Age? ')
    print('Next year you will be ' + age + 1)

Then explain the rule about input() and type conversion in one sentence."
```

> 🤖 **Human-in-the-loop:** don't just paste the answer — *run* the corrected code and confirm it.
> The bug is that `input()` returns a string and you can't `+ 1` to a string (and can't `+` a
> string and int). Fix: `age = int(input('Age? '))` then use an f-string.

---

### 💻🧪 Lab with tests — *refactor into functions, add a `main()`, verify*

The version above mixes math and input. Refactor the math into **pure functions** (no `input`,
no `print` — just take values, return values), keep the I/O in `main()`, and write **unit tests**
so you can prove the calculator is correct.

> 📁 Runnable files: [`../labs/tip_calculator.py`](../labs/tip_calculator.py) and
> [`../labs/test_tip_calculator.py`](../labs/test_tip_calculator.py).

```python
# tip_calculator.py
def calculate_tip(bill, tip_percent):
    return bill * tip_percent / 100

def grand_total(bill, tip_percent):
    return bill + calculate_tip(bill, tip_percent)

def per_person(total, people):
    if people <= 0:
        raise ValueError("people must be greater than 0")
    return total / people

def main():
    bill = float(input("Bill amount? "))
    tip_percent = int(input("Tip %? "))
    people = int(input("Split between how many? "))
    total = grand_total(bill, tip_percent)
    print(f"Grand total: ${total:.2f}")
    print(f"Each person pays: ${per_person(total, people):.2f}")

if __name__ == "__main__":
    main()
```

```python
# test_tip_calculator.py
import unittest
from tip_calculator import calculate_tip, grand_total, per_person

class TestTipCalculator(unittest.TestCase):
    def test_calculate_tip(self):
        self.assertAlmostEqual(calculate_tip(100, 15), 15.0)

    def test_grand_total(self):
        self.assertAlmostEqual(grand_total(100, 15), 115.0)

    def test_per_person_splits_evenly(self):
        self.assertAlmostEqual(per_person(120, 4), 30.0)

    def test_per_person_rejects_zero_people(self):
        with self.assertRaises(ValueError):    # bad input should error, not divide by zero
            per_person(100, 0)

if __name__ == "__main__":
    unittest.main()
```

```bash
python3 tip_calculator.py                      # run it
python3 -m unittest test_tip_calculator.py     # run the tests → "OK"
```

> 💡 Use `assertAlmostEqual` for `float` math (decimals can carry tiny rounding error, so `==` is
> unreliable). Notice the test for *bad input* — robust code expects mistakes.

<script type="text/markdown" data-path="examples/python-variables-micro-credential/atoms/atom-5-mini-project-capstone.md">## ⚛ Learning Atom 5 — *Mini-Project: Ship a Program (Capstone)*

**Phase:** 🐵 4 · Collaboration & Reflection (*share*) · **KSA:** 🛠️ Skill + 🌱 Ability
· **Target level:** L2 · **Component ids:** `S-declare-assign`, `S-use-values`, `A-attention-detail`

### 🎯 Learning objective

- **Create** a small, working Python program that stores, converts, and prints data using
  variables — then **explain and peer-review** it.

### 🧩 Prerequisites

- Atoms 1–4.

### 🧭 Atom description

This is the capstone, delivered as a learning atom. You'll integrate everything — naming,
assignment, types, conversion, expressions, and f-strings — into one small program you actually
*ship*, then trade code with a peer for review. Shipping something tiny and correct, and being
able to talk through it, is exactly what an entry-level task looks like.

---

### 🚀 The brief

> Build a short program (**~15–30 lines**) that collects some inputs, computes something useful
> with variables, and prints a clean, formatted summary with f-strings.

Pick one (or invent your own at the same scope):

- **Receipt maker** — items, unit prices, quantities → subtotal, tax, total.
- **Profile card** — name, birth year, city, favorite language → a formatted "ID card".
- **Trip cost splitter** — total cost, nights, number of people → cost per person per night.
- **Unit converter** — e.g. km↔miles or °C↔°F using a formula and a constant.

### 📦 What to submit

- [ ] **The program** — logic in well-named functions (PEP 8), a `main()` runner, at least 3
  different types, at least one type conversion, and f-string output.
- [ ] **A unit test file** — at least **3 passing tests** (`python3 -m unittest` shows `OK`).
- [ ] **A sample run** — the input you gave and the printed output.
- [ ] **A 4–6 line README** — what it does, how to run it + how to run the tests, one improvement.
- [ ] **A peer review you gave** — using the checklist below, on a classmate's program.

### 🧱 Starter scaffold — *functions + `main()` + tests*

Structure the program so the logic is in **testable functions** and `main()` only handles I/O.
This is the shape professionals ship — and the only way you can write tests for it.

> 📁 Full runnable reference: [`../labs/receipt.py`](../labs/receipt.py) +
> [`../labs/test_receipt.py`](../labs/test_receipt.py).

```python
# receipt.py
TAX_RATE = 0.19                      # constant in UPPER_CASE

def subtotal(unit_price, quantity):
    return unit_price * quantity

def build_receipt(item_name, unit_price, quantity, rate=TAX_RATE):
    sub = subtotal(unit_price, quantity)
    tax = sub * rate
    total = sub + tax
    return (
        "----- RECEIPT -----\n"
        f"{item_name} x{quantity} @ ${unit_price:.2f}\n"
        f"Subtotal: ${sub:.2f}\n"
        f"Tax ({rate*100:.0f}%): ${tax:.2f}\n"
        f"TOTAL:    ${total:.2f}"
    )

def main():
    item_name = input("Item name? ")
    unit_price = float(input("Unit price? "))
    quantity = int(input("Quantity? "))
    print(build_receipt(item_name, unit_price, quantity))

if __name__ == "__main__":
    main()
```

```python
# test_receipt.py
import unittest
from receipt import subtotal, build_receipt

class TestReceipt(unittest.TestCase):
    def test_subtotal(self):
        self.assertAlmostEqual(subtotal(2.5, 4), 10.0)

    def test_build_receipt_has_item_and_total(self):
        r = build_receipt("Coffee", 3.0, 2, rate=0.0)
        self.assertIn("Coffee x2", r)
        self.assertIn("TOTAL:    $6.00", r)

if __name__ == "__main__":
    unittest.main()
```

<script type="text/markdown" data-path="examples/self-learning-micro-credential/atoms/atom-1-how-learning-works.md">## ⚛ Learning Atom 1 — *How Learning Works (Process > Answer)*

**Phase:** 🙉 1 · Self-Guided Introduction (*hear*) · **KSA:** 🧠 Knowledge · **Target level:** L2
· **Component id:** `K-learning-process`

### 🎯 Learning objective

- **Explain** why the *process* of reaching an answer matters more than the answer itself, and **how
  struggle and failure drive learning.**

### 🧩 Prerequisites

- None. Bring one thing you tried to learn and found hard.

### 🧭 Atom description

Most people think learning means *getting the right answer fast*. That belief quietly sabotages them:
they copy the answer, feel productive, and learn nothing. This atom rewires that. You'll see that the
**effortful process** — struggling, getting it wrong, retrieving from memory — is *where the learning
actually happens*. Get this, and the rest of the course (search, AI, the loop) becomes a way to make
the process better, not a shortcut around it.

---

### 📖 Reading — *The answer is the by-product; the process is the point* (≈ 7 min)

Imagine two students. One watches a worked solution and nods along — it all makes sense. The other
wrestles with the problem, gets stuck, tries three wrong things, then finally cracks it. The first
*feels* like they learned more (it was smooth). The second actually did. This is one of the most
robust findings in the science of learning: **the conditions that make learning feel hard are often
the ones that make it stick.** Researchers call these **desirable difficulties.**

Three ideas to internalize:

- **Process over answer.** The answer is disposable — tomorrow's problem is different. What transfers
  is *how you got there*: the questions you asked, the dead ends you ruled out, the method you built.
  When you copy an answer, you keep the answer and throw away the learning.
- **Productive failure.** Being wrong isn't the opposite of learning — it's part of it. A wrong
  attempt tells you exactly where your model of the world is broken, which is the precise spot to fix.
  Studies on *productive failure* (Kapur) show learners who struggle *before* being shown the solution
  understand it more deeply than those shown first. **Fail → notice the gap → close it.**
- **Metacognition (thinking about your thinking).** Good learners constantly ask: *What do I actually
  understand? Where am I confused? What will I try next?* This self-monitoring is what turns effort
  into progress instead of spinning.

Two traps to avoid:

- **The fluency illusion.** Re-reading and highlighting *feel* like learning but mostly create
  familiarity, not memory. **Retrieval** (closing the book and trying to recall/explain) and **spacing**
  (revisiting over days) are far stronger — even though they feel harder.
- **Answer-seeking.** Jumping straight to "just tell me the answer" (from a person, Google, or an AI)
  skips the struggle that builds understanding. Use answers to **check and unblock**, not to replace
  the attempt. *Try first, then look.*

> **Reframe for the whole course:** when something is hard, you are not failing at learning — you are
> *doing* learning. The discomfort is the sensation of your brain changing.

**Key takeaways**

- [ ] The **process** of reaching an answer is what transfers; the answer is disposable.
- [ ] **Failure is data** — it pinpoints exactly what to fix (*productive failure*).
- [ ] **Retrieval + spacing** beat re-reading, even though they feel harder (*desirable difficulties*).
- [ ] **Metacognition** — ask what you understand and what to try next.
- [ ] **Try first, then look** — use answers to check/unblock, not to skip the struggle.

---

### 🎬 Watch — learning how to learn (pick one, ~10–17 min)

```youtube
https://www.youtube.com/watch?v=O96fE1E-rf8
Barbara Oakley — "Learning how to learn" (TEDxOaklandUniversity).
```

```youtube
https://www.youtube.com/watch?v=5eW6Eagr9XA
Veritasium — "The 4 things it takes to be an expert" (deliberate practice & feedback).
```

### 🖼️ See — the learn-by-failing loop

```mermaid
flowchart LR
  TRY["🛠️ Attempt<br/>(try first)"] --> STUCK["❓ Stuck / wrong"]
  STUCK --> GAP["🔍 Notice the gap<br/>(what's broken?)"]
  GAP --> LOOK["📖 Look it up / ask<br/>(check & unblock)"]
  LOOK --> RETRY["🔁 Retry from memory"]
  RETRY -.deeper understanding.-> TRY
```

2. What is "productive failure," and why does it help?

<details>

   method) — copying keeps the disposable answer and throws away the transferable process.
2. Struggling/being wrong **before** seeing the solution; it exposes exactly where your understanding
   is broken, so the later explanation lands deeper.
3. **Re-reading/highlighting** (the fluency illusion) → instead use **retrieval practice** (recall
   from memory) and **spacing** (revisit over days).

</details>

<script type="text/markdown" data-path="examples/self-learning-micro-credential/atoms/atom-2-trust-sources-and-how-ai-works.md">## ⚛ Learning Atom 2 — *Trustworthy Sources & How AI Really Works*

**Phase:** 🙉 1 · Self-Guided Introduction (*hear*) · **KSA:** 🧠 Knowledge · **Target level:** L2
· **Component id:** `K-sources-and-ai-limits`

### 🎯 Learning objective

- **Evaluate** whether a source is trustworthy, and **explain — at a basic level — how LLMs work and
  where they fail.**

### 🧩 Prerequisites

- Atom 1. The mindset of "try first, then verify" carries straight into this atom.

### 🧭 Atom description

Self-learning online means swimming in information of wildly different quality — and now, in
*confident* answers from AI that may simply be wrong. Before you research (Atom 3) or learn with AI
(Atom 4), you need a basic radar for **what to trust** and an honest picture of **what an LLM actually
is.** This is the safety briefing for everything that follows.

---

### 📖 Reading — *Trust, but verify — especially the confident robot* (≈ 8 min)

**Part A — Is this source trustworthy?** A quick checklist (one version is the **CRAAP** test):

- **Currency** — How recent is it? Does recency matter for this topic (it does for tech/medicine,
  less for history)?
- **Relevance** — Does it actually answer *your* question, at the right depth?
- **Authority** — Who wrote it, and what makes them credible? An expert, institution, or peer-reviewed
  outlet beats an anonymous blog or a random forum post.
- **Accuracy** — Is it supported by evidence and consistent with other reputable sources? Can you
  trace its claims?
- **Purpose** — Why does this exist? To inform, to sell, to persuade? Watch for bias and incentives
  (e.g., a "study" funded by the company it flatters).

A **source hierarchy** (rough, not absolute): peer-reviewed research & official documentation > reputable
institutions (universities, established news, standards bodies) > expert practitioners & well-sourced
explainers > anonymous blogs/forums > random social posts. **Triangulate:** trust a claim more when
**two or three independent, reputable sources** agree. Primary sources (the original paper, the
official docs) beat someone's summary of them.

**Part B — How an LLM actually works (basic).** A large language model (the thing behind AI chat) is,
underneath, a very sophisticated **next-word predictor.** It was trained on huge amounts of text and
learned the statistical patterns of language. When you ask it something, it generates the most likely
*sounding* continuation — word by word. It is *not* looking up facts in a database, and it has **no
understanding or intent**; it produces text that *resembles* a correct answer.

That design creates specific, important limitations:

- **Hallucination.** It can state false things — fake facts, fake citations, fake quotes — **fluently
  and confidently.** Plausible ≠ true. This is the single most important thing to remember.
- **Confidence ≠ correctness.** Its certainty in tone tells you *nothing* about whether it's right.
  It will be just as smooth when wrong as when right.
- **Knowledge cutoff / no live data.** A base model only "knows" up to its training date and doesn't
  truly browse the live web (unless a specific tool gives it that, and even then, verify).
- **Bias & gaps.** It reflects biases and blind spots in its training data; it can be confidently
  Western-centric, outdated, or simply ignorant of niche topics.
- **No real sources by default.** If it offers citations, they may be invented. Always check that a
  cited source exists and actually says what's claimed.
- **You steer it.** It often agrees with you (sycophancy) and follows leading questions. Garbage or
  biased prompts in → biased answers out.

> **The golden rule for the rest of this course:** treat an LLM like a **fast, confident, sometimes
> wrong study partner** — brilliant for explaining, brainstorming, and getting unstuck, never the
> final word. **Verify anything that matters against a trustworthy source.**

**Key takeaways**

- [ ] Vet sources with **CRAAP** (Currency, Relevance, Authority, Accuracy, Purpose) and **triangulate.**
- [ ] An LLM is a **next-word predictor** — it has no understanding and isn't a fact database.
- [ ] It can **hallucinate** confidently; **confidence ≠ correctness.**
- [ ] Mind the **knowledge cutoff, bias, and fake citations** — verify against real sources.

---

### 🖼️ See — verify-the-AI flow

```mermaid
flowchart TD
  ASK["🤖 AI gives an answer"] --> IMP{"Does it matter<br/>if it's wrong?"}
  IMP -->|no| USE["💡 Use as a starting point"]
  IMP -->|yes| VERIFY["🔍 Verify against a<br/>trustworthy source"]
  VERIFY --> AGREE{"Reputable sources<br/>agree?"}
  AGREE -->|yes| TRUST["✅ Trust & use"]
  AGREE -->|no| REJECT["🚫 Discard / dig deeper"]
```

![Should I trust this AI answer? — generated diagram](../img/atom-2-trust-sources-and-how-ai-works.png)

"Does it matter if it's wrong?" → No: "Use as a starting point" / Yes: "Verify against a trustworthy

---

### 🧪 Practice — *Source & AI-claim audit*

1. **Source triage.** Take a question you care about and find three sources (e.g., a research/official
   page, a reputable explainer, a random blog/forum). Score each with CRAAP and rank them.
2. **Catch a hallucination.** Ask an AI something specific and checkable (a date, a citation, a niche
   fact). Then verify each claim against a trustworthy source. Note anything that was confidently
   wrong or unverifiable.

<details>
<summary>What good looks like</summary>

- You can articulate *why* one source outranks another (authority + accuracy + purpose).
- You found at least one AI claim you couldn't verify — or proved one wrong — and you didn't take its
  confidence as evidence.

</details>

---

### ✅ Evaluate — Pop quiz (formative, `knowledge-mini`)

1. What does each letter of CRAAP stand for, and what does "triangulate" mean?
2. In one sentence, what is an LLM actually doing when it answers?
3. Why is "the AI sounded very confident" *not* a reason to trust an answer?

<details>
<summary>Answer key</summary>

1. **C**urrency, **R**elevance, **A**uthority, **A**ccuracy, **P**urpose. *Triangulate* = confirm a
   claim across multiple independent, reputable sources.
2. Predicting the **most likely next words** based on patterns in its training data — not looking up
   verified facts.
3. Because LLMs generate confident-sounding text whether right or wrong — **confidence ≠ correctness**,
   and they can **hallucinate.**

</details>

---

### 📦 Deliverable

- Your source-triage ranking (3 sources + CRAAP notes) **and** one documented AI claim you verified or
  debunked, with the trustworthy source you checked against.

### 🧠 Final reflection

- Where have you previously trusted a source (or an AI answer) you shouldn't have? What's your new rule?

- DigComp 2.2 — competence area 1: *Information & data literacy*.
- Plain-language explainers on how LLMs work and why they hallucinate (verify currency before use).

### 🧩 Connections

- **Predecessor:** Atom 1. **Successors:** Atom 3 (search for trustworthy sources), Atom 4 (use AI
  safely with verification).

<script type="text/markdown" data-path="examples/self-learning-micro-credential/atoms/atom-3-research-with-search.md">## ⚛ Learning Atom 3 — *Research with Search Engines*

**Phase:** 🙈 2 · Visual Exploration (*see*) · **KSA:** 🛠️ Skill · **Target level:** L2
· **Component id:** `S-search-research`

### 🎯 Learning objective

- **Find and triangulate** trustworthy answers to a real question using a search engine (e.g., Google)
  — crafting good queries, using operators, and reading critically.

### 🧩 Prerequisites

- Atom 2 (source trust) — searching is only useful if you can judge what you find.

### 🧭 Atom description

Search is the most-used learning tool on earth, and almost everyone uses it at 20% of its power. This
atom turns "typing a question and clicking the first link" into a deliberate research skill: ask a
sharp query, use a few operators to cut noise, scan results critically, and triangulate across
sources. It's in Phase 2 (*see*) because you learn it by watching it modeled, then doing a hunt.

---

### 🎬 Watch — searching like a pro (~5–10 min)

```youtube
https://www.youtube.com/watch?v=Fzd07K-bScw
"Google search tips & operators" — a practical explainer (verify before delivery).
```

---

### 📖 Reading — *Ask a better question, get a better answer* (≈ 7 min)

**1) Craft the query.** The search box rewards precision:

- **Use keywords, not full sentences.** Drop filler words; keep the meaningful terms. `python list vs
  tuple difference` beats `what is the difference between a list and a tuple in python please`.
- **Add context that narrows it:** the year, the version, the platform, the domain — `react useEffect
  cleanup 2025`, `excel xlookup vs vlookup`.
- **Speak the source's language.** Think about the words an expert page would use, not how a beginner
  phrases it. Searching the *answer's* vocabulary finds better pages.
- **Iterate.** Your first query is a probe. Read the snippets, steal better terms from them, and
  refine. Research is a loop, not one shot.

**2) Use a few high-leverage operators:**

| Operator | Does | Example |
| -------- | ---- | ------- |
| `"exact phrase"` | Forces an exact match | `"productive failure" learning` |
| `site:` | Search within one site | `site:docs.python.org enumerate` |
| `-word` | Excludes a term | `jaguar speed -car` |
| `filetype:` | Find a file type | `machine learning basics filetype:pdf` |
| `OR` | Either term | `bicycle OR cycling commuting` |
| `intitle:` / `*` | In the title / wildcard | `intitle:tutorial docker` · `"learn * in 30 days"` |

**3) Read the results critically.** Don't auto-click result #1 (it's often an ad or SEO bait). Scan
several snippets, prefer sources that pass the Atom-2 trust test (official docs, reputable
institutions, well-sourced explainers), and **open a few in parallel** to compare. Watch the *date*.

**4) Triangulate & trace.** For anything important, confirm it across **2–3 independent reputable
sources** and try to reach the **primary source** (the original docs/paper), not a copy of a copy. If
sources disagree, that disagreement is itself information — dig into why.

**5) Know when to switch tools.** Search is best for *finding trustworthy sources and current/specific
facts*; AI (Atom 4) is best for *explaining and synthesizing*. Strong self-learners bounce between
them: search to find and verify, AI to understand — then verify the AI with search again.

**Key takeaways**

- [ ] Query with **precise keywords + context**, in the *source's* vocabulary; then **iterate.**
- [ ] A few **operators** (`"..."`, `site:`, `-`, `filetype:`) cut noise fast.
- [ ] **Don't trust result #1 by default** — scan, compare, check dates.
- [ ] **Triangulate** across 2–3 reputable sources and reach the **primary source.**

---

### 🖼️ See — the research loop

```mermaid
flowchart LR
  Q["❓ Sharp question"] --> QUERY["⌨️ Keyword query<br/>+ operators"]
  QUERY --> SCAN["👀 Scan results<br/>critically"]
  SCAN --> EVAL{"Trustworthy?<br/>(CRAAP)"}
  EVAL -->|no| QUERY
  EVAL -->|yes| TRI["🔺 Triangulate<br/>2–3 sources"]
  TRI --> ANS["✅ Verified answer"]
```

![Search research loop — generated diagram](../img/atom-3-research-with-search.png)

> 🖼️ *Generated image — produced from the prompt below.*

A reusable prompt to generate an on-brand version:

```prompt
Create a clean, modern infographic of a "search research loop": Sharp question → Keyword query +
operators → Scan results critically → Trustworthy? (CRAAP) → (loop back if no) → Triangulate 2–3
sources → Verified answer. Use ADA brand colors (Indigo #1E2A6E, Turquoise #15B5C6, Gold #E0A53C),
light background, flat vector, legible sans-serif. 16:9.
```

---

### 🧪 Practice — *Research scavenger hunt* (Challenge / Quest)

Answer each with a search engine, and for each record: your **final query**, the **operator(s)** used,
your **two trustworthy sources**, and the **answer**.

1. Find the **official documentation** page for a tool you use (use `site:`), not a third-party copy.
2. Find a **PDF** report from a reputable institution on a topic you care about (use `filetype:pdf`).
3. Find the **exact origin** of a popular quote — is it correctly attributed? (use `"exact phrase"`).
4. Find the **current** recommended way to do something that changed recently (add a year/version).
5. Find a claim where **two reputable sources disagree** — and note why.

---

### ✅ Evaluate — Performance task (`skill`)

Submit your scavenger-hunt sheet. Scored on:

| Criterion | Excellent (3) | Adequate (2) | Needs work (1) |
| --------- | ------------- | ------------ | -------------- |
| **Query craft** | Precise keywords + apt operators; iterates | Workable queries | Full-sentence, no refinement |
| **Source quality** | Reaches primary/reputable sources | Mostly decent sources | First link / low quality |
| **Triangulation** | Confirms across independent sources | Some cross-checking | Single source |
| **Critical reading** | Notes dates, bias, disagreement | Some critique | Takes results at face value |

> Pass = 2+ each → **L2** evidence for `S-search-research`.

### 📦 Deliverable

- Your completed scavenger-hunt sheet (queries + operators + sources + answers).

### 🧠 Final reflection

- Which operator or habit will most change how you search day-to-day? Why?

### 🔗 Sources to verify (human-in-the-loop)

- Google — *Search operators / refine web searches* (official help).
- DigComp 2.2 — area 1: *browsing, searching and filtering data, information, and digital content*.
- Any reputable "advanced search techniques" guide (verify currency).

### 🧩 Connections

- **Predecessor:** Atom 2. **Successor:** Atom 4 (use AI to *explain* what you find — then verify by
  searching).

<script type="text/markdown" data-path="examples/self-learning-micro-credential/atoms/atom-4-learn-with-ai.md">## ⚛ Learning Atom 4 — *Learn with AI (Basic Prompting + Verify)*

**Phase:** 🙊 3 · Applied Practice (*do*) · **KSA:** 🛠️ Skill · **Target level:** L2
· **Component ids:** `S-learn-with-ai`, `K-sources-and-ai-limits`

### 🎯 Learning objective

- **Prompt an AI** to explain a topic at the right level, **ask it for sources**, and **verify** its
  output — using it as a study partner, not an oracle.

### 🧩 Prerequisites

- Atom 2 (how AI works + its limits) and Atom 3 (search, for verification). This atom *applies* both.

### 🧭 Atom description

Used well, an AI assistant is the best on-demand tutor ever made: infinitely patient, available 24/7,
able to re-explain anything five different ways. Used badly, it's a confident misinformation machine
that does your thinking for you. This atom teaches the *well* version: basic prompting to learn, plus
a verification habit that protects you from the limitations you met in Atom 2.

---

### 📖 Reading — *Prompt to learn, not to copy* (≈ 8 min)

**Anatomy of a good learning prompt.** A useful prompt usually has four parts — **Role, Context, Task,
Format**:

- **Role:** *"Act as a patient tutor for a complete beginner."*
- **Context:** what you know and where you're stuck — *"I understand X but not how Y connects."*
- **Task:** what you want — *"Explain Z with a simple analogy, then a concrete example."*
- **Format:** how to deliver — *"Keep it under 150 words; then ask me one question to check I got it."*

**Prompts that make you *learn*, not just receive answers:**

- **Explain at a level:** *"Explain like I'm 12,"* then *"now explain it the way you'd tell a
  professional."* Comparing levels builds real understanding.
- **Analogy + example:** *"Give me an analogy, then a real example, then a counter-example."*
- **Make it quiz you:** *"Ask me 5 questions one at a time to test my understanding, and tell me if
  I'm wrong and why."* This forces **retrieval** (Atom 1) instead of passive reading.
- **Find your gaps:** *"Here's my explanation of X in my own words: [...]. What did I get wrong or
  miss?"* — the single most powerful learning prompt.
- **Unstick, don't solve:** *"Don't give me the answer. Give me a hint and the next question I should
  ask myself."* This protects the productive struggle from Atom 1.
- **Plan a path:** *"I want to learn X in two weeks with ~30 min/day. Give me a step-by-step plan with
  free resources I should verify."*

**The non-negotiable: verify.** Because of hallucination and the other limits from Atom 2:

- **Ask for sources** — *"Cite reputable sources I can check."* — then **actually open them** (they may
  be invented). Reaching the real source is a feature, not a chore.
- **Cross-check anything that matters** with a search (Atom 3), especially facts, numbers, dates, code
  that touches real systems, citations, and anything high-stakes.
- **Don't outsource the struggle.** Use AI to *explain and unblock*, then close the book and **redo it
  yourself from memory.** If you only nodded along, you didn't learn it.
- **Watch sycophancy & leading questions.** If you ask *"isn't X true?"* it may just agree. Ask
  neutrally: *"Is X true? What's the evidence for and against?"*

> **Mental model:** AI is a brilliant, fast, confident **study partner that is sometimes wrong.**
> Pair it with search to verify, and with your own practice to actually learn. Search **finds and
> verifies**; AI **explains and synthesizes**; *you* do the learning.

**Key takeaways**

- [ ] Structure prompts with **Role · Context · Task · Format.**
- [ ] Use prompts that force **retrieval** (quiz me, critique my explanation, hint don't solve).
- [ ] **Always verify** — ask for sources, open them, cross-check with search.
- [ ] **Don't outsource the struggle**; redo it from memory. Ask **neutrally** to avoid sycophancy.

---

### 🖼️ See — search + AI working together

```mermaid
flowchart LR
  GOAL["🎯 What I want to learn"] --> AI["🤖 AI: explain / analogy / quiz me"]
  AI --> TRY["🧠 Redo from memory"]
  TRY --> VER["🔍 Verify with search<br/>(open real sources)"]
  VER --> OK{"Holds up?"}
  OK -->|yes| LEARNED["✅ Learned (for now)"]
  OK -->|no| AI
```

![Learn with AI, safely — generated diagram](../img/atom-4-learn-with-ai.png)

> 🖼️ *Generated image — produced from the prompt below.*

A reusable prompt to generate an on-brand version:

```prompt
Create a clean, modern infographic titled "Learn With AI, Safely": What I want to learn → AI explains
/ quizzes me → Redo from memory → Verify with search (open real sources) → Holds up? → Yes: Learned /
No: back to AI. Caption: "AI explains, search verifies, you learn." Use ADA brand colors (Indigo
#1E2A6E, Turquoise #15B5C6, Gold #E0A53C), light background, flat vector, legible sans-serif. 16:9.
```

---

### 🧪 Practice — *AI study session* (AI Prompt Question + Worksheet)

Pick one real topic you want to understand. Run this sequence with an AI tool and save the transcript:

1. **Explain prompt** (Role·Context·Task·Format) — get a beginner explanation + an example.
2. **Level-shift** — ask for the same idea explained for a professional; note what's added.
3. **Quiz me** — have it ask you 5 questions one at a time; answer from memory.
4. **Critique my understanding** — write your own 4-sentence explanation; ask the AI what you got
   wrong.
5. **Verify** — ask for sources, then **check at least two claims** with a search (Atom 3). Record any
   claim that was wrong, unverifiable, or had a fake citation.

---

### ✅ Evaluate — Performance task (`skill`)

Submit your transcript + worksheet. Scored on:

| Criterion | Excellent (3) | Adequate (2) | Needs work (1) |
| --------- | ------------- | ------------ | -------------- |
| **Prompt quality** | Clear Role·Context·Task·Format; iterates | Workable prompts | Vague one-liners |
| **Learning (not copying)** | Uses quiz/critique/redo-from-memory | Some active use | Passive copy-paste |
| **Verification** | Opens sources; cross-checks; catches an error | Some checking | Takes AI at face value |
| **Judgment about limits** | Articulates where AI helped vs. couldn't be trusted | Some awareness | None |

> Pass = 2+ each → **L2** evidence for `S-learn-with-ai`.

### 📦 Deliverable

- Your AI study-session transcript, your own written explanation, and your verification notes
  (including anything the AI got wrong).

### 🧠 Final reflection

- Where did AI genuinely accelerate your learning, and where did verification save you? What's your
  personal rule for trusting it?

### 🔗 Sources to verify (human-in-the-loop)

- Any reputable, current "prompting basics / how to learn with AI" guide (verify currency).
- Atom 2 of this course (LLM limitations) — re-read before high-stakes use.
- DigComp 2.2 — interacting with and critically evaluating AI-generated content.

### 🧩 Connections

- **Predecessors:** Atoms 2 & 3. **Successor:** Atom 5 (put search + AI inside a full learning loop).

<script type="text/markdown" data-path="examples/self-learning-micro-credential/atoms/atom-5-self-learning-loop.md">## ⚛ Learning Atom 5 — *The Self-Learning Loop (Learn by Failing Forward)*

**Phase:** 🙊 3 · Applied Practice (*do*) · **KSA:** 🛠️ Skill + 🌱 Ability · **Target level:** L2
· **Component ids:** `S-learning-loop`, `A-curiosity`, `A-resilience-failure`

### 🎯 Learning objective

- **Run a complete self-learning loop** on a small real topic — driven by curiosity and **persisting
  through failure** — and keep a learning log of the process.

### 🧩 Prerequisites

- Atoms 1–4. This atom assembles the whole toolkit into one repeatable process.

### 🧭 Atom description

So far you have the pieces: a mindset (process > answer; failure is data), source judgment, search,
and AI. This atom is where they become a **habit you can point at anything.** You'll pick a genuinely
unknown micro-topic and learn it end-to-end in a single loop — on purpose hitting walls and
documenting how you got past them. This is also where the **Abilities** (curiosity, resilience) get
their first real workout.

---

### 📖 Reading — *One loop you can reuse forever* (≈ 6 min)

The self-learning loop has five steps. The magic is in repeating it in tight cycles, not doing it once
perfectly:

1. **Set a sharp goal.** Make it small and observable. Not "learn data viz" but *"make one bar chart
   from a CSV and explain what it shows."* A goal you can *demonstrate* beats a goal you can only
   *feel.*
2. **Find resources (filter ruthlessly).** Use search (Atom 3) to find 1–2 trustworthy resources and
   AI (Atom 4) to explain the confusing parts. Resist collecting 30 tabs — that's procrastination in
   disguise. Pick a starting point and move.
3. **Practice — try before you're ready.** Attempt the thing *now*, while you still feel unprepared.
   You will get stuck and get things wrong. **Good.** Each failure is a precise pointer to the next
   thing to learn (Atom 1). Look things up to *unblock*, then keep going.
4. **Self-test (retrieve).** Close everything and check: can you do it / explain it from memory? If
   not, you found your gap — loop back to step 2 or 3 for *that specific gap.*
5. **Reflect (metacognition).** Write a few lines: what you learned, what tripped you, what you'd do
   differently. Reflection is what converts a one-off into a transferable method.

**The role of the Abilities in the loop:**

- **🌱 Curiosity** is the engine. It's what makes you ask "but why?" and "what if?", chase the
  interesting tangent, and keep generating questions. Without it, the loop stalls at step 1.
- **🌱 Resilience (learn by failing forward)** is the fuel for steps 3–4. The moment you're stuck is
  the moment most people quit — and it's exactly the moment learning is about to happen. Reframe "I
  failed" as **"I found a gap; that's progress,"** take a breath, and try the next thing. Persistence
  + a new approach, not just grinding the same wrong way.

> **"Failing forward"** means every failure moves you closer because you *extract the lesson* from it.
> A failure you ignore is a loss; a failure you mine is tuition you already paid — collect the lesson.

**Key takeaways**

- [ ] The loop: **goal → resources → practice → self-test → reflect**, repeated in tight cycles.
- [ ] Make goals **small and demonstrable**; avoid resource-hoarding.
- [ ] **Try before you're ready**; treat each stuck moment as the next thing to learn.
- [ ] **Curiosity** drives the loop; **resilience** gets you through the stuck parts.

---

### 🖼️ See — the self-learning loop

```mermaid
flowchart LR
  GOAL["🎯 Sharp goal"] --> FIND["🔎 Find resources<br/>(search + AI)"]
  FIND --> DO["🛠️ Practice<br/>(try before ready)"]
  DO --> FAIL["💥 Get stuck / fail"]
  FAIL --> LESSON["💡 Extract the lesson"]
  LESSON --> TEST["🧠 Self-test from memory"]
  TEST --> REFLECT["📝 Reflect"]
  REFLECT -.next cycle.-> GOAL
```

---

### 🧪 Practice — *One full loop + learning log* (Project / Quest + Reflection)

Pick a **small, genuinely new** micro-skill you can attempt in ~60–90 minutes (e.g., make a chart from
data, write a one-page summary in a new format, learn 10 phrases of a language and use them, fix a
small thing using docs). Run the loop **and keep a learning log** capturing:

- Your **goal** (small + demonstrable) and **why you're curious** about it.
- The **resources** you chose (and why) — search + AI, with verification.
- **At least two failures / stuck points**, what each one taught you, and how you got past it.
- Your **self-test** result (could you do/explain it from memory?).
- A short **reflection** + what you'd do differently next loop.

**Pair option (collaborate):** swap learning logs with a partner and trade one piece of encouragement
+ one suggestion. Hearing how someone else got unstuck is itself a lesson.

---

### ✅ Evaluate — Behavioral assessment (`behavioral`)

Scored from your learning log + (if paired) your partner's observation. This is a key occasion for the
Abilities:

| Criterion | Excellent (3) | Adequate (2) | Needs work (1) |
| --------- | ------------- | ------------ | -------------- |
| **Loop execution (🛠️)** | All 5 steps, tight cycles, demonstrable goal | Most steps | Skipped practice/self-test |
| **Curiosity (🌱)** | Generates own questions; chases understanding | Some initiative | Waits to be told |
| **Resilience / failing forward (🌱)** | Documents failures + lessons; persists & adapts | Some persistence | Quits or hides the struggle |
| **Verification** | Checks AI/sources within the loop | Some checking | None |
| **Reflection** | Honest, specific, forward-looking | Generic | Missing |

> Pass = 2+ each. This is **occasion 1 of 3** for `A-curiosity` and `A-resilience-failure` (also
> observed in the capstone, and across the course).

### 📦 Deliverable

- Your learning log for one full loop (goal · resources · ≥2 documented failures + lessons · self-test
  · reflection) and the artifact you produced.

### 🧠 Final reflection

- Which step do you skip when you're impatient (usually self-test or reflect)? What does skipping it
  cost you?

### 🔗 Sources to verify (human-in-the-loop)

- Ericsson & Pool, *Peak* (deliberate practice — practice at the edge of ability).
- Zimmerman, *Self-Regulated Learning* (the plan → monitor → reflect cycle).
- Atom 1 of this course (productive failure & retrieval).

### 🧩 Connections

- **Predecessors:** Atoms 1–4. **Successor:** Atom 6 (run the loop on a bigger self-chosen skill and
  teach it back).
</script>
<script type="text/markdown" data-path="examples/self-learning-micro-credential/atoms/atom-6-capstone-learn-something-new.md">## ⚛ Learning Atom 6 — *Capstone: Teach Yourself Something New & Teach It Back*

**Phase:** 🐵 4 · Collaboration & Reflection (*share*) · **KSA:** 🛠️ Skill + 🌱 Ability
· **Target level:** L2 · **Component ids:** `S-search-research`, `S-learn-with-ai`,
`S-learning-loop`, `A-curiosity`, `A-resilience-failure`

### 🎯 Learning objective

- **Teach yourself a brand-new micro-skill** using online resources, search, and AI; **document the
  process** (including failures and how you verified information); and **teach it back** to peers.

### 🧩 Prerequisites

- All prior atoms.

### 🧭 Atom description

The capstone proves the meta-skill: hand the learner something they don't know and watch them learn it
*well, on their own.* It integrates everything — the right mindset (process > answer; failure is
data), search, AI-with-verification, and the full learning loop — and ends with a teach-back, because
**explaining what you learned is the ultimate test that you actually learned it.**

---

### 🚀 The brief

> Choose a **genuinely new micro-skill** you can plausibly reach a basic working level in within the
> course window (roughly 3–6 focused hours), e.g.: make a simple data chart, build a one-page site,
> learn the basics of a tool, learn enough of a language to hold a 60-second self-intro, edit a short
> video, write SQL for 3 simple queries. **(1)** Learn it using search + AI + free online resources,
> running the self-learning loop. **(2)** Keep a **learning log** that shows the *process* — including
> the failures, the dead ends, and how you **verified** AI/online claims. **(3)** Produce a small
> **artifact** that demonstrates the skill. **(4)** **Teach it back** in a short session and
> peer-review a classmate.

Pick something **real and modest.** The grade is on *how you learned* and *whether you can teach it* —
not on mastering something huge.

---

### 📦 What to submit

- [ ] **The artifact** — the thing you made/can now do (file, link, recording, or live demo).
- [ ] **A learning log** — goal, resources (with why + verification), **≥3 documented failures/stuck
  points and the lesson from each**, self-tests, and reflections across the loop cycles.
- [ ] **A source & AI audit** — at least 3 claims you verified, the trustworthy sources you used, and
  any AI output you caught being wrong or unverifiable.
- [ ] **A teach-back** — a 3–5 minute explanation (live or recorded) that teaches the basics to someone
  else, including one thing that tripped you up and how you got past it.
- [ ] **A peer review you gave** — the capstone rubric applied to a classmate's teach-back + learning
  log, with specific, kind, useful feedback.

---

### 🎤 Showcase / teach-back structure (≈ 5 minutes)

1. **What & why** (30s) — the skill and why you were curious about it.
2. **Teach the basics** (2–3 min) — explain it so a beginner could start; show the artifact.
3. **The messy middle** (1 min) — a failure that taught you the most, and how you got unstuck.
4. **How you knew it was true** (30s) — one thing you verified (and one AI limitation you hit).

---

### ✅ Evaluate — Capstone (`capstone-5`)

Graded with the standard 5-criteria Assessment Rubric in [`../rubrics.md`](rubrics.md) /
[`../capstone.md`](capstone.md). This is the **third and decisive occasion** for the Abilities
`A-curiosity` and `A-resilience-failure`, alongside the Skills.

### 📦 Deliverable

- Your artifact + learning log + source/AI audit + teach-back + the peer review you gave.

### 🧠 Final reflection

- You now have a process you can point at *anything*. What's the next skill you'll teach yourself with
  it — and what's your first small, demonstrable goal?

### 🔗 Sources to verify (human-in-the-loop)

- [`../capstone.md`](capstone.md) · [`../rubrics.md`](rubrics.md) · [`../skills-map.md`](skills-map.md).
- The teach-back ("learn by teaching") effect — Fiorella & Mayer, *Learning as a Generative Activity*.

### 🧩 Connections

- **Predecessor:** Atom 5. **Outcome:** 🏅 *Self-Directed Learner* badge → the meta-credential that
  accelerates every other pathway (see [`../skills-map.md`](skills-map.md)).
</script>
<script type="text/markdown" data-path="guides/curriculum-design-guide.md"># 🗺️ ADA Curriculum Designer Guide

### Step-by-Step Manual for Designing ADA-Aligned Microcourses and Learning Atoms

This guide provides a **practical workflow** for instructors, mentors, and course designers to create **job-ready micro-credentials** using the **Applied Digital Apprenticeship (ADA) methodology**.

---

## 1. Define the Competency

Identify a **real-world job competency** that the learner must develop. Connect it to recognized frameworks when possible:

* [SFIA – Skills Framework for the Information Age.](https://sfia-online.org/en/framework)

* [O\*NET Online – Occupational Information Network (US).](https://www.onetonline.org/)

* [ESCO – European Skills, Competences, Qualifications and Occupations.](https://esco.ec.europa.eu/en)

* [ILO – International Labour Organization Skills and Employability.](https://www.ilo.org/skills/lang--en/index.htm)


---

## 2. Map Learning Objectives

Write **Bloom’s taxonomy-aligned objectives** that scaffold from lower-order (remember, understand) to higher-order (analyze, evaluate, create). Each objective should be measurable.

### Bloom’s Taxonomy Quick Reference

| Level      | Sample Verbs                     |
| ---------- | -------------------------------- |
| Remember   | list, define, recall             |
| Understand | explain, summarize, describe     |
| Apply      | use, implement, demonstrate      |
| Analyze    | differentiate, compare, organize |
| Evaluate   | critique, justify, assess        |
| Create     | design, construct, formulate     |

**Example:**

* **Remember**: "List the primary colors."
* **Understand**: "Explain how complementary colors interact."
* **Apply**: "Create a color wheel demonstrating complementary pairs."
* **Analyze**: "Compare traditional vs. digital color models."
* **Evaluate**: "Assess the effectiveness of a brand’s color palette."
* **Create**: "Design a color scheme for a new product launch."

---

## 3. Design Learning Atoms ⚛

Each **learning atom** focuses on a single learning objective and integrates **Concept → Example → Practice → Evaluation**.

### Atom Components

* **Read** – Articles, guides, infographics, case studies.
* **Listen** – Podcasts, expert interviews, narrated content.
* **Watch** – Videos, animations, demos, simulations.
* **Practice** – Labs, coding challenges, design tasks.
* **Evaluate** – Quizzes, rubrics, AI-driven checks.
* **Collaborate** – Peer feedback, discussions, mentor check-ins.

👉 Use the [Learning Atom Template](../templates/learning-atom-template.md) to design each atom.

---

## 4. Assemble Modules (Microcourse Structure)

Group **4–8 learning atoms** into modules with a clear theme. Each module should:

* Introduce a **theoretical foundation**.
* Include a **lab or applied challenge**.
* End with an **evaluation or reflection**.

👉 Use the [Microcourse Template](../templates/micro-credential-ada-template.md) for structuring.

---

## 5. Plan Assessment Strategy

Assessments should combine **formative (ongoing)** and **summative (final)** methods.

* **Labs & Atoms** → Mini-Rubric (3 criteria: Accuracy, Application, Clarity).
* **Capstone Project** → Standard Rubric (5 criteria: Relevance, Application, Problem-Solving & Creativity, Clarity & Communication, Collaboration & Reflection).

---

## 6. Define Deliverables

Clearly describe what learners will produce and how it demonstrates the competency.

* Examples: *Code repository, business plan, design prototype, research report, video pitch.*
* Deliverables must be **portfolio-ready** and **job-relevant**.

---

## 7. Human & Collaborative Interaction

Integrate opportunities for mentorship, feedback, and community learning.

* 🧑‍🏫 Mentor sessions / office hours
* 👥 Group challenges or peer reviews
* 🌐 Forums or Slack/Discord communities
* 🎤 Project presentations and showcases

---

## 8. Align with ADA Phases

Make sure your course flows through the **4 ADA learning phases**:

1. **🙉 Self-Guided Introduction** → readings, videos, quizzes.
2. **🙈 Visual Exploration** → demos, role-play, walkthroughes.
3. **🙊 Applied Practice** → labs, tools, simulations.
4. **🐵 Collaboration & Reflection** → peer interaction, project sharing.

---

## 9. Example Workflow

1. **Competency**: *Data Visualization with Python*.
2. **Objectives**: *Understand charts → Apply libraries → Create dashboard.*
3. **Atoms**: *Intro to matplotlib, Case study, Lab on bar charts.*
4. **Module**: *Data Visualization Basics.*
5. **Assessment**: *Mini-rubric for labs, capstone dashboard with rubric.*
6. **Deliverable**: *Interactive dashboard shared on GitHub.*
7. **Human Interaction**: *Peer feedback on dashboard design.*
8. **Phases**: *Concept (Self-study) → Demo (Visual) → Lab (Practice) → Peer Showcase (Collaboration).*

---

## ✅ Checklist for Designers

Use this checklist to ensure your micro-credential is ADA-aligned. Examples are included in italics for clarity.

* [ ] **Defined a real-world competency**
  *Example: "Ability to design a customer journey map for digital marketing."*
* [ ] **Linked to frameworks/standards (SFIA, O\*NET, ESCO, ILO)**
  *Example: "ESCO: Marketing Specialist – Customer Journey Design."*
* [ ] **Wrote Bloom-aligned learning objectives**
  *Example: "Analyze user behavior using funnel metrics."*
* [ ] **Designed 4–8 learning atoms**
  *Example: Atoms on customer personas, analytics dashboards, A/B testing.*
* [ ] **Assembled atoms into modules**
  *Example: Module = "User Analytics Basics" with 3 atoms + a lab.*
* [ ] **Defined assessments with rubrics**
  *Example: Mini-rubric for analytics lab; capstone rubric for final marketing strategy.*
* [ ] **Specified deliverables (portfolio-ready)**
  *Example: A customer journey map PDF and a data-driven marketing report.*
* [ ] **Planned human/collaborative elements**
  *Example: Weekly mentor Q\&A and peer review of reports.*
* [ ] **Mapped phases (Hear → See → Do → Share)**
  *Example: Self-study readings → Demo videos → Analytics lab → Peer showcase.*

---

> For inspiration, see the [Art Learning Atom Example](../examples/learning-atom-art.md) or [Art Learning Micro-Credential Example](../examples/art_microcredential_template.md).
</script>
<script type="text/markdown" data-path="guides/guia-design-curriculo.md"># 🗺️ Guia do Designer de Currículo ADA

### Manual Passo a Passo para Projetar Microcursos e Átomos de Aprendizado Alinhados com ADA

Este guia fornece um **fluxo de trabalho prático** para instrutores, mentores e designers de curso para criar **micro-credenciais prontas para o trabalho** usando a **metodologia de Aprendizado Digital Aplicado (ADA)**.

---

## 1. Definir a Competência

Identifique uma **competência profissional do mundo real** que o aprendiz deve desenvolver. Conecte-a com frameworks reconhecidos quando possível:

* [SFIA – Framework de Habilidades para a Era da Informação.](https://sfia-online.org/en/framework)

* [O\*NET Online – Rede de Informação Ocupacional (EUA).](https://www.onetonline.org/)

* [ESCO – Habilidades, Competências, Qualificações e Ocupações Europeias.](https://esco.ec.europa.eu/en)

* [OIT – Organização Internacional do Trabalho Habilidades e Empregabilidade.](https://www.ilo.org/skills/lang--en/index.htm)

---

## 2. Mapear Objetivos de Aprendizado

Escreva **objetivos alinhados com a taxonomia de Bloom** que progridam de ordem inferior (lembrar, compreender) para ordem superior (analisar, avaliar, criar). Cada objetivo deve ser mensurável.

### Referência Rápida da Taxonomia de Bloom

| Nível      | Verbos de Exemplo                           |
| ---------- | ------------------------------------------- |
| Lembrar    | listar, definir, recordar                  |
| Compreender| explicar, resumir, descrever               |
| Aplicar    | usar, implementar, demonstrar              |
| Analisar   | diferenciar, comparar, organizar           |
| Avaliar    | criticar, justificar, avaliar              |
| Criar      | projetar, construir, formular              |

**Exemplo:**

* **Lembrar**: "Listar as cores primárias."
* **Compreender**: "Explicar como as cores complementares interagem."
* **Aplicar**: "Criar um círculo cromático demonstrando pares complementares."
* **Analisar**: "Comparar modelos de cor tradicionais vs. digitais."
* **Avaliar**: "Avaliar a eficácia da paleta de cores de uma marca."
* **Criar**: "Projetar um esquema de cores para o lançamento de um novo produto."

---

## 3. Projetar Átomos de Aprendizado ⚛

Cada **átomo de aprendizado** foca em um único objetivo de aprendizado e integra **Conceito → Exemplo → Prática → Avaliação**.

### Componentes do Átomo

* **Ler** – Artigos, guias, infográficos, estudos de caso.
* **Escutar** – Podcasts, entrevistas de especialistas, conteúdo narrado.
* **Assistir** – Vídeos, animações, demonstrações, simulações.
* **Praticar** – Laboratórios, desafios de código, tarefas de design.
* **Avaliar** – Questionários, rubricas, verificações com IA.
* **Colaborar** – Feedback entre pares, discussões, check-ins com mentores.

👉 Use o [Modelo de Átomo de Aprendizado](../templates/learning-atom-template.md) para projetar cada átomo.

---

## 4. Montar Módulos (Estrutura de Microcurso)

Agrupe **4–8 átomos de aprendizado** em módulos com um tema claro. Cada módulo deve:

* Introduzir uma **base teórica**.
* Incluir um **laboratório ou desafio aplicado**.
* Terminar com uma **avaliação ou reflexão**.

👉 Use o [Modelo de Microcurso](../templates/micro-credential-ada-template.md) para estruturar.

---

## 5. Planejar Estratégia de Avaliação

As avaliações devem combinar métodos **formativos (contínuos)** e **somativos (finais)**.

* **Laboratórios e Átomos** → Mini-Rubrica (3 critérios: Precisão, Aplicação, Clareza).
* **Projeto Capstone** → Rubrica Padrão (5 critérios: Relevância, Aplicação, Resolução de Problemas e Criatividade, Clareza e Comunicação, Colaboração e Reflexão).

---

## 6. Definir Entregáveis

Descreva claramente o que os aprendizes produzirão e como isso demonstra a competência.

* Exemplos: *Repositório de código, plano de negócios, protótipo de design, relatório de pesquisa, pitch em vídeo.*
* Os entregáveis devem estar **prontos para portfólio** e ser **relevantes para o trabalho**.

---

## 7. Interação Humana e Colaborativa

Integre oportunidades para mentoria, feedback e aprendizado comunitário.

* 🧑‍🏫 Sessões de mentor / horário de atendimento
* 👥 Desafios em grupo ou revisões entre pares
* 🌐 Fóruns ou comunidades Slack/Discord
* 🎤 Apresentações de projetos e showcases

---

## 8. Alinhar com as Fases ADA

Certifique-se de que seu curso flua através das **4 fases de aprendizado ADA**:

1. **🙉 Introdução Autoguiada** → leituras, vídeos, questionários.
2. **🙈 Exploração Visual** → demonstrações, interpretação, percursos.
3. **🙊 Prática Aplicada** → laboratórios, ferramentas, simulações.
4. **🐵 Colaboração e Reflexão** → interação entre pares, compartilhamento de projetos.

---

## 9. Exemplo de Fluxo de Trabalho

1. **Competência**: *Visualização de Dados com Python*.
2. **Objetivos**: *Compreender gráficos → Aplicar bibliotecas → Criar dashboard.*
3. **Átomos**: *Introdução ao matplotlib, Estudo de caso, Laboratório sobre gráficos de barras.*
4. **Módulo**: *Fundamentos de Visualização de Dados.*
5. **Avaliação**: *Mini-rubrica para laboratórios, dashboard capstone com rubrica.*
6. **Entregável**: *Dashboard interativo compartilhado no GitHub.*
7. **Interação Humana**: *Feedback entre pares sobre design do dashboard.*
8. **Fases**: *Conceito (Autoestudo) → Demo (Visual) → Laboratório (Prática) → Showcase entre Pares (Colaboração).*

---

## ✅ Lista de Verificação para Designers

Use esta lista de verificação para garantir que sua micro-credencial esteja alinhada com ADA. Exemplos são incluídos em itálico para clareza.

* [ ] **Definiu uma competência do mundo real**
  *Exemplo: "Capacidade de projetar um mapa de jornada do cliente para marketing digital."*
* [ ] **Vinculado a frameworks/padrões (SFIA, O\*NET, ESCO, OIT)**
  *Exemplo: "ESCO: Especialista em Marketing – Design de Jornada do Cliente."*
* [ ] **Escreveu objetivos de aprendizado alinhados com Bloom**
  *Exemplo: "Analisar comportamento do usuário usando métricas de funil."*
* [ ] **Projetou 4–8 átomos de aprendizado**
  *Exemplo: Átomos sobre personas de clientes, dashboards de analytics, testes A/B.*
* [ ] **Montou átomos em módulos**
  *Exemplo: Módulo = "Fundamentos de Analytics do Usuário" com 3 átomos + um laboratório.*
* [ ] **Definiu avaliações com rubricas**
  *Exemplo: Mini-rubrica para laboratório de analytics; rubrica capstone para estratégia de marketing final.*
* [ ] **Especificou entregáveis (prontos para portfólio)**
  *Exemplo: Um PDF de mapa de jornada do cliente e um relatório de marketing baseado em dados.*
* [ ] **Planejou elementos humanos/colaborativos**
  *Exemplo: Q&A semanal com mentor e revisão entre pares de relatórios.*
* [ ] **Mapeou fases (Ouvir → Ver → Fazer → Compartilhar)**
  *Exemplo: Leituras de autoestudo → Vídeos de demonstração → Laboratório de analytics → Showcase entre pares.*

---

<script type="text/markdown" data-path="templates/codelab-ada-template.md"># 🧪 ADA Codelab Template

This codelab template is designed following the ADA Methodology and Learning Atoms structure. Each codelab should combine explanation, code demonstration, and guided exercises.

> **Where this fits:** a codelab is a 🧪 **Practice** atom that builds a 🛠️ **Skill** (the *know-how*
> someone must perform). Use it inside a Micro Course built with the
> [Micro-Credential Template](micro-credential-ada-template.md) — record which atom/objective it
> supports and assess it with the **skill / performance rubric**.

| Fits in | Value |
| ------- | ----- |
| Micro-credential | \[course title] |
| Supports atom / objective | \[Atom #, objective] |
| KSA type / target level | 🛠️ Skill · \[0–4] |

---

## 🧠 Title
Example: Build Your First REST API with Flask

## 🎯 Learning Objective
By the end of this codelab, learners will be able to:
- Create a basic REST API using Flask
- Handle HTTP methods and routes
- Run and test an API locally

---

## 🛠️ Requirements
- Python 3.8+
- `pip`
- IDE or code editor (e.g., VS Code)

Install Flask:
```bash
pip install flask
```

---

## 🚀 Step 1: Hello World API
### 🔍 Explanation
We’ll start by building a minimal Flask application.

### 💻 Code Example
```python
from flask import Flask
app = Flask(__name__)

@app.route('/')
def home():
    return "Hello, world!"

if __name__ == '__main__':
    app.run(debug=True)
```

### 🧪 Exercise
- Run the app locally
- Visit `http://127.0.0.1:5000/`
- Change the response text to your name

---

## 📨 Step 2: Add a New Route
### 🔍 Explanation
Let’s create a new route that returns user info.

### 💻 Code Example
```python
@app.route('/user')
def user():
    return {'name': 'Jane Doe', 'age': 28}
```

### 🧪 Exercise
- Add another route `/about` that returns a short message about you.

---

## 🧪 Final Challenge
Create an endpoint `/greet/<name>` that returns `Hello, <name>!`.

Example:
```python
@app.route('/greet/<name>')
def greet(name):
    return f"Hello, {name}!"
```

Test it with: `http://127.0.0.1:5000/greet/Ada`

---

## ✅ Completion Criteria
- [ ] App runs without errors
- [ ] All endpoints work as expected
- [ ] Personalized route returns dynamic content

---

## 🏁 Next Steps
- Add JSON responses using `jsonify`
- Deploy the app with Replit or Render
- Explore Flask Blueprints for modular APIs

---

<script type="text/markdown" data-path="templates/micro-credential-ada-template.md"># 🚀 ADA Micro-Credential Template

Use this template to design a **Micro Course (ADA micro-credential)** that develops **any skill
your organization needs someone to actually perform** — a real job task, done to a real standard.
Each section has **\[instructions in brackets]**; replace them with your content. Worked example:
[Growth Mindset micro-credential](../examples/growth-mindset-micro-credential/README.md).

---

## 🧭 How to use this template — *from a skill need to a course in 7 steps*

```mermaid
flowchart LR
  S0["🏢 Step 0<br/>Skill need at work"] --> S1["🎯 Step 1<br/>Target competency"]
  S1 --> S2["🧬 Step 2<br/>KSA breakdown"]
  S2 --> S3["📘 Step 3<br/>Objectives (Bloom+KSA)"]
  S3 --> S4["⚛ Step 4<br/>Atoms + modalities"]
  S4 --> S5["🔄 Step 5<br/>4 phases + planner"]
  S5 --> S6["🚀 Step 6<br/>Capstone + rubrics"]
  S6 --> S7["🏅 Step 7<br/>Badge → skills map"]
```

1. **Step 0 — Name the skill need** (below): what must someone *do* at work, and what does "good" look like?
2. **Step 1 — Anchor it** to a recognized competency (SFIA · O\*NET · ESCO · ILO).
3. **Step 2 — Break it into KSA** — 🧠 Knowledge, 🛠️ Skill, 🌱 Ability — so each piece is taught/assessed correctly.
4. **Step 3 — Write Bloom objectives**, each tagged with its KSA type.
5. **Step 4 — Design 4–8 learning atoms**, choosing modalities from the topology.
6. **Step 5 / 6 — Sequence the 4 phases**, then add a capstone + rubrics.
7. **Step 7 — Issue a badge** that writes KSA levels into a skills map for job matching.

> 🔗 Deeper method for Step 0–2: [Role-to-Credential Mapping](../specs/role-to-credential-mapping.md)
> · KSA types & levels: [KSA Taxonomy](../specs/ksa-taxonomy.md)
> · modality menu: [Learning Atom Topology](../specs/learning-atom-topology.md).

---

## 🏢 Step 0 — Organizational Skill Need *(intake)*

Start here. Describe the **real task** you need someone to perform — not a topic. If you can
observe a high performer doing it, even better (see the role-mapping spec for DACUM / shadowing).

| Intake question | Your answer |
| --------------- | ----------- |
| **What must the person be able to *do*?** (an observable task) | \[e.g. "Run a blameless incident retro that produces fix-forward actions"] |
| **Who performs it / in which role(s)?** | \[role, team, seniority] |
| **Why it matters** (business outcome / cost of the gap) | \[impact if done well vs. poorly] |
| **What "good" looks like** (high-performer behavior, the bar) | \[1–3 observable signs of mastery] |
| **Recognized framework reference** | \[SFIA · O\*NET · ESCO · ILO competency] |
| **Current gap** (where learners are today) | \[what they can't yet do / do inconsistently] |
| **Evidence of mastery** (how you'll know they can do it) | \[the artifact/behavior that proves it] |

> ⚠️ AI-assisted skill mappings are **decision support** — have a mentor or the hiring manager
> validate the task, the bar, and the evidence before building (human-in-the-loop).

---

## 🎓 Micro Credential Title

\[Write a clear, competency-aligned title.]
**Example:** *Business Resilience: Strategies to Adapt and Thrive*

---

## ⏳ Estimated Duration

\[Define the length: hours or weeks. ADA micro-credentials are usually 10–30 hours.]
**Example:** *15 hours · 3 weeks (5h/week)*

---

## 🎯 Target Job Competency

\[Identify the real-world job skill the course develops, referencing frameworks like SFIA, O\*NET, or ESCO.]
**Example:** *Ability to design and implement business continuity and resilience strategies.*

---

## 🧬 Step 2 — KSA Breakdown

Split the competency into typed components. The **type decides how you teach and assess it**:
Knowledge → acquire + quiz; Skill → practice + performance rubric; Ability → repeated authentic
practice + behavioral rubric across occasions. Set a target level **0–4** (see
[KSA Taxonomy](../specs/ksa-taxonomy.md)).

| KSA type | Component (what they know / can do) | Why this type | Target level |
| -------- | ----------------------------------- | ------------- | ------------ |
| 🧠 Knowledge | \[concept / fact to understand] | enabling base | \[0–4] |
| 🛠️ Skill | \[a concrete, practiceable procedure] | the *know-how* | \[0–4] |
| 🌱 Ability | \[a durable disposition / attitude] | proven by behavior over time | \[0–4] |

> A "skill someone must perform" almost always needs **all three**: a little Knowledge, the
> core Skill, and the Abilities (judgment, adaptability, collaboration) that make it stick.

---

## 🔑 Prerequisites

\[List the knowledge, skills, or tools learners should already have. If none, write “None.”]

* [ ] \[Skill or knowledge #1]
* [ ] \[Skill or knowledge #2]

---

## 📘 Learning Objectives

\[Define 3–5 objectives using **Bloom’s taxonomy verbs**. Tag each with its **KSA type**
(🧠 K / 🛠️ S / 🌱 A) so the matching modality and rubric are obvious. Each is supported by Learning Atoms.]

**Example (tagged):**

* 🧠 **Understand** models of organizational resilience.
* 🛠️ **Design** a resilience strategy for a crisis scenario.
* 🌱 **Adapt** decisions calmly as conditions change (shown across occasions).

**Example:**

* **Understand** models of organizational resilience.
* **Analyze** vulnerabilities in changing environments.
* **Design** resilience strategies for crisis response.
* **Evaluate** leadership approaches in uncertain contexts.

---

## 💡 Skills to Be Developed (Workforce Competencies)

\[List 1– 3 specific, measurable skills learners will be able to demonstrate.]

**Example:**

* Diagnose organizational resilience levels.
* Apply adaptive decision-making in uncertain contexts.
* Create a resilience framework for crisis management.
* Foster collaborative and resilient organizational cultures.

---

## ⚛ Learning Atoms

Each **Learning Atom** = *Concept + Example + Practice + Evaluation*
\[Design 4–8 atoms, one per learning objective. Fill in details using the table below.] Build
each atom from the [Learning Atom Template](learning-atom-template.md) and pick **modalities**
from the [Learning Atom Topology](../specs/learning-atom-topology.md) that fit the atom's KSA type:

- 🧠 **Knowledge** → 📖 Read · 🎧 Listen · 🎬 Watch · 🖼️ See
- 🛠️ **Skill** → 🧪 Practice (Lab · Codelab · Simulation) + performance rubric
- 🌱 **Ability** → 🖼️ See (model it) + 🧪 Practice + 🤝 Collaborate, across multiple occasions

| Atom   | Objective       | KSA | Modalities (sub-types)              | Practice                | Evaluate                         |
| ------ | --------------- | --- | ----------------------------------- | ----------------------- | -------------------------------- |
| Atom 1 | \[Objective #1] | \[🧠/🛠️/🌱] | \[e.g. Article · Explainer · Diagram] | \[Mini-lab or exercise] | \[Quiz, reflection, mini-rubric] |
| Atom 2 | \[Objective #2] | …   | …                                   | …                       | …                                |

---

## 🔍 ADA Learning Phases

Each phase uses **Learning Atoms** and follows Confucius’ progression: 

*hear → see → do → share*.

---

### 🙉 Phase 1: Self-Guided Introduction

> *“I hear and I forget.”  — Confucius*

**Goal:** Introduce concepts through self-learning.
Includes: 📖 readings · 🎥 videos · 🎧 podcasts · 📚 case studies · ❓ quizzes

---

### 🙈 Phase 2: Visual Exploration

> *“I see and I remember.”  — Confucius*

**Goal:** Reinforce learning visually and experimentally.
Includes: 🧩 demos · 🎞️ walkthroughs · 🧪 role-play · 📊 scenario exploration

---

### 🙊 Phase 3: Applied Practice

> *“I do and I understand.”  — Confucius*

**Goal:** Apply knowledge in practical challenges.
Includes: 🧪 hands-on labs · 💻 coding tasks · 🛠️ simulations · 📝 rubric-based evaluation

---

### 🐵 Phase 4: Collaboration and Reflection

> *“I share and I multiply.”  — ADA Methodology*

**Goal:** Promote collaborative learning and reflection.
Includes: 👥 peer feedback · 🗣️ co-creation projects · 🌐 forums · 🎤 showcase presentations.

---

## 📋 Phase Content Planner (Editable Table)

\[Use this table to **list the content, activities, and assessments** for each phase. Replace placeholders with your course details.]

| Phase                               | Learning Atom(s)    | Content & Resources                      | Activity/Practice                       | Assessment Method                  |
| ----------------------------------- | ------------------- | ---------------------------------------- | --------------------------------------- | ---------------------------------- |
| Phase 1: Self-Guided Introduction   | \[Atom #1, Atom #2] | \[Articles, videos, podcasts]            | \[Reflection prompt, short quiz]        | \[Quiz, AI Q\&A check]             |
| Phase 2: Visual Exploration         | \[Atom #2, Atom #3] | \[Animations, demos, role-play scenario] | \[Guided walkthrough, group discussion] | \[Formative feedback]              |
| Phase 3: Applied Practice           | \[Atom #3, Atom #4] | \[Lab manual, tools, datasets]           | \[Hands-on lab, coding challenge]       | \[Mini-rubric + feedback]          |
| Phase 4: Collaboration & Reflection | \[Atom #4]          | \[Project brief, peer forum]             | \[Capstone presentation, peer review]   | \[Capstone rubric + peer feedback] |

---

## 🚀 Capstone Project

\[Design a **portfolio-ready project** that integrates all course skills. It should simulate a real job task and be evaluated with the rubric below.]

**Example:**
*Learners will create a **Business Resilience Plan** for a company, including:*

1. **Relevance** → Alignment with business continuity needs.
2. **Application of Skills** → Use of resilience frameworks.
3. **Problem-Solving & Creativity** → Innovative approaches to crises.
4. **Clarity & Communication** → Clear, professional deliverable.
5. **Collaboration & Reflection** → Peer feedback and reflection documented.

---

## 📊 Assessment & Evaluation

* ✅ Quizzes and reflection prompts per atom (formative)
* ✅ Feedback on labs and mini-projects (mini-rubric)
* ✅ Capstone project graded with rubric (summative)
* ✅ Peer and/or mentor review (optional)

---

### 🔹 Mini-Rubric for Labs/Atoms (3 Criteria)

| Criterion       | Excellent (3)                                 | Adequate (2)                    | Needs Improvement (1)       |
| --------------- | --------------------------------------------- | ------------------------------- | --------------------------- |
| **Accuracy**    | Task completed correctly with no major errors | Mostly correct, minor errors    | Incorrect or incomplete     |
| **Application** | Demonstrates correct use of concept/tool      | Partial application, some gaps  | Weak or missing application |
| **Clarity**     | Clear, well-organized submission              | Some clarity, needs improvement | Unclear or hard to follow   |

> \[Use for small labs, coding exercises, or practice tasks. Quick 3-point scale for speed.]

---

### 📋 Assessment Rubric (Capstone — 5 Criteria)

The capstone is scored on **five criteria** across **four proficiency bands**, weighted to a total
of **100 points**. A criterion's band sets how much of its weight is earned. Recommended
**pass = ≥ 70% overall, with at least *Developing* on every criterion**, mentor-verified
(human-in-the-loop). This is the standard ADA rubric — reuse it across all your micro-credentials.

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (Job Competency Alignment)** | Fully aligned with the target job competency throughout. | Mostly aligned, minor gaps. | Partially aligned; notable gaps. | Weak or missing alignment. | **20 pts** |
| **Application of Skills** | Advanced, correct use of the target tools/methods. | Adequate use, minor errors. | Inconsistent use; several errors. | Minimal or incorrect application. | **25 pts** |
| **Problem-Solving & Creativity** | Innovative, practical solutions. | Sound but conventional. | Limited originality; partly impractical. | Little originality; impractical. | **20 pts** |
| **Clarity & Communication** | Clear, well-structured, professional. | Generally clear, minor issues. | Uneven clarity / structure. | Unclear, poorly structured. | **15 pts** |
| **Collaboration & Reflection** | Strong peer engagement + insightful reflection. | Moderate engagement + reflection. | Minimal engagement / reflection. | Missing. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

---

adjust the weights so they total **100 pts**.]

| **\[Criterion 4 — Clarity & Communication]** | \[Describe] | \[Describe] | \[Describe] | \[Describe] | **\[15 pts]** |
| **\[Criterion 5 — Collaboration & Reflection]** | \[Describe] | \[Describe] | \[Describe] | \[Describe] | **\[20 pts]** |
| **TOTAL** | | | | | **100 pts** |

---

## 📦 Supporting Resources

\[List any datasets, tools, starter code, templates, or guides learners will need.]

* 📁 \[Datasets, APIs, or case studies]
* 🧰 \[Starter notebooks or templates]
* 🧭 \[Setup instructions or tool guides]

---

## 🏅 Step 7 — Badge → Skills Map *(job matching)*

Define the badge so completion **writes proven KSA levels into the learner's skills map**, which
can then be matched against any job's minimum bar (see
[Skills Map & Job Matching](../specs/skills-map-and-job-matching.md)).

```yaml
badge:
  name: "[Badge name — e.g. Resilience Practitioner]"
  evidence_required: ["[atom-x]", "[atom-y]", "capstone"]   # what must be verified
  issued_on: verified-evidence                              # mentor/employer sign-off
  components:                                               # KSA levels this badge certifies
    K-[id]: [0-4]
    S-[id]: [0-4]
    A-[id]: [0-4]
```

| The job asks for… (must-have) | This badge proves | Match |
| ----------------------------- | ----------------- | ----- |
| \[skill / ability + min level] | \[component → level earned] | ✅ / ⚠️ / ❌ |

---

## 🎓 Outcomes & Recognition

\[Define what learners gain at the end.]

* Conceptual mastery of \[domain/skill].
* Practical, job-ready application of the **skill your org needs performed**.
* Portfolio project to showcase.
* LinkedIn-compatible **digital badge** that updates the learner's skills map.

---

## ✅ Design Conformance Checklist

Before you publish, confirm the Micro Course is **job-ready and on-method**:

* [ ] Step 0 names a real **task someone must perform**, with an observable "what good looks like".
* [ ] The competency is anchored to **SFIA / O\*NET / ESCO / ILO**.
* [ ] Every objective is **Bloom-verb + KSA-typed** (🧠/🛠️/🌱).
* [ ] **4–8 atoms**, each with modalities chosen to fit its KSA type.
* [ ] Abilities/attitudes are assessed with a **behavioral rubric across multiple occasions** (never a single quiz).
* [ ] There is a **capstone** that simulates the real task + a 5-criteria rubric.
* [ ] The **badge** maps to KSA levels and feeds a **skills map** for job matching.
* [ ] A **mentor/employer** validated the skill need and the evidence (human-in-the-loop).
* [ ] Resources are current, accessible, and properly licensed.

<script type="text/markdown" data-path="templates/es/plantilla-codelab-ada.md"># 🧪 Plantilla de Codelab ADA

Esta plantilla de codelab está diseñada siguiendo la Metodología ADA y la estructura de Átomos de Aprendizaje. Cada codelab debe combinar explicación, demostración de código y ejercicios guiados.

> **Dónde encaja:** un codelab es un átomo de 🧪 **Práctica** que construye una 🛠️ **Habilidad**
> (el *saber-hacer* que alguien debe realizar). Úsalo dentro de un Micro Curso creado con la
> [Plantilla de Micro-Credencial](plantilla-microcredencial-ada.md) — registra qué átomo/objetivo
> apoya y evalúalo con la **rúbrica de habilidad / desempeño**.

| Encaja en | Valor |
| --------- | ----- |
| Micro-credencial | \[título del curso] |
| Apoya átomo / objetivo | \[Átomo #, objetivo] |
| Tipo KSA / nivel objetivo | 🛠️ Habilidad · \[0–4] |

---

## 🧠 Título
Ejemplo: Crea tu primera API REST con Flask

## 🎯 Objetivo de Aprendizaje
Al finalizar este codelab, el estudiante será capaz de:
- Crear una API REST básica usando Flask
- Manejar métodos y rutas HTTP
- Ejecutar y probar una API localmente

---

## 🛠️ Requisitos
- Python 3.8+
- `pip`
- IDE o editor de código (por ejemplo, VS Code)

Instalar Flask:
```bash
pip install flask
```

---

## 🚀 Paso 1: API Hola Mundo
### 🔍 Explicación
Comenzaremos creando una aplicación mínima con Flask.

### 💻 Código de ejemplo
```python
from flask import Flask
app = Flask(__name__)

@app.route('/')
def home():
    return "¡Hola, mundo!"

if __name__ == '__main__':
    app.run(debug=True)
```

### 🧪 Ejercicio
- Ejecuta la app localmente
- Visita `http://127.0.0.1:5000/`
- Cambia el texto de respuesta por tu nombre

---

## 📨 Paso 2: Agregar una nueva ruta
### 🔍 Explicación
Ahora crearemos una ruta que devuelva información de usuario.

<script type="text/markdown" data-path="templates/es/plantilla-microcredencial-ada.md"># 🚀 Plantilla de Micro-Credencial ADA

Usa esta plantilla para diseñar un **Micro Curso (micro-credencial ADA)** que desarrolle
**cualquier habilidad que tu organización necesite que alguien realice** — una tarea laboral real,
hecha a un estándar real. Cada sección tiene **\[instrucciones entre corchetes]**; reemplázalas con
tu contenido. Ejemplo completo:
[micro-credencial de Mentalidad de Crecimiento](../../examples/growth-mindset-micro-credential/README.md) *(contenido en inglés)*.

---

## 🧭 Cómo usar esta plantilla — *de una necesidad de habilidad a un curso en 7 pasos*

```mermaid
flowchart LR
  S0["🏢 Paso 0<br/>Necesidad en el trabajo"] --> S1["🎯 Paso 1<br/>Competencia objetivo"]
  S1 --> S2["🧬 Paso 2<br/>Desglose KSA"]
  S2 --> S3["📘 Paso 3<br/>Objetivos (Bloom+KSA)"]
  S3 --> S4["⚛ Paso 4<br/>Átomos + modalidades"]
  S4 --> S5["🔄 Paso 5<br/>4 fases + planificador"]
  S5 --> S6["🚀 Paso 6<br/>Capstone + rúbricas"]
  S6 --> S7["🏅 Paso 7<br/>Insignia → mapa de habilidades"]
```

1. **Paso 0 — Nombra la necesidad** (abajo): ¿qué debe *hacer* alguien en el trabajo y cómo se ve "lo bueno"?
2. **Paso 1 — Anclala** a una competencia reconocida (SFIA · O\*NET · ESCO · ILO).
3. **Paso 2 — Desglósala en KSA** — 🧠 Conocimiento, 🛠️ Habilidad, 🌱 Aptitud — para enseñar/evaluar cada parte correctamente.
4. **Paso 3 — Escribe objetivos Bloom**, cada uno etiquetado con su tipo KSA.
5. **Paso 4 — Diseña 4–8 átomos de aprendizaje**, eligiendo modalidades de la topología.
6. **Paso 5 / 6 — Secuencia las 4 fases**, luego agrega capstone + rúbricas.
7. **Paso 7 — Emite una insignia** que escriba niveles KSA en un mapa de habilidades para emparejamiento laboral.

> 🔗 Método detallado para Paso 0–2: [Mapeo de Rol a Credencial](../../specs/role-to-credential-mapping.md)
> · Tipos y niveles KSA: [Taxonomía KSA](../../specs/ksa-taxonomy.md)
> · menú de modalidades: [Topología del Átomo de Aprendizaje](../../specs/learning-atom-topology.md).

---

## 🏢 Paso 0 — Necesidad de Habilidad Organizacional *(intake)*

Empieza aquí. Describe la **tarea real** que necesitas que alguien realice — no un tema. Si puedes
observar a una persona de alto desempeño haciéndolo, mejor aún (ver DACUM / shadowing en el spec de mapeo de rol).

| Pregunta de intake | Tu respuesta |
| ------------------ | ------------ |
| **¿Qué debe ser capaz de *hacer* la persona?** (una tarea observable) | \[ej. "Facilitar un retro de incidentes sin culpas que produzca acciones correctivas"] |
| **¿Quién lo realiza / en qué rol(es)?** | \[rol, equipo, seniority] |
| **Por qué importa** (resultado de negocio / costo de la brecha) | \[impacto si se hace bien vs. mal] |
| **Cómo se ve "lo bueno"** (comportamiento de alto desempeño, el estándar) | \[1–3 señales observables de maestría] |
| **Referencia a marco reconocido** | \[competencia SFIA · O\*NET · ESCO · ILO] |
| **Brecha actual** (dónde están hoy los estudiantes) | \[lo que aún no pueden hacer / hacen de forma inconsistente] |
| **Evidencia de maestría** (cómo sabrás que pueden hacerlo) | \[el artefacto/comportamiento que lo demuestra] |

> ⚠️ Los mapeos de habilidades asistidos por IA son **apoyo a la decisión** — pide a un mentor o
> al responsable de contratación que valide la tarea, el estándar y la evidencia antes de construir (humano en el ciclo).

\[Define la duración: horas o semanas. Las micro-credenciales ADA suelen ser de 10–30 horas.]
**Ejemplo:** *15 horas · 3 semanas (5h/semana)*

## 🎯 Competencia Laboral Objetivo

\[Identifica la habilidad laboral del mundo real que desarrolla el curso, referenciando marcos como SFIA, O\*NET, o ESCO.]
**Ejemplo:** *Capacidad de diseñar e implementar estrategias de continuidad y resiliencia empresarial.*
