<script type="text/markdown" data-path="examples/ksa-attitude-adaptability.md"># 🌱 Example — Attitude / Ability: Adaptability & Growth Mindset (KSA)

**KSA flavor demonstrated:** a pure **Ability** (an attitude / durable disposition) — the
hardest type to teach and assess, and the one job postings most often demand ("adaptable",
"thrives in ambiguity", "growth mindset") yet rarely develop intentionally.

This example shows how v2 makes an *attitude* trainable and certifiable by: modeling it,
threading it across **multiple authentic occasions**, and assessing it with a **behavioral
rubric + reflection + 360**, never a quiz.

Conforms to [`../specs/micro-credential-v2-schema.md`](../specs/micro-credential-v2-schema.md).

---

## YAML front matter

```yaml
---
schema: ada-microcredential/v2
id: mc-adaptability-growth-mindset
title: "Thriving in Change: Adaptability & Growth Mindset"
language: en
duration_hours: 14
status: published
license: CC-BY-SA-4.0
mentors: ["@sancarbar"]

target_roles:
  - role: "Any role in a fast-changing digital team"
    framework_ref: "O*NET Work Styles: Adaptability/Flexibility, Persistence / ESCO: transversal attitudes"

ksa:
  - { id: K-mindset-science, type: knowledge, label: "Fixed vs. growth mindset; basics of self-regulation", target_level: 1, bloom: understand }
  - { id: S-reframing-technique, type: skill, label: "Apply a reframing/learning-loop technique under setback", target_level: 2, bloom: apply }
  - { id: A-adaptability, type: ability, label: "Adapt approach & stay effective amid change/ambiguity", target_level: 2, primary: true, affective_stage: organize, assessed_occasions: 4 }
  - { id: A-growth-mindset, type: ability, label: "Treat failure as learning; seek challenge & feedback", target_level: 2, affective_stage: value, assessed_occasions: 3 }

atoms:
  - { id: atom-1, title: "The science of mindset", ksa_refs: [K-mindset-science], phase: 1, formats: [read, watch, evaluate], rubric: knowledge-mini }
  - { id: atom-2, title: "Spot the mindset", ksa_refs: [K-mindset-science, A-growth-mindset], phase: 2, formats: [watch, evaluate], rubric: knowledge-mini }
  - { id: atom-3, title: "The curveball lab", ksa_refs: [A-adaptability, S-reframing-technique], phase: 3, formats: [practice, collaborate, evaluate], rubric: ability-behavioral }
  - { id: atom-4, title: "Failure résumé & growth journal", ksa_refs: [A-growth-mindset, A-adaptability], phase: 4, formats: [practice, collaborate, evaluate], rubric: ability-behavioral }

capstone:
  title: "The pivot challenge"
  integrates_ksa: [K-mindset-science, S-reframing-technique, A-adaptability, A-growth-mindset]
  rubric: capstone-5

badge:
  name: "Thriving in Change"
  evidence_required: ["atom-3", "atom-4", "capstone"]
  issued_on: verified-evidence
---
```

---

## 🎯 Target Job Competency
Stay effective and keep learning when **goals, tools, or requirements change** — listed in
postings as *adaptability, flexibility, resilience, growth mindset* (O\*NET Work Styles;
ESCO transversal attitudes).

## 🧬 KSA breakdown — an attitude, modeled as Abilities

| KSA | Component | Why this type | Target |
| --- | --------- | ------------- | ------ |
| 🧠 Knowledge | Fixed vs. growth mindset; self-regulation basics | Concepts to understand (small enabling layer) | L1 |
| 🛠️ Skill | A reframing / learning-loop technique | A *teachable move* you can practice in reps | L2 |
| 🌱 Ability | Adaptability amid change | A disposition shown across many situations | L2 |
| 🌱 Ability | Growth mindset (failure = learning) | A disposition / attitude shown over time | L2 |

> **Why two Abilities + one Skill:** an attitude isn't taught by lecturing it. v2 gives the
> learner a small **Knowledge** base, a concrete **Skill** (a reframing move they can
> actually do), and then builds the **Abilities** through repeated, real exposure to
> change — because dispositions are proven by *behavior across contexts*, not by a test.

## 📘 Learning Objectives (Bloom + Affective + KSA)

| Objective | Bloom / Affective | KSA | Component | Target |
| --------- | ----------------- | --- | --------- | ------ |
| Explain fixed vs. growth mindset | Understand | 🧠 K | K-mindset-science | L1 |
| Apply a reframing technique to a setback | Apply | 🛠️ S | S-reframing-technique | L2 |
| Adapt approach when conditions change | Organize (affective) | 🌱 A | A-adaptability | L2 |
| Treat failure as learning; seek challenge | Value (affective) | 🌱 A | A-growth-mindset | L2 |

---

## ⚛ Learning Atoms — *attitude-appropriate design*

> Modalities below are chosen from the [Learning Atom Topology](../specs/learning-atom-topology.md):
> 🖼️ *Mental Model* · 🎬 *case clips* · 🧪 *Simulation / Role-Play* · 📖 *Journal* · 🤝 *Study Group* · ✅ *Behavioral Assessment*.

### Atom 1 · "The science of mindset" — 🧠 Knowledge *(Phase 1)*
- **Read/Watch:** growth-mindset overview; what self-regulation is.
- **Evaluate:** quick concept check. **Evidence:** K-mindset-science **L1**.
- *(Knowledge here is intentionally light — L1 — it only enables the Abilities.)*

### Atom 2 · "Spot the mindset" — 🧠 K → 🌱 A modeling *(Phase 2: see)*
- **Watch:** clips/cases of people facing setbacks with fixed vs. growth responses.
- **Evaluate:** identify the language and behaviors of each; predict outcomes.
- **Purpose:** lets learners *recognize* the target Ability before being asked to live it.

### Atom 3 · "The curveball lab" — 🌱 Ability + 🛠️ Skill *(Phase 3: do)*
- **Practice:** mid-task, the brief **changes twice** (new constraint, then a removed
  resource). Learner replans using the reframing technique. *(occasions 1 & 2)*
- **Collaborate:** debrief with peers; mentor observes how the learner responded to change.
- **Evaluate:** behavioral rubric on *adaptation* (did they re-plan vs. freeze?) + correct
  use of the reframing move.
- **Evidence:** effective response to 2 changes → S-reframing-technique **L2**; partial
  A-adaptability evidence.

### Atom 4 · "Failure résumé & growth journal" — 🌱 Ability *(Phase 4: share)*
- **Practice:** write a *failure résumé* (a real setback + what was learned); set a
  stretch goal and pursue feedback on it. *(occasion 3)*
- **Collaborate:** share with the cohort; give/receive supportive challenge.
- **Reflect:** ongoing growth journal across the 2–3 weeks *(occasion 4 — sustained)*.
- **Evaluate:** behavioral rubric + peer/mentor 360 on sustained behavior.
- **Evidence:** A-growth-mindset **L2** (3 occasions) and A-adaptability **L2** (4 occasions).

---

## 🔍 Phase planner

| Phase | Atom(s) | KSA focus | Activity | Assessment |
| ----- | ------- | --------- | -------- | ---------- |
| 🙉 1 | Atom 1 | 🧠 K | mindset readings/video | knowledge-mini |
| 🙈 2 | Atom 2 | 🧠 K → 🌱 A | analyze case clips | formative |
| 🙊 3 | Atom 3 | 🌱 A + 🛠️ S | curveball lab (change ×2) | behavioral |
| 🐵 4 | Atom 4 | 🌱 A | failure résumé + journal + 360 | behavioral + 360 |

---

## 📊 Behavioral rubric (the right tool for an attitude)

| Criterion | Excellent (3) | Adequate (2) | Needs Improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Consistency across contexts** | Adapted effectively across all 4 occasions | Adapted in 2–3 | Froze/resisted; only when pushed |
| **Self-awareness (reflection)** | Names triggers, choices, and growth with insight | Some reflection | Minimal/none |
| **Response to setback/feedback** | Reframes as learning, seeks the challenge | Accepts but passive | Defensive or avoidant |

> An attitude can't be certified from one moment or a quiz. The rubric explicitly requires
> evidence **across occasions** — that's what separates an Ability from a Skill.

## 🚀 Capstone — "The pivot challenge"
A multi-day project whose goal **pivots partway through**. Learners must re-scope, keep the
team moving, document what they changed and why, and reflect on how they handled it.
Capstone criteria map to KSA:

| Capstone criterion | Evidences |
| ------------------ | --------- |
| Relevance | adapting to a realistic pivot |
| Application of Skills | S-reframing-technique |
| Problem-Solving & Creativity | A-adaptability |
| Clarity & Communication | reflection + change log |
| Collaboration & Reflection | A-growth-mindset + peer 360 |

### 📋 Assessment Rubric (capstone-5)

Five criteria across four proficiency bands, weighted to **100 points** (pass ≥ 70%, at least
*Developing* on every criterion; mentor-verified). Because this certifies an **Ability**, pair it
with the behavioral rubric across occasions above.

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | The pivot is a realistic, job-relevant stretch; framing accurate. | Relevant; framing mostly accurate. | Loosely relevant; framing partly off. | Off-target or inaccurate. | **20 pts** |
| **Application of Skills** | Reframing technique used skillfully to re-scope. | Used adequately, minor gaps. | Attempted but inconsistent. | Largely absent or misapplied. | **25 pts** |
| **Problem-Solving & Creativity** | Re-plans calmly into a smart new path. | Sound, conventional re-plan. | Some re-planning; stalls at points. | Freezes; no adaptation. | **20 pts** |
| **Clarity & Communication** | Clear change log + honest, structured reflection. | Generally clear. | Uneven clarity. | Unclear or missing. | **15 pts** |
| **Collaboration & Reflection** | Strong peer 360 + deeply insightful reflection. | Moderate engagement + reflection. | Minimal. | Missing. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

## 🏅 Badge → skills map
Sets `A-adaptability=2` and `A-growth-mindset=2` — exactly the durable Abilities that
employers list as `must_have` "attitude/fit" and that a Knowledge-only course can never
certify. This badge is what closes the **Ability** gaps in a job-match skills map.
</script>
<script type="text/markdown" data-path="examples/ksa-human-skill-feedback.md"># 🤝 Example — Human Skill: Giving & Receiving Feedback (KSA)

**KSA flavor demonstrated:** a **human/durable Skill** (the technique of structuring
feedback) explicitly paired with an **Ability** (empathetic, psychologically-safe
communication) and grounded in **Knowledge** (feedback models).

This example shows that "soft" competencies decompose with the **same KSA rigor** as
technical ones — and why human competencies usually need **both** a Skill layer (the
repeatable technique) **and** an Ability layer (the disposition shown across situations).

Conforms to [`../specs/micro-credential-v2-schema.md`](../specs/micro-credential-v2-schema.md).

---

## YAML front matter

```yaml
---
schema: ada-microcredential/v2
id: mc-feedback-conversations
title: "Feedback That Helps: Giving & Receiving Feedback"
language: en
duration_hours: 12
status: published
license: CC-BY-SA-4.0
mentors: ["@sancarbar"]

target_roles:
  - role: "Team Lead / Senior Individual Contributor"
    framework_ref: "ESCO: transversal skills – communication, teamwork / O*NET: Social Skills"

ksa:
  - { id: K-feedback-models, type: knowledge, label: "Feedback models (SBI, radical candor, growth feedback)", target_level: 2, bloom: understand }
  - { id: S-structure-feedback, type: skill, label: "Structure a feedback conversation (SBI: Situation-Behavior-Impact)", target_level: 2, bloom: apply, primary: true, prerequisites: [K-feedback-models] }
  - { id: S-receive-feedback, type: skill, label: "Receive feedback without defensiveness; ask clarifying questions", target_level: 2, bloom: apply }
  - { id: A-empathetic-communication, type: ability, label: "Communicate with empathy & create psychological safety", target_level: 2, affective_stage: value, assessed_occasions: 3 }

atoms:
  - { id: atom-1, title: "Why feedback fails — and the models that work", ksa_refs: [K-feedback-models], phase: 1, formats: [read, listen, evaluate], rubric: knowledge-mini }
  - { id: atom-2, title: "Watch good & bad feedback", ksa_refs: [K-feedback-models, A-empathetic-communication], phase: 2, formats: [watch, evaluate], rubric: knowledge-mini }
  - { id: atom-3, title: "Role-play: give SBI feedback", ksa_refs: [S-structure-feedback, A-empathetic-communication], phase: 3, formats: [practice, collaborate, evaluate], rubric: ability-behavioral }
  - { id: atom-4, title: "Receive feedback & reflect", ksa_refs: [S-receive-feedback, A-empathetic-communication], phase: 4, formats: [practice, collaborate, evaluate], rubric: ability-behavioral }

capstone:
  title: "Run a real feedback conversation"
  integrates_ksa: [K-feedback-models, S-structure-feedback, S-receive-feedback, A-empathetic-communication]
  rubric: capstone-5

badge:
  name: "Feedback That Helps"
  evidence_required: ["atom-3", "atom-4", "capstone"]
  issued_on: verified-evidence
---
```

---

## 🎯 Target Job Competency
Give and receive **actionable, respectful feedback** — a transversal competency for any
leadership or senior IC role (ESCO transversal skills: communication, teamwork).

## 🧬 KSA breakdown — and the Skill ↔ Ability distinction

| KSA | Component | Why this type | Target |
| --- | --------- | ------------- | ------ |
| 🧠 Knowledge | Feedback models (SBI, growth feedback) | Concepts you recall & reason with | L2 |
| 🛠️ Skill | Structure a feedback conversation (SBI) | A **repeatable technique** that improves with reps | L2 |
| 🛠️ Skill | Receive feedback constructively | Also a practiced procedure | L2 |
| 🌱 Ability | Empathetic communication / psychological safety | A **disposition** shown consistently across people & moments | L2 |

> **Key teaching point:** the *technique* of SBI is a **Skill** (learnable in reps). Doing
> it with genuine empathy that makes others feel safe is an **Ability** (a disposition
> proven across many conversations). v2 develops and assesses **both**.

## 📘 Learning Objectives (Bloom + KSA)

| Objective | Bloom | KSA | Component | Target |
| --------- | ----- | --- | --------- | ------ |
| Compare common feedback models | Understand | 🧠 K | K-feedback-models | L2 |
| Deliver feedback using SBI | Apply | 🛠️ S | S-structure-feedback | L2 |
| Receive feedback without defensiveness | Apply | 🛠️ S | S-receive-feedback | L2 |
| Communicate with empathy / safety | Value | 🌱 A | A-empathetic-communication | L2 |

---

## ⚛ Learning Atoms — *taught & assessed to type*

> Modalities below are chosen from the [Learning Atom Topology](../specs/learning-atom-topology.md):
> 📖 *Article* · 🎧 *Podcast* · 🎬 *paired clips* · 🧪 *Role-Play* · 🤝 *Peer 360* · ✅ *Behavioral Assessment*.

### Atom 1 · "Why feedback fails — and what works" — 🧠 Knowledge *(Phase 1)*
- **Read:** SBI model + growth-feedback overview. **Listen:** podcast on candor vs. kindness.
- **Evaluate:** concept check — classify statements as observation vs. judgment.
- **Evidence:** ≥80% quiz → K-feedback-models **L2**. **Rubric:** `knowledge-mini`.

### Atom 2 · "Watch good & bad feedback" — 🧠 K → 🌱 A modeling *(Phase 2: see)*
- **Watch:** paired clips of effective vs. damaging feedback.
- **Evaluate:** annotate what created (or destroyed) psychological safety.
- **Purpose:** builds the mental model of what the Ability *looks like* before practicing it.

### Atom 3 · "Role-play: give SBI feedback" — 🛠️ Skill + 🌱 Ability *(Phase 3: do)*
- **Practice:** role-play giving feedback to a peer on a real-ish scenario (occasion 1),
  then a second, different scenario (occasion 2).
- **Collaborate:** peers + mentor observe and coach.
- **Evaluate:** behavioral rubric on **both** the SBI structure (Skill) and the empathy /
  safety created (Ability).
- **Evidence:** structured, empathetic delivery in 2 scenarios → S-structure-feedback **L2**
  + partial A evidence. **Rubric:** `ability-behavioral`.

### Atom 4 · "Receive feedback & reflect" — 🛠️ Skill + 🌱 Ability *(Phase 4: share)*
- **Practice:** receive live feedback; respond with clarifying questions, no defensiveness.
- **Collaborate:** 360 mini-survey from 2 peers + mentor (occasion 3).
- **Reflect:** journal on your default reaction and how you regulated it.
- **Evidence:** corroborated calm, curious reception → S-receive-feedback **L2**; combined
  with Atoms 2–3 → A-empathetic-communication **L2** (3 occasions met).

---

## 🔍 Phase planner

| Phase | Atom(s) | KSA focus | Activity | Assessment |
| ----- | ------- | --------- | -------- | ---------- |
| 🙉 1 | Atom 1 | 🧠 K | read/listen + quiz | knowledge-mini |
| 🙈 2 | Atom 2 | 🧠 K → 🌱 A | annotate clips | formative |
| 🙊 3 | Atom 3 | 🛠️ S + 🌱 A | role-play ×2 | behavioral |
| 🐵 4 | Atom 4 | 🛠️ S + 🌱 A | receive + 360 + reflect | behavioral + 360 |

---

## 🚀 Capstone — "Run a real feedback conversation"
Conduct an actual (or high-fidelity simulated) feedback conversation, recorded or observed,
then receive feedback on your feedback. Submit a reflection. Scored with the 5-criteria
capstone rubric:

| Capstone criterion | Evidences |
| ------------------ | --------- |
| Relevance | K-feedback-models |
| Application of Skills | S-structure-feedback, S-receive-feedback |
| Problem-Solving & Creativity | adapting tone to the person/situation |
| Clarity & Communication | A-empathetic-communication |
| Collaboration & Reflection | 360 + reflection journal |

### 📋 Assessment Rubric (capstone-5)

Five criteria across four proficiency bands, weighted to **100 points** (pass ≥ 70%, at least
*Developing* on every criterion; mentor-verified).

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | Conversation is a real, job-relevant feedback case, framed accurately. | Relevant; framing mostly accurate. | Loosely relevant; framing partly off. | Off-target or inaccurate framing. | **20 pts** |
| **Application of Skills** | SBI structure + skilled receiving used cleanly. | Both used adequately, minor gaps. | Inconsistent or partial use. | Minimal or incorrect application. | **25 pts** |
| **Problem-Solving & Creativity** | Adapts tone to the person/situation insightfully. | Sound, conventional adaptation. | Some adaptation; uneven. | Rigid; no adaptation. | **20 pts** |
| **Clarity & Communication** | Empathetic, clear, well-structured delivery + reflection. | Generally clear. | Uneven clarity. | Unclear or missing. | **15 pts** |
| **Collaboration & Reflection** | Strong 360 engagement + insightful reflection journal. | Moderate engagement + reflection. | Minimal. | Missing. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

## 🌱 Why the Ability needs ≥3 occasions
A single good conversation could be luck. v2 certifies `A-empathetic-communication` only
after it shows up across **Atom 2 (recognize), Atom 3 (×2 role-plays), Atom 4 (live + 360)**
— consistency across contexts is the definition of an Ability.

## 🏅 Badge → skills map
Sets `K-feedback-models=2`, `S-structure-feedback=2`, `S-receive-feedback=2`,
`A-empathetic-communication=2` — the human-skill cluster many leadership roles list as a
`must_have` Ability that postings rarely teach.

**KSA flavor demonstrated:** primarily a **Skill** (technical/hard), built on top of
**Knowledge**, and threaded with one **Ability**.

This worked example shows an ADA **v2** micro-credential conforming to
[`../specs/micro-credential-v2-schema.md`](../specs/micro-credential-v2-schema.md). It
illustrates how a *technical skill* is decomposed into Knowledge (know-what), Skill
(know-how), and Ability (durable disposition).

---

## YAML front matter (machine-readable)

```yaml

schema: ada-microcredential/v2
id: mc-rest-api-fundamentals
title: "REST API Fundamentals with Flask"
language: en
duration_hours: 18
status: published
license: CC-BY-SA-4.0
authors: ["Ada School Team"]
mentors: ["@sancarbar"]

target_roles:

    framework_ref: "O*NET 15-1254.00 Web Developers / SFIA:PROG"

ksa:

  - { id: S-build-rest-endpoint, type: skill,   label: "Build & test a CRUD REST endpoint", target_level: 2, bloom: create, primary: true, prerequisites: [K-http-semantics] }
  - { id: S-write-unit-tests,  type: skill,     label: "Write unit tests for an endpoint", target_level: 2, bloom: apply }

atoms:
  - { id: atom-1, title: "How the web talks", ksa_refs: [K-http-semantics], phase: 1, modalities: [{dimension: read, subtype: "Technical Article"}, {dimension: watch, subtype: "Video Explainer"}, {dimension: see, subtype: "Diagram"}, {dimension: evaluate, subtype: "Pop Quiz"}], rubric: knowledge-mini }
  - { id: atom-2, title: "Build your first endpoint", ksa_refs: [S-build-rest-endpoint, K-http-semantics], phase: 3, modalities: [{dimension: watch, subtype: "Tutorial / Screencast"}, {dimension: practice, subtype: "Codelab"}, {dimension: evaluate, subtype: "Performance Task"}], rubric: skill-performance }

  - { id: atom-4, title: "Requirements changed — adapt", ksa_refs: [A-adaptability, S-build-rest-endpoint], phase: 4, modalities: [{dimension: practice, subtype: "Project Task"}, {dimension: collaborate, subtype: "Pair Programming"}, {dimension: evaluate, subtype: "Behavioral Assessment"}], rubric: ability-behavioral }

## 🎓 Title
**REST API Fundamentals with Flask** · ⏳ 18 hours · 3 weeks

## 🎯 Target Job Competency
Build, test, and adapt RESTful web services — a core task for a **Junior Backend Developer**
(O\*NET 15-1254.00 / SFIA:PROG).

## 🧬 KSA breakdown of this competency

| KSA | Component | Why this type | Target |
| --- | --------- | ------------- | ------ |
| 🧠 Knowledge | HTTP methods, status codes, REST resource design | Information you must recall & reason with | L2 Working |
| 🛠️ Skill | Build & test a CRUD endpoint | A procedure that improves with reps & produces an artifact | L2 Working |
| 🛠️ Skill | Write unit tests | Same — procedural, artifact-producing | L2 Working |
| 🌱 Ability | Adaptability when requirements change | A disposition shown across situations | L2 Working |

> Note how a "technical" competency is **not just a skill** — it rests on Knowledge and is
> only job-real when paired with the Ability to adapt.

## 📘 Learning Objectives (Bloom + KSA)

| Objective | Bloom | KSA | Component | Target |
| --------- | ----- | --- | --------- | ------ |
| Explain HTTP methods, status codes & REST design | Understand | 🧠 K | K-http-semantics | L2 |
| Build & test a CRUD endpoint in Flask | Create | 🛠️ S | S-build-rest-endpoint | L2 |
| Write unit tests covering happy + error paths | Apply | 🛠️ S | S-write-unit-tests | L2 |
| Adapt the API to a changed spec | Apply | 🌱 A | A-adaptability | L2 |

## 🧱 Atom & Modality Map

Each atom selects concrete sub-types from the [Learning Atom Topology](../specs/learning-atom-topology.md), matched to its KSA type.

```mermaid
flowchart TD
  MC["🎓 REST API Fundamentals"]
  MC --> A1["⚛ Atom 1 · 🧠 K · P1<br/>📖 Technical Article<br/>🎬 Video Explainer<br/>🖼️ Diagram<br/>✅ Pop Quiz"]
  MC --> A2["⚛ Atom 2 · 🛠️ S · P3<br/>🎬 Screencast<br/>🧪 Codelab<br/>✅ Performance Task"]
  MC --> A3["⚛ Atom 3 · 🛠️ S · P3<br/>🧪 Test Challenge<br/>✅ Mini-Rubric"]
  MC --> A4["⚛ Atom 4 · 🌱 A · P4<br/>🧪 Project Task<br/>🤝 Pair Programming<br/>✅ Behavioral Assessment"]
  A1 --> CAP["🚀 Capstone: Ship a Tasks API"]
  A2 --> CAP
  A3 --> CAP
  A4 --> CAP
  CAP --> B["🏅 Badge → 🗺️ Skills Map"]
```

---

## ⚛ Learning Atoms — *taught & assessed to type*

### Atom 1 · "How the web talks" — 🧠 Knowledge *(Phase 1: hear)*
- **📖 Read** *(Technical Article)*: REST/HTTP primer (MDN HTTP overview).
- **🎬 Watch** *(Video Explainer)*: 10-min animated request/response lifecycle.
- **🖼️ See** *(Diagram)*: annotate a client–server request/response diagram.
- **🧪 Practice** *(retrieval)*: map verbs ↔ CRUD.
- **✅ Evaluate** *(Pop Quiz)*: 10-question check (status codes, idempotency).
- **Evidence → level:** ≥80% on quiz + correct diagram → K-http-semantics **L2**.
- **Rubric:** `knowledge-mini` (Accuracy-weighted).

### Atom 2 · "Build your first endpoint" — 🛠️ Skill *(Phase 3: do)*
- **🎬 Watch** *(Tutorial / Screencast)*: walkthrough (mirrors `templates/codelab-ada-template.md`).
- **🧪 Practice** *(Codelab)*: implement `GET/POST/PUT/DELETE /items` in Flask with JSON +
  error handling; commit to a repo.
- **✅ Evaluate** *(Performance Task)*: rubric on the running endpoint + code review.
- **Evidence → level:** working CRUD endpoint reviewed by mentor → S-build-rest-endpoint **L2**.
- **Rubric:** `skill-performance` (Application-weighted).

### Atom 3 · "Prove it works: unit testing" — 🛠️ Skill *(Phase 3: do)*
- **🧪 Practice** *(Test Challenge)*: write `pytest` tests covering happy path + 404/400
  cases; reach ≥80% coverage of the endpoint.
- **✅ Evaluate** *(Mini-Rubric)*: passing suite + coverage report.
- **Evidence → level:** green suite, ≥80% coverage → S-write-unit-tests **L2**.
- **Rubric:** `skill-performance`.

### Atom 4 · "Requirements changed — adapt & review" — 🌱 Ability *(Phase 4: share)*
- **🧪 Practice** *(Project Task)*: a new spec arrives (add filtering + pagination);
  implement via a PR.
- **🤝 Collaborate** *(Pair Programming + Async Peer Review)*: pair on the change; review one
  peer's PR; receive a review on yours.
- **📖 Read/Write** *(Journal)*: reflect — *what changed, what you changed, what you'd do differently.*
- **✅ Evaluate** *(Behavioral Assessment)*: behavioral rubric across **3 occasions** (the
  change, the peer review, the reflection) + mentor observation.
- **Evidence → level:** adaptation handled + constructive review + reflection → A-adaptability **L2**.
- **Rubric:** `ability-behavioral`.

---

## 🔍 Phase planner

| Phase | Atom(s) | KSA focus | Activity | Assessment |
| ----- | ------- | --------- | -------- | ---------- |
| 🙉 1 Self-Guided | Atom 1 | 🧠 K | readings + video + diagram | quiz |
| 🙈 2 Visual | Atom 2 (demo) | 🧠 K→🛠️ S | codelab walkthrough | formative |
| 🙊 3 Applied | Atoms 2–3 | 🛠️ S | build + test labs | performance rubric |
| 🐵 4 Collaboration | Atom 4 | 🌱 A | PR + peer review + reflection | behavioral rubric |

## 🚀 Capstone — "Ship a small Tasks API"
Design, build, test, and **adapt** a multi-resource REST API (tasks + tags), submit via PR,
and review a peer's submission. Scored with the 5-criteria capstone rubric; each criterion
maps to a KSA it evidences:

| Capstone criterion | Evidences |
| ------------------ | --------- |
| Relevance (job alignment) | K-http-semantics |
| Application of Skills | S-build-rest-endpoint, S-write-unit-tests |
| Problem-Solving & Creativity | S-build-rest-endpoint |
| Clarity & Communication | reflection + PR description |
| Collaboration & Reflection | A-adaptability + peer review |

### 📋 Assessment Rubric (capstone-5)

Five criteria across four proficiency bands, weighted to **100 points** (pass ≥ 70%, at least
*Developing* on every criterion; mentor-verified).

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (job alignment)** | API fully reflects correct HTTP semantics and the brief. | Mostly aligned, minor gaps. | Partially aligned; notable gaps. | Weak or missing alignment. | **20 pts** |
| **Application of Skills** | Endpoints + tests built correctly; clean, idiomatic code. | Adequate build/tests, minor errors. | Inconsistent; gaps in tests or correctness. | Minimal or incorrect application. | **25 pts** |
| **Problem-Solving & Creativity** | Adapts to the new spec with a robust, elegant solution. | Sound but conventional adaptation. | Limited; partly working adaptation. | Stalls on the change. | **20 pts** |
| **Clarity & Communication** | Clear PR description + reflection; professional. | Generally clear, minor issues. | Uneven clarity / structure. | Unclear or missing. | **15 pts** |
| **Collaboration & Reflection** | Constructive peer review + insightful reflection. | Moderate engagement + reflection. | Minimal engagement / reflection. | Missing. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

<script type="text/markdown" data-path="examples/role-data-scientist-pathway.md"># 📘 Worked Example — *Data Processing → Data Scientist* Pathway

An end-to-end application of the
[Role-to-Credential Mapping methodology](../specs/role-to-credential-mapping.md): we take a
**real role with placement demand** (*Data Scientist*), **deconstruct** it into duties →
tasks → KSA at a **high-performer bar**, **cluster** those into a **pathway of connected
micro-credentials** (starting with *data processing*), and **measure a learner's skills gap**
toward the role.

> Reads alongside: [`ksa-taxonomy.md`](../specs/ksa-taxonomy.md) ·
> [`skills-map-and-job-matching.md`](../specs/skills-map-and-job-matching.md) ·
> [`genai-authoring-workflow.md`](../specs/genai-authoring-workflow.md).

---

## Stage 0 — Target role & demand 🔒

```yaml
role: "Data Scientist"
framework_refs: ["O*NET:15-2051.00", "ESCO:data scientist", "ILO ISCO-08:2511", "SFIA:DATS"]
purpose: "Turn data into validated, decision-ready insight and ML systems."
demand_signals:
  - { signal: "high and growing demand for data/ML roles", value: "high", verified: false }   # NEEDS HUMAN VALIDATION
validated_by: "employer:AcmeData / mentor:@sancarbar"
```

**Why this role:** consistent hiring demand and a clear, *learnable* skill structure that
builds from an accessible entry point — **data processing** — which is itself a job-relevant
competency (data/analytics assistants) and the foundation every downstream duty depends on.

---

## Stages 1–2 — Triangulated duty → task analysis 🔒

Signals used: O\*NET/ESCO task lists (A) + 8 job postings (B) + shadowing & a BEI with 2
senior data scientists (C). Reconciled into duties and observable tasks.

```mermaid
flowchart TD
  R["💼 Data Scientist"] --> D1["🗂️ D1 Acquire &amp; prepare data"]
  R --> D2["🗂️ D2 Explore &amp; visualize"]
  R --> D3["🗂️ D3 Model &amp; validate"]
  R --> D4["🗂️ D4 Operationalize"]
  R --> D5["🗂️ D5 Communicate &amp; influence"]
  D1 --> T1["🔧 Clean &amp; validate a raw dataset"]
  D1 --> T2["🔧 Build a reproducible data pipeline"]
  D2 --> T3["🔧 Run EDA &amp; visualize patterns"]
  D3 --> T4["🔧 Frame &amp; test a hypothesis"]
  D3 --> T5["🔧 Train &amp; evaluate an ML model"]
  D4 --> T6["🔧 Deploy &amp; monitor a model"]
  D5 --> T7["🔧 Turn results into a decision recommendation"]
```

---

## Stages 3–4 — KSA at the high-performer bar

For each task we extract Knowledge / Skill / Ability with a **target level (0–4)** defined as
*"what a strong performer does,"* plus **observable performance criteria** taken from the
observation notes. (Abbreviated to the core components.)

| KSA id | Type | Label | Bar (0–4) | Performance criterion (from observation) | Must-have |
| ------ | ---- | ----- | --------- | ---------------------------------------- | --------- |
| `K-data-types-quality` | 🧠 K | Data types, missingness & quality concepts | 2 | Names failure modes before touching data | yes |
| `S-data-wrangling` | 🛠️ S | Clean/transform data reproducibly | 3 | Justified missing/outlier strategy; rerunnable pipeline | yes |
| `S-pipeline-build` | 🛠️ S | Build a parameterized data pipeline | 2 | Idempotent, documented, version-controlled | yes |
| `K-stats-foundations` | 🧠 K | Probability & inferential statistics | 2 | Chooses the right test; states assumptions | yes |
| `S-eda-visualization` | 🛠️ S | EDA & honest visualization | 3 | Charts answer a question; no misleading scales | yes |
| `S-ml-modeling` | 🛠️ S | Train/evaluate ML models | 3 | Proper train/val/test; metric fits the problem | yes |
| `S-ml-production` | 🛠️ S | Deploy & monitor a model | 2 | Tracks drift; can roll back | no |
| `S-insight-communication` | 🛠️ S | Communicate results to deciders | 3 | Leads with the decision, not the method | yes |
| `A-rigor` | 🌱 A | Analytical rigor / skepticism | 3 | Verifies assumptions; distrusts "too good" results | yes |
| `A-stakeholder-empathy` | 🌱 A | Stakeholder empathy & communication | 2 | Frames work in the audience's terms | yes |
| `A-adaptability` | 🌱 A | Adaptability under changing data/goals | 2 | Re-plans when data invalidates the approach | no |

> Note the **differentiators** the postings didn't list — `A-rigor`, `A-stakeholder-empathy`
> — surfaced by the Behavioral Event Interviews. These often decide who performs well.

---

## Stages 5–6 — Cluster into a sequenced pathway

KSA cluster into six micro-credentials, sequenced by prerequisite and rising proficiency
across the four ADA phases.

```mermaid
flowchart LR
  MC1["📦 Data Wrangling<br/>(data processing)"] --> MC2["📊 EDA &amp; Visualization"]
  MC2 --> MC3["📐 Statistical Inference"]
  MC3 --> MC4["🤖 ML Foundations"]
  MC4 --> MC5["🚀 ML in Production"]
  MC2 --> MC6["🗣️ Insight Communication"]
  MC5 --> JOB["🎯 Data Scientist<br/>job-ready"]
  MC6 --> JOB
```

| # | Micro-credential | Closes (KSA) | Phase | Capstone (mirrors a real task) |
| - | ---------------- | ------------ | ----- | ------------------------------ |
| 1 | **Data Wrangling** *(data processing)* | `K-data-types-quality`, `S-data-wrangling`, `S-pipeline-build`, `A-rigor` | 1·3 | Ship a reproducible cleaning pipeline + data-quality report on a messy real dataset |
| 2 | **EDA & Visualization** | `S-eda-visualization`, `A-stakeholder-empathy` | 2 | Produce an EDA notebook that answers 3 stakeholder questions honestly |
| 3 | **Statistical Inference** | `K-stats-foundations`, `A-rigor` | 3 | Design + run a valid A/B-style test and defend the assumptions |
| 4 | **ML Foundations** | `S-ml-modeling`, `A-rigor` | 3 | Train, evaluate, and error-analyze a model with leakage-free splits |
| 5 | **ML in Production** | `S-ml-production`, `A-adaptability` | 3 | Deploy a model behind an API with drift monitoring + rollback |
| 6 | **Insight Communication** | `S-insight-communication`, `A-stakeholder-empathy` | 4 | Present a decision recommendation to a non-technical panel |

Each is a standalone **ADA v2 micro-credential** (design them with the
[v2 schema](../specs/micro-credential-v2-schema.md)); **earning all required ones accumulates
into the Data Scientist role profile.**

---

## Stage 8 — Skills-gap analysis for a learner

A learner arrives having done some data work. We evidence their current levels and diff
against the role bar (mechanics: [skills-map spec](../specs/skills-map-and-job-matching.md)).

```yaml
learner: "ada-learner-042"
evidenced:
  - { ref: K-data-types-quality, level: 2, evidence: "quiz:mc-wrangling", verified: true }
  - { ref: S-data-wrangling,     level: 2, evidence: "artifact:cleaning-nb", verified: true }
  - { ref: S-pipeline-build,     level: 1, evidence: "lab:pipeline-1", verified: true }
  - { ref: S-eda-visualization,  level: 1, evidence: "artifact:eda-1", verified: true }
  - { ref: A-rigor,              level: 2, evidence: "360:cohort-3", verified: true }
  # statistics, ML, production, communication, stakeholder-empathy: not yet evidenced (L0)
```

### Resulting skills map (core/must-have rows)

| Component | Type | Bar | Have | Gap | Status |
| --------- | ---- | --- | ---- | --- | ------ |
| K-data-types-quality | 🧠 K | 2 | 2 | 0 | ✅ met |
| S-data-wrangling | 🛠️ S | 3 | 2 | 1 | 🟡 partial |
| S-pipeline-build | 🛠️ S | 2 | 1 | 1 | 🟡 partial |
| K-stats-foundations | 🧠 K | 2 | 0 | 2 | 🔴 missing |
| S-eda-visualization | 🛠️ S | 3 | 1 | 2 | 🟡 partial |
| S-ml-modeling | 🛠️ S | 3 | 0 | 3 | 🔴 missing |
| S-insight-communication | 🛠️ S | 3 | 0 | 3 | 🔴 missing |
| A-rigor | 🌱 A | 3 | 2 | 1 | 🟡 partial |
| A-stakeholder-empathy | 🌱 A | 2 | 0 | 2 | 🔴 missing |

**Ordered plan (prerequisite, then weight):** finish **Data Wrangling** (close
`S-data-wrangling` 2→3, `S-pipeline-build` 1→2) → **EDA & Visualization** → **Statistical
Inference** → **ML Foundations** → **Insight Communication** → **ML in Production**.

The learner is **strongest where they've worked (data processing) and the gap is largest in
modeling, statistics, and communication** — exactly the route the pathway sequences. Re-run
the match after each badge; *job-ready* when every must-have gap is 0 and the match clears the
threshold.

---

## What this demonstrates

- A **real role** becomes a **measurable tree** of duties → tasks → KSA.
- The **bar is set by high performers**, captured through observation, so "passing" means
  "can do the job well," not "saw the material."
- **Connected micro-credentials** form a **pathway**; the first (*data processing*) is both
  immediately useful and the foundation for the rest.
- The learner always has a **number** (the gap / match %) showing exactly what to earn next.

> ⚠️ All KSA levels, demand signals, and mappings above are **illustrative** and must be
> validated by mentors/employers before use — per the methodology's human gates.
</script>
<script type="text/markdown" data-path="examples/skills-map-job-match-frontend.md"># 🗺️ Example — End-to-End: From Job Posting to Job-Ready (Skills Map + Match)

This is the **full ADA v2 loop** on a realistic role: a **Junior Frontend Developer**. It
shows how Gen AI turns a job posting into a **target KSA profile**, diffs it against a
learner to build a **skills map**, computes a **job-match score**, prescribes
micro-credentials (covering technical, human, and attitude competencies), and re-scores to
**job-ready**.

Specs used: [`../specs/genai-authoring-workflow.md`](../specs/genai-authoring-workflow.md),
[`../specs/skills-map-and-job-matching.md`](../specs/skills-map-and-job-matching.md),
[`../specs/ksa-taxonomy.md`](../specs/ksa-taxonomy.md).

---

## Step 0 · The job posting (input)

> **Junior Frontend Developer — AcmeApps**
> Build and maintain responsive UIs in React. Turn Figma designs into accessible
> components. Write tests. Collaborate in code review and daily standups. We move fast and
> requirements change — we want someone **adaptable**, **communicative**, and eager to
> learn. JavaScript + HTML/CSS required; Git essential.

---

## Step 1 · Extract Target KSA Profile  🔒 *(Gen AI → human validated)*

The assistant classifies each requirement as K / S / A, assigns a minimum level and weight,
and — importantly — **adds the Abilities the posting implies**. The mentor/employer then
validated levels and confirmed inferred Abilities.

```yaml
role: "Junior Frontend Developer"
source: "AcmeApps posting"
framework_ref: "O*NET 15-1254.00 Web Developers / ESCO: front-end developer"
validated_by: "employer:AcmeApps + mentor:@sancarbar"
requirements:
  - { ref: K-html-css,            type: knowledge, min_level: 2, weight: 3, must_have: true }
  - { ref: K-accessibility-basics, type: knowledge, min_level: 2, weight: 3, must_have: true }
  - { ref: S-javascript,          type: skill,     min_level: 2, weight: 5, must_have: true }
  - { ref: S-react-components,     type: skill,     min_level: 2, weight: 5, must_have: true }
  - { ref: S-figma-to-ui,          type: skill,     min_level: 2, weight: 4, must_have: true }
  - { ref: S-frontend-testing,     type: skill,     min_level: 2, weight: 3, must_have: true }
  - { ref: S-use-git,             type: skill,     min_level: 2, weight: 3, must_have: true }
  - { ref: A-adaptability,        type: ability,   min_level: 2, weight: 3, must_have: false, inferred: true }
  - { ref: A-communication,       type: ability,   min_level: 2, weight: 4, must_have: true }
  - { ref: A-growth-mindset,      type: ability,   min_level: 2, weight: 3, must_have: false, inferred: true }
```

> 🔎 **Human-in-the-loop value:** the posting only said "adaptable, communicative, eager to
> learn." The AI translated those into three concrete, level-rated **Abilities** — and the
> employer confirmed **communication** is actually a `must_have`.

---

## Step 2 · The learner's current profile

From self-assessment + previously earned ADA badges (each level backed by evidence):

```yaml
learner: "ada-learner-042"
evidenced:
  - { ref: K-html-css,            level: 2, evidence: "badge:mc-web-basics", verified: true }
  - { ref: K-accessibility-basics, level: 1, evidence: "self+quiz",          verified: true }
  - { ref: S-javascript,          level: 2, evidence: "badge:mc-js-foundations", verified: true }
  - { ref: S-react-components,     level: 1, evidence: "tutorial project",   verified: true }
  - { ref: S-use-git,             level: 2, evidence: "badge:mc-git-basics", verified: true }
  - { ref: A-communication,       level: 1, evidence: "cohort peer notes",   verified: true }
  # absent (level 0): S-figma-to-ui, S-frontend-testing, A-adaptability, A-growth-mindset
```

---

## Step 3 · Skills Map (the gap graph)  🔒

| Component | Type | Need | Have | Gap | Status | Must-have |
| --------- | ---- | ---- | ---- | --- | ------ | --------- |
| K-html-css | 🧠 K | 2 | 2 | 0 | ✅ met | yes |
| K-accessibility-basics | 🧠 K | 2 | 1 | 1 | 🟡 partial | yes |
| S-javascript | 🛠️ S | 2 | 2 | 0 | ✅ met | yes |
| S-react-components | 🛠️ S | 2 | 1 | 1 | 🟡 partial | yes |
| S-figma-to-ui | 🛠️ S | 2 | 0 | 2 | 🔴 missing | yes |
| S-frontend-testing | 🛠️ S | 2 | 0 | 2 | 🔴 missing | yes |
| S-use-git | 🛠️ S | 2 | 2 | 0 | ✅ met | yes |
| A-adaptability | 🌱 A | 2 | 0 | 2 | 🔴 missing | no |
| A-communication | 🌱 A | 2 | 1 | 1 | 🟡 partial | **yes** |
| A-growth-mindset | 🌱 A | 2 | 0 | 2 | 🔴 missing | no |

```
Prerequisite-ordered "to earn":
 [K-html-css ✅] → [S-react-components 🟡] → [S-figma-to-ui 🔴]
 [K-accessibility-basics 🟡] ─┘
 BLOCKERS (must_have, unmet): S-react-components, S-figma-to-ui, S-frontend-testing,
                              K-accessibility-basics, A-communication
 Boosters (nice-to-have): A-adaptability, A-growth-mindset
```

**Coverage by type:** Knowledge 1/2 · Skill 3/5 · Ability 1/3 → the **Ability** column is
the weakest, exactly the part postings under-specify.

---

## Step 4 · Job-match score (before)

`match = 100 × Σ min(have,need)×weight / Σ need×weight`

| Component | need×w | have×w |
| --------- | ------ | ------ |
| K-html-css | 6 | 6 |
| K-accessibility-basics | 6 | 3 |
| S-javascript | 10 | 10 |
| S-react-components | 10 | 5 |
| S-figma-to-ui | 8 | 0 |
| S-frontend-testing | 6 | 0 |
| S-use-git | 6 | 6 |
| A-adaptability | 6 | 0 |
| A-communication | 8 | 4 |
| A-growth-mindset | 6 | 0 |
| **Σ** | **72** | **34** |

```json
{ "role": "Junior Frontend Developer", "match_score": 47, "job_ready": false,
  "blockers": ["S-react-components","S-figma-to-ui","S-frontend-testing",
               "K-accessibility-basics","A-communication"],
  "coverage": {"knowledge":"1/2","skill":"3/5","ability":"1/3"} }
```

**47% — not job-ready.** Five must-haves unmet (spanning Knowledge, Skills, **and** an
Ability).

---

## Step 5 · Prescribed learning path (micro-credentials per gap)

Gen AI clusters the gaps into a sequenced path mixing **technical, human, and attitude**
development — the core promise of ADA v2:

| # | Micro-credential | Closes (KSA) | Flavor |
| - | ---------------- | ------------ | ------ |
| 1 | **Accessible UI with React** | K-accessibility-basics →2, S-react-components →2 | 🛠️ technical + 🧠 knowledge |
| 2 | **From Figma to Components** | S-figma-to-ui →2 | 🛠️ technical |
| 3 | **Frontend Testing Essentials** | S-frontend-testing →2 | 🛠️ technical |
| 4 | **[Feedback That Helps](ksa-human-skill-feedback.md)** | A-communication →2 | 🤝 human skill |
| 5 | **[Thriving in Change](ksa-attitude-adaptability.md)** | A-adaptability →2, A-growth-mindset →2 | 🌱 attitude |

Note MC #4 and #5 **reuse the worked examples in this repo** — the same KSA components flow
straight into the job match.

---

## Step 6 · Job-match score (after completing the path)

Each earned badge updates the learner profile to the target levels. New `have×weight`:

| Component | need×w | have×w (after) |
| --------- | ------ | -------------- |
| K-html-css | 6 | 6 |
| K-accessibility-basics | 6 | 6 |
| S-javascript | 10 | 10 |
| S-react-components | 10 | 10 |
| S-figma-to-ui | 8 | 8 |
| S-frontend-testing | 6 | 6 |
| S-use-git | 6 | 6 |
| A-adaptability | 6 | 6 |
| A-communication | 8 | 8 |
| A-growth-mindset | 6 | 6 |
| **Σ** | **72** | **72** |

```json
{ "role": "Junior Frontend Developer", "match_score": 100, "job_ready": true,
  "blockers": [], "coverage": {"knowledge":"2/2","skill":"5/5","ability":"3/3"} }
```

**100% and job-ready** — all must-haves met across all three KSA types.

> A learner short on time could stop after MC #1–#4: that clears every **must_have**
> (A-adaptability and A-growth-mindset are not blocking). Recompute: have = 72 − 6 (adapt)
> − 6 (growth) = 60 → 60/72 ≈ **83%**, just under the 85% threshold but **job-eligible**
> since no blockers remain. The two attitude boosters then take them to 100% and stronger
> standing.

---

## Step 7 · What the learner walks away with

- 🏅 **5 verified badges** mapped to real KSA components.
- 🗂️ A **portfolio** (React app, Figma-built components, test suite, a recorded feedback
  conversation, a growth journal / pivot project).
- 📊 A shareable **match report** showing 100% against the target role, broken down by
  Knowledge, Skills, and Abilities.
- 🔁 A reusable profile that can be **re-matched against other roles** instantly.

---

## The big picture

```
 Posting → [AI extract+human validate] → Target KSA Profile
         → [diff with learner] → Skills Map + 47% match (not ready)
         → [design path: technical + human + attitude micro-credentials]
         → [learn · produce evidence · earn badges] → profile updated
         → [re-match] → 100% match → JOB-READY
```

This is ADA v2: **a clear, KSA-driven framework that uses Gen AI to design micro-credentials
and a skills map that tells a learner exactly what to earn to meet a job's minimum bar —
across knowledge, technical skills, human skills, and attitudes.**
</script>

least-taught — competencies of the AI era: **thinking critically**. It is a *fully populated* example
built end-to-end with the ADA Methodology (KSA + 4 phases + learning-atom topology): every atom has
**real reading text**, **curated videos**, **Mermaid diagrams**, **image-generation prompts**,
hands-on drills, and rubrics.

> 🖥️ **See it live:** open [`course.html`](course.html) in any browser for an interactive, navigable

Critical thinking is a **cognitive skill** that spans the full KSA spectrum: a small **Knowledge** base
(the anatomy of reasoning; fallacies & biases), three core **Skills** (evaluate arguments & evidence,
question & verify, and construct & defend a reasoned argument), and the durable **Abilities** that
power them (intellectual humility and a curious, skeptical stance). It pairs naturally with
[Problem Solving](../problem-solving-micro-credential/README.md) (where you apply the reasoning) and
[Self-Learning](../self-learning-micro-credential/README.md) (where you judge sources and AI output).

## 🧭 What this teaches

In a world flooded with content, confident AI answers, and persuasive nonsense, the ability to **tell
good reasoning from bad** is a superpower. This course makes it concrete and certifiable: learners
learn to **deconstruct an argument** (claims, premises, assumptions, inference), **spot fallacies and
biases**, **evaluate evidence and sources**, **ask sharp questions**, and **build and defend a
well-reasoned position** — finishing by reasoning through a real, contested issue and defending their
conclusion.

messages), the **Skill** of navigating feedback / difficult conversations, and the durable

clear message** (in writing and out loud), and **handle feedback and hard conversations** with
empathy and appropriate assertiveness — finishing with a real communication performance they deliver
and peer-review.

## 🧭 What this teaches

beginners get stuck (naming, types, `=` vs `==`, "why is my number a string?"). This course makes
that foundational skill **trainable and certifiable**: learners build an accurate mental model of
what a variable *is*, learn Python's core data types and dynamic typing, then **write real code**
to declare, name, reassign, combine, and convert values — finishing with a small program they ship
and peer-review.

<script type="text/markdown" data-path="examples/ada-methodology-designer-micro-credential/capstone.md"># 🚀 Capstone — *Design a Complete ADA Credential*

The capstone is delivered as [Atom 7](atoms/atom-7-capstone-assemble-the-credential.md). This file
is the **grading brief**: what the designer submits, how it maps to KSA, and the showcase format.

---

## 🎯 The brief

> Take a **real organizational skill need** and design a complete ADA micro-credential for it,
> using all three templates — from a Step 0 skill-need intake through KSA breakdown, Bloom-tagged
> objectives, 4–8 atoms, a capstone, a 5-criteria Assessment Rubric, and a badge → skills map — then
> peer-review a classmate's credential and do a 5-minute showcase.

The point is a **coherent, conformant, deliverable** credential someone could actually run — not a
huge one. This is exactly the job: turn a fuzzy "we need people who can do X" into a measurable,
job-matchable learning unit.

---

## 📦 What to submit

- [ ] **The micro-credential doc** — Step 0 intake → competency (SFIA/O\*NET/ESCO) → KSA breakdown
  with 0–4 targets → Bloom + KSA objectives → atoms table → capstone → badge.
- [ ] **4–8 learning atoms** — at least one **Knowledge**, one **Skill**, and one **Ability** atom,
  each with topology-correct modalities and a matching evaluation.
- [ ] **A 5-criteria Assessment Rubric** for the capstone (+ at least one mini-rubric).
- [ ] **A badge → skills-map fragment** showing which KSA levels completion certifies.
- [ ] **The Design Conformance Checklist** (from the template) passed.
- [ ] **A peer review you gave** — applied to a classmate's credential.

---

## 🎤 Showcase structure (≈ 5 minutes)

1. **The skill need** (45s) — whose job, which task, why now.
2. **KSA breakdown** (60s) — the components and target levels.
3. **One atom** (90s) — your proudest atom and why its modalities fit its KSA type.
4. **Badge → job gap** (60s) — what the skills map writes and the requirement it closes.
5. **Human-in-the-loop** (15s) — what a mentor/employer must validate before it counts.

---

## 🧬 How the capstone maps to KSA

| Capstone element | Evidences | Component |
| ---------------- | --------- | --------- |
| Coherent Step 0 → badge structure | Understands the ADA architecture | 🧠 K-ada-architecture |
| Correct KSA typing + 0–4 targets | Classifying competencies | 🧠 K-ksa-framework (L3) |
| Bloom-verb, KSA-tagged objectives | Writing measurable objectives | 🛠️ S-write-objectives (L2) |
| Atoms with topology-correct modalities | Designing atoms of each type | 🛠️ S-design-atoms (L3) |
| A fair, weighted 5-criteria rubric | Building assessment | 🛠️ S-build-rubric (L2) |
| The whole thing assembled & conformant | Assembling a micro-credential | 🛠️ S-assemble-mc (L3) |
| Learner-centered choices + HITL flags + peer review | Design judgment across ≥3 occasions | 🌱 A-design-judgment (L2) |

---

## ✅ Grading

Atom-level checks (`knowledge-mini`, `skill`) gate entry to the capstone, which is then scored on the
standard 5-criteria **Assessment Rubric** below (also in [`rubrics.md`](rubrics.md)).

## 📋 Assessment Rubric

Five criteria across four proficiency bands, weighted to **100 points**.

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | Anchored to a real skill need and a named framework; alignment is tight from intake to badge. | Relevant and framework-linked; minor gaps. | Loosely relevant; framework link weak or generic. | Off-target or unanchored to any real need. | **20 pts** |
| **Application of skills** | KSA typing, Bloom objectives, modality fit, and rubric design are all correct and consistent. | Mostly correct with minor errors. | Several gaps (mistyped KSA, fuzzy verbs, modality mismatch, vague bands). | Minimal or incorrect application of the methodology. | **25 pts** |
| **Problem-solving & creativity** | Atoms are well-sequenced and inventive; the capstone genuinely simulates the real job task. | Sound, conventional design that works. | Uneven sequence; thin or generic capstone. | Incoherent sequence or missing capstone. | **20 pts** |
| **Clarity & communication** | Docs are clear, on-template, and professional; showcase is crisp and persuasive. | Generally clear and on-template. | Uneven clarity or off-template in places. | Unclear, incomplete, or not on-template. | **15 pts** |
| **Collaboration & reflection** | Insightful peer review given; honest reflection; human-in-the-loop points explicitly flagged. | Adequate peer review and reflection. | Minimal review / reflection. | Missing peer review or reflection. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

> **Pass for the badge:** atom-level `skill` checks ≥ 2 each AND the Assessment Rubric weighted score
> ≥ 70% (at least *Developing* on every criterion), with the peer review + showcase completed —
> **verified by a mentor** (human-in-the-loop). See [`skills-map.md`](skills-map.md) for what the
> badge unlocks.
</script>

<script type="text/markdown" data-path="examples/ada-methodology-designer-micro-credential/rubrics.md"># 📊 Rubrics — ADA Methodology Designer Micro-Credential

All assessment instruments used across the course. Atoms reference these by `rubric` flavor:
`knowledge-mini`, `skill`, `capstone-5` (plus a `design-judgment` behavioral lens applied throughout).

---

## 🔹 `knowledge-mini` — concept checks (Atoms 1, 2, 4)

Quick formative check; used for the pop quizzes and the KSA classification worksheet.

| Criterion | Excellent (3) | Adequate (2) | Needs improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Accuracy** | All answers correct; classifies K/S/A and levels reliably | Mostly correct | Repeats a misconception (e.g. quiz-assessing an Ability) |
| **Vocabulary** | Uses terms correctly (KSA, Bloom level, modality, affective) | Roughly right | Vague / wrong terms |
| **Self-application** | Connects the concept to their own design-in-progress | Generic example | None |

> Pass = 2+ on each. Knowledge here is **L2–L3** — it enables the design Skills that follow.

---

## 🔹 `skill` — performance mini-rubric (Atoms 3, 5, 6)

For writing objectives, authoring the three atoms, and building the rubric.

| Criterion | Excellent (3) | Adequate (2) | Needs improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Correct mechanics** | Objectives measurable; atoms complete; rubric weights total 100 | Minor gaps | Incomplete or non-functional |
| **KSA fit** | Bloom level + modalities + instrument all match the KSA type | One slip | Mismatched (e.g. quiz for an Ability) |
| **Topology use** | Specific sub-types chosen deliberately from the topology | Generic but valid | Defaults to "video + quiz" everywhere |
| **Measurability** | A second designer could grade with the same result | Mostly clear | Bands/criteria too vague to apply |

> Pass = 2+ on each → **L2–L3** evidence for the relevant design Skill component.

---

## 🔹 `design-judgment` — the instructional-judgment lens (Atoms 5–7) ⭐

The lens that builds the **Ability** `A-design-judgment`. A habit, not a single moment — observed
across the **3 assessed occasions** (peer review in Atom 5, the assessment design in Atom 6, the
capstone in Atom 7).

| Criterion | Excellent (3) | Adequate (2) | Needs improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Learner empathy** | Choices clearly center the learner (accessibility, scaffolding, fairness) | Generally learner-aware | Designer-/content-centric |
| **Framework rigor** | Competencies linked honestly to SFIA/O\*NET/ESCO; sources cited | Some linkage | Unanchored claims |
| **Human-in-the-loop** | Explicitly flags what a mentor/employer must validate | Mentions it | Treats AI/own output as authoritative |

> Consistent 2+ across occasions supports **L2** for `A-design-judgment`.

---

## ✨ `capstone-5` — Assessment Rubric (standard ADA capstone)

The capstone is scored on **five criteria** across **four proficiency bands**, weighted to a total of
**100 points**. Each criterion's band sets how much of its weight is earned. **Pass = ≥ 70% overall
with at least *Developing* on every criterion**, mentor-verified (human-in-the-loop).

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | Anchored to a real skill need and a named framework; alignment is tight from intake to badge. | Relevant and framework-linked; minor gaps. | Loosely relevant; framework link weak or generic. | Off-target or unanchored to any real need. | **20 pts** |
| **Application of skills** | KSA typing, Bloom objectives, modality fit, and rubric design are all correct and consistent. | Mostly correct with minor errors. | Several gaps (mistyped KSA, fuzzy verbs, modality mismatch, vague bands). | Minimal or incorrect application of the methodology. | **25 pts** |
| **Problem-solving & creativity** | Atoms are well-sequenced and inventive; the capstone genuinely simulates the real job task. | Sound, conventional design that works. | Uneven sequence; thin or generic capstone. | Incoherent sequence or missing capstone. | **20 pts** |
| **Clarity & communication** | Docs are clear, on-template, and professional; showcase is crisp and persuasive. | Generally clear and on-template. | Uneven clarity or off-template in places. | Unclear, incomplete, or not on-template. | **15 pts** |
| **Collaboration & reflection** | Insightful peer review given; honest reflection; human-in-the-loop points explicitly flagged. | Adequate peer review and reflection. | Minimal review / reflection. | Missing peer review or reflection. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

> **Badge pass:** atom-level `skill` checks ≥ 2 each AND Assessment Rubric weighted ≥ 70%
> (at least *Developing* on every criterion), **mentor-verified** (human-in-the-loop).

---

<script type="text/markdown" data-path="examples/critical-thinking-micro-credential/capstone.md"># 🚀 Capstone — Reason Through a Real Issue

The capstone integrates every component of the **Critical Thinking** micro-credential into one piece of
evidence. Full task and rubric live in
[`atoms/atom-6-capstone-reason-through-a-real-issue.md`](atoms/atom-6-capstone-reason-through-a-real-issue.md);
this file is the at-a-glance brief and the KSA mapping.

---

## 🎯 The brief

> **Take a real, contested issue, evaluate the evidence on all sides, reach a reasoned and calibrated
> conclusion, and defend it under peer scrutiny.**

Deliverable: a **Reasoned Position Brief** (~800–1,200 words or short deck) that:

1. **Frames** a genuinely contested issue (and why it's contested).
2. **Steelmans all sides** — strongest argument for each, represented fairly.
3. **Evaluates the evidence** — quality, fallacies/biases, lateral verification with cited sources.
4. **Builds a reasoned position** — claim → reasons → evidence → strongest counterargument + honest
   response → **qualified** conclusion.
5. **States what would change your mind** + your confidence level.
6. **Reflects** on whether and how your view shifted.

Plus a **showcase/defense** and at least one **peer review**.

---

## 🧬 How the capstone proves each KSA component

| KSA | Component | Where it shows up in the capstone |
| --- | --------- | --------------------------------- |
| 🧠 K | The anatomy of reasoning | Correctly maps claims/premises/assumptions across sides |
| 🧠 K | Fallacies & biases | Names fallacies/biases in the evidence and arguments |
| 🛠️ S | Evaluate arguments & evidence | The evidence-evaluation section (quality, relevance, verification) |
| 🛠️ S | Question & verify | Lateral verification of key evidence; Socratic framing; steelmans |
| 🛠️ S | Build & defend an argument | The reasoned-position section + live defense |
| 🌱 A | Intellectual humility | Calibration; "what would change my mind"; conceding/ updating in defense |
| 🌱 A | Skeptical curiosity | Questioning all sides incl. own; sharp peer review |

---

## ✅ Pass bar

- **≥ 80%** on the 5-criteria `capstone-5` rubric **and** no criterion below *Developing*.
- Abilities confirmed at **L2** via behavioral evidence across **≥ 3 occasions** (Atom 5 + forum +
  capstone defense).
- Result: **🏅 Critical Thinker** badge issued on verified evidence, writing
  `S-evaluate-arguments`, `S-question-verify`, `S-construct-argument`, `A-intellectual-humility`,
  `A-skepticism-curiosity` to the learner's [skills map](skills-map.md).
</script>

---

## 🎯 Target job competency

**Think critically.** Employers want people who can cut through noise: evaluate claims, weigh evidence,
spot flawed reasoning, ask the right questions, and reach a defensible conclusion — especially now that
AI can produce fluent, confident, sometimes-wrong content at scale. It is one of the most-requested
competencies across every function. Mapped to **O\*NET** (Critical Thinking, Active Learning, Judgment
& Decision Making) and **ESCO** transversal *"think critically / analytically."*

## 🧬 KSA breakdown — a cognitive skill, taught the right way

| KSA | Component | Why this type | Target |
| --- | --------- | ------------- | ------ |
| 🧠 Knowledge | The anatomy of reasoning | A mental model: claims, premises, inference, standards | L2 |
| 🧠 Knowledge | Fallacies & reasoning biases | You can't catch flaws you can't name | L2 |
| 🛠️ Skill | Evaluate arguments & evidence | A trainable technique (deconstruct + judge) | **L2** |
| 🛠️ Skill | Question & verify | Socratic questioning + source evaluation | **L2** |
| 🛠️ Skill | Build & defend an argument | Argument mapping; address counterarguments | L2 |
| 🌱 Ability | Intellectual humility | A disposition: willingness to be wrong & revise | L2 |
| 🌱 Ability | Skeptical curiosity | A habit of questioning before accepting | L2 |

> **Why this shape:** critical thinking is mostly **doing** (Skills: evaluate, question, construct),
> but it only *works* when paired with the **Abilities** that drive it — intellectual humility (to
> follow evidence even against your own view) and skeptical curiosity (to question the obvious). Those
> Abilities are assessed **behaviorally, across ≥3 occasions**, not with a quiz.

## 📘 Learning objectives (Bloom + KSA)

| Objective | Bloom | KSA | Component | Target |
| --------- | ----- | --- | --------- | ------ |
| Explain the parts of an argument and distinguish validity from soundness | Understand | 🧠 K | K-reasoning | L2 |
| Recognize common logical fallacies and reasoning biases | Understand | 🧠 K | K-fallacies-biases | L2 |
| Deconstruct an argument and evaluate its evidence and logic | Analyze | 🛠️ S | S-evaluate-arguments | L2 |
| Ask Socratic questions and evaluate source credibility | Apply | 🛠️ S | S-question-verify | L2 |
| Construct and defend a reasoned argument addressing counterarguments | Create | 🛠️ S | S-construct-argument | L2 |
| Stay open to being wrong and revise beliefs with evidence | Value (affective) | 🌱 A | A-intellectual-humility | L2 |
| Question claims and assumptions across situations | Respond (affective) | 🌱 A | A-skepticism-curiosity | L2 |

---

| Phase | Atom(s) | KSA focus | Activity | Assessment |
| ----- | ------- | --------- | -------- | ---------- |
| 🙉 1 · hear | Atom 1, 2 | 🧠 K | reading + video on reasoning; fallacy/bias framework | knowledge-mini (pop quizzes) |
| 🙈 2 · see | Atom 3 | 🛠️ S | model argument analysis; deconstruct & judge a real case | performance task |
| 🙊 3 · do | Atom 4, 5 | 🛠️ S + 🌱 A | Socratic questioning + source audit; build & defend an argument | performance task + behavioral assessment |
| 🐵 4 · share | Atom 6 (capstone) | 🛠️ S + 🌱 A | reason through a real issue; defend + peer review | capstone-5 |

---

## 🚀 Capstone & 📊 assessment

Full brief in [`capstone.md`](capstone.md); all rubrics in [`rubrics.md`](rubrics.md). In short:
formative pop quizzes for the Knowledge atoms, skill performance tasks for argument evaluation and
questioning/verification, a **behavioral assessment** across occasions for the Abilities, and a
reasoned analysis of a real issue, defended on the standard 5-criteria capstone rubric. The badge →
skills-map mapping is in [`skills-map.md`](skills-map.md).

## 🎓 Outcomes & recognition

- A toolkit to **question and verify**: Socratic questions, source evaluation, steelmanning.
- The ability to **build and defend** a reasoned position that survives counterarguments.
- The durable **intellectual humility** and **skeptical curiosity** that make it stick — evidenced over time.

<script type="text/markdown" data-path="examples/critical-thinking-micro-credential/rubrics.md"># 📊 Rubrics — Critical Thinking Micro-Credential

All assessment instruments for this micro-credential, in one place. They follow the ADA conventions:
**formative** knowledge checks, **skill** performance tasks, **behavioral** assessment for Abilities
(across ≥3 occasions, never a quiz), and the standardized **5-criteria capstone** rubric.

---

## 1. `knowledge-mini` — formative knowledge checks (Atoms 1–2)

Used for the pop quizzes. Not heavily weighted; the goal is readiness for the skill atoms.

| Band | Descriptor |
| ---- | ---------- |
| ✅ Secure | Distinguishes validity/soundness; names fallacies & biases correctly with examples |
| 🟡 Developing | Gets the gist; mixes up some fallacies/biases or the validity/soundness distinction |
| 🔴 Not yet | Cannot yet identify the parts of an argument or common fallacies — revisit Atoms 1–2 |

---

## 2. `skill` — performance-task rubric (Atoms 3–4)

Applied to the argument-deconstruction task (Atom 3) and the question-&-verify task (Atom 4). Pass = **2+
on every row** → records the component at **L2**.

| Criterion | Excellent (3) | Adequate (2) | Needs work (1) |
| --------- | ------------- | ------------ | -------------- |
| **Mapping / questioning** | Accurately maps argument parts; asks sharp, category-spanning questions | Mostly accurate | Misreads argument / vague questions |
| **Logic evaluation** | Correctly assesses inference; names real gaps/fallacies | Some evaluation | Misses or invents flaws |
| **Evidence / verification** | Judges evidence quality; verifies laterally with named sources; traces original | Some judging/verifying | Takes evidence at face value |
| **Charity & judgment** | Steelmans before judging; proportioned, fair verdict | Some nuance | One-sided / strawmans |

> `S-evaluate-arguments` (Atom 3) and `S-question-verify` (Atom 4) each reach **L2** on a pass.

---

## 3. `behavioral` — Abilities rubric (Atoms 5–6, ≥ 3 occasions)

Abilities are **observed over time**, never quizzed. Evidence is gathered across Atom 5 (build &
defend), the discussion forum, and the capstone defense + peer review.

### 🌱 `A-intellectual-humility` — open-mindedness & willingness to revise

| Stage | Observable behavior |
| ----- | ------------------- |
| Proficient (L2+) | Invites the strongest objections; concedes valid points; **updates** position when warranted; confidence calibrated to evidence |
| Developing (L1–L2) | Acknowledges other views; occasionally updates; some over/under-confidence |
| Emerging (L0–L1) | Defends position regardless of evidence; treats concession as losing |

### 🌱 `A-skepticism-curiosity` — questioning stance

| Stage | Observable behavior |
| ----- | ------------------- |
| Proficient (L2+) | Questions own assumptions; asks "what would prove me wrong?"; pursues the strongest version of every side |
| Developing (L1–L2) | Questions others' claims; less consistent at self-questioning |
| Emerging (L0–L1) | Accepts claims at face value; little curiosity about alternatives |

> **≥ 3 occasions** required for the badge. Mentors log short notes per occasion (date, behavior seen).

---

## 4. `capstone-5` — capstone rubric (Atom 6)

The standardized 5-criteria, weighted, 4-band rubric. **Pass = ≥ 80% overall and no criterion below
Developing.**

| Criterion | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Beginning (≤69%) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Issue framing & charity (steelman)** | Frames a genuinely contested issue precisely; steelmans *all* sides so fairly supporters would agree | Frames clearly; represents sides fairly | Frames loosely; one side is weak/strawmanned | Vague issue; one-sided | **20 pts** |
| **Evidence evaluation & verification** | Rigorously judges evidence quality, names fallacies/biases, verifies key evidence laterally with cited sources | Solid evaluation; sources mostly verified | Surface evaluation; little verification | Takes evidence at face value | **25 pts** |
| **Reasoning & argument construction** | Tight claim→reasons→evidence; engages the strongest counterargument honestly; conclusion well-supported | Clear argument; addresses a counterargument | Loose structure; weak counterargument handling | Assertion without real support | **25 pts** |
| **Calibration & intellectual humility** | Confidence precisely matched to evidence; states what would change their mind; updates when warranted | Mostly calibrated; some openness | Over/under-confident; little openness | Unqualified certainty; no openness | **15 pts** |
| **Defense, peer review & curiosity** | Defends with poise, concedes valid points, asks sharp questions; peer review fair and incisive | Defends and reviews competently | Minimal/defensive engagement | Avoids challenge; no real review | **15 pts** |
| **TOTAL** | | | | | **100 pts** |

<script type="text/markdown" data-path="examples/effective-communication-micro-credential/capstone.md"># 🚀 Capstone — *Deliver, Converse, Reflect*

The capstone is delivered as [Atom 6](atoms/atom-6-communication-capstone.md). This file is the
**grading brief**: what learners submit, how it maps to KSA, and the showcase format.

---

## 🎯 The brief

> Pick a **real** communication you need to do (update, proposal, feedback, or a tough ask). Plan it
> (audience + channel + structured message), **deliver** it as a 3–5 minute spoken message or written
> piece, and **lead the follow-up conversation** — listening actively and handling at least one
> question, pushback, or hard moment with empathy and appropriate assertiveness. Then **reflect** and
> **peer-review** a classmate.

The point is a **real, well-handled exchange** you can explain — integrating the whole course — not a
polished performance for its own sake.

---

## 📦 What to submit

- [ ] **A one-page plan** — audience analysis (who/know/care/do), chosen channel + why, message
  outlined with **BLUF + Pyramid** (and **SBI** if it's feedback).
- [ ] **The performance** — a recording, a live observation, or the written piece + notes/transcript
  of the follow-up conversation.
- [ ] **A reflection** (6–8 sentences) — what landed, one noise source you managed, and how you
  handled the hardest moment.
- [ ] **A peer review you gave** — the capstone rubric applied to a classmate, with specific, kind,
  useful (SBI) feedback.

---

## 🎤 Showcase / observation structure (≈ 5 minutes)

1. **Context** (30s) — the audience and why this channel.
2. **The message** (2–3 min) — deliver it, leading with the point.
3. **The conversation** (1–2 min) — field a question/pushback live; listen, then respond.
4. **One choice** (30s) — a deliberate communication choice and why.

---

## 🧬 How the capstone maps to KSA

| Capstone element | Evidences | Component |
| ---------------- | --------- | --------- |
| Audience + channel choice in the plan | How communication works; audience/channel | 🧠 K-comm-model, K-audience-channel |
| Listening during the follow-up conversation | Active listening | 🛠️ S-active-listening (L2) |
| BLUF/Pyramid/SBI message | Structuring clear messages | 🛠️ S-structure-message (L2) |
| Handling pushback / a hard moment | Feedback & difficult conversations | 🛠️ S-feedback-difficult (L2) |
| Adapting to the listener; person feels respected | Empathy across occasions | 🌱 A-empathy (L2) |
| Saying the hard thing calmly and clearly | Assertive, respectful expression | 🌱 A-assertiveness (L2) |
| Peer review given + honest reflection | Collaboration & reflection | (capstone-5 collaboration) |

> The Abilities (`A-empathy`, `A-assertiveness`) are confirmed here as the **3rd observed occasion**,
> after Atoms 3 and 5.

---

## ✅ Grading

Atom-level checks (`knowledge-mini`, `skill`, `behavioral`) gate entry to the capstone, which is then
scored on the standard 5-criteria **Assessment Rubric** below (also in [`rubrics.md`](rubrics.md)).

## 📋 Assessment Rubric

Five criteria across four proficiency bands, weighted to **100 points**.

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | Message is purpose-built for a real audience and goal; channel choice is justified and apt. | Relevant; audience/channel mostly fitting. | Loosely fitting; generic audience/channel choice. | Off-target; no clear audience or purpose. | **20 pts** |
| **Application of skills** | Active listening, BLUF/Pyramid/SBI, and de-escalation are all used correctly and naturally. | Most used correctly, with minor lapses. | Several gaps (buried lead, weak listening, no structure). | Minimal or incorrect application. | **25 pts** |
| **Problem-solving** | Handles the live pushback/hard moment skillfully; adapts in real time. | Handles it adequately. | Partly handled; some defensiveness or rigidity. | Mishandled or avoided. | **20 pts** |
| **Clarity & communication** | Message is clear, concise, well-structured; nonverbals align. | Generally clear. | Uneven clarity or structure. | Unclear or disorganized. | **15 pts** |
| **Collaboration & reflection** | Empathy and assertiveness evident; insightful peer review + honest reflection. | Adequate empathy/assertiveness, review, reflection. | Minimal. | Missing. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

> **Pass for the badge:** atom-level checks ≥ 2 each (incl. the behavioral assessment), Assessment
> Rubric weighted score ≥ 70% (at least *Developing* on every criterion), and the peer review +
> reflection completed — **verified by a mentor/instructor** (human-in-the-loop). See
> [`skills-map.md`](skills-map.md) for what the badge unlocks.
</script>

## 🎯 Target job competency

**Communicate effectively** at work: listen so people feel heard, say/write things so people
understand and act, and handle feedback and tension without damaging the relationship. It is the
single most common line in job postings — *"excellent communication skills", "stakeholder
communication", "active listening", "clear written communication".* Mapped to **O\*NET** basic skills
(Active Listening, Speaking, Writing) and social skills (Social Perceptiveness, Persuasion), and
**ESCO** transversal communication skills.

## 🧬 KSA breakdown — a human skill, taught the right way

| KSA | Component | Why this type | Target |
| --- | --------- | ------------- | ------ |
| 🧠 Knowledge | How communication works (model, noise) | A small mental model that explains *why* messages fail | L2 |
| 🧠 Knowledge | Audience & channel | Prevents the "right message, wrong channel/audience" failure | L2 |
| 🛠️ Skill | Active listening | A trainable technique (paraphrase, clarify, check) | **L2** |
| 🛠️ Skill | Structure a clear message | BLUF/SBI/Pyramid — practiced in writing & speech | **L2** |
| 🛠️ Skill | Feedback & difficult conversations | A procedure for high-stakes moments | L2 |
| 🌱 Ability | Empathy & audience-awareness | A disposition shown across situations, over time | L2 |
| 🌱 Ability | Assertiveness (respectful) | Calm, honest expression under pressure — a habit | L2 |

> **Why this shape:** communication is mostly **doing** (Skills), but it only *transfers* when paired
> with the **Abilities** that drive it — empathy (to adapt to the other person) and assertiveness (to
> say the hard thing kindly). Hence the Abilities are assessed **behaviorally, across ≥3 occasions**,
> not with a quiz.

## 📘 Learning objectives (Bloom + KSA)

| Objective | Bloom | KSA | Component | Target |
| --------- | ----- | --- | --------- | ------ |
| Explain the communication model and name common barriers (noise) | Understand | 🧠 K | K-comm-model | L2 |
| Analyze an audience and choose an appropriate channel | Understand/Analyze | 🧠 K | K-audience-channel | L2 |
| Listen actively: paraphrase, ask clarifying questions, check understanding | Apply | 🛠️ S | S-active-listening | L2 |
| Structure a clear message with BLUF/SBI/Pyramid (written & spoken) | Apply | 🛠️ S | S-structure-message | L2 |
| Give and receive feedback and de-escalate a difficult conversation | Apply | 🛠️ S | S-feedback-difficult | L2 |
| Adapt to the listener with empathy across multiple situations | Value (affective) | 🌱 A | A-empathy | L2 |
| Express needs assertively and respectfully under pressure | Respond (affective) | 🌱 A | A-assertiveness | L2 |

---

## 🔍 Phase planner

| Phase | Atom(s) | KSA focus | Activity | Assessment |
| ----- | ------- | --------- | -------- | ---------- |
| 🙉 1 · hear | Atom 1, 2 | 🧠 K | reading + video + the comm model; audience/channel worksheet | knowledge-mini (pop quizzes) |
| 🙈 2 · see | Atom 3 | 🛠️ S + 🌱 A | model active listening; paired listening practice | skill mini-rubric |
| 🙊 3 · do | Atom 4, 5 | 🛠️ S + 🌱 A | structure messages; feedback & difficult-conversation role-plays | performance task + behavioral assessment |
| 🐵 4 · share | Atom 6 (capstone) | 🛠️ S + 🌱 A | deliver a message + lead a conversation; showcase + peer review | capstone-5 |

---

## 🚀 Capstone & 📊 assessment

Full brief in [`capstone.md`](capstone.md); all rubrics in [`rubrics.md`](rubrics.md). In short:
formative pop quizzes for the Knowledge atoms, a skill mini-rubric + performance task for listening
and message structure, a **behavioral assessment** across occasions for the Abilities, and a live
communication performance graded on the standard 5-criteria capstone rubric. The badge → skills-map
mapping is in [`skills-map.md`](skills-map.md).

## 🎓 Outcomes & recognition

- A working model of how communication succeeds and fails (no more "they just didn't get it").
- Two job-ready moves: **active listening** and **structuring a clear message** (written & spoken).
- A repeatable approach to **feedback and difficult conversations**.
- The durable **empathy** and **assertiveness** that make communication land — evidenced over time.
- A portfolio artifact: a recorded/observed communication performance + reflection.
- LinkedIn-compatible digital badge: **🏅 Effective Communicator** — a multiplier on almost any role.
