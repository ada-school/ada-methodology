<script type="text/markdown" data-path="specs/ada-v2-ksa-framework.md"># 🧬 ADA v2 — KSA-Driven Applied Digital Apprenticeship

**Status:** Specification (draft v2.0) · **Extends:** [ADA v1 (`README.md`)](../README.md)
· **License:** CC BY-SA 4.0

This is the **core specification** for ADA v2. It defines how the **KSA framework
(Knowledge, Skills, Abilities)** integrates with the existing ADA building blocks
(learning atoms, 4 phases, Bloom alignment, capstones) to produce **job-matched,
Gen AI-authored micro-credentials**.

Read [`ksa-taxonomy.md`](ksa-taxonomy.md) first for definitions. This document is the
"how it all fits together."

---

## 1. What v2 keeps from v1

Nothing valuable is removed. v2 is a **superset**:

- ⚛ **Learning Atoms** — still the smallest unit (`Read · Listen · Watch · Practice ·
  Evaluate · Collaborate`).
- 🔄 **4 Learning Phases** — *hear → see → do → share*.
- 🧱 **Micro-credentials** — 10–30h, 4–8 atoms, capstone, rubric, digital badge.
- 🎯 **Bloom alignment** and **framework anchoring** (SFIA / O\*NET / ESCO / ILO).

> **Backward compatibility:** any v1 micro-credential becomes a valid v2 one by adding
> KSA tags and proficiency targets. No rewrite required.

## 2. What v2 adds

1. **A competency type on everything (KSA).** Every objective and atom is tagged Knowledge,
   Skill, or Ability — and taught/assessed accordingly.
2. **A proficiency level on every competency (0–4).** Makes "ready or not" computable.
3. **A skills map.** A graph of the KSA a learner has vs. what a target job needs.
4. **A job-match score.** The percentage of a role's minimum KSA the learner has evidenced.
5. **A Gen AI authoring loop.** From job posting → target profile → skills map → designed
   atoms → rubrics, with humans validating each gate.

---

## 3. The v2 competency triangle inside ADA

```
                         🌱 ABILITIES (durable / attitudes)
                        develop across the whole journey,
                        proven in Phase 2 & 4 + reflection
                                   ▲
                                   │
                       transfer & │ consistency
                                   │
        🧠 KNOWLEDGE ───────────────────────────────► 🛠️ SKILLS
        (Phase 1: hear)        applied in           (Phase 3: do)
        Read·Listen·Watch                            Practice·labs
```

- **Knowledge** is necessary but not sufficient — it enables Skills.
- **Skills** turn Knowledge into action — proven by artifacts/performance.
- **Abilities** determine whether Knowledge + Skills are applied *consistently and well*
  across changing, real contexts. They are the differentiator employers describe as
  "attitude" and "fit."

A complete competency for a job almost always needs **all three**. v2 forces designers (and
the Gen AI) to ask: *for this role, what K, what S, and what A — at what level?*

---

## 4. KSA across the 4 ADA Phases

Each phase still runs *hear → see → do → share*, but v2 makes its **KSA emphasis**
explicit so designers balance coverage:

| Phase | Confucius | Primary KSA focus | Typical atoms | Evidence produced |
| ----- | --------- | ----------------- | ------------- | ----------------- |
| 🙉 **1 · Self-Guided Introduction** | I hear | **Knowledge** | Read, Listen, Watch + concept check | Concept mastery (quiz/Q&A) |
| 🙈 **2 · Visual Exploration** | I see | **Knowledge → Ability** (modeling, noticing) | Demos, walkthroughs, role-play observation | Annotated analysis, "what good looks like" |
| 🙊 **3 · Applied Practice** | I do | **Skill** | Labs, codelabs, simulations | Built artifact + performance rubric |
| 🐵 **4 · Collaboration & Reflection** | I share | **Ability** (+ Skill transfer) | Peer review, showcase, mentor feedback, reflection | Behavioral evidence + reflection journal |

**Design balance rule:** a micro-credential should not be all-Knowledge. If every atom is
Read/Watch + quiz, it develops only K and will fail at job matching. Each micro-credential
should move the learner on **at least one S and at least one A**, not only K.

---

## 5. The v2 micro-credential lifecycle

```
1. SOURCE the competency        ← job posting / role / framework
2. EXTRACT target KSA profile   ← K, S, A each with target level  (Gen AI + human review)
3. DIFF against learner profile ← what they already evidence
4. BUILD the skills map         ← the gap = what to earn  (graph with prerequisites)
5. DESIGN micro-credentials     ← one per cluster of KSA gaps
6. DESIGN atoms per KSA node    ← teach/assess to the type (K/S/A)
7. ASSESS with typed rubrics    ← knowledge / performance / behavioral
8. ISSUE evidence-based badges  ← update learner profile
9. RE-MATCH                     ← new job-match %  →  loop until job-ready
```

Stages 2, 5, and 6 are where **Gen AI** does the heavy drafting; stages 2, 4, and 7 have
**mandatory human validation gates** (mentor/employer). See
[`genai-authoring-workflow.md`](genai-authoring-workflow.md).

---

## 6. Designing atoms *to the KSA type*

The single most important v2 rule: **teach and assess each atom according to its type.**

### 🧠 Knowledge atoms
- **Lead with:** Read / Listen / Watch.
- **Practice:** retrieval (flashcards, "explain it back", concept maps).
- **Evaluate:** quiz, AI Q&A, accuracy-weighted mini-rubric.
- **Target evidence:** learner can correctly explain and reason about the concept.

### 🛠️ Skill atoms
- **Lead with:** Practice (lab, codelab, simulation) after a short concept primer.
- **Practice:** real reps producing a real artifact; increasing difficulty.
- **Evaluate:** performance rubric on the artifact/observed performance (Accuracy ·
  Application · Clarity); code review / mentor review.
- **Target evidence:** learner produces a working artifact / performs the procedure
  independently at the target level.

### 🌱 Ability atoms
- **Lead with:** authentic, slightly uncomfortable situations (role-play, real
  collaboration, ambiguity) + modeling in Phase 2.
- **Practice:** repeated across *different* contexts; pair with reflection.
- **Evaluate:** behavioral rubric, peer/mentor 360, reflective journal, self-assessment
  with evidence — observed **across multiple occasions**, not one.
- **Target evidence:** learner demonstrates the disposition *consistently* under varied,
  realistic conditions.

> Abilities can't be "completed" in one sitting. v2 recommends threading an Ability across
> **several atoms / weeks** and certifying it from accumulated evidence.

---

## 7. Assessment model (typed rubrics)

v2 keeps v1's rubrics and adds a **typed lens**:

| KSA type | Rubric flavor | Heaviest criteria | Evidence count |
| -------- | ------------- | ----------------- | -------------- |
| Knowledge | Concept/accuracy | Accuracy, Reasoning | 1 (point-in-time ok) |
| Skill | Performance | Application, Accuracy, Clarity | 1–2 artifacts |
| Ability | Behavioral / reflective | Consistency, Self-awareness, Impact on others | ≥3 occasions |

The **capstone** integrates all three: a realistic job task that requires applying
Knowledge, demonstrating Skills, and exhibiting Abilities (collaboration, communication,
adaptability) — scored with the 5-criteria capstone rubric from v1, now explicitly mapped
to KSA coverage.

---

## 8. From competency to credential to job — the matching link

v2's payoff is that competencies are **computable**:

- A **role** = a target KSA profile (each component + minimum level).
- A **learner** = an evidenced KSA profile (each component + achieved level + evidence).
- A **skills map** = the diff (gaps), ordered by prerequisites.
- A **job-match score** = `Σ met-minimums (weighted) / Σ required-minimums`.
- A **micro-credential** closes one or more gaps; earning its badge raises achieved levels
  and the match score.

Full data model and formula: [`skills-map-and-job-matching.md`](skills-map-and-job-matching.md).

---

## 9. Roles & the human-in-the-loop

| Role | Responsibility | Validates |
| ---- | -------------- | --------- |
| **Curriculum designer** | Owns the micro-credential design | Atom quality, KSA balance |
| **Mentor** | Coaches + assesses, esp. Abilities | Behavioral evidence, skill performance |
| **Employer / SME** | Defines the target role | Target KSA profile + minimum levels |
| **Gen AI assistant** | Drafts profiles, maps, atoms, rubrics | (nothing — always reviewed) |
| **Learner** | Produces evidence, reflects | Self-assessment (corroborated) |

**Non-negotiable:** Gen AI **proposes**; a human **validates** target profiles, gap maps,
and any badge issuance. AI-suggested mappings are flagged until confirmed.

---

## 10. Conformance checklist (a micro-credential is "v2-compliant" if…)

- [ ] Anchored to a real role/competency + framework reference (SFIA/O\*NET/ESCO/ILO).
- [ ] Every objective and atom carries a **KSA type** and **target level (0–4)**.
- [ ] Covers **≥1 Skill** and **≥1 Ability**, not Knowledge alone.
- [ ] Each atom is **taught & assessed to its type** (typed rubrics).
- [ ] Abilities are assessed across **≥3 occasions** with reflection.
- [ ] Emits **machine-readable KSA tags** ([schema](micro-credential-v2-schema.md)) so it
      can feed a skills map.
- [ ] Has a capstone integrating K + S + A.
- [ ] Passed a **human validation gate** before badge issuance.
- [ ] (If Gen AI-authored) followed [`genai-authoring-workflow.md`](genai-authoring-workflow.md)
      and logged the review.

---

## 11. Glossary (v2 additions)

- **KSA component** — a single Knowledge, Skill, or Ability item with an ID and level.
- **Target KSA profile** — the set of KSA components (+ minimum levels) a role requires.
- **Learner KSA profile** — the set a learner has evidenced (+ achieved levels).
- **Skills map** — the gap graph between target and learner, ordered by prerequisites.
- **Job-match score** — weighted % of a role's minimums the learner meets.
- **Validation gate** — a required human review step before proceeding/issuing.
</script>
<script type="text/markdown" data-path="specs/genai-authoring-workflow.md"># 🤖 Gen AI Authoring Workflow

How to use a Gen AI assistant (Claude, GPT, Gemini, etc.) to go from a **job opportunity**
to a **designed ADA v2 micro-credential** and a learner **skills map** — fast, consistently,
and with **humans validating** the critical steps.

This is a **pipeline of prompts with fixed output schemas**. Each stage's output feeds the
next; each gated stage requires human sign-off before proceeding.

Prereqs: [`ksa-taxonomy.md`](ksa-taxonomy.md) ·
[`skills-map-and-job-matching.md`](skills-map-and-job-matching.md) ·
[`micro-credential-v2-schema.md`](micro-credential-v2-schema.md).

---

## Pipeline overview

```
 Stage 0  System grounding (load the ADA v2 specs)
 Stage 1  Extract Target KSA Profile      from a job posting        ▶ 🔒 HUMAN GATE
 Stage 2  Build the Skills Map            target − learner profile  ▶ 🔒 HUMAN GATE
 Stage 3  Design micro-credential(s)      one per gap cluster
 Stage 4  Design learning atoms           teach/assess to KSA type
 Stage 5  Generate typed rubrics & capstone
 Stage 6  Localize (ES / PT-BR)           keep parallel structure
 Stage 7  QA against conformance checklist                          ▶ 🔒 HUMAN GATE (badge)
```

> 🔒 **Human gates** (Stages 1, 2, 7): a mentor/employer must validate the target profile,
> the gap map, and any badge issuance. AI output is a **draft proposal** until signed off.

---

## Stage 0 — System grounding

Give the assistant the methodology as context. Suggested system prompt:

```
You are an ADA v2 curriculum-design assistant for Ada School.
Follow the ADA Methodology v2: learning atoms (Read·Listen·Watch·Practice·Evaluate·
Collaborate), 4 phases (hear→see→do→share), Bloom alignment, and the KSA framework
(Knowledge=know-what/why, Skill=know-how, Ability=durable/attitude).
Rules:
- Type every objective/atom as K, S, or A and assign a target level 0–4.
- Anchor competencies to SFIA/O*NET/ESCO/ILO when possible.
- Ensure each micro-credential covers ≥1 Skill and ≥1 Ability, not Knowledge only.
- Teach/assess each atom to its type (knowledge→quiz; skill→performance rubric;
  ability→behavioral rubric across ≥3 occasions + reflection).
- Output valid YAML/JSON matching the provided schemas. Flag every inference as
  "NEEDS HUMAN VALIDATION" where you are uncertain or where employer confirmation is required.
- Never assert a competency mapping or proficiency as final; you propose, humans validate.
```

---

## Stage 1 — Extract the Target KSA Profile  🔒

**Input:** a job posting (paste text) or a framework role (SFIA/O\*NET/ESCO id).

**Prompt template:**

```
From the job posting below, extract a Target KSA Profile.
For each requirement: classify as knowledge|skill|ability, give a stable id (prefix
K-/S-/A-), a label, a minimum proficiency level (0–4 per the ADA scale), a weight (1–5
importance), and must_have (true/false). Add Abilities the role implies even if not
stated explicitly, and mark those "inferred: true". Cite a framework_ref where possible.
Output YAML per the Target KSA Profile schema. List open questions for the employer.

JOB POSTING:
"""
<paste>
"""
```

**Output:** a `Target KSA Profile` (see schema in
[`skills-map-and-job-matching.md` §1.2](skills-map-and-job-matching.md)).

**🔒 Gate:** mentor/employer reviews — corrects levels/weights, confirms inferred Abilities,
removes hallucinated requirements. Postings under-state durable competencies; the human
adds the real Abilities.

---

## Stage 2 — Build the Skills Map  🔒

**Input:** validated Target KSA Profile + the learner's current profile (self-assessment +
imported badges).

**Prompt template:**

```
Given the validated Target KSA Profile and the Learner KSA Profile below, produce:
1) a Skills Map table (component, type, need, have, gap, status, must_have),
2) the job-match score and job_ready boolean (threshold 85%, blockers must be met),
3) an ordered "to_earn" plan (respect prerequisites, then weight),
4) a coverage-by-type check (warn if 0 abilities).
Output the minimal JSON object from the skills-map spec, plus the table in Markdown.

TARGET PROFILE: <yaml>
LEARNER PROFILE: <yaml>
```

**Output:** Skills Map table + match JSON (see §2–§6 of the skills-map spec).

**🔒 Gate:** mentor validates the learner's claimed current levels against evidence before
the plan is trusted.

---

## Stage 3 — Design the micro-credential(s)

**Input:** the `to_earn` list. Cluster related gaps into one or more micro-credentials
(10–30h, 4–8 atoms each).

**Prompt template:**

```
Design an ADA v2 micro-credential that closes these KSA gaps: <subset of to_earn>.
Produce the YAML front matter (micro-credential-v2-schema) + Markdown body:
title, duration, target role link, prerequisites, Bloom-aligned objectives each tagged
with its KSA component id and target level, the atom list, phase planner, capstone, and
typed assessment plan. Ensure ≥1 Skill and ≥1 Ability are covered.
```

**Output:** a v2 micro-credential file (front matter + body).

---

## Stage 4 — Design the learning atoms (to type)

For each KSA component, generate an atom **using the type-specific recipe**:

| If component is… | Tell the AI to emphasize… | Evaluate with… |
| ---------------- | ------------------------- | -------------- |
| 🧠 Knowledge | Read/Listen/Watch + retrieval practice | quiz / AI Q&A (accuracy) |
| 🛠️ Skill | short primer → hands-on lab/codelab with reps | performance rubric on artifact |
| 🌱 Ability | modeling + role-play/real collaboration across contexts + reflection | behavioral rubric across ≥3 occasions + journal |

**Prompt template:**

```
Design a learning atom for KSA component <id> (type: <k/s/a>, target level <n>).
Use the ADA learning-atom structure. Apply the <type> recipe: for ability, span multiple
occasions and require reflection; for skill, produce a concrete artifact; for knowledge,
include a concept check. Provide the matching rubric. Output per learning-atom-template.
```

---

## Stage 5 — Rubrics & capstone

```
Generate: (a) a mini-rubric for each atom matched to its KSA type, and (b) a capstone that
integrates the micro-credential's K + S + A in one realistic job task, scored with the
5-criteria ADA capstone rubric, with a row showing which KSA each criterion evidences.
```

---

## Stage 6 — Localize

```
Translate the micro-credential into Spanish (templates/es) and Portuguese-BR
(templates/pt-br). Keep section structure parallel to the English source. Do not alter the
KSA ids or levels (they are language-neutral).
```

---

## Stage 7 — QA & badge issuance  🔒

Run the **conformance checklist** from
[`ada-v2-ksa-framework.md` §10](ada-v2-ksa-framework.md) automatically:

```
Audit this micro-credential against the ADA v2 conformance checklist. For each item return
pass/fail + fix. Confirm every objective has a KSA type + level, ≥1 skill and ≥1 ability
are present, abilities are assessed across ≥3 occasions, and machine-readable tags are valid.
```

**🔒 Gate:** a human signs off the QA report; **badges are issued only on verified evidence**,
never on AI judgement alone.

---

## Anti-hallucination & quality rules

- **Cite or flag:** every framework_ref and external resource is either a real link or
  marked `NEEDS HUMAN VALIDATION`.
- **No invented levels:** the AI proposes proficiency; the human confirms against evidence.
- **Schema-locked output:** reject free-form output; require the YAML/JSON schemas so the
  result is machine-consumable by the skills-map tooling.
- **Bias check on Abilities:** prompt the AI to surface durable/attitudinal competencies
  postings omit, then have the employer confirm them.
- **Keep it accessible:** prefer free tools and openly licensed resources.
- **Log the loop:** store prompts + human edits for auditability and reuse.

---

## End-to-end example

A complete run of this pipeline (posting → profile → map → micro-credentials → match) is
in [`../examples/skills-map-job-match-frontend.md`](../examples/skills-map-job-match-frontend.md).
</script>
<script type="text/markdown" data-path="specs/ksa-taxonomy.md"># 🧩 KSA Taxonomy — Knowledge, Skills, Abilities

The **KSA framework** is the competency spine of ADA v2. It gives every learning objective
a *type*, so it can be taught, practiced, and assessed in the way that actually develops it
— and so it can be matched against a job's requirements.

KSA originates in occupational and human-resources practice (e.g. O\*NET descriptors,
job-analysis standards) and pairs naturally with ADA's existing Bloom alignment.

---

## 1. The three types

### 🧠 Knowledge — the *know-what* and *know-why*

Theoretical, factual, and conceptual understanding a person can recall and reason with.
It is **cognitive** and largely acquired through study and exposure.

- *Examples:* HTTP status code semantics; principles of color theory; what psychological
  safety is; the stages of a sales funnel; how diffusion models generate images.
- *Develops through:* Read · Listen · Watch atoms; case studies; explanation.
- *Assessed with:* quizzes, concept checks, oral/AI Q&A, "explain it back" prompts.
- *Bloom home:* Remember, Understand (extends into Analyze/Evaluate).

### 🛠️ Skills — the *know-how*

Procedural proficiencies developed through **deliberate, repeated practice**. Observable
and improvable; can be **technical/hard** (build a REST API, run a regression) or
**human/applied** (facilitate a retro, give structured feedback).

- *Examples:* writing a Flask endpoint; building a dashboard; running a 1:1; structuring a
  feedback conversation; pitching to a stakeholder.
- *Develops through:* Practice atoms, labs, codelabs, simulations, role-play, reps.
- *Assessed with:* performance tasks, rubrics on a produced artifact or observed
  performance, code review, capstone.
- *Bloom home:* Apply, Analyze, Create.

### 🌱 Abilities — the *can-do* / *will-do* (durable capacities & attitudes)

Enduring personal capacities and dispositions that shape *how consistently and how well*
someone applies knowledge and skills across changing contexts. This is where **attitudes
and human/durable qualities** live: adaptability, resilience, curiosity, collaboration,
integrity, growth mindset, attention to detail.

- *Examples:* adapts approach when requirements change; persists through ambiguity;
  collaborates across disciplines; takes ownership; communicates with empathy.
- *Develops through:* repeated authentic practice + reflection + feedback over time
  (Collaborate atoms, Phase 4, mentorship, real/realistic stakes).
- *Assessed with:* behavioral rubrics, reflective journals, peer/mentor 360 feedback,
  observation across multiple situations, self-assessment + evidence.
- *Bloom home:* spans all levels; best paired with the **affective domain**
  (Receive → Respond → Value → Organize → Internalize).

> **Skill vs. Ability — the practical test:** if it improves mainly through *reps and
> procedure*, treat it as a **Skill**. If it is a *disposition expressed consistently
> across situations* (and shows up as "attitude" in a job posting), treat it as an
> **Ability**. Many human competencies have both a Skill layer (the technique) and an
> Ability layer (the disposition) — model both when it matters (see the feedback example).

---

## 2. Side-by-side

| Dimension | 🧠 Knowledge | 🛠️ Skill | 🌱 Ability |
| --------- | ----------- | -------- | --------- |
| Question | Know-what / know-why | Know-how | Can-do / will-do |
| Nature | Cognitive | Procedural | Dispositional / durable |
| Acquired by | Study, exposure | Deliberate practice | Practice + reflection over time |
| Time to develop | Short–medium | Medium | Long, continuous |
| Primary atom formats | Read, Listen, Watch | Practice | Collaborate + Practice + Reflect |
| Evidence | Correct recall/explanation | Artifact / performance | Consistent behavior across contexts |
| Assessment | Quiz, concept check | Performance rubric | Behavioral rubric, 360, reflection |
| Bloom | Remember, Understand | Apply, Analyze, Create | All + Affective domain |
| Volatility | Higher (facts change) | Medium | Low (transfers across roles) |

---

## 3. How to classify a competency (decision flow)

```
Is it information you must recall or reason with?              → KNOWLEDGE (K)
   ↓ no
Is it a procedure that gets better with reps / produces an artifact? → SKILL (S)
   ↓ no
Is it a disposition/attitude shown consistently across situations?   → ABILITY (A)
```

Tie-breakers:
- A job posting line that reads as a **tool, language, method, or task** → usually **S**
  (with a **K** prerequisite).
- A line that reads as an **adjective about the person** ("adaptable", "collaborative",
  "detail-oriented", "self-driven") → **A**.
- A line that reads as a **concept/standard to understand** → **K**.

---

## 4. Proficiency scale (shared, 0–4)

Every KSA component carries a target **proficiency level**. Use one scale across all three
types so gaps are computable (see `skills-map-and-job-matching.md`). Aligned loosely with
SFIA levels and Dreyfus stages.

| Level | Label | Knowledge looks like | Skill looks like | Ability looks like |
| ----- | ----- | -------------------- | ---------------- | ------------------ |
| **0** | None | No exposure | Cannot perform | Not yet observed |
| **1** | Aware | Can recognize/recall basics | Performs with full guidance | Shows it occasionally, prompted |
| **2** | Working | Explains and relates concepts | Performs routine cases independently | Shows it reliably in familiar contexts |
| **3** | Proficient | Reasons about edge cases/trade-offs | Handles novel/complex cases, mentors others | Shows it under pressure / new contexts |
| **4** | Expert | Synthesizes, teaches, sets standards | Sets best practice, optimizes | Role-models and develops it in others |

**Job-readiness rule of thumb:** most entry-level roles require **L2 (Working)** on core
KSA and **L1 (Aware)** on adjacent KSA. v2 makes this explicit per role.

---

## 5. Mapping KSA → ADA building blocks

| ADA element | Knowledge | Skill | Ability |
| ----------- | --------- | ----- | ------- |
| **Atom formats** | Read, Listen, Watch | Practice | Collaborate (+ Practice, + Reflect) |
| **Phase emphasis** | Phase 1 (Self-Guided) | Phase 3 (Applied Practice) | Phases 2 & 4 (Visual + Collaboration/Reflection) |
| **Deliverable** | Concept artifact / explanation | Built artifact / performance | Reflection + behavioral evidence |
| **Rubric type** | Accuracy-weighted | Application-weighted | Behavioral / 360 / reflection-weighted |

Every **learning atom in v2 declares its KSA type(s)** and the target level it moves the
learner toward. A single atom may touch more than one type (e.g. a feedback role-play
builds the *skill* of structuring feedback **and** the *ability* of empathetic
communication) — tag the **primary** type and list secondaries.

---

## 6. KSA tag format (used in atoms & micro-credentials)

```yaml
ksa:
  - id: K-http-semantics
    type: knowledge
    label: "HTTP request/response semantics"
    target_level: 2          # 0–4 scale above
    framework_ref: "SFIA:PROG / O*NET:15-1254.00"
  - id: S-build-rest-endpoint
    type: skill
    label: "Build & test a REST endpoint"
    target_level: 2
    primary: true
  - id: A-adaptability
    type: ability
    label: "Adaptability under changing requirements"
    target_level: 2
    affective_stage: respond   # receive|respond|value|organize|internalize
```

See [`micro-credential-v2-schema.md`](micro-credential-v2-schema.md) for the full schema
and [`skills-map-and-job-matching.md`](skills-map-and-job-matching.md) for how these IDs
feed the matchable skills graph.
</script>
<script type="text/markdown" data-path="specs/learning-atom-topology.md"># ⚛ Learning Atom Topology

The **complete map of what a Learning Atom can be.** This document expands the ADA Learning
Atom from a handful of formats into a **rich, structured topology of modalities and
sub-types**, with architecture diagrams, selection guidance, and KSA/Phase mappings.

It applies to **both v1 and v2**. In v2, every atom additionally carries a **KSA type**
(🧠 Knowledge · 🛠️ Skill · 🌱 Ability) and a **proficiency target** — see
[`ksa-taxonomy.md`](ksa-taxonomy.md).

> **Diagrams below use [Mermaid](https://mermaid.js.org/).** They render natively on GitHub
> and inside this repo's interactive browser ([`../index.html`](../index.html)).

---

## 1. Where atoms sit in the ADA architecture

```mermaid
flowchart TD
  M["🎓 Micro-credential<br/>(10–30h · job-ready unit)"]
  M --> P["🔄 4 Learning Phases<br/>hear → see → do → share"]
  M --> A["⚛ Learning Atoms<br/>(4–8 per micro-credential)"]
  A --> O["🎯 One Objective<br/>(Bloom verb)"]
  A --> K["🧬 KSA type + level<br/>(v2)"]
  A --> MOD["🧱 Modalities<br/>(the topology)"]
  A --> D["📦 Deliverable + Rubric"]
  MOD --> ACQ["ACQUIRE<br/>📖 Read · 🎧 Listen · 🎬 Watch · 🖼️ See"]
  MOD --> APP["APPLY<br/>🧪 Practice"]
  MOD --> ASS["ASSESS<br/>✅ Evaluate"]
  MOD --> AMP["AMPLIFY<br/>🤝 Collaborate"]
  ACQ --> CAP["🚀 Capstone → 🏅 Badge → 🗺️ Skills Map"]
  APP --> CAP
  ASS --> CAP
  AMP --> CAP
```

A **Learning Atom** is the smallest instructional unit: **one objective**, taught through a
chosen mix of **modalities**, producing a **deliverable** assessed by a **rubric**.

---

## 2. Anatomy of a Learning Atom (v2)

<p align="center">
  <img alt="Inside the Learning Atom: Read & Listen (Introduction) → Watch & Practice (Application) → Evaluate (Mastery)" src="../img/ada-learning-atom-structure.png" width="760">
</p>

A Learning Atom is the **smallest self-contained unit of knowledge** — like a single Lego
brick that provides one specific skill. It layers **Read & Listen** (introduction:
contextualize and feel the *why*) → **Watch & Practice** (application: see the *how*, then
do it) → **Evaluate** (mastery: verify understanding and performance).

```mermaid
classDiagram
  class LearningAtom{
    +String id
    +String title
    +String objective
    +int phase
    +List~Modality~ modalities
    +String deliverable
  }
  class Modality{
    +String dimension
    +String subtype
  }
  class KSAComponent{
    +String type
    +int target_level
  }
  class Rubric{
    +String flavor
  }
  class MicroCredential{
    +List~LearningAtom~ atoms
    +Capstone capstone
    +Badge badge
  }
  MicroCredential "1" o-- "4..8" LearningAtom
  LearningAtom "1" *-- "1..*" Modality
  LearningAtom "1" --> "1..*" KSAComponent
  LearningAtom "1" --> "1" Rubric
```

- `dimension` ∈ Read · Listen · Watch · See · Practice · Evaluate · Collaborate
- `subtype` = a leaf from the topology (e.g. *Codelab*, *Podcast*, *Case Study*)
- `type` ∈ knowledge · skill · ability · `target_level` 0–4 · `flavor` ∈ knowledge/skill/ability/capstone

---

## 3. The seven modality dimensions

The ADA atom organizes learning into **7 modalities**, grouped by purpose:

| Group | Modality | Verb | Primary purpose | KSA affinity |
| ----- | -------- | ---- | --------------- | ------------ |
| **Acquire** | 📖 **Read** (Readings) | I read | Acquire concepts via text | 🧠 K |
| **Acquire** | 🎧 **Listen** (Audio) | I hear | Acquire/feel concepts via sound | 🧠 K · 🌱 A |
| **Acquire** | 🎬 **Watch** (Video) | I see | Observe ideas & processes in motion | 🧠 K |
| **Acquire** | 🖼️ **See** (Visual) | I picture | Encode structure & relationships visually | 🧠 K |
| **Apply** | 🧪 **Practice** | I do | Build skill through doing | 🛠️ S |
| **Assess** | ✅ **Evaluate** | I prove | Measure & evidence learning | all |
| **Amplify** | 🤝 **Collaborate** | I share | Learn socially; show dispositions | 🌱 A · 🛠️ S |

> 🖼️ **Visual** is promoted to a first-class modality in this topology (previously folded
> into *Watch*) — diagrams, mental models, and frameworks deserve their own design space.
> 🤖 **AI-assisted** is **cross-cutting**, not a separate dimension: Gen AI can power a
> *Practice* atom (AI Prompt Question), an *Evaluate* atom (AI Q&A check), or a tutor in
> any modality.

---

## 4. The complete topology (mind map)

```mermaid
mindmap
  root((⚛ Learning Atom))
    📖 Readings
      Article
      Blog Post

## 6. Modality ↔ KSA mapping

Different modalities develop different KSA types. Choose modalities that match the atom's
KSA target.

```mermaid
flowchart LR
  subgraph KSA
    K["🧠 Knowledge"]
    S["🛠️ Skill"]
    A["🌱 Ability"]
  end
  RD["📖 Read"] --> K
  LS["🎧 Listen"] --> K
  WT["🎬 Watch"] --> K
  SE["🖼️ See"] --> K
  PR["🧪 Practice"] --> S
  PR --> A
  EV["✅ Evaluate"] --> K
  EV --> S
  EV --> A
  CO["🤝 Collaborate"] --> A
  CO --> S
```

| KSA target | Lead modalities | Evidence / Evaluation |
| ---------- | --------------- | --------------------- |
| 🧠 Knowledge | Read · Listen · Watch · See + retrieval Practice | Pop Quiz, Quiz, AI Q&A |
| 🛠️ Skill | Watch (demo) → Practice (lab/codelab) | Performance Task, Mini-Rubric, Peer Review |
| 🌱 Ability | See (model it) + Practice (role-play) + Collaborate | Behavioral Assessment (≥3), Reflection, 360 |

## 8. How to choose the right format (decision flow)

```mermaid
flowchart TD
  Q0{"What is the<br/>atom's KSA type?"}
  Q0 -->|🧠 Knowledge| Q1{"Learner preference<br/>/ context?"}
  Q0 -->|🛠️ Skill| SK["🧪 Practice: Codelab · Lab · Kata · Test Challenge<br/>preceded by a 🎬 Tutorial/Demo"]
  Q0 -->|🌱 Ability| AB["🖼️ Model it (Mental Model/Case)<br/>+ 🧪 Role-Play/Simulation<br/>+ 🤝 Collaborate, across ≥3 occasions"]
  Q1 -->|reads best| RT["📖 Article · Technical Article · Case Study"]
  Q1 -->|listens best| AU["🎧 Podcast · Narration"]
  Q1 -->|watches best| VI["🎬 Explainer · Short · Documentary"]
  Q1 -->|thinks visually| VS["🖼️ Diagram · Mental Model · Infographic"]
  SK --> EV{"How to evaluate?"}
  AB --> EV
  RT --> EV
  AU --> EV
  VI --> EV
  VS --> EV
  EV -->|knowledge| EK["✅ Pop Quiz / Quiz / AI Q&A"]
  EV -->|skill| ES["✅ Performance Task + Mini-Rubric"]
  EV -->|ability| EA["✅ Behavioral Assessment + Reflection + 360"]
```

**Rules of thumb**
- Pair **at least one Acquire** modality with **one Apply** modality per skill atom.
- Offer **modality choice** for Knowledge atoms (read *or* listen *or* watch) for accessibility.
- Never assess an **Ability** with a quiz — use behavioral evidence across occasions.
- Use **Visual** to compress complex structure (architecture, process, model) before practice.

## 9. The atom learning flow

```mermaid
flowchart LR
  A1["📖🎧🎬🖼️<br/>ACQUIRE"] --> A2["🧪<br/>APPLY"] --> A3["✅<br/>ASSESS"] --> A4["🤝<br/>AMPLIFY"]
  A4 -.feedback.-> A1
  A3 -.remediate.-> A2
```

Atoms are **adaptive**: weak assessment loops back to more practice; collaboration feeds
reflection back into acquisition.

## 11. Generating atoms by type with Gen AI

The [Gen AI authoring workflow](genai-authoring-workflow.md) selects modalities from this
topology based on the atom's KSA type:

```mermaid
flowchart TD
  IN["KSA component<br/>(type + target level)"] --> R{"type?"}
  R -->|🧠 K| GK["Generate: Read/Listen/Watch/See subtype<br/>+ retrieval Practice + Formative quiz"]
  R -->|🛠️ S| GS["Generate: Tutorial/Screencast<br/>+ Codelab/Lab + Performance rubric"]
  R -->|🌱 A| GA["Generate: Mental Model + Role-Play/Sim<br/>+ Collaboration + Behavioral rubric (≥3)"]
  GK --> OUT["Atom YAML (modalities[] + rubric)"]
  GS --> OUT
  GA --> OUT
  OUT --> HV["🔒 Human validation"]
```

**Prompt add-on (use with Stage 4 of the workflow):**

```
When designing the atom, pick concrete modality sub-types from the Learning Atom Topology
that match the KSA type. Output a modalities[] list, each {dimension, subtype}. For
knowledge offer 2+ Acquire options (read/listen/watch/see) for accessibility; for skill
include a Practice subtype + a Tutorial/Demo; for ability include a Visual model, a
Practice role-play/simulation, and a Collaboration subtype assessed across ≥3 occasions.
```

## 12. Authoring checklist (topology-aware)

- [ ] Atom has **one objective** (Bloom verb) and a **KSA type + level** (v2).
- [ ] Modalities are chosen **from this topology** and **match the KSA type**.
- [ ] Knowledge atoms offer **≥2 Acquire options** for accessibility.
- [ ] Skill atoms pair an **Acquire/Demo** with a **Practice** sub-type.
- [ ] Ability atoms use **See + Practice + Collaborate** and a **behavioral** evaluation.
- [ ] Evaluation sub-type matches purpose (**diagnostic / formative / summative**).
- [ ] At least one **collaboration** sub-type appears in the micro-credential (P4).
- [ ] Sub-types are realistic and use **free/accessible** tools where possible.

    deliverable: "PR implementing the change + 1 peer review + reflection note"
    rubric: ability-behavioral

capstone:
  title: "Ship a small Tasks API"
  summary: "Design, build, test, and adapt a multi-resource REST API; submit via PR and review a peer."
  integrates_ksa: [K-http-semantics, S-build-rest-endpoint, S-write-unit-tests, A-adaptability, A-collaboration]
  rubric: capstone-5

badge:
  name: "REST API Fundamentals"
  evidence_required: ["capstone", "atom-3", "atom-4"]
  issued_on: verified-evidence            # never AI-only
---
```

---

## 3. Rubric type reference

| `rubric` value | Use for | Heaviest criteria |
| -------------- | ------- | ----------------- |
| `knowledge-mini` | Knowledge atoms | Accuracy, Reasoning |
| `skill-performance` | Skill atoms | Application, Accuracy, Clarity |
| `ability-behavioral` | Ability atoms | Consistency, Self-awareness, Impact on others (≥3 occasions) |
| `capstone-5` | Capstone | Relevance · Application · Problem-Solving · Communication · Collaboration |

The concrete rubric tables are the ones already defined in v1's
[`micro-credential-ada-template.md`](../templates/micro-credential-ada-template.md); v2 just
references them by name and adds the **ability-behavioral** rubric below.

### Ability behavioral rubric (new in v2)

| Criterion | Excellent (3) | Adequate (2) | Needs Improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Consistency across contexts** | Demonstrated in ≥3 varied/real situations | Shown in 2 situations | Shown once or only when prompted |
| **Self-awareness (reflection)** | Insightful reflection naming triggers, choices, growth | Surface reflection | Little/no reflection |
| **Impact on others / outcome** | Visibly improved teamwork/outcome; peers corroborate | Some positive effect | Negligible or negative effect |

---

## 4. Markdown body

After the front matter, include the standard v1 micro-credential sections (title, duration,
target competency, prerequisites, **Bloom objectives — each tagged with its `ksa` id**,
learning atoms, phase planner, capstone, assessment & rubrics, resources, outcomes,
credits). Copy from
[`../templates/micro-credential-ada-template.md`](../templates/micro-credential-ada-template.md)
and add a KSA column to the atom and objective tables, e.g.:

```markdown
## 📘 Learning Objectives (Bloom + KSA)

| Objective | Bloom | KSA | Component | Target |
| --------- | ----- | --- | --------- | ------ |
| Explain HTTP methods & status codes | Understand | 🧠 K | K-http-semantics | L2 |
| Build & test a CRUD endpoint | Create | 🛠️ S | S-build-rest-endpoint | L2 |
| Adapt the API when requirements change | Apply | 🌱 A | A-adaptability | L2 |
```

---

## 5. Validation rules (must pass to publish)

- [ ] `schema: ada-microcredential/v2` present.
- [ ] Every `ksa[]` entry has `id`, `type` ∈ {knowledge,skill,ability}, `target_level` 0–4.
- [ ] ≥1 `skill` **and** ≥1 `ability` present (not Knowledge-only).
- [ ] Every Ability has `assessed_occasions ≥ 3`.
- [ ] Every `atom.ksa_refs` id exists in `ksa[]`.
- [ ] Every `atom.modalities[].dimension` ∈ {read, listen, watch, see, practice, evaluate,
      collaborate} and each `subtype` is a valid leaf from
      [`learning-atom-topology.md`](learning-atom-topology.md), matched to the atom's KSA type.
- [ ] Each atom's `rubric` matches its KSA type (knowledge→mini, skill→performance,
      ability→behavioral).
- [ ] `capstone.integrates_ksa` covers all primary components.
- [ ] `badge.issued_on: verified-evidence`.
- [ ] KSA ids are language-neutral and identical across en/es/pt-br versions.

> Copy this file (front matter + body) to start a new v2 micro-credential. The worked
> examples in [`../examples/`](../examples/) all conform to this schema.
</script>
<script type="text/markdown" data-path="specs/role-to-credential-mapping.md"># 🧭 Role-to-Credential Mapping — From Job Profiles to Measurable Learning

This spec defines the **methodology and practices** for turning a **real job/role profile**
(e.g. *Data Scientist*) into a **connected pathway of micro-credentials** and **measurable
learning units**, so a learner can close a **skills gap** and **match the bar set by high
performers** in that role.

It is the **bridge between the labor market and the ADA building blocks**. Where
[`ksa-taxonomy.md`](ksa-taxonomy.md) defines *what kinds* of competencies exist and
[`skills-map-and-job-matching.md`](skills-map-and-job-matching.md) defines *how gaps are
scored*, this spec defines **how you discover, in the first place, the competencies a role
truly requires** — by triangulating frameworks, live demand, and **observation of how
experts actually do the work** — and how you **deconstruct** that into credentials.

> **The dynamic learning system, in one line:** pick a role with real placement demand →
> deconstruct it into duties → tasks → KSA at a high-performer bar → cluster into
> micro-credentials → sequence into a pathway → measure the gap → learn and re-measure
> until *job-ready*.

---

## 1. Core idea: a role is a learnable structure

A job is not a monolith. Decomposed, it is a **measurable tree**:

```
ROLE  ─ is performed through ─►  DUTIES (areas of responsibility)
DUTY  ─ is carried out as ────►  TASKS (observable work outputs)
TASK  ─ requires ────────────►  KSA components (Knowledge · Skills · Abilities)
KSA   ─ is developed by ──────►  LEARNING ATOMS (Read·Listen·Watch·See·Practice·Evaluate·Collaborate)
ATOMS ─ cluster into ────────►  MICRO-CREDENTIALS (10–30h, job-ready units)
MC    ─ sequence into ───────►  a PATHWAY (the route to the role)
PATHWAY ─ measured against you ►  SKILLS MAP + JOB-MATCH %  (the gap)
```

```mermaid
flowchart TD
  ROLE["💼 Role Profile<br/>(real placement demand)"] --> DUTY["🗂️ Duties<br/>areas of responsibility"]
  DUTY --> TASK["🔧 Tasks<br/>observable work outputs"]
  TASK --> KSA["🧬 KSA components<br/>at a high-performer bar (0–4)"]
  KSA --> ATOM["⚛ Learning Atoms<br/>measurable units + evidence"]
  ATOM --> MC["🎓 Micro-credentials<br/>4–8 atoms · 10–30h"]
  MC --> PATH["🛤️ Pathway<br/>sequenced, prerequisite-aware"]
  PATH --> MAP["🗺️ Skills Map + Match %<br/>your measurable gap"]
  MAP -. re-measure after evidence .-> KSA
```

Every arrow is a design decision you can make **explicit, measurable, and validated by a
human expert** — which is what makes the learning system *dynamic* (re-run it as demand,
tools, or the learner change).

---

## 2. Triangulate three sources of truth

No single source captures a real role. Postings under-state durable competencies; frameworks
lag the market; a single expert is idiosyncratic. **Triangulate, then let AI synthesize and
a human validate.**

```mermaid
flowchart LR
  F["📚 A · Frameworks<br/>O*NET · ESCO · SFIA · ILO ISCO"] --> AI["🤖 AI synthesis<br/>de-dupe · classify · level"]
  M["📈 B · Live market<br/>job postings · demand signals"] --> AI
  O["👀 C · Real work observation<br/>high performers (DACUM · BEI · shadowing)"] --> AI
  AI --> H["🧑‍🏫 Human validation<br/>mentor / employer / expert"]
  H --> RP["✅ Validated Role Profile<br/>duties · tasks · KSA · levels"]
```

| Source | Gives you | Strength | Watch-out |
| ------ | --------- | -------- | --------- |
| **A. Frameworks** (O\*NET, ESCO, SFIA, ILO ISCO-08) | Canonical duties, tasks, and a stable competency vocabulary | Authoritative, comparable, citable | Generic; lags new tools/roles |
| **B. Live market** (job postings, demand data) | What employers *ask for now*; placement demand | Current, role-specific | Over-indexes on tools/keywords; under-states Abilities |
| **C. Real work observation** (high performers) | What experts *actually do*, and the **differentiators** between average and top performers | Reveals tacit skills + attitudes | Effort; small-sample bias; needs consent |

> **Why observe high performers?** Job-readiness isn't "can do the task at all" — it's "can
> do it like someone who is *good* at the job." Observation surfaces the **competency
> differentiators** (often Abilities/attitudes: judgment, rigor, communication, ownership)
> that postings rarely name but that decide real performance.

---

## 3. The deconstruction pipeline (with human gates)

A repeatable, AI-assisted process. Stages 0, 2, and 7 are **human gates** — AI proposes, a
mentor/employer validates.

```mermaid
flowchart TD
  S0["0 · Choose & justify target role<br/>(demand evidence)"]:::gate --> S1
  S1["1 · Gather raw signals<br/>frameworks + postings + observation notes"] --> S2
  S2["2 · Duty → Task analysis<br/>decompose the work"]:::gate --> S3
  S3["3 · Extract KSA per task<br/>know / do / embody"] --> S4
  S4["4 · Set the high-performer bar<br/>proficiency 0–4 + performance criteria"] --> S5
  S5["5 · Cluster KSA → micro-credentials"] --> S6
  S6["6 · Sequence into a pathway<br/>prerequisites + 4 phases"] --> S7
  S7["7 · Validate & publish<br/>mentor/employer sign-off"]:::gate --> S8
  S8["8 · Skills-gap analysis & match<br/>measure learner vs. bar, re-measure"]
  classDef gate fill:#E0A53C,stroke:#1E2A6E,color:#0A1124;
```

### Stage 0 — Choose & justify the target role 🔒
- Name the role and anchor it to a framework id (e.g. **O\*NET 15-2051.00 Data Scientists**,
  **ESCO** "data scientist", **ILO ISCO-08 2511**).
- Capture a **demand signal** (openings, growth, local placement data) so the pathway targets
  a role that actually hires. Record the source.
- **Gate:** program owner confirms the role is worth building for.

### Stage 1 — Gather raw signals
- Pull the framework duty/task lists. Collect **5–15 real job postings**. Schedule
  **observation** of 2–4 high performers (see §4). Store everything as evidence.

### Stage 2 — Duty → Task analysis 🔒
- Decompose the role into **4–8 duties**, each into **observable tasks** (a task produces a
  work output you could point at). Use AI to draft from the signals; **validate with an
  expert panel (DACUM)**.

### Stage 3 — Extract KSA per task
- For each task ask: what must one **Know** (K), **be able to do** (S), and **consistently
  embody** (A) to perform it *well*? Tag each with a stable id (`K-`/`S-`/`A-`) and a
  `framework_ref`. Mark inferences `NEEDS HUMAN VALIDATION`.

### Stage 4 — Set the high-performer bar
- For each KSA, set a **target proficiency 0–4** (see [`ksa-taxonomy.md` §4](ksa-taxonomy.md))
  defined as *"what a high performer does."* Write **observable performance criteria** drawn
  from the observation notes — these become the **measurable** anchor for assessment.

### Stage 5 — Cluster KSA into micro-credentials
- Group related KSA (shared task, shared prerequisites) into **micro-credentials** (10–30h,
  4–8 atoms, ≥1 Skill and ≥1 Ability each). Each micro-credential = a coherent, badge-worthy
  slice of the role.

### Stage 6 — Sequence into a pathway
- Order micro-credentials by **prerequisite** and increasing proficiency, mapped across the
  **4 ADA phases** (hear → see → do → share). Output a pathway graph.

### Stage 7 — Validate & publish 🔒
- Mentor/employer reviews the duties, KSA, levels, and pathway. Fix gaps (especially missing
  Abilities). Only then publish.

### Stage 8 — Skills-gap analysis & match
- Compare a learner's evidenced profile to the role's bar → **skills map + match %**
  (mechanics in [`skills-map-and-job-matching.md`](skills-map-and-job-matching.md)). Learn,
  produce evidence, re-measure. This loop is what makes it *dynamic*.

---

## 4. Practices for observing high performers

The differentiating step. Use one or more of these established job-analysis practices, scaled
to your time budget.

### 4.1 DACUM (Developing A Curriculum) panel
A facilitated half-day workshop with **5–8 expert workers** who chart the role's **duties and
tasks** on the spot. Fast, high-validity source for Stage 2. Capture the chart verbatim.

### 4.2 Work shadowing / job shadowing
Observe an expert doing real work. Use a structured log:

- [ ] **Trigger** — what starts this task? (ticket, data drop, meeting)
- [ ] **Steps** — the actual sequence, tools, and decisions taken
- [ ] **Inputs/Outputs** — what they consume and produce (artifacts)
- [ ] **Decision points** — where judgment is applied; what options they weighed
- [ ] **Quality bar** — how they know the output is "good"
- [ ] **Differentiators** — what they do that a novice wouldn't

### 4.3 Behavioral Event / Critical Incident Interview (BEI / CIT)
Ask the expert to narrate **specific recent incidents** ("tell me about the last time a model
underperformed in production"): *situation → task → action → result → what made the
difference*. CIT/BEI is the classic technique for surfacing the **Abilities** (judgment,
rigor, communication) that separate top performers.

### 4.4 Artifact & telemetry analysis
Collect what top performers **produce** (notebooks, dashboards, PRs, reports, docs) and, where
available, work telemetry. Reverse-engineer the implied KSA and quality criteria.

### 4.5 Ethics & rigor
- **Consent & privacy:** observe with permission; anonymize incidents; never capture personal/
  confidential data.
- **Avoid single-expert overfit:** triangulate ≥2 performers + framework + postings.
- **Separate *what* from *who*:** describe behaviors, not personalities.

---

## 5. Making learning units *measurable*

A learning unit is "measurable" when its success is defined by **observable performance at a
stated level**, drawn from real work. Convert each KSA into a measurable unit:

| From observation… | …to a measurable learning unit |
| ----------------- | ------------------------------ |
| What a high performer **does** | A KSA component with a **target level (0–4)** |
| **How** you know their output is good | **Performance criteria** (the rubric anchors) |
| The **artifact** they produce | The atom's **deliverable / evidence type** |
| A real recurring **task** | The micro-credential's **capstone** (mirror a real duty) |
| The **differentiators** | The **Ability** criteria + reflection prompts |

**The measurability rules:**
1. **Every KSA carries a level and observable criteria** — no "understand X"; instead
   "explains X and predicts the failure mode (L2)."
2. **Evidence matches type** — Knowledge → quiz/explanation; Skill → artifact/performance
   rubric; Ability → behavioral rubric across ≥3 occasions + reflection.
3. **The capstone is a real duty** — the final assessment reproduces an actual work task at
   the high-performer bar, so "passing" means "can do the job."
4. **The gap is a number** — distance between the learner's evidenced level and the bar feeds
   the match score; learning is "done" when the gap closes, not when time is served.

> Skills gap (per component) = `max(0, target_level − evidenced_level)`. The pathway exists to
> drive every must-have gap to zero. See the scoring model in
> [`skills-map-and-job-matching.md`](skills-map-and-job-matching.md).

---

## 6. AI prompts for role deconstruction

Reusable prompts that plug into the [Gen AI Authoring Workflow](genai-authoring-workflow.md).
All assume the Stage-0 system grounding from that spec and obey: **triangulate, cite or flag,
propose-don't-assert.**

### 6.1 Role demand & framing (Stage 0)
```
Target role: "<role title>".
1) Map it to the closest O*NET, ESCO, SFIA, and ILO ISCO-08 codes (cite ids).
2) Summarize its core purpose in one sentence.
3) List signals of labor-market demand you can find or that I should verify
   (openings, growth, typical employers), marking anything unverified
   "NEEDS HUMAN VALIDATION".
Output YAML: { role, framework_refs[], purpose, demand_signals[] }.
```

### 6.2 Duty → Task decomposition (Stage 2)
```
Using (A) the framework duty/task lists, (B) these job postings, and (C) these
observation/DACUM notes, produce the role's work structure.
- 4–8 DUTIES (areas of responsibility).
- Under each, the observable TASKS (each produces a nameable work output).
- For each task note its trigger, output artifact, and the source(s) it came from
  (framework | posting | observation).
Reconcile overlaps; flag tasks seen in observation but absent from frameworks as
"emergent". Output YAML per the Role Profile schema (§7).

FRAMEWORKS: """<paste>"""   POSTINGS: """<paste>"""   OBSERVATIONS: """<paste>"""
```

### 6.3 KSA extraction at the high-performer bar (Stages 3–4)
```
For each task below, extract the KSA needed to perform it LIKE A HIGH PERFORMER.
- Knowledge (K-), Skill (S-), Ability (A-) with stable ids, labels, framework_ref.
- target_level 0–4 (ADA scale) = the level a strong performer shows.
- performance_criteria: 2–4 OBSERVABLE statements (from the observation notes) that
  describe success at that level.
- weight 1–5 and must_have true/false.
Add Abilities implied by the observed "differentiators" even if postings omit them, marked
inferred:true. Output YAML: tasks[] -> ksa[].

TASKS: """<paste from 6.2>"""   OBSERVATION DIFFERENTIATORS: """<paste>"""
```

### 6.4 Cluster into micro-credentials (Stage 5)
```
Cluster these KSA components into ADA micro-credentials (10–30h, 4–8 atoms, each covering
≥1 Skill and ≥1 Ability). For each: title, the KSA ids it closes, target role link, a
capstone that mirrors one real task, and Bloom-aligned objectives tagged with KSA id+level.
Output YAML per micro-credential-v2-schema. Keep clusters prerequisite-coherent.
```

### 6.5 Sequence the pathway (Stage 6)
```
Order these micro-credentials into a learning PATHWAY toward "<role>".
Respect prerequisites; rise in proficiency; map each to the ADA phase it emphasizes
(hear→see→do→share). Output YAML: pathway{ role, steps[]{ mc_id, requires[], phase } } and a
Mermaid flowchart LR of the sequence.
```

### 6.6 Gap calibration (Stage 8)
```
Given this role's KSA bar and a learner's evidenced profile, produce the skills map, the
match %, blockers, and the ordered to_earn plan (per skills-map-and-job-matching spec).
Express each gap as max(0, target_level − evidenced_level). Output the minimal JSON + table.
```

---

## 7. Schemas

### 7.1 Role Profile (work structure)
```yaml
role: "Data Scientist"
framework_refs: ["O*NET:15-2051.00", "ESCO:data scientist", "ILO ISCO-08:2511", "SFIA:DATS"]
purpose: "Turn data into validated, decision-ready insight and ML systems."
demand_signals:
  - { signal: "openings (local market)", value: "high", source: "<link>", verified: false }
validated_by: "employer:AcmeData / mentor:@sancarbar"     # human gate
duties:
  - id: D-data-prep
    label: "Acquire & prepare data"
    tasks:
      - id: T-clean-dataset
        label: "Clean & validate a raw dataset for analysis"
        trigger: "new raw data drop"
        output_artifact: "reproducible cleaning notebook + data quality report"
        sources: [framework, posting, observation]
        ksa:
          - { ref: S-data-wrangling, type: skill, target_level: 3, weight: 5, must_have: true,
              performance_criteria: ["handles missing/outliers with justified strategy",
                                     "pipeline is reproducible and documented"] }
          - { ref: A-rigor, type: ability, target_level: 3, weight: 4, must_have: true, inferred: true,
              performance_criteria: ["verifies assumptions before trusting results"] }
```

### 7.2 Pathway (sequence of micro-credentials)
```yaml
pathway:
  role: "Data Scientist"
  readiness_threshold: 85
  steps:
    - { mc_id: mc-data-wrangling,        requires: [],                       phase: 1 }
    - { mc_id: mc-eda-visualization,     requires: [mc-data-wrangling],      phase: 2 }
    - { mc_id: mc-statistical-inference, requires: [mc-eda-visualization],   phase: 3 }
    - { mc_id: mc-ml-foundations,        requires: [mc-statistical-inference],phase: 3 }
    - { mc_id: mc-ml-in-production,      requires: [mc-ml-foundations],      phase: 3 }
    - { mc_id: mc-insight-communication, requires: [mc-eda-visualization],   phase: 4 }
```

These reuse the KSA ids and feed directly into the
[skills-map](skills-map-and-job-matching.md) and
[micro-credential v2 schema](micro-credential-v2-schema.md).

---

## 8. Worked example — *Data Processing → Data Scientist*

A full, end-to-end application of this pipeline (role demand → duties/tasks → KSA at the
high-performer bar → micro-credential pathway → skills map → match) is in:

> 📘 [**`../examples/role-data-scientist-pathway.md`**](../examples/role-data-scientist-pathway.md)

It shows how mastering **data processing** is the first credential on a sequenced route that
accumulates into the **Data Scientist** role profile, and how a learner's gap is measured at
each step.

---

## 9. Conformance checklist for a role deconstruction

- [ ] Target role anchored to ≥1 framework id **and** a real demand signal.
- [ ] Evidence **triangulated** (framework + ≥5 postings + ≥2 high-performer observations).
- [ ] Role decomposed into duties → observable tasks (each with an output artifact).
- [ ] Every task mapped to KSA with **types, levels, and observable performance criteria**.
- [ ] Proficiency bar = **high-performer** behavior, not "can do at all".
- [ ] Abilities/differentiators captured (not just tools) and **employer-validated**.
- [ ] KSA clustered into micro-credentials (each ≥1 Skill + ≥1 Ability) and **sequenced** into
      a prerequisite-aware pathway across the 4 phases.
- [ ] Each micro-credential's capstone mirrors a **real task** at the role bar.
- [ ] Gap is computable and the match loop re-measures after each evidence event.
- [ ] Human sign-off recorded at Stages 0, 2, and 7.

---

## 10. Guardrails

- **Human-in-the-loop is mandatory.** AI deconstructs; mentors/employers/expert workers
  validate duties, KSA, levels, and the pathway before publication or badging.
- **Don't ship tool lists as competencies.** A keyword ("Pandas") is a Skill *with* a
  Knowledge prerequisite and usually an Ability layer (rigor, judgment) — model all three.
- **Surface the hidden Abilities.** Postings omit durable competencies; observation reveals
  them. A role map with **0 Abilities** is incomplete.
- **Avoid single-source/single-expert bias.** Triangulate and observe more than one performer.
- **Privacy & consent** for all observation; anonymize incidents.
- **Keep it accessible & current.** Prefer free/open tools; re-run the pipeline as demand and
  tooling evolve — the system is meant to be dynamic.

---

<script type="text/markdown" data-path="specs/skills-map-and-job-matching.md"># 🗺️ Skills Map & Job Matching

This spec defines the **data model** and **scoring** that turn KSA competencies into a
**skills map** — the graph of what a learner must earn to qualify for a specific job — and a
**job-match score**.

Depends on the proficiency scale and tag format in [`ksa-taxonomy.md`](ksa-taxonomy.md).

---

## 1. Core entities

```
KSA Component ──< has many ── belongs to ──> Target KSA Profile (a ROLE/JOB)
      ▲                                                │
      │ evidenced by                                   │ matched against
      │                                                ▼
Learner KSA Profile (a PERSON) ──────── diff ─────> SKILLS MAP (the gaps)
                                                       │
                                                       │ closed by
                                                       ▼
                                              Micro-credentials / Atoms
```

### 1.1 KSA Component

The atomic, matchable unit. Same IDs flow through atoms, profiles, and the map.

```yaml
id: S-build-rest-endpoint        # stable, unique, type-prefixed (K-/S-/A-)
type: skill                      # knowledge | skill | ability
label: "Build & test a REST endpoint"
description: "Create, route, and test a CRUD REST endpoint with error handling."
framework_ref: "O*NET:15-1254.00 / SFIA:PROG"
prerequisites: [K-http-semantics, S-read-write-python]
related: [S-write-unit-tests]
```

### 1.2 Target KSA Profile (a role)

What a **job opportunity** requires. Each line = a component + the **minimum level** and a
**weight** (importance). `must_have` marks disqualifying gaps.

```yaml
role: "Junior Backend Developer"
source: "https://example.com/job/12345"          # posting, or framework role
framework_ref: "O*NET 15-1254.00 Web Developers"
validated_by: "mentor:@sancarbar / employer:AcmeCorp"   # human gate
requirements:
  - { ref: K-http-semantics,     min_level: 2, weight: 3, must_have: true }
  - { ref: S-build-rest-endpoint, min_level: 2, weight: 5, must_have: true }
  - { ref: S-write-unit-tests,    min_level: 2, weight: 4, must_have: true }
  - { ref: S-use-git,             min_level: 2, weight: 3, must_have: true }
  - { ref: A-adaptability,        min_level: 2, weight: 3, must_have: false }
  - { ref: A-collaboration,       min_level: 2, weight: 4, must_have: true }
```

### 1.3 Learner KSA Profile (a person)

What the learner **has evidenced**. Each achieved level must point to evidence
(badge, artifact, assessment) — *no evidence, no level*.

```yaml
learner: "ada-learner-001"
evidenced:
  - { ref: K-http-semantics,     level: 2, evidence: "badge:mc-rest-api", verified: true }
  - { ref: S-build-rest-endpoint, level: 1, evidence: "lab:rest-lab-1",    verified: true }
  - { ref: S-use-git,             level: 2, evidence: "badge:mc-git-basics", verified: true }
  - { ref: A-collaboration,       level: 2, evidence: "360:cohort-7",       verified: true }
  # S-write-unit-tests: absent (level 0)
  # A-adaptability: absent (level 0)
```

---

## 2. The Skills Map (gap graph)

The skills map is the **diff** between a target profile and a learner profile, expressed as
a prerequisite-ordered graph of **gaps**.

For each requirement `r`:

```
gap(r) = max(0, r.min_level − learner.level(r.ref))
status =
   met        if gap == 0
   partial    if 0 < gap and learner.level > 0
   missing    if learner.level == 0
   blocker    if status != met and r.must_have == true
```

### Example skills map (from the profiles above)

| Component | Type | Need | Have | Gap | Status | Must-have |
| --------- | ---- | ---- | ---- | --- | ------ | --------- |
| K-http-semantics | 🧠 K | L2 | L2 | 0 | ✅ met | yes |
| S-build-rest-endpoint | 🛠️ S | L2 | L1 | 1 | 🟡 partial | yes |
| S-write-unit-tests | 🛠️ S | L2 | L0 | 2 | 🔴 missing | yes |
| S-use-git | 🛠️ S | L2 | L2 | 0 | ✅ met | yes |
| A-adaptability | 🌱 A | L2 | L0 | 2 | 🟡 missing | no |
| A-collaboration | 🌱 A | L2 | L2 | 0 | ✅ met | yes |

**To earn (ordered by prerequisite then weight):**
1. `S-build-rest-endpoint` L1→L2 *(close partial; prereq for the role's core task)*
2. `S-write-unit-tests` L0→L2 *(blocker — must_have)*
3. `A-adaptability` L0→L2 *(nice-to-have; raises match but not blocking)*

### Visual

```
        [K-http-semantics ✅]
                 │ prereq
                 ▼
   [S-build-rest-endpoint 🟡 L1→L2] ──► [S-write-unit-tests 🔴 L0→L2]  ◄ BLOCKER
                 │
                 ▼
        (capstone-ready)        [A-adaptability 🟡 L0→L2]  (boosts match)
        [S-use-git ✅] [A-collaboration ✅]
```

---

## 3. Job-match score

A single, explainable readiness number.

```
weighted_have(r)     = min(learner.level(r.ref), r.min_level) * r.weight
weighted_required(r) = r.min_level * r.weight

match_score = 100 * Σ weighted_have(r) / Σ weighted_required(r)

job_ready   = (match_score ≥ readiness_threshold)   AND
              (no must_have requirement has status != met)
```

- `readiness_threshold` default = **85%** (configurable per program/employer).
- A learner can be at 90% overall but **not job-ready** if a single `must_have` is unmet —
  surface blockers explicitly.

### Worked calculation (example above)

| Component | min×weight (req) | min(have,min)×weight (have) |
| --------- | ---------------- | --------------------------- |
| K-http-semantics | 2×3 = 6 | 2×3 = 6 |
| S-build-rest-endpoint | 2×5 = 10 | 1×5 = 5 |
| S-write-unit-tests | 2×4 = 8 | 0×4 = 0 |
| S-use-git | 2×3 = 6 | 2×3 = 6 |
| A-adaptability | 2×3 = 6 | 0×3 = 0 |
| A-collaboration | 2×4 = 8 | 2×4 = 8 |
| **Σ** | **44** | **25** |

`match_score = 100 × 25/44 ≈ 57%` → **not job-ready** (below 85% **and** two must-haves
unmet: `S-write-unit-tests`, plus `S-build-rest-endpoint` partial).

After earning the two blocking skills to L2: have = 25 + 5 + 8 = 38 → 38/44 ≈ **86%**, and
all must-haves met → **job-ready**. `A-adaptability` then becomes the next optional boost
(→ 44/44 = 100%).

---

## 4. KSA-balance health check

Because job postings over-index on Skills and under-state Abilities, the map should report
**coverage by type** so designers don't ship Knowledge-only paths:

```
coverage = { knowledge: met/total per type, skill: …, ability: … }
```

Warn if a role's map has **0 Abilities** (postings often omit them — add the durable
competencies the role really needs, validated by the employer/mentor).

---

## 5. Lifecycle of a learner's map

```
1. Pick target role            → load/extract Target KSA Profile (human-validated)
2. Self-assess + import badges  → Learner KSA Profile
3. Generate Skills Map + score  → gaps, blockers, ordered plan
4. Enroll in micro-credentials  → each maps to specific gap components
5. Produce evidence → assess    → verified levels updated
6. Re-score                     → repeat until job_ready
7. Export                       → portfolio + badges + match report to employer
```

---

## 6. Minimal JSON for tooling

A single object a Gen AI or app can produce/consume:

```json
{
  "role": "Junior Backend Developer",
  "readiness_threshold": 85,
  "match_score": 57,
  "job_ready": false,
  "blockers": ["S-write-unit-tests", "S-build-rest-endpoint"],
  "to_earn": [
    {"ref": "S-build-rest-endpoint", "from": 1, "to": 2, "type": "skill", "must_have": true},
    {"ref": "S-write-unit-tests", "from": 0, "to": 2, "type": "skill", "must_have": true},
    {"ref": "A-adaptability", "from": 0, "to": 2, "type": "ability", "must_have": false}
  ],
  "coverage": {"knowledge": "1/1", "skill": "1/3", "ability": "1/2"}
}
```

See [`../examples/skills-map-job-match-frontend.md`](../examples/skills-map-job-match-frontend.md)
for a complete end-to-end walkthrough on a real-style role.
</script>
<script type="text/markdown" data-path="examples/art_microcredential_template.md"># 🎨 ADA Micro-Credential: Fundamentals of Color Theory in Art

### Applied Digital Apprenticeship (ADA Methodology)

This micro-credential develops foundational **art and design competencies**, focusing on **color theory** as a building block for broader creative skills in graphic design, illustration, and visual communication.

**Fundamentals of Color Theory in Art**

---

## ⏳ Estimated Duration
10–15 hours · 2–3 weeks (5h/week)

---

## 🎯 Target Job Competency
Ability to apply **color theory principles** to create balanced, visually effective compositions across artistic and design contexts.

Linked to frameworks:  
- [ESCO – Graphic Designer](https://esco.ec.europa.eu/en/classification/occupation?uri=http%3A%2F%2Fdata.europa.eu%2Fesco%2Foccupation%2Fd1a6ddad-3f0c-42d5-b68a-c674f085bb21)

- [ILO – Creative Industries Skills](https://www.ilo.org/skills/lang--en/index.htm)

## 🔑 Prerequisites
- [ ] Basic familiarity with visual arts (painting, drawing, or digital tools)  
- [ ] Access to free design software (Canva, Figma, or GIMP)

---

## 📘 Learning Objectives (Bloom-Aligned)
- **Understand** how primary, secondary, and complementary colors interact.  
- **Apply** color harmonies to create balanced compositions.  
- **Analyze** the emotional and psychological effects of colors.  
- **Create** a digital artwork using intentional color schemes.

---

## 💡 Skills to Be Developed

- Build a digital color wheel.
