<script type="text/markdown" data-path="examples/effective-communication-micro-credential/rubrics.md"># 📊 Rubrics — Effective Communication

All rubrics for this micro-credential. Atom-level rubrics are **formative** (gate progress); the
**capstone-5** rubric is the **summative** Assessment Rubric. Abilities are scored **behaviorally
across ≥3 occasions**, never with a quiz.

> See the rubric philosophy in [`../../guides/curriculum-design-guide.md`](../../guides/curriculum-design-guide.md)
> and the standard rubric in [`../../templates/micro-credential-ada-template.md`](../../templates/micro-credential-ada-template.md).

---

## 1) `knowledge-mini` — for Knowledge atoms (Atoms 1–2)

Formative checks for understanding (used by the pop quizzes).

| Criterion | Pass (✓) | Not yet (✗) |
| --------- | -------- | ----------- |
| **Comprehension** | Explains the model/concept in own words | Recites without understanding |
| **Application** | Picks the right channel / spots the noise in a scenario | Cannot transfer to a new case |
| **Reflection** | Connects the idea to a real situation | No connection made |

Pass = all ✓. Retake allowed.

---

## 2) `skill` — for Skill atoms (Atoms 3–4)

| Criterion | Excellent (3) | Adequate (2) | Needs work (1) |
| --------- | ------------- | ------------ | -------------- |
| **Active listening (Atom 3)** | Attends, paraphrases, names feeling, asks open Qs, checks | Some moves present | Talks over / fixes first |
| **Message structure (Atom 4)** | Leads with point; clean pyramid; clear CTA | Mostly structured | Buried lead / rambling |
| **Concision & clarity** | Tight, concrete, jargon-managed | Some filler | Wordy / vague |

Pass = 2+ on each relevant row → **L2** for the targeted Skill.

---

## 3) `behavioral` — for the Abilities (Atoms 3, 5, capstone)

Scored by **observation across ≥3 occasions** (Atom 3 listening drill, Atom 5 role-plays, capstone).
The Ability is credited only if it shows up **consistently**.

| Ability | Looks like (✓) | Doesn't look like (✗) | Occasions |
| ------- | -------------- | --------------------- | --------- |
| **Empathy & audience-awareness (`A-empathy`)** | Adapts to the listener; names feelings; person feels understood | Talks at people; ignores cues; one-size message | Atoms 3, 5, capstone |
| **Assertiveness, respectful (`A-assertiveness`)** | Says the hard thing calmly and clearly; holds position without aggression | Aggressive (blames) or avoidant (sugarcoats/silent) | Atoms 5, capstone |

Credit at **L2** = observed ✓ in **at least 3 occasions** (Atom 5 alone is not enough).

---

## 4) `capstone-5` — summative Assessment Rubric (the badge gate)

The standard ADA 5-criteria / 4-band / 100-point rubric. Identical to the table in
[`capstone.md`](capstone.md):

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | Message is purpose-built for a real audience and goal; channel choice justified. | Relevant; mostly fitting. | Loosely fitting; generic. | Off-target. | **20 pts** |
| **Application of skills** | Listening, BLUF/Pyramid/SBI, de-escalation all used correctly and naturally. | Most used correctly. | Several gaps. | Minimal/incorrect. | **25 pts** |
| **Problem-solving** | Handles live pushback skillfully; adapts in real time. | Handles adequately. | Partly; some rigidity. | Mishandled/avoided. | **20 pts** |
| **Clarity & communication** | Clear, concise, structured; nonverbals align. | Generally clear. | Uneven. | Unclear. | **15 pts** |
| **Collaboration & reflection** | Empathy + assertiveness evident; insightful peer review + honest reflection. | Adequate. | Minimal. | Missing. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

---

## 🏅 Badge issuance — *Effective Communicator*

Issued when **all** hold (mentor-verified — human-in-the-loop):

- [ ] **Knowledge:** Atoms 1–2 pop quizzes passed.
- [ ] **Skills:** Atom 3 (listening) + Atom 4 (structure) mini-rubrics ≥ 2 each → **L2**.
- [ ] **Abilities:** `A-empathy` & `A-assertiveness` observed ✓ across **≥3 occasions**.
- [ ] **Capstone:** Assessment Rubric weighted score **≥ 70%** (≥ *Developing* on each criterion).
- [ ] **Collaboration:** peer review given + reflection submitted.

The badge writes these KSA components (with levels) into the learner's **skills map** —
see [`skills-map.md`](skills-map.md).

<script type="text/markdown" data-path="examples/effective-communication-micro-credential/skills-map.md"># 🗺️ Skills Map — *Effective Communicator*

How earning this badge updates a learner's **skills map** and why it's one of the highest-leverage
credentials to hold — communication is a near-universal job requirement.

> Concept reference: [`../../specs/skills-map-job-matching.md`](../../specs/skills-map-job-matching.md).

---

## 🧩 What the badge writes to the skills map

On issuance, these KSA components are recorded with evidence and level:

| Component | Type | Level | Evidence |
| --------- | ---- | ----- | -------- |
| `K-comm-model` — how communication works | 🧠 Knowledge | L2 | Atom 1 quiz |
| `K-audience-channel` — audience & channel | 🧠 Knowledge | L2 | Atom 2 quiz + worksheet |
| `S-active-listening` — listen actively | 🛠️ Skill | **L2** | Atom 3 mini-rubric + capstone |
| `S-structure-message` — structure clear messages | 🛠️ Skill | **L2** | Atom 4 performance task + capstone |
| `S-feedback-difficult` — feedback & hard conversations | 🛠️ Skill | L2 | Atom 5 behavioral + capstone |
| `A-empathy` — empathy & audience-awareness | 🌱 Ability | L2 | Behavioral, ≥3 occasions |
| `A-assertiveness` — assertive, respectful | 🌱 Ability | L2 | Behavioral, ≥3 occasions |

---

## 🎯 Why this badge matters everywhere

```mermaid
flowchart TD
  EC["🏅 Effective Communicator"] --> IC["👩‍💻 Any IC role<br/>clearer updates, fewer reworks"]
  EC --> LEAD["🧭 Team lead / manager<br/>feedback, 1:1s, alignment"]
  EC --> CLIENT["🤝 Client-facing / sales<br/>discovery, proposals, trust"]
  EC --> CROSS["🔀 Cross-functional work<br/>stakeholder communication"]
```

"Communication skills" appears in the majority of job postings across functions. Unlike most badges
that boost one role, **Effective Communicator is a multiplier** on nearly every role's effectiveness
and is frequently an explicit hiring criterion (O\*NET lists Active Listening, Speaking, and Writing
as *basic skills* required across occupations).

---

## 🧭 How it fits a learning pathway

| Stage | Credential | What it adds |
| ----- | ---------- | ------------ |
| Foundational (durable) | 🏅 **Effective Communicator** *(this one)* | listen, structure, handle hard talks |
| Pairs well with | 🏅 [Growth Mindset](../growth-mindset-micro-credential/skills-map.md) | resilience + feedback-seeking — the receiving side of communication |
| Builds toward | *Facilitation · Influencing & Negotiation · Presentation & Storytelling* | (future credentials) advanced communication |
| Role pathways | *Team Lead · Product Manager · Customer Success · Consultant · Tech Lead* | communication is a core competency in each |

> **Job-matching note:** because communication is a *transversal* competency, this badge rarely
> appears alone in a role's minimums — it **stacks** with technical badges (e.g.,
> [Python Variables](../python-variables-micro-credential/skills-map.md) → developer pathway) to make a
> candidate's profile credible end-to-end. Matching against a specific job's minimum bar still

<script type="text/markdown" data-path="examples/growth-mindset-micro-credential/capstone.md"># 🚀 Capstone — *Growth in the Wild: a 21-Day Stretch Challenge*

The capstone is delivered as [Atom 6](atoms/atom-6-growth-in-the-wild-capstone.md). This file is
the **grading brief**: what learners submit, how it maps to KSA, and the showcase format.

---

## 🎯 The brief

> Choose a real, slightly scary **stretch goal** and pursue it for **21 days** using everything
> in this course — deliberate-practice loops, the YET Loop for setbacks, weekly feedback asks,
> and a growth journal — then **showcase** it to your cohort for a peer + mentor 360.

The point is not a polished outcome. The point is **documented behavior under real difficulty**.
A capstone where everything went smoothly scores *lower* than one full of setbacks that were
reframed and learned from — because the Ability is only visible when things get hard.

---

## 📦 What to submit

- [ ] **Goal one-pager** — the stretch goal, why it's at your edge, and your loop design (targets, feedback sources, practice block).
- [ ] **Growth journal** — most-days entries across 21 days (template in Atom 6).
- [ ] **Deliberate-practice logs** — at least 8 rep logs showing target → feedback → correction.
- [ ] **Feedback-ask records ×3** — one specific ask per week (question / response / change made).
- [ ] **Setback log** — at least 3 YET-Loop reframes of real walls you hit.
- [ ] **Showcase** — a 5-minute talk or recording (structure below).
- [ ] **Peer 360 forms** — your ratings of 2 peers + the ratings you received.

---

## 🎤 Showcase structure (5 minutes)

1. **The reach (30s)** — what you went after and why it scared you a little.
2. **The best failure (90s)** — the most *useful* thing that went wrong, and the YET-Loop reframe.
3. **What feedback changed (90s)** — a before/after from your weekly asks.
4. **The evidence (60s)** — journal + logs; your Day-0 vs Day-21 mindset self-rating.
5. **What you'll keep (30s)** — the one habit that outlives the badge.

---

## 🧬 How the capstone maps to KSA

| Capstone element | Evidences | Component |
| ---------------- | --------- | --------- |
| Accurate framing of mindset in the goal one-pager | Understanding the construct | 🧠 K-mindset-science, K-mindset-nuance |
| YET-Loop reframes in the setback log | The reframing move under pressure | 🛠️ S-yet-reframe |
| Deliberate-practice rep logs | Designed + ran feedback loops | 🛠️ S-deliberate-practice |
| Journal + feedback asks + showcase across 21 days | Failure-as-learning, feedback-seeking, persistence | 🌱 A-growth-mindset (**L3**) |
| Handling pivots/walls without stalling | Stayed effective amid change | 🌱 A-adaptability (L2) |

---

## ✅ Grading

Two instruments, both in [`rubrics.md`](rubrics.md):

- **Behavioral rubric** — consistency across the **5 assessed occasions**, self-awareness, and
  response to setback/feedback. *(This is what certifies the Ability.)*
- **Assessment Rubric (capstone-5)** — the standard 5-criteria ADA capstone rubric, below.

## 📋 Assessment Rubric

Five criteria across four proficiency bands, weighted to **100 points**.

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | Goal is a real, job-relevant stretch; mindset framing is precise and accurate throughout. | Goal is relevant; mindset framing mostly accurate. | Goal loosely relevant; framing partly off or generic. | Weak / off-target goal; framing inaccurate or missing. | **20 pts** |
| **Application of skills** | YET Loop + deliberate-practice loops used skillfully and visibly across the challenge. | Both techniques used adequately, with minor gaps. | Techniques attempted but inconsistent or superficial. | Techniques largely absent or misapplied. | **25 pts** |
| **Problem-solving & creativity** | Setbacks reframed into smart, original next reaches. | Setbacks handled with sound, conventional responses. | Some response to setbacks, but stalls or repeats. | Stalls at obstacles; no reframing. | **20 pts** |
| **Clarity & communication** | Journal + showcase are clear, honest, well-structured and compelling. | Generally clear and organized. | Uneven clarity; gaps or sanitized account. | Unclear, disorganized, or missing. | **15 pts** |
| **Collaboration & reflection** | Proactive feedback-seeking, strong peer 360, deeply insightful reflection. | Solid engagement and reflection. | Minimal engagement; shallow reflection. | Little or no collaboration or reflection. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

> **Pass for the badge:** behavioral rubric ≥ 2 on every criterion **across occasions** AND
> Assessment Rubric weighted score ≥ 70% (at least *Developing* on every criterion),
> **verified by a mentor**. See [`skills-map.md`](skills-map.md) for what the badge unlocks.
</script>

## 🎯 Target job competency

Keep learning and stay effective when **goals, tools, or feedback are hard** — written in
postings as *growth mindset, learning agility, coachable, resilient, thrives on feedback*.
Mapped to **O\*NET Work Styles** (Adaptability/Flexibility, Persistence, Achievement/Effort),
**ESCO** transversal attitudes, and **SFIA** behavioural factors + *LEDA*.

## 🧬 KSA breakdown — an attitude made trainable

| KSA | Component | Why this type | Target |
| --- | --------- | ------------- | ------ |
| 🧠 Knowledge | Mindset science (fixed vs. growth, neuroplasticity) | Concepts to understand — a small enabling base | L1 |
| 🧠 Knowledge | Myths & nuance (false growth mindset, effect sizes) | Prevents shallow / performative adoption | L1 |
| 🛠️ Skill | The *power of yet* reframing move | A concrete, repeatable move you can practice | L2 |
| 🛠️ Skill | Deliberate-practice loop with feedback | A teachable method that *operationalizes* the mindset | L2 |
| 🌱 Ability | **Growth mindset** (failure = learning) | A disposition proven by behavior over time | **L3** |
| 🌱 Ability | Adaptability amid change | Cross-cutting disposition, reinforced throughout | L2 |

> **Why this shape:** you can't lecture an attitude into existence. v2 gives a light
> **Knowledge** base, two concrete **Skills** the learner can actually *do*, and then grows
> the **Ability** through repeated, authentic challenge — because dispositions are evidenced by
> *behavior across occasions*, not by a test.

| Treat failure as data; seek challenge and feedback; persist | Organize (affective) | 🌱 A | A-growth-mindset | L3 |
| Stay effective and keep learning when conditions change | Value (affective) | 🌱 A | A-adaptability | L2 |

<script type="text/markdown" data-path="examples/growth-mindset-micro-credential/rubrics.md"># 📊 Rubrics — Growth Mindset Micro-Credential

All assessment instruments used across the course. Atoms reference these by `rubric` flavor:
`knowledge-mini`, `skill`, `ability-behavioral`, `capstone-5`.

---

## 🔹 `knowledge-mini` — concept checks (Atoms 1–2)

Quick formative check; used for pop quizzes and AI Q&A checks.

| Criterion | Excellent (3) | Adequate (2) | Needs improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Accuracy** | Correct, and avoids the common myths | Mostly correct | Repeats a myth as fact |
| **Precision** | States the *bounded* claim (developable ability + response to struggle) | Roughly right | Slogan-level ("just try harder") |
| **Self-application** | Connects to a real personal example | Generic example | None |

> Pass = 2+ on each. Knowledge here is intentionally **L1** — it only enables the Abilities.

---

## 🔹 `skill` — performance mini-rubric (Atoms 3–4)

For the YET Loop reframe and the deliberate-practice lab.

| Criterion | Excellent (3) | Adequate (2) | Needs improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Correct move** | Executes the technique as designed (reframe / loop) | Minor gaps | Technique not really used |
| **Strategy + feedback** | Specific strategy AND a real feedback source | One present, vague | Missing |
| **Visible improvement** | Clear change/correction between attempts | Slight change | No change |
| **Reframe under struggle** | Uses YET Loop when stuck | Sometimes | Defaults to fixed read |

> Pass = 2+ on each → **L2** evidence for the relevant Skill component.

---

## 🔹 `ability-behavioral` — the attitude rubric (Atoms 5–6) ⭐

The instrument that **certifies the Ability**. An attitude cannot be proven by one moment or a
quiz — this rubric explicitly requires evidence **across the 5 assessed occasions** (2 curveball
reframes, 3 feedback asks, sustained journal, showcase).

| Criterion | Excellent (3) | Adequate (2) | Needs improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Consistency across occasions** | Growth behavior shown across all 5 occasions | Shown in 3–4 | Only when pushed |
| **Failure as learning** | Reframes setbacks as data; reaches again | Accepts setbacks passively | Defensive / avoids reaching |
| **Feedback seeking** | Proactively seeks specific, hard feedback and acts on it | Seeks occasionally | Avoids; only receives |
| **Self-awareness (reflection)** | Names triggers, choices, and growth with insight | Some reflection | Minimal / none |
| **Persistence / adaptability** | Stays effective and re-plans amid walls & change | Recovers slowly | Stalls or quits |

> Pass = 2+ on **every** criterion. Excellent across the board supports **L3** for
> `A-growth-mindset`.

---

## ✨ `capstone-5` — Assessment Rubric (standard ADA capstone)

The capstone is scored on **five criteria** across **four proficiency bands**, weighted to a total
of **100 points**. Each criterion's band sets how much of its weight is earned. **Pass = ≥ 70%
overall with at least *Developing* on every criterion**, mentor-verified (human-in-the-loop).

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | Goal is a real, job-relevant stretch; mindset framing is precise and accurate throughout. | Goal is relevant; mindset framing mostly accurate. | Goal loosely relevant; framing partly off or generic. | Weak / off-target goal; framing inaccurate or missing. | **20 pts** |
| **Application of skills** | YET Loop + deliberate-practice loops used skillfully and visibly across the challenge. | Both techniques used adequately, with minor gaps. | Techniques attempted but inconsistent or superficial. | Techniques largely absent or misapplied. | **25 pts** |
| **Problem-solving & creativity** | Setbacks reframed into smart, original next reaches. | Setbacks handled with sound, conventional responses. | Some response to setbacks, but stalls or repeats. | Stalls at obstacles; no reframing. | **20 pts** |
| **Clarity & communication** | Journal + showcase are clear, honest, well-structured and compelling. | Generally clear and organized. | Uneven clarity; gaps or sanitized account. | Unclear, disorganized, or missing. | **15 pts** |
| **Collaboration & reflection** | Proactive feedback-seeking, strong peer 360, deeply insightful reflection. | Solid engagement and reflection. | Minimal engagement; shallow reflection. | Little or no collaboration or reflection. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

> **Badge pass:** `ability-behavioral` ≥ 2 on every criterion **across occasions** AND
> `capstone-5` weighted ≥ 70%, **mentor-verified** (human-in-the-loop).

## 🎯 Why this matters for job matching

Job postings reliably ask for *attitudes* — "growth mindset," "coachable," "learning agility,"
"thrives on feedback," "comfortable with ambiguity" — and these are exactly the components a
**Knowledge-only** course can never certify. A typical match before and after this badge:

| Job requirement (`must_have`) | Before | After badge |
| ----------------------------- | ------ | ----------- |
| Growth mindset / learning agility (Ability ≥ 2) | ❌ 0 | ✅ 3 |
| Adapts to change / ambiguity (Ability ≥ 2) | ⚠️ 1 | ✅ 2 |
| Seeks & acts on feedback (Skill/Ability ≥ 2) | ❌ 0 | ✅ via `A-growth-mindset` + `S-yet-reframe` |

```mermaid
flowchart LR
  GAP["🔎 Job match gap<br/>Ability: growth mindset = MISSING"] --> MC["🎓 Growth Mindset<br/>micro-credential"]
  MC --> EV["📦 Behavioral evidence<br/>across 5 occasions + capstone"]
  EV --> BADGE["🏅 Growth Mindset Practitioner"]
  BADGE --> MAP["🗺️ Skills map<br/>A-growth-mindset = 3"]
  MAP --> MATCH["✅ Meets must-have<br/>attitude requirement"]
```

---

## 🔗 Where this fits a role pathway

`A-growth-mindset` and `A-adaptability` are **durable, transferable** Abilities — they belong in
the *foundation layer* of almost every role pathway built with
[`../../specs/role-to-credential-mapping.md`](../../specs/role-to-credential-mapping.md). Pair
this badge with role-specific technical micro-credentials (e.g.,
[the Data Scientist pathway](../role-data-scientist-pathway.md)) so a learner matches **both**
the hard-skill *and* the attitude minimums a job demands.

> ⚠️ Per the methodology, AI-suggested matches are **decision support**, not a hiring decision —
> a mentor/employer validates the evidence before the badge counts (human-in-the-loop).

<script type="text/markdown" data-path="examples/innovation-creativity-micro-credential/capstone.md"># 🚀 Capstone — Innovation Challenge

The capstone integrates every component of the **Innovation & Creativity** micro-credential into one
piece of evidence. Full task and rubric live in
[`atoms/atom-6-capstone-innovation-challenge.md`](atoms/atom-6-capstone-innovation-challenge.md); this
file is the at-a-glance brief and the KSA mapping.

---

## 🎯 The brief

> **Run a full innovation challenge: reframe a real problem, generate options, prototype the best, and
> pitch it.**

Deliverable: an **Innovation Brief** (~800–1,200 words or short deck) + prototype + pitch that:

1. **Reframes** a real problem (observe → insight → "How Might We" + alternative frames).
2. **Diverges** — 30+ varied ideas, ≥2 techniques + AI, originals marked.
3. **Converges** — criteria-based shortlist (desirability/feasibility/viability) → one concept.
4. **Prototypes** — a rough prototype that answers the biggest question.
5. **Tests & iterates** — feedback from ≥2 people, documented learnings and changes.
6. **Pitches** — problem/insight, concept, value, and next steps.

Plus a **showcase/demo** and at least one **peer review**.

---

## 🧬 How the capstone proves each KSA component

| KSA | Component | Where it shows up in the capstone |
| --- | --------- | --------------------------------- |
| 🧠 K | What creativity & innovation are | Diverge/converge discipline; value argument (idea → value) |
| 🧠 K | Ideation frameworks | Named techniques used in divergence and convergence |
| 🛠️ S | Reframe & spot opportunities | The reframe section (insight + HMW + frames) |
| 🛠️ S | Generate ideas | The 30+ idea list (fluency, flexibility, originality) |
| 🛠️ S | Develop, prototype & evaluate | Criteria choice + prototype + test/iterate |
| 🌱 A | Creative confidence | Bold sharing; failed tests as iteration; productive risk |
| 🌱 A | Curious openness | "What if" questions; building on feedback; cross-domain ideas |

---

## ✅ Pass bar

- **≥ 80%** on the 5-criteria `capstone-5` rubric **and** no criterion below *Developing*.
- Abilities confirmed at **L2** via behavioral evidence across **≥ 3 occasions** (Atom 5 + forum +
  capstone showcase).
- Result: **🏅 Creative Innovator** badge issued on verified evidence, writing
  `S-reframe-opportunities`, `S-generate-ideas`, `S-develop-prototype`, `A-creative-confidence`,
  `A-curiosity-openness` to the learner's [skills map](skills-map.md).
</script>

## 🎯 Target job competency

**Think creatively and innovate.** Organizations don't just want novel ideas — they want people who can
**reframe problems, generate options, and turn the best into something real and valuable.** As routine
work is automated, the premium shifts to originality, idea fluency, and the judgment to develop ideas
into impact. Mapped to **O\*NET** (Fluency of Ideas, Originality, Thinking Creatively, Innovation) and
**ESCO** transversal *"think creatively / use creativity."*

## 🧬 KSA breakdown — a creative skill, taught the right way

| KSA | Component | Why this type | Target |
| --- | --------- | ------------- | ------ |
| 🧠 Knowledge | What creativity & innovation are | A mental model: divergent/convergent; idea → value | L2 |
| 🧠 Knowledge | Ideation frameworks | You can't apply tools you don't know | L2 |
| 🛠️ Skill | Reframe & spot opportunities | A trainable technique (observe → insight → HMW) | **L2** |
| 🛠️ Skill | Generate ideas | Divergent thinking on demand (fluency/flexibility/originality) | **L2** |
| 🛠️ Skill | Develop, prototype & evaluate | Converge, prototype, test, iterate | L2 |
| 🌱 Ability | Creative confidence | A disposition: share rough ideas, embrace failure | L2 |
| 🌱 Ability | Curious openness | A habit: seek novelty, connect across domains | L2 |

> **Why this shape:** creativity is mostly **doing** (Skills: reframe, generate, develop), but it only
> *flows* when paired with the **Abilities** that unlock it — **creative confidence** (the belief and
> willingness to share imperfect ideas and treat failure as iteration) and **curious openness** (the
> habit of seeking novelty and connecting distant ideas). Those Abilities are assessed **behaviorally,
> across ≥3 occasions**, not with a quiz.

## 📘 Learning objectives (Bloom + KSA)

| Objective | Bloom | KSA | Component | Target |
| --------- | ----- | --- | --------- | ------ |
| Explain divergent vs. convergent thinking and how creativity becomes innovation | Understand | 🧠 K | K-creativity-innovation | L2 |
| Describe major ideation frameworks and when to use each | Understand | 🧠 K | K-ideation-frameworks | L2 |
| Reframe a problem and write sharp opportunity ("How Might We") questions | Analyze | 🛠️ S | S-reframe-opportunities | L2 |
| Generate many varied, original ideas on demand | Create | 🛠️ S | S-generate-ideas | L2 |
| Develop, prototype, and evaluate ideas against criteria | Create | 🛠️ S | S-develop-prototype | L2 |
| Share rough ideas and treat failure as iteration | Value (affective) | 🌱 A | A-creative-confidence | L2 |
| Seek novelty and connect ideas across domains | Respond (affective) | 🌱 A | A-curiosity-openness | L2 |

| Phase | Atom(s) | KSA focus | Activity | Assessment |
| ----- | ------- | --------- | -------- | ---------- |
| 🙉 1 · hear | Atom 1, 2 | 🧠 K | reading + video on creativity/innovation; ideation frameworks | knowledge-mini (pop quizzes) |
| 🙈 2 · see | Atom 3 | 🛠️ S | model a reframe; observe → insight → "How Might We" | performance task |
| 🙊 3 · do | Atom 4, 5 | 🛠️ S + 🌱 A | divergent idea sprints; prototype + evaluate the best | performance task + behavioral assessment |
| 🐵 4 · share | Atom 6 (capstone) | 🛠️ S + 🌱 A | full innovation challenge; pitch + peer review | capstone-5 |

## 🚀 Capstone & 📊 assessment

Full brief in [`capstone.md`](capstone.md); all rubrics in [`rubrics.md`](rubrics.md). In short:
formative pop quizzes for the Knowledge atoms, skill performance tasks for reframing and idea
generation, a **behavioral assessment** across occasions for the Abilities, and a full
reframe→ideate→prototype→pitch challenge scored on the standard 5-criteria capstone rubric. The badge →
skills-map mapping is in [`skills-map.md`](skills-map.md).

## 🎓 Outcomes & recognition

- A working model of creativity that replaces "I'm just not creative" with **a repeatable process**.
- The ability to **reframe** a problem into sharp opportunity questions.
- On-demand **idea fluency** — generate many varied, original options without freezing.
- The ability to **develop, prototype, and evaluate** ideas down to one you can pitch.
- The durable **creative confidence** and **curious openness** that make it stick — evidenced over time.
- A portfolio artifact: a documented innovation challenge with a prototype and pitch.
- LinkedIn-compatible digital badge: **🏅 Creative Innovator** — a signal for product, design & strategy roles.

<script type="text/markdown" data-path="examples/innovation-creativity-micro-credential/rubrics.md"># 📊 Rubrics — Innovation & Creativity Micro-Credential

All assessment instruments for this micro-credential, in one place. They follow the ADA conventions:
**formative** knowledge checks, **skill** performance tasks, **behavioral** assessment for Abilities
(across ≥3 occasions, never a quiz), and the standardized **5-criteria capstone** rubric.

---

## 1. `knowledge-mini` — formative knowledge checks (Atoms 1–2)

Used for the pop quizzes. Not heavily weighted; the goal is readiness for the skill atoms.

| Band | Descriptor |
| ---- | ---------- |
| ✅ Secure | Distinguishes creativity/innovation and diverge/converge; names frameworks and when to use them |
| 🟡 Developing | Gets the gist; mixes up some frameworks or the diverge/converge distinction |
| 🔴 Not yet | Cannot yet explain the creative process or name ideation tools — revisit Atoms 1–2 |

---

## 2. `skill` — performance-task rubric (Atoms 3–4)

Applied to the reframe task (Atom 3) and the idea-generation task (Atom 4). Pass = **2+ on every row**
→ records the component at **L2**.

| Criterion | Excellent (3) | Adequate (2) | Needs work (1) |
| --------- | ------------- | ------------ | -------------- |
| **Reframe / observation** | Behavior-based observation; genuine insight; sharp solution-neutral HMW | Some real insight / usable HMW | Opinions not observation; HMW is a solution in disguise |
| **Idea volume & variety** | High fluency (30+) and flexibility (6+ categories) | Decent quantity, some variety | Few, same-category ideas |
| **Originality** | Clearly non-obvious, novel ideas surfaced | A few original ideas | All clichés / first-ten |
| **Process discipline** | Defers judgment; uses techniques to break ruts | Some technique use | Stalls; judges while generating |

> `S-reframe-opportunities` (Atom 3) and `S-generate-ideas` (Atom 4) each reach **L2** on a pass.

---

## 3. `behavioral` — Abilities rubric (Atoms 5–6, ≥ 3 occasions)

Abilities are **observed over time**, never quizzed. Evidence is gathered across Atom 5 (prototype &
test), the discussion forum, and the capstone showcase + peer review.

### 🌱 `A-creative-confidence` — share rough work & treat failure as iteration

| Stage | Observable behavior |
| ----- | ------------------- |
| Proficient (L2+) | Shares unfinished work without over-polishing; treats failed tests as iteration; takes productive creative risks; defers judgment |
| Developing (L1–L2) | Shares with prompting; some risk-taking; occasionally defensive about flops |
| Emerging (L0–L1) | Withholds ideas until "perfect"; treats failure as verdict; avoids risk |

### 🌱 `A-curiosity-openness` — seek novelty & connect across domains

| Stage | Observable behavior |
| ----- | ------------------- |
| Proficient (L2+) | Seeks disconfirming feedback; asks "what if"; borrows ideas across domains; changes course on evidence |
| Developing (L1–L2) | Curious in familiar areas; some openness to feedback |
| Emerging (L0–L1) | Defends first idea; little novelty-seeking; closed to other domains |

> **≥ 3 occasions** required for the badge. Mentors log short notes per occasion (date, behavior seen).

---

## 4. `capstone-5` — capstone rubric (Atom 6)

The standardized 5-criteria, weighted, 4-band rubric. **Pass = ≥ 80% overall and no criterion below
Developing.**

| Criterion | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Beginning (≤69%) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Reframe & insight** | Sharp, human-centered insight and HMW; alternative frames show real reframing | Clear insight and usable HMW | Generic problem; weak insight | Solves the obvious/wrong problem | **20 pts** |
| **Idea generation** | High volume, strong variety and genuine originality; techniques + AI used well | Good quantity and some variety | Few ideas; mostly obvious | Minimal/derivative ideas | **20 pts** |
| **Convergence & prototype** | Criteria-based choice; prototype precisely answers the key question | Reasonable choice + working prototype | Weak rationale; superficial prototype | No real criteria or prototype | **25 pts** |
| **Testing, iteration & value** | Real user testing; clear learnings drive iteration; value is well-argued | Tested; some iteration and value case | Little testing/iteration | No testing; value unclear | **20 pts** |
| **Pitch, collaboration & confidence** | Compelling, clear pitch; bold sharing; incisive, generative peer review | Solid pitch and review | Minimal/unclear pitch or review | Avoids sharing; no real review | **15 pts** |
| **TOTAL** | | | | | **100 pts** |

| Requirement | Evidence |
| ----------- | -------- |
| `S-reframe-opportunities` @ L2 | Atom 3 performance task |
| `S-generate-ideas` @ L2 | Atom 4 performance task |
| `S-develop-prototype` @ L2 | Atom 5 + capstone |

All six → **🏅 Creative Innovator** badge, written to the learner's [skills map](skills-map.md).

<script type="text/markdown" data-path="examples/problem-solving-micro-credential/capstone.md"># 🚀 Capstone — *Solve a Real Problem End-to-End*

The capstone is delivered as [Atom 6](atoms/atom-6-capstone-solve-a-real-problem.md). This file is the
**grading brief**: what learners submit, how it maps to KSA, and the defense format.

---

## 🎯 The brief

> Pick a **real, non-trivial problem** you can work on within the course window. Run the **full
> problem-solving process** and produce a sharp **problem statement**, a **root-cause analysis**, a set
> of **options with a decision matrix**, your **chosen solution with the trade-off named**, and a
> **pilot/implementation plan** with a success metric. Then **defend it** and peer-review a classmate.

The point is the **quality of the thinking** — define → diagnose → decide — not the size of the
problem.

---

## 📦 What to submit

- [ ] **Problem statement** — specific, measurable, neutral, solution-free, with success metric.
- [ ] **Root-cause analysis** — 5 Whys and/or fishbone + how you **tested** the suspected cause.
- [ ] **Options + decision matrix** — ≥5 options, weighted criteria, the choice, the **trade-off named.**
- [ ] **Pilot/implementation plan** — smallest reversible test + what "it worked" looks like.
- [ ] **A reflection** (6–8 sentences) — where you got stuck, an assumption discarded, a bias caught.
- [ ] **A peer review you gave** — the capstone rubric applied to a classmate, with useful feedback.

---

## 🎤 Showcase / defense structure (≈ 5 minutes)

1. **The problem** (1 min) — statement + why it matters.
2. **The diagnosis** (1–2 min) — root cause + how you know.
3. **The decision** (1–2 min) — options, matrix, choice, trade-off.
4. **Next & lessons** (30s) — pilot plan + one lesson.

> Expect **challenge questions** ("what if your root cause is wrong?") — answering with your reasoning
> is part of the grade (critical-curiosity, observed live).

---

## 🧬 How the capstone maps to KSA

| Capstone element | Evidences | Component |
| ---------------- | --------- | --------- |
| Process discipline + symptom/root-cause distinction | The problem-solving process | 🧠 K-process |
| Naming trade-offs; catching a bias in the reflection | Decisions & cognitive biases | 🧠 K-decisions-biases |
| Sharp, decomposed problem statement | Define & decompose | 🛠️ S-frame (L2) |
| 5 Whys / fishbone + a real test | Root cause analysis | 🛠️ S-root-cause (L2) |
| Options + weighted decision matrix + choice | Generate & choose solutions | 🛠️ S-solutions (L2) |
| Staying with the messy problem; refining vs. forcing | Persistence & ambiguity tolerance | 🌱 A-persistence (L2) |
| Questioning assumptions; handling challenge questions | Critical, curious thinking | 🌱 A-critical-curious (L2) |
| Defense + peer review + reflection | Collaboration & reflection | (capstone-5 collaboration) |

> The Abilities (`A-persistence`, `A-critical-curious`) are confirmed here as the **3rd observed
> occasion**, after Atom 5 and across the course.

---

## ✅ Grading

Atom-level checks (`knowledge-mini`, `skill`, `behavioral`) gate entry to the capstone, which is then
scored on the standard 5-criteria **Assessment Rubric** below (also in [`rubrics.md`](rubrics.md)).

## 📋 Assessment Rubric

Five criteria across four proficiency bands, weighted to **100 points**.

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | A real, well-scoped problem run through the full process to a defensible solution. | Relevant; process mostly complete. | Process partial or problem trivial. | Off-target or solution-jumped. | **20 pts** |
| **Application of skills** | Framing, root-cause analysis, and decision matrix all used correctly and naturally. | Most used correctly, minor gaps. | Several gaps (weak diagnosis, gut decision). | Minimal/incorrect application. | **25 pts** |
| **Problem-solving (depth & rigor)** | Tests the root cause; trade-offs explicit; reversible pilot; reasoning sound. | Adequate rigor. | Shallow diagnosis or unsupported choice. | No real analysis. | **20 pts** |
| **Clarity & communication (defense)** | Defense is clear and logical; handles challenge questions well. | Generally clear. | Uneven or hard to follow. | Unclear/missing. | **15 pts** |
| **Collaboration & reflection** | Persistence + critical curiosity evident; insightful peer review + honest reflection (bias caught). | Adequate review + reflection. | Minimal. | Missing. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

> **Pass for the badge:** atom-level checks ≥ 2 each (incl. the behavioral assessment), Assessment
> Rubric weighted score ≥ 70% (at least *Developing* on every criterion), and the peer review +
> reflection completed — **verified by a mentor/instructor** (human-in-the-loop). See
> [`skills-map.md`](skills-map.md) for what the badge unlocks.
</script>

## 🎯 Target job competency

**Solve problems methodically.** Employers don't just want answers — they want people who can take an
ambiguous, messy situation, **figure out what the real problem is**, **diagnose why it's happening**,
and **choose a defensible solution** under constraints. It is one of the most-requested competencies
across every function. Mapped to **O\*NET** (Complex Problem Solving, Critical Thinking, Judgment &
Decision Making) and **ESCO** transversal *"solve problems / think analytically."*

## 🧬 KSA breakdown — a cognitive skill, taught the right way

| KSA | Component | Why this type | Target |
| --- | --------- | ------------- | ------ |
| 🧠 Knowledge | The problem-solving process & mindset | A mental model that stops "solution-jumping" | L2 |
| 🧠 Knowledge | Decisions & cognitive biases | You can't counter biases you can't name | L2 |
| 🛠️ Skill | Define & decompose | A trainable technique (problem statement, breakdown) | **L2** |
| 🛠️ Skill | Root cause analysis | 5 Whys / fishbone / hypotheses — practiced on cases | **L2** |
| 🛠️ Skill | Generate & choose solutions | Divergent options + convergent decision matrix | L2 |
| 🌱 Ability | Persistence & ambiguity tolerance | A disposition shown across situations, over time | L2 |
| 🌱 Ability | Critical, curious thinking | A habit of questioning assumptions | L2 |

> **Why this shape:** problem solving is mostly **doing** (Skills: frame, diagnose, decide), but it
> only *works* when paired with the **Abilities** that drive it — persistence (to stay with hard,
> unclear problems) and critical curiosity (to question the obvious). Those Abilities are assessed
> **behaviorally, across ≥3 occasions**, not with a quiz.

## 📘 Learning objectives (Bloom + KSA)

| Objective | Bloom | KSA | Component | Target |
| --------- | ----- | --- | --------- | ------ |
| Explain the problem-solving process and distinguish symptom from root cause | Understand | 🧠 K | K-process | L2 |
| Recognize common cognitive biases and how they distort decisions | Understand | 🧠 K | K-decisions-biases | L2 |

<script type="text/markdown" data-path="examples/problem-solving-micro-credential/rubrics.md"># 📊 Rubrics — Problem Solving

All rubrics for this micro-credential. Atom-level rubrics are **formative** (gate progress); the
**capstone-5** rubric is the **summative** Assessment Rubric. Abilities are scored **behaviorally
across ≥3 occasions**, never with a quiz.

> See the rubric philosophy in [`../../guides/curriculum-design-guide.md`](../../guides/curriculum-design-guide.md)
> and the standard rubric in [`../../templates/micro-credential-ada-template.md`](../../templates/micro-credential-ada-template.md).

---

## 1) `knowledge-mini` — for Knowledge atoms (Atoms 1–2)

Formative checks for understanding (used by the pop quizzes).

| Criterion | Pass (✓) | Not yet (✗) |
| --------- | -------- | ----------- |
| **Comprehension** | Explains the process / a bias in own words | Recites without understanding |
| **Application** | Spots symptom-vs-cause or a bias in a scenario | Cannot transfer to a new case |
| **Reflection** | Connects the idea to a real problem | No connection made |

Pass = all ✓. Retake allowed.

---

## 2) `skill` — for Skill atoms (Atoms 3–4)

| Criterion | Excellent (3) | Adequate (2) | Needs work (1) |
| --------- | ------------- | ------------ | -------------- |
| **Define & decompose (Atom 3)** | Sharp, measurable, solution-free statement; MECE tree | Mostly clear + a breakdown | Vague / hides a solution |
| **Root cause (Atom 4)** | Reaches actionable cause; tests it | Some digging + a test | Stops at symptom; assumes cause |
| **Bias awareness** | Seeks disconfirming evidence | Some | Confirmation-driven |

Pass = 2+ on each relevant row → **L2** for the targeted Skill.

---

## 3) `behavioral` — for the Abilities (Atom 5, capstone, across the course)

Scored by **observation across ≥3 occasions** (Atom 5 challenge + pair review, the capstone defense,
and general participation). The Ability is credited only if it shows up **consistently.**

| Ability | Looks like (✓) | Doesn't look like (✗) | Occasions |
| ------- | -------------- | --------------------- | --------- |
| **Persistence & ambiguity tolerance (`A-persistence`)** | Stays with hard/unclear problems; refines instead of forcing | Grabs a premature answer; quits when foggy | Atom 5, capstone, throughout |
| **Critical, curious thinking (`A-critical-curious`)** | Questions assumptions; asks why/what-if; welcomes challenge | Accepts the obvious; defends first instinct | Atom 5, capstone, throughout |

Credit at **L2** = observed ✓ in **at least 3 occasions** (the capstone alone is not enough).

---

## 4) `capstone-5` — summative Assessment Rubric (the badge gate)

The standard ADA 5-criteria / 4-band / 100-point rubric. Identical to the table in
[`capstone.md`](capstone.md):

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | A real, well-scoped problem run through the full process to a defensible solution. | Relevant; process mostly complete. | Process partial or problem trivial. | Off-target or solution-jumped. | **20 pts** |
| **Application of skills** | Framing, root-cause analysis, and decision matrix all used correctly and naturally. | Most used correctly. | Several gaps. | Minimal/incorrect. | **25 pts** |
| **Problem-solving (depth & rigor)** | Tests the root cause; trade-offs explicit; reversible pilot. | Adequate rigor. | Shallow diagnosis / unsupported choice. | No real analysis. | **20 pts** |
| **Clarity & communication (defense)** | Clear, logical defense; handles challenge questions. | Generally clear. | Uneven. | Unclear/missing. | **15 pts** |
| **Collaboration & reflection** | Persistence + critical curiosity evident; insightful review + honest reflection. | Adequate. | Minimal. | Missing. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

---

## 🏅 Badge issuance — *Problem Solver*

Issued when **all** hold (mentor-verified — human-in-the-loop):

- [ ] **Knowledge:** Atoms 1–2 pop quizzes passed.
- [ ] **Skills:** Atom 3 (frame) + Atom 4 (root cause) performance tasks ≥ 2 each → **L2.**

<script type="text/markdown" data-path="examples/python-variables-micro-credential/capstone.md"># 🚀 Capstone — *Ship a Small Program with Variables*

The capstone is delivered as [Atom 5](atoms/atom-5-mini-project-capstone.md). This file is the
**grading brief**: what learners submit, how it maps to KSA, and the showcase format.

---

## 🎯 The brief

> Build a short Python program (**~15–30 lines**) that collects inputs, computes something useful
> using variables, and prints a clean, formatted summary with f-strings — then peer-review a
> classmate's program and do a 30–60s showcase.

The point is a **small, correct, readable** program you can explain — not a big one. An entry-level
task is exactly this: take some data, transform it correctly, present it clearly, and talk through
your choices.

---

## 📦 What to submit

- [ ] **The program** — valid PEP 8 `snake_case` names; at least **3 different data types**; at
  least **one type conversion**; output formatted with **f-strings**.
- [ ] **A sample run** — the inputs you gave and the printed output.
- [ ] **A mini-README** (4–6 lines) — what it does, how to run it, one thing you'd improve.
- [ ] **A peer review you gave** — the Atom 5 checklist applied to a classmate's program.

---

## 🎤 Showcase structure (30–60 seconds)

1. **What it does** (10s) — one sentence.
2. **A variable choice** (20s) — a naming/type decision and why.
3. **A bug you hit** (20s) — what the error message said and how you fixed it.
4. **One improvement** (10s) — what you'd add next.

---

## 🧬 How the capstone maps to KSA

| Capstone element | Evidences | Component |
| ---------------- | --------- | --------- |
| Correct use of types and a conversion | Understands types & casting | 🧠 K-var-concept, K-data-types |
| Valid, readable PEP 8 variable names | Declaring & naming variables | 🛠️ S-declare-assign (L2) |
| Expressions + f-string output that runs | Using/converting/formatting values | 🛠️ S-use-values (L2) |
| Diagnosing the bug you describe in the showcase | Reading errors, fixing details | 🌱 A-attention-detail (L2) |
| Peer review given + improvement applied | Collaboration & reflection | (capstone-5 collaboration) |

---

## ✅ Grading

Atom-level checks (`knowledge-mini`, `skill`) gate entry to the capstone, which is then scored on
the standard 5-criteria **Assessment Rubric** below (also in [`rubrics.md`](rubrics.md)).

## 📋 Assessment Rubric

Five criteria across four proficiency bands, weighted to **100 points**.

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | Program clearly meets the brief and uses variables meaningfully and purposefully. | Program meets the brief; variable use mostly purposeful. | Program loosely meets the brief; trivial or forced variable use. | Off-target or trivial; brief not met. | **20 pts** |
| **Application of skills** | Names, types, conversion, expressions, f-strings, functions + unit tests all used correctly. | Most used correctly, with minor errors. | Several gaps (e.g. missing conversion, weak names, no tests). | Minimal or incorrect application. | **25 pts** |
| **Problem-solving** | Handles inputs sensibly; bugs found via tests/errors, fixed and explained. | Works on normal input; fixes most issues. | Works partially; some bugs unresolved. | Frequently broken; errors unresolved. | **20 pts** |
| **Clarity & communication** | Clean output + clear mini-README + crisp showcase. | Generally clear output and docs. | Uneven; missing README or unclear output. | Unclear or missing. | **15 pts** |
| **Collaboration & reflection** | Useful peer review given; applied a fix; honest, specific reflection. | Adequate peer review and reflection. | Minimal review / reflection. | None. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

> **Pass for the badge:** the program runs and meets the brief, Assessment Rubric weighted score
> ≥ 70% (at least *Developing* on every criterion), and the peer review + showcase are completed —
> **verified by an instructor**. See [`skills-map.md`](skills-map.md) for what the badge unlocks.
</script>
<script type="text/markdown" data-path="examples/python-variables-micro-credential/labs.md"># 🧪 Labs & Tests — runnable code for the codelabs

Every codelab in this micro-credential ships as **real, runnable Python** with a `main()` to run
it and a **unit-test file** to prove it works. The files live in
[`labs/`](labs/) and are the source of truth — the snippets inside the atoms are excerpts of these.

> 🧠 **Why this matters (the method):** putting logic in small **functions** and verifying them
> with **unit tests** is exactly the *attention-to-detail / debugging* Ability (`A-attention-detail`)
> this course builds. Tests turn "I think it works" into "I can prove it works."

---

## ▶️ How to run everything

```bash
# from the course folder
cd labs

# run any program (it asks for input):
python3 profile_card.py
python3 tip_calculator.py
python3 receipt.py

# run a single test file:
python3 -m unittest test_tip_calculator.py

# run ALL tests at once (auto-discovers test_*.py):
python3 -m unittest discover -v
```

A green run looks like this:

```text
Ran 13 tests in 0.001s

OK
```

---

## 🔁 The test-driven loop (how to use the tests while you build)

```mermaid
flowchart LR
  WRITE["✍️ Write / change a function"] --> RUN["🏃 Run the tests"]
  RUN --> PASS{"All green?"}
  PASS -->|❌ no| READ["🔎 Read the failure<br/>(expected vs actual)"]
  READ --> FIX["🛠️ Fix the code"]
  FIX --> RUN
  PASS -->|✅ yes| SHIP["🚀 Ship / next feature"]
```

### `profile_card.py` (Atom 3)

```python
def calculate_age(birth_year, current_year):
    return current_year - birth_year

def make_profile_card(name, birth_year, favorite_language, current_year):
    age = calculate_age(birth_year, current_year)
    return (
        "----- PROFILE -----\n"
        f"Name:     {name}\n"
        f"Age:      {age}\n"
        f"Codes in: {favorite_language}"
    )

def main():
    name = input("Name? ")
    birth_year = int(input("Birth year? "))
    favorite_language = input("Favorite language? ")
    print(make_profile_card(name, birth_year, favorite_language, 2026))

if __name__ == "__main__":
    main()
```

### `tip_calculator.py` (Atom 4)

```python
def calculate_tip(bill, tip_percent):
    return bill * tip_percent / 100

def grand_total(bill, tip_percent):
    return bill + calculate_tip(bill, tip_percent)

def per_person(total, people):
    if people <= 0:
        raise ValueError("people must be greater than 0")
    return total / people

def main():
    bill = float(input("Bill amount? "))
    tip_percent = int(input("Tip %? "))
    people = int(input("Split between how many? "))
    total = grand_total(bill, tip_percent)
    print(f"Grand total: ${total:.2f}")
    print(f"Each person pays: ${per_person(total, people):.2f}")

if __name__ == "__main__":
    main()
```

### `receipt.py` (Atom 5 capstone)

```python
TAX_RATE = 0.19

def subtotal(unit_price, quantity):
    return unit_price * quantity

def apply_tax(amount, rate=TAX_RATE):
    return amount * (1 + rate)

def build_receipt(item_name, unit_price, quantity, rate=TAX_RATE):
    sub = subtotal(unit_price, quantity)
    tax = sub * rate
    total = sub + tax
    return (
        "----- RECEIPT -----\n"
        f"{item_name} x{quantity} @ ${unit_price:.2f}\n"
        f"Subtotal: ${sub:.2f}\n"
        f"Tax ({rate*100:.0f}%): ${tax:.2f}\n"
        f"TOTAL:    ${total:.2f}"
    )

def main():
    item_name = input("Item name? ")
    unit_price = float(input("Unit price? "))
    quantity = int(input("Quantity? "))
    print(build_receipt(item_name, unit_price, quantity))

if __name__ == "__main__":
    main()
```

### Example test file — `test_tip_calculator.py`

```python
import unittest
from tip_calculator import calculate_tip, grand_total, per_person

class TestTipCalculator(unittest.TestCase):
    def test_calculate_tip(self):
        self.assertAlmostEqual(calculate_tip(100, 15), 15.0)

    def test_grand_total(self):
        self.assertAlmostEqual(grand_total(100, 15), 115.0)

    def test_per_person_splits_evenly(self):
        self.assertAlmostEqual(per_person(120, 4), 30.0)

    def test_per_person_rejects_zero_people(self):
        with self.assertRaises(ValueError):
            per_person(100, 0)

if __name__ == "__main__":
    unittest.main()
```

---

## ✅ Common assertions you'll use

| Assertion | Checks | Use for |
| --------- | ------ | ------- |
| `assertEqual(a, b)` | `a == b` | ints, strings, exact values |
| `assertAlmostEqual(a, b)` | `a ≈ b` | `float` math (avoids rounding traps) |
| `assertIn(x, text)` | `x in text` | a substring is present in output |
| `assertTrue(x)` / `assertFalse(x)` | truthiness | booleans / conditions |
| `assertRaises(Error)` | code raises | bad input is rejected safely |

> ⚠️ **Human-in-the-loop:** tests prove the code does what *you specified*. A mentor still checks
> that you specified the *right* behavior — green tests are necessary, not sufficient.
</script>

## 🎯 Target job competency

script, notebook, and app. Appears in postings as *"Python (basic)", "scripting", "able to write
simple programs", "data manipulation".* Mapped to **SFIA PROG** (level 1–2), **O\*NET** Programmer /
Software Developer tasks, and **ESCO** *"use a programming language / Python"*.

## 🧬 KSA breakdown — a first skill, taught the right way

| KSA | Component | Why this type | Target |
| --- | --------- | ------------- | ------ |
| 🧠 Knowledge | What a variable is (name → value; the label model; dynamic typing) | A small mental model you must *understand* before coding | L1 |
| 🧠 Knowledge | Core data types & conversion (`int`, `float`, `str`, `bool`) | Prevents the #1 beginner bug ("number is a string") | L2 |
| 🛠️ Skill | Declare / name / reassign variables (PEP 8) | A concrete move practiced in a codelab | **L2** |
| 🛠️ Skill | Use variables in expressions, convert types, f-strings | The *useful* payoff — make the data do something | **L2** |
| 🌱 Ability | Attention to detail / debugging mindset | Reading errors & fixing typos is a habit, shown across reps | L2 |

> **Why this shape:** a coding skill is mostly **doing**, with just enough **Knowledge** to avoid
> classic traps, plus the budding **Ability** to slow down, read an error, and fix it — the habit
> that separates someone who "did a tutorial" from someone who can actually program.

## 📘 Learning objectives (Bloom + KSA)

| Objective | Bloom | KSA | Component | Target |
| --------- | ----- | --- | --------- | ------ |
| Explain what a variable is and how a name is bound to a value | Understand | 🧠 K | K-var-concept | L1 |
| Identify Python's core data types and predict `type()` results | Understand | 🧠 K | K-data-types | L2 |
| Declare, assign, and reassign variables with readable PEP 8 names | Apply | 🛠️ S | S-declare-assign | L2 |
| Use variables in expressions, convert types, and format with f-strings | Apply | 🛠️ S | S-use-values | L2 |
| Organize logic into functions with a `main()` runner | Apply | 🛠️ S | S-use-values | L2 |
| Write and run a basic unit test (`unittest`) to verify a function | Apply | 🌱 A | A-attention-detail | L2 |
| Read an error message and fix a naming/type bug | Apply | 🌱 A | A-attention-detail | L2 |

Full brief in [`capstone.md`](capstone.md); all rubrics in [`rubrics.md`](rubrics.md). In short:

- An accurate mental model of variables, types, and dynamic typing (no magic).

<script type="text/markdown" data-path="examples/python-variables-micro-credential/rubrics.md"># 📊 Rubrics — Python Variables Micro-Credential

All assessment instruments used across the course. Atoms reference these by `rubric` flavor:
`knowledge-mini`, `skill`, `capstone-5` (plus a `code-quality` lens applied throughout).

---

## 🔹 `knowledge-mini` — concept checks (Atoms 1–2)

Quick formative check; used for the pop quizzes.

| Criterion | Excellent (3) | Adequate (2) | Needs improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Accuracy** | All answers correct; predicts `type()`/conversion results | Mostly correct | Repeats a misconception (e.g. `=` means `==`) |
| **Vocabulary** | Uses terms correctly (assign, type, convert, concatenate) | Roughly right | Vague / wrong terms |
| **Self-application** | Connects to own code example | Generic example | None |

> Pass = 2+ on each. Knowledge here is **L1–L2** — it enables the Skills that follow.

---

## 🔹 `skill` — performance mini-rubric (Atoms 3–4)

For the naming/assignment codelab and the expressions/conversion/f-strings codelab.

| Criterion | Excellent (3) | Adequate (2) | Needs improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Correct mechanics** | Assignment, reassignment, swap, expressions all work | Minor gaps | Code doesn't run |
| **Naming (PEP 8)** | All names valid, descriptive `snake_case` | Mostly good | Cryptic / invalid names |
| **Types & conversion** | Converts input correctly; right type everywhere | One slip | Type bugs unresolved |
| **Reads errors** | Diagnoses Syntax/Name/Type errors and fixes them | Fixes with hints | Guesses randomly |

> Pass = 2+ on each → **L2** evidence for the relevant Skill component.

---

## 🔹 `code-quality` — the attention-to-detail lens (applied across Atoms 3–5) ⭐

The lens that builds the **Ability** `A-attention-detail`. A habit, not a single moment — looked
for across the **3 assessed occasions** (two codelabs + the capstone).

| Criterion | Excellent (3) | Adequate (2) | Needs improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Readability** | Clear names, tidy layout, helpful comment where needed | Generally readable | Hard to follow |
| **Error handling habit** | Reads the error message and fixes the real cause | Fixes eventually | Ignores / works around |
| **Runs clean** | No errors on normal input across all occasions | Occasional slip | Frequently broken |

> Consistent 2+ across occasions supports **L2** for `A-attention-detail`.

---

## ✨ `capstone-5` — Assessment Rubric (standard ADA capstone)

The capstone is scored on **five criteria** across **four proficiency bands**, weighted to a total
of **100 points**. Each criterion's band sets how much of its weight is earned. **Pass = ≥ 70%
overall with at least *Developing* on every criterion**, instructor-verified (human-in-the-loop).

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | Program clearly meets the brief and uses variables meaningfully and purposefully. | Program meets the brief; variable use mostly purposeful. | Program loosely meets the brief; trivial or forced variable use. | Off-target or trivial; brief not met. | **20 pts** |
| **Application of skills** | Names, types, conversion, expressions, f-strings, functions + unit tests all used correctly. | Most used correctly, with minor errors. | Several gaps (e.g. missing conversion, weak names, no tests). | Minimal or incorrect application. | **25 pts** |
| **Problem-solving** | Handles inputs sensibly; bugs found via tests/errors, fixed and explained. | Works on normal input; fixes most issues. | Works partially; some bugs unresolved. | Frequently broken; errors unresolved. | **20 pts** |
| **Clarity & communication** | Clean output + clear mini-README + crisp showcase. | Generally clear output and docs. | Uneven; missing README or unclear output. | Unclear or missing. | **15 pts** |
| **Collaboration & reflection** | Useful peer review given; applied a fix; honest, specific reflection. | Adequate peer review and reflection. | Minimal review / reflection. | None. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

> **Badge pass:** atom-level `skill` checks ≥ 2 each AND Assessment Rubric weighted ≥ 70%
> (at least *Developing* on every criterion), **instructor-verified** (human-in-the-loop).

---

<script type="text/markdown" data-path="examples/self-learning-micro-credential/capstone.md"># 🚀 Capstone — *Teach Yourself Something New & Teach It Back*

The capstone is delivered as [Atom 6](atoms/atom-6-capstone-learn-something-new.md). This file is the
**grading brief**: what learners submit, how it maps to KSA, and the showcase format.

---

## 🎯 The brief

> Choose a **genuinely new micro-skill** you can reach a basic working level in within the course
> window (~3–6 focused hours). **Learn it** using search + AI + free online resources, running the
> self-learning loop. **Document the process** in a learning log — including the failures and how you
> **verified** information. Produce a small **artifact** that demonstrates the skill, then **teach it
> back** and peer-review a classmate.

The point is a **well-run learning process you can teach** — integrating the whole course — not
mastering something large.

---

## 📦 What to submit

- [ ] **The artifact** — the thing you made / can now do (file, link, recording, or live demo).
- [ ] **A learning log** — goal, resources (with why + verification), **≥3 documented failures and the
  lesson from each**, self-tests, and reflections across the loop cycles.
- [ ] **A source & AI audit** — ≥3 claims you verified, the trustworthy sources used, and any AI output
  you caught being wrong/unverifiable.
- [ ] **A teach-back** — a 3–5 minute explanation (live or recorded) that teaches the basics, including
  one thing that tripped you up and how you got past it.
- [ ] **A peer review you gave** — the capstone rubric applied to a classmate, with specific, kind,
  useful feedback.

---

## 🎤 Showcase / teach-back structure (≈ 5 minutes)

1. **What & why** (30s) — the skill and the curiosity behind it.
2. **Teach the basics** (2–3 min) — explain it so a beginner could start; show the artifact.
3. **The messy middle** (1 min) — a failure that taught the most, and how you got unstuck.
4. **How you knew it was true** (30s) — one thing you verified + one AI limitation you hit.

---

## 🧬 How the capstone maps to KSA

| Capstone element | Evidences | Component |
| ---------------- | --------- | --------- |
| Reframing the struggle in the log; "failing forward" | How learning works | 🧠 K-learning-process |
| Source & AI audit | Trustworthy sources & LLM limits | 🧠 K-sources-and-ai-limits |
| Finding & triangulating resources | Research with search | 🛠️ S-search-research (L2) |
| Using AI to explain + verifying it | Learn with AI | 🛠️ S-learn-with-ai (L2) |
| Running the full loop to a demonstrable artifact | Self-learning loop | 🛠️ S-learning-loop (L2) |
| Driving own learning; chasing questions | Curiosity & learner agency | 🌱 A-curiosity (L2) |
| Persisting through documented failures | Resilience / failing forward | 🌱 A-resilience-failure (L2) |
| Teach-back + peer review + reflection | Collaboration & reflection | (capstone-5 collaboration) |

> The Abilities (`A-curiosity`, `A-resilience-failure`) are confirmed here as the **3rd observed
> occasion**, after Atom 5 and across the course.

---

## ✅ Grading

Atom-level checks (`knowledge-mini`, `skill`, `behavioral`) gate entry to the capstone, which is then
scored on the standard 5-criteria **Assessment Rubric** below (also in [`rubrics.md`](rubrics.md)).

## 📋 Assessment Rubric

Five criteria across four proficiency bands, weighted to **100 points**.

| Criteria | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Initial (69% or less) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Relevance (competency alignment)** | A genuinely new, well-scoped skill learned to a demonstrable level via online + AI + search. | Relevant skill; mostly demonstrable. | Skill too easy/vague, or weakly demonstrated. | Off-target or pre-known. | **20 pts** |
| **Application of skills** | Search, AI-with-verification, and the full learning loop are all used correctly and naturally. | Most used correctly, minor gaps. | Several gaps (no verification, skipped loop steps). | Minimal/incorrect application. | **25 pts** |
| **Problem-solving (learn by failing)** | Documents real failures, mines each for a lesson, and adapts; clear "failing forward". | Documents some failures + lessons. | Mentions struggle vaguely. | Hides struggle / gave up. | **20 pts** |
| **Clarity & communication (teach-back)** | Teaches the basics clearly; a beginner could start; process explained well. | Generally clear teach-back. | Uneven or hard to follow. | Unclear or missing. | **15 pts** |
| **Collaboration & reflection** | Curiosity evident; sharp source/AI audit; insightful peer review + honest reflection. | Adequate audit, review, reflection. | Minimal. | Missing. | **20 pts** |
| **TOTAL** | | | | | **100 pts** |

> **Pass for the badge:** atom-level checks ≥ 2 each (incl. the behavioral assessment), Assessment
> Rubric weighted score ≥ 70% (at least *Developing* on every criterion), and the peer review +
> reflection completed — **verified by a mentor/instructor** (human-in-the-loop). See
> [`skills-map.md`](skills-map.md) for what the badge unlocks.
</script>

## 🎯 Target job competency

**Learn independently and continuously.** Employers increasingly hire for *learning agility* — the
capacity to pick up new tools, domains, and problems without being formally taught. This credential
makes that hireable: the learner can find trustworthy answers online, use AI as a study partner
(without being misled by it), and run a disciplined self-learning loop. Mapped to **O\*NET** process
skills (Active Learning, Learning Strategies, Critical Thinking), **ESCO** *"learn to learn"*, and
**DigComp** area 1 (information & data literacy).

## 🧬 KSA breakdown — the meta-skill, taught the right way

| KSA | Component | Why this type | Target |

| 🧠 Knowledge | How learning works (process > answer; productive failure) | A mental model that reframes struggle as learning | L2 |
| 🧠 Knowledge | Trustworthy sources & LLM limits | You can't verify what you don't understand | L2 |
| 🛠️ Skill | Research with search engines | A trainable technique (queries, operators, triangulation) | **L2** |
| 🛠️ Skill | Learn with AI (+ verify) | Basic prompting *paired with* verification | **L2** |
| 🛠️ Skill | The self-learning loop | A repeatable procedure for any new topic | L2 |
| 🌱 Ability | Curiosity & learner agency | A disposition shown across situations, over time | L2 |
| 🌱 Ability | Resilience (learn by failing) | A habit of persisting through being stuck/wrong | L2 |

> **Why this shape:** self-learning is mostly **doing** (Skills: search, prompt, loop), but it only
> *sticks* when paired with the **Abilities** that drive it — curiosity (to keep asking) and
> resilience (to keep going when you fail). Those Abilities are assessed **behaviorally, across ≥3
> occasions**, never with a quiz.

All rubrics for this micro-credential. Atom-level rubrics are **formative** (gate progress); the
**capstone-5** rubric is the **summative** Assessment Rubric. Abilities are scored **behaviorally
across ≥3 occasions**, never with a quiz.
