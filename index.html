<script type="text/markdown" data-path="examples/growth-mindset-micro-credential/atoms/atom-6-growth-in-the-wild-capstone.md">## ⚛ Learning Atom 6 — *Growth in the Wild (21-Day Challenge)* · 🚀 Capstone

**Phase:** 🐵 4 · Collaboration & Reflection (*share*) · **KSA:** 🌱 Ability · **Target level:** L3
· **Component id:** `A-growth-mindset` (+ `A-adaptability`)

### 🎯 Learning objective

- **Sustain and evidence** a growth mindset on a *real* stretch goal over 21 days — running
  deliberate-practice loops, reframing setbacks, seeking feedback, and reflecting — culminating
  in a peer-reviewed showcase.

### 🧩 Prerequisites

- All prior atoms. A genuine, slightly scary stretch goal you can move on for three weeks.

### 🧭 Atom description

An attitude is proven by **behavior across time**, so the capstone is not a presentation you make
*about* growth mindset — it's three weeks of *living it* on something that matters, documented as
you go. This is the atom that turns the badge from "knows about" into "does." It integrates every
KSA in the course.

> 📄 The full grading brief is in [`../capstone.md`](../capstone.md); rubrics in
> [`../rubrics.md`](../rubrics.md).

---

### 🧪 The challenge

1. **Choose a stretch goal (Day 0).** Real and uncomfortable: *"run my first design review,"
   "ship a feature in an unfamiliar language," "give a talk at the team demo."* It must have a
   visible outcome and room to fail.
2. **Design the loop (Day 0).** Define your stretch targets, your feedback source(s), and a
   daily 20–40 min practice block. (Reuses Atom 4.)
3. **Run it for 21 days.** Each session: one deliberate-practice rep + capture feedback. Each
   time you hit a wall, run the **YET Loop** and log it. (Reuses Atoms 3–4.)
4. **Seek feedback weekly (×3 occasions).** A specific ask to a specific person each week.
   (Reuses Atom 5.)
5. **Keep a growth journal.** A short daily/most-days entry: what you attempted, what failed,
   what you learned, the next reach. (`read: Journal / Diary` modality.)
6. **Showcase (Demo Day).** A 5-minute share to the cohort: the goal, your biggest *useful*
   failure, what the feedback changed, and your evidence. Then a **peer + mentor 360**.

This gives the **5 assessed occasions** the primary Ability requires: the curveball reframes,
three feedback asks, the sustained journal, and the showcase.

---

### 📖 Read — Growth journal (your own, Journal / Diary)

Use this lightweight daily template (most days for 21 days):

```text
Day __ / 21   ·   Goal: ____________________
- Attempted today:
- Where it got hard (and my YET Loop reframe):
- Feedback / data I got:
- What I learned → next reach:
- Mindset self-rating (1 fixed ··· 5 growth): __
```

<script type="text/markdown" data-path="examples/innovation-creativity-micro-credential/atoms/atom-1-what-is-creativity-and-innovation.md">## ⚛ Learning Atom 1 — *What Creativity & Innovation Are*

**Phase:** 🙉 1 · Self-Guided Introduction (*hear*) · **KSA:** 🧠 Knowledge · **Target level:** L2
· **Component id:** `K-creativity-innovation`

### 🎯 Learning objective

- **Explain** divergent vs. convergent thinking and **how creativity becomes innovation** — and bust
  the common myths about who gets to be creative.

### 🧩 Prerequisites

- None. Bring one thing you wish worked better (a product, a process, a chore) — your raw material.

### 🧭 Atom description

Most people think creativity is a personality trait you're born with or without. It isn't. Creativity
is a **process** anyone can learn, and innovation is what happens when you carry that process all the
way to **real value.** This atom installs the core vocabulary the rest of the course builds on.

---

### 📖 Reading — *Creativity is a process, not a gift* (≈ 7 min)

**Two definitions, one relationship:**

- **Creativity** = generating ideas that are both **novel** *and* **useful/relevant** in context. (Just
  novel = random; just useful = ordinary. Creativity needs both.)
- **Innovation** = **creativity + execution that creates value.** An idea in your head isn't an
  innovation. A creative idea that's built, adopted, and makes something better — *that's* innovation.

> A useful shorthand: **Innovation = Idea × Execution × Value.** A brilliant idea with no execution is
> worth ~zero; flawless execution of a worthless idea is also ~zero.

**The two modes of thinking (you need both):**

- **Divergent thinking** — open up: generate *many* options, defer judgment, chase quantity and
  variety. This is where ideas are *born.* Measured by **fluency** (how many), **flexibility** (how
  many *kinds*), and **originality** (how rare).
- **Convergent thinking** — narrow down: evaluate, combine, and choose using criteria. This is where
  ideas get *better and real.*

The classic failure mode is mixing them: judging ideas the moment they appear kills divergence. The
discipline is to **separate** the modes — diverge fully, *then* converge.

**The creative process (a simple, repeatable loop):**

1. **Understand & reframe** the problem (Atom 3).
2. **Diverge** — generate lots of ideas (Atom 4).
3. **Converge** — select and develop the best (Atom 5).
4. **Prototype & test** — make it real enough to learn (Atom 5).
5. **Iterate** — repeat with what you learned.

**Three myths to drop now:**

- *"Creativity is a talent you have or don't."* → It's a **skill**; practice and method raise everyone's output.
- *"Great ideas arrive as flashes of genius."* → They usually **combine existing ideas** in new ways
  (often across domains) and emerge from *volume* + iteration.
- *"Constraints kill creativity."* → Constraints **focus** it. A blank page is paralyzing; a sharp
  constraint ("design it for a 5-year-old / for $5 / in one tap") sparks ideas.

**Key takeaways**

- [ ] **Creativity** = novel **and** useful; **innovation** = creativity **+ execution + value.**
- [ ] **Diverge** (generate, defer judgment) then **converge** (evaluate, choose) — never at once.
- [ ] Creativity is a **process/skill**, not a fixed gift.
- [ ] **Constraints fuel** creativity; ideas usually **combine** existing things.

---

```youtube
https://www.youtube.com/watch?v=16p9YRF0l-g

```

```youtube
https://www.youtube.com/watch?v=UAinLaT42xY
TED — Tim Brown: "Tales of creativity and play" / design thinking overview (verify before delivery).
```

---

  P["🎯 Reframed problem"] --> DIV["🔀 Diverge<br/>many ideas · defer judgment"]
  DIV --> CONV["🎯 Converge<br/>evaluate · choose"]
  CONV --> PROTO["🛠️ Prototype & test"]
  PROTO --> VALUE["💎 Innovation = value"]
```

![The creative process — generated diagram](../img/atom-1-what-is-creativity-and-innovation.png)

```prompt

---

### ✅ Evaluate — Pop quiz (formative, `knowledge-mini`)

1. What's the difference between creativity and innovation?
2. Why must divergent and convergent thinking be kept separate?
3. True or false: constraints reduce creativity. Explain.

<details>
<summary>Answer key</summary>

1. **Creativity** = generating novel *and* useful ideas; **innovation** = taking a creative idea
   through **execution** so it creates real **value.**
2. Because judging ideas while generating them (convergent during divergent) shuts down idea flow — you
   self-censor before options exist. Diverge fully first, *then* evaluate.
3. **False.** Well-chosen **constraints focus** creativity and spark ideas; a totally blank page is
   often paralyzing.

</details>

---

  **execution** would take, and (c) the **value** it would create — your first Idea × Execution × Value.

- IDEO / d.school — design thinking and the diverge–converge model.
- Amabile, *The Componential Theory of Creativity* (creativity = domain skills + creative thinking + motivation).

<script type="text/markdown" data-path="examples/innovation-creativity-micro-credential/atoms/atom-2-ideation-frameworks.md">## ⚛ Learning Atom 2 — *Ideation Frameworks*

**Phase:** 🙉 1 · Self-Guided Introduction (*hear*) · **KSA:** 🧠 Knowledge · **Target level:** L2
· **Component id:** `K-ideation-frameworks`

### 🎯 Learning objective

- **Describe** the major ideation frameworks and **explain when to use each** stage of the creative
  process.

### 🧩 Prerequisites

- Atom 1 (diverge/converge, idea → value). Frameworks are tools that plug into that loop.

### 🧭 Atom description

You don't have to wait for inspiration — you can *trigger* it with structured tools. This atom is a
field guide to the most useful ideation frameworks, mapped to *when* in the process each one helps.
Knowing the menu means you'll never stare at a blank page again.

---

### 📖 Reading — *A toolkit for triggering ideas* (≈ 8 min)

**Big-picture process framework:**

- **Design thinking** (Empathize → Define → Ideate → Prototype → Test). A human-centered loop that
  keeps ideas anchored to *real user needs.* Most other tools live inside its "Ideate" and "Prototype"
  stages. (This whole micro-credential roughly follows it.)

**Divergent (idea-generation) tools:**

- **Brainstorming — done right.** The original rules (Osborn) still hold: **defer judgment, go for
  quantity, welcome wild ideas, build on others' ideas ("yes, and").** Most "brainstorms" fail because
  they break rule one.
- **Brainwriting / 6-3-5.** Everyone writes ideas silently, then passes them on to build upon. Beats
  group brainstorming for quantity and fairness (no loud voices dominating, no anchoring).
- **SCAMPER.** A checklist to twist an existing thing: **S**ubstitute, **C**ombine, **A**dapt,
  **M**odify/Magnify, **P**ut to other use, **E**liminate, **R**everse. Great for improving products/processes.
- **Lateral thinking (de Bono).** Deliberately break patterns: random-word association, provocations
  ("Po: cars have square wheels"), challenging assumptions.
- **Analogies & cross-domain transfer.** "How does nature/another industry solve this?" (Velcro from
  burrs; bullet trains from kingfisher beaks.) Most breakthroughs are **borrowed** from elsewhere.
- **Constraints & "what if."** Add an extreme constraint ("for $1," "no screen," "in 10 seconds") or
  remove one ("infinite budget") to jolt new directions.
- **SCAMPER + AI.** Modern twist: use an LLM as an idea *multiplier* — but you steer, select, and judge
  (the convergence and taste are yours; Atom 4 covers this).

**Convergent (selection) tools:**

- **Affinity mapping** — cluster many ideas into themes to see patterns.
- **Dot voting** — quick, democratic shortlisting.
- **Criteria / impact–effort matrix** — score ideas on desirability, feasibility, viability (or
  impact vs. effort) to choose what to prototype (Atom 5).
- **Six Thinking Hats** — examine a chosen idea from multiple angles (facts, feelings, risks, benefits).

> **The meta-skill:** match the **tool to the stage.** Diverging? Reach for brainwriting, SCAMPER,
> analogies. Converging? Reach for affinity maps and an impact–effort matrix. Using a convergent tool
> while you should be diverging (or vice-versa) is the most common mistake.

**Key takeaways**

- [ ] **Design thinking** is the wrapping loop; most tools live in its Ideate/Prototype stages.
- [ ] Divergent tools: **brainstorming (defer judgment), brainwriting, SCAMPER, lateral thinking,
  analogies, constraints.**
- [ ] Convergent tools: **affinity mapping, dot voting, impact–effort matrix, Six Hats.**
- [ ] **Match the tool to the stage** — diverge with some, converge with others.

---

```prompt
Create a clean, modern infographic "Match the tool to the stage": a decision splits into "Divergent
tools (brainstorm, brainwriting, SCAMPER, lateral thinking, analogies, constraints)" and "Convergent
tools (affinity map, dot vote, impact-effort matrix, Six Hats)". Use ADA brand colors (Indigo #1E2A6E,
Turquoise #15B5C6, Gold #E0A53C), light background, flat vector, legible sans-serif. 16:9.
```

---

### ✅ Evaluate — Pop quiz (formative, `knowledge-mini`)

1. What does the "S" and "R" in SCAMPER stand for?
2. Why is brainwriting often better than group brainstorming for idea quantity?
3. Name one divergent and one convergent tool, and when you'd use each.

<details>
<summary>Answer key</summary>

1. **S** = Substitute; **R** = Reverse (or Rearrange). (Full set: Substitute, Combine, Adapt,
   Modify/Magnify, Put to other use, Eliminate, Reverse.)
2. It removes **anchoring** and **dominant voices** — everyone generates silently in parallel, so you
   get more diverse ideas without social pressure or groupthink.
3. e.g. **SCAMPER (divergent)** to generate variations of a product; **impact–effort matrix
   (convergent)** to pick which idea to prototype.

</details>

---

### 📦 Deliverable

- Pick the thing you want to improve (Atom 1). Run **SCAMPER** on it: write at least one idea per letter
  (7 ideas minimum).

### 🧠 Final reflection

- Which framework feels most natural to you, and which feels uncomfortable (often the most useful one)?

### 🔗 Sources to verify (human-in-the-loop)

- IDEO/d.school — *Design Thinking* bootleg & method cards.
- Osborn, *Applied Imagination* (brainstorming rules); Eberle (SCAMPER).
- de Bono, *Lateral Thinking* and *Six Thinking Hats*.

### 🧩 Connections

- **Predecessor:** Atom 1. **Successors:** Atom 3 (reframe first), Atom 4 (apply the divergent tools).
</script>
<script type="text/markdown" data-path="examples/innovation-creativity-micro-credential/atoms/atom-3-reframe-problems-and-spot-opportunities.md">## ⚛ Learning Atom 3 — *Reframe Problems & Spot Opportunities*

**Phase:** 🙈 2 · Visual Exploration (*see*) · **KSA:** 🛠️ Skill · **Target level:** L2
· **Component id:** `S-reframe-opportunities`

### 🎯 Learning objective

- **Reframe** a problem and **spot opportunities** by observing, finding insights, and writing sharp
  "How Might We" questions.

### 🧩 Prerequisites

- Atoms 1–2. The best ideas come from the best *questions* — so we start before ideation.

### 🧭 Atom description

Most weak ideas come from solving the wrong problem. This atom teaches the highest-leverage creative
move: **reframing.** Before generating a single idea, you sharpen *what* you're solving and *for whom*,
turning a vague complaint into a focused, generative opportunity question. It's in Phase 2 (*see*)
because you learn it by watching it modeled, then doing it on a real situation.

---

### 📖 Reading — *Solve the right problem* (≈ 8 min)

**Why reframing matters.** "Make a faster elevator" produces engineering ideas. Reframed to "make the
*wait* feel shorter," it produces *mirrors in the lobby* — cheaper, and it worked. Same situation, a far
better problem. The reframe is often worth more than the idea.

**Step 1 — Observe like an anthropologist (empathize).** Don't ask people what they want; watch what
they *do.* Look for:

- **Pain points** — where do people struggle, wait, complain, or improvise?
- **Workarounds** — homemade fixes reveal unmet needs (a sticky note on a screen = a missing feature).
- **Surprises** — anything that doesn't match what you expected is a clue.
- **Context** — when/where/with whom does this happen? (Jobs-to-be-done: *what is the user really
  trying to accomplish?*)

**Step 2 — Find the insight.** An insight is a *non-obvious truth* about the user that, once seen,
opens new solutions. It's deeper than an observation:

- Observation: *"People skip the onboarding tutorial."*
- Insight: *"People want to feel competent immediately; a tutorial signals 'this is hard.'"*

**Step 3 — Reframe with "How Might We" (HMW).** Turn the insight into an opportunity question that is:

- **Not too broad** ("HMW improve education?" — paralyzing) and **not too narrow** ("HMW add a blue
  button?" — that's a solution in disguise).
- **Solution-neutral** — it invites many answers, not one.
- **Human-centered** — it names *who* and *what outcome.*
- Example: *"How might we help new users feel competent in the first 60 seconds?"*

**Step 4 — Generate alternative frames.** A great practice: write the problem **5 different ways**
(broaden it, narrow it, flip it, change the user, change the goal). Pick the frame that feels most
generative — *then* ideate (Atom 4).

> **The move:** observe → insight → **HMW** question → pick the most generative frame. A sharp question
> makes ideation almost easy.

**Key takeaways**

- [ ] The **reframe** is often worth more than the idea — solve the *right* problem.
- [ ] **Observe behavior** (pains, workarounds, surprises), don't just ask.
- [ ] Turn an **insight** (non-obvious truth) into a **"How Might We"** question.
- [ ] HMW questions are **solution-neutral, human-centered, and right-sized.**

---

### 🖼️ See — observe → insight → reframe

```mermaid
flowchart LR
  OBS["👀 Observe<br/>pains · workarounds · surprises"] --> INS["💡 Insight<br/>non-obvious truth"]
  INS --> HMW["❓ How Might We…?<br/>solution-neutral question"]
  HMW --> FRAMES["🔄 5 alternative frames"]
  FRAMES --> PICK["🎯 Pick the most generative"]
```

![Reframe the problem — generated diagram](../img/atom-3-reframe-problems-and-spot-opportunities.png)

> 🖼️ *Generated image — produced from the prompt below.*

A reusable prompt to generate an on-brand version:

```prompt
Create a clean, modern infographic "Reframe the problem": Observe (pains, workarounds, surprises) →
Insight (non-obvious truth) → "How Might We…?" question → 5 alternative frames → Pick the most
generative. Use ADA brand colors (Indigo #1E2A6E, Turquoise #15B5C6, Gold #E0A53C), light background,
flat vector, legible sans-serif. 16:9.
```

---

### 🧪 Practice — *Reframe a real problem* (Worksheet + Case Study)

Pick a real situation you can observe (a tool your team uses, a daily friction, a service you find
frustrating). Then:

1. **Observe.** Write 5+ concrete observations — focus on pains, workarounds, surprises (watch real
   behavior, not opinions).
2. **Insight.** Distil **one** non-obvious insight about what the user is really trying to do.
3. **HMW.** Write a sharp, solution-neutral "How Might We" question from that insight.
4. **Reframe ×5.** Write the problem 5 different ways (broaden, narrow, flip, change user, change goal).
5. **Pick.** Choose the most generative frame and say why.

---

### ✅ Evaluate — Performance task (`skill`)

Submit your reframe. Scored on:

| Criterion | Excellent (3) | Adequate (2) | Needs work (1) |
| --------- | ------------- | ------------ | -------------- |
| **Observation** | Concrete, behavior-based; captures real pains/workarounds | Some real observations | Opinions/assumptions, not observation |
| **Insight** | Genuine non-obvious truth about the user | A reasonable observation restated | Surface-level or missing |
| **HMW quality** | Solution-neutral, human-centered, right-sized | Usable but broad/narrow | A solution in disguise / vague |
| **Alternative frames** | 5 genuinely different, generative frames | A few real alternatives | Restatements of the same frame |

> Pass = 2+ each → **L2** evidence for `S-reframe-opportunities`.

### 📦 Deliverable

- Your observations, insight, HMW question, 5 frames, and chosen frame.

### 🧠 Final reflection

- Did the reframe change what kinds of solutions feel possible? How?

### 🔗 Sources to verify (human-in-the-loop)

- IDEO, *The Field Guide to Human-Centered Design* (observe, insight, HMW).
- Wedell-Wedellsborg, *What's Your Problem?* (reframing).
- Christensen, *Jobs to Be Done* (what the user is really trying to accomplish).

### 🧩 Connections

- **Predecessor:** Atom 2. **Successor:** Atom 4 (generate ideas against your chosen frame).
</script>
<script type="text/markdown" data-path="examples/innovation-creativity-micro-credential/atoms/atom-4-generate-ideas.md">## ⚛ Learning Atom 4 — *Generate Ideas*

**Phase:** 🙊 3 · Applied Practice (*do*) · **KSA:** 🛠️ Skill · **Target level:** L2
· **Component id:** `S-generate-ideas`

### 🎯 Learning objective

- **Generate** many varied, original ideas on demand using divergent techniques — measured by fluency,
  flexibility, and originality.

### 🧭 Atom description

This is the engine room: producing ideas on purpose, in volume, without freezing or self-censoring.
You'll run structured idea sprints, push past the obvious "first ten," and use AI as an idea
multiplier. The goal isn't one perfect idea — it's a *rich, varied pile* to choose from in Atom 5.

---

### 📖 Reading — *Quantity is the path to quality* (≈ 8 min)

**The counter-intuitive truth:** to get *good* ideas, generate *many* ideas. Research and practice both
show that the **best idea is rarely the first** — the obvious ones come out first, and originality lives
deeper in the list. So you chase **quantity** on purpose.

**The three measures of divergent output** (aim to improve all three):

- **Fluency** — *how many* ideas. (Set targets: "30 ideas in 10 minutes.")
- **Flexibility** — *how many different kinds.* (Don't list 20 variations of the same idea — jump
  categories: cheaper, fun, social, automated, physical, AI…)
- **Originality** — *how rare/novel.* (Push past the clichés everyone lists.)

**Rules that keep the ideas flowing:**

1. **Defer judgment.** No "that won't work" during generation. Evaluation is a *separate* mode (Atom 5).
2. **Go for volume.** Set a quota; quotas beat "good ideas."
3. **Encourage wild ideas.** Easier to tame a wild idea than to spice up a safe one.
4. **Build, don't block — "yes, and."** Combine and stack on others' ideas.
5. **Stay visual & fast.** One idea per sticky note/line; speed over polish.

**Techniques to break out of ruts** (from Atom 2, now applied):

- **SCAMPER** the existing solution — force one idea per letter.
- **Analogies** — "how would [Disney / a hospital / nature / a 5-year-old] solve this?"
- **Provocation / "what if"** — "what if it were free? illegal? instant? invisible?"
- **Worst possible idea** — generate *terrible* ideas, then invert them (removes the fear of bad ideas
  and often reveals a good one in reverse).
- **Brainwriting** — generate silently first, then share, to avoid anchoring.

**Using AI as an idea multiplier (you stay the creative director):** an LLM is great at *fluency* and
*flexibility* on demand — but it regresses to the average, so **you** provide the reframe, push for
weirder branches, and judge. Diverge with the AI; *converge with your taste.*

> **The habit:** set a quota → defer judgment → diverge with a technique → push past the first ten →
> only *then* evaluate.

**Key takeaways**

- [ ] The best idea is rarely the first — chase **quantity** to reach **quality.**
- [ ] Improve **fluency** (how many), **flexibility** (how varied), **originality** (how rare).
- [ ] **Defer judgment**, set quotas, welcome wild ideas, build with "yes, and."
- [ ] Use SCAMPER, analogies, "what if," worst-idea — and AI as a multiplier you steer.

---

### 🖼️ See — push past the obvious

```mermaid
flowchart TD
  Q["🎯 HMW question + quota"] --> FIRST["😐 First 10 ideas<br/>(the obvious)"]
  FIRST --> TECH["🧰 Apply a technique<br/>SCAMPER · analogy · what-if · worst-idea"]
  TECH --> DEEP["🌟 Ideas 11–40<br/>(varied & original)"]
  DEEP --> PILE["🗂️ A rich pile to choose from"]
```

![Push past the obvious — generated diagram](../img/atom-4-generate-ideas.png)

> 🖼️ *Generated image — produced from the prompt below.*

A reusable prompt to generate an on-brand version:

```prompt
Create a clean, modern infographic "Push past the obvious": HMW question + quota → first 10 ideas (the
obvious) → apply a technique (SCAMPER, analogy, what-if, worst-idea) → ideas 11-40 (varied & original)
→ a rich pile to choose from. Use ADA brand colors (Indigo #1E2A6E, Turquoise #15B5C6, Gold #E0A53C),
light background, flat vector, legible sans-serif. 16:9.
```

---

### 🧪 Practice A — *The idea sprint* (Worksheet)

Using your chosen "How Might We" frame from Atom 3:

1. **Quota run.** Set a timer (10 min) and generate **at least 30 ideas.** One line each. No editing.
2. **Technique boost.** When you stall, apply **two** techniques (e.g., SCAMPER + analogy + worst-idea)
   to push to **40+.**
3. **Tag for flexibility.** Group your ideas into categories — aim for **6+ different kinds.** If most
   land in one category, generate more in the empty ones.
4. **Star the originals.** Mark the 5 most *original* ideas (the ones you've never seen before).

### 🧪 Practice B — *AI as idea multiplier* (AI Prompt Question)

```prompt
You are my divergent-thinking partner. Generate ideas only — do NOT evaluate or rank.
Give me 25 varied ideas for this "How Might We" question, deliberately spanning these angles:
cheap, premium, playful, social, automated/AI, physical, low-tech, and "wild/borderline impossible".
Then give me 5 "worst possible ideas" I can invert.
How Might We: """[paste your HMW question]"""
```

Then **you** curate: keep the 5 ideas with the most potential, and note one human idea of yours that
the AI didn't reach.

---

### ✅ Evaluate — Performance task (`skill`)

Submit Practice A + B. Pass = real **volume** (30+), genuine **flexibility** (6+ categories),
identifiable **originality** (non-cliché ideas), and evidence you **deferred judgment** and used
techniques to break ruts. → **L2** evidence for `S-generate-ideas`.

### 📦 Deliverable

- Your idea list (tagged by category, originals starred) + the curated AI output with your additions.

### 🧠 Final reflection

- Where did your best ideas appear — early or after idea 20? What does that tell you?

### 🔗 Sources to verify (human-in-the-loop)

- Guilford / Torrance — fluency, flexibility, originality (divergent thinking measures).
- IDEO brainstorming rules; *Creative Confidence* (Kelley & Kelley).
- Research on idea quantity → quality (e.g., "the best ideas come later in the list").

### 🧩 Connections

- **Predecessor:** Atom 3. **Successor:** Atom 5 (now converge, prototype, and evaluate).
</script>
<script type="text/markdown" data-path="examples/innovation-creativity-micro-credential/atoms/atom-5-develop-prototype-and-evaluate.md">## ⚛ Learning Atom 5 — *Develop, Prototype & Evaluate*

**Phase:** 🙊 3 · Applied Practice (*do*) · **KSA:** 🛠️ Skill + 🌱 Abilities · **Target level:** L2
· **Component ids:** `S-develop-prototype`, `A-creative-confidence`, `A-curiosity-openness`

### 🎯 Learning objective

- **Converge** on the best ideas with criteria, **build a rough prototype**, and **test** it — while
  demonstrating **creative confidence** and **curious openness**.

### 🧭 Atom description

A pile of ideas isn't innovation. This atom is where ideas become *real enough to learn from*: you
select with criteria, make something tangible quickly, and test it to improve it. It's also where the
two **Abilities** get assessed — because sharing rough work and treating failed tests as data is
exactly creative confidence in action.

---

### 📖 Reading — *Make it real to make it better* (≈ 7 min)

**Step 1 — Converge with criteria (don't just pick your favorite).** Score your shortlisted ideas on:

- **Desirability** — do people actually want it? (ties back to your insight, Atom 3)
- **Feasibility** — can it realistically be built/done?
- **Viability** — is it worth it (value vs. cost)?

A quick **impact–effort matrix** (or dot voting to shortlist, then criteria to choose) turns "I like
this one" into a defensible choice. Pick 1–2 to prototype.

**Step 2 — Prototype: lowest-fidelity thing that answers your biggest question.** A prototype isn't a
finished product — it's a **question made tangible.** Match fidelity to the question:

- Paper sketch / storyboard — *does the flow make sense?*
- Clickable mock / slides — *is it understandable?*
- Role-play / "Wizard of Oz" (you fake the backend) — *do people behave as hoped?*
- Landing page / concept poster — *do people want it?*

The marshmallow-challenge lesson: teams that **build early and often** beat teams that plan then build
once. **Fail cheap, fail early.**

**Step 3 — Test & learn.** Put the prototype in front of real people. Ask them to *use* it, not rate
it. Watch for what confuses or delights them. Capture: *what worked, what didn't, what surprised me,
what's next.* Then **iterate** — a "failed" test isn't failure, it's the data that makes the next
version better.

**The two Abilities, made visible.** This atom surfaces dispositions under pressure:

- **🌱 Creative confidence** — you **share rough, unfinished work** without apologizing it to death;
  you treat a test that flops as **iteration, not verdict**; you defer judgment so ideas survive long
  enough to develop.
- **🌱 Curious openness** — you **seek out** disconfirming feedback, ask "what if we tried…", and pull
  ideas from unexpected places rather than defending your first concept.

> **The mark of an innovator:** not falling in love with the first idea, but **building the cheapest
> thing that teaches you the most — and changing your mind when it does.**

**Key takeaways**

- [ ] **Converge with criteria** (desirability, feasibility, viability), not just preference.
- [ ] A **prototype is a question made tangible** — match fidelity to the question; build early.
- [ ] **Test by watching people use it**; capture learnings and **iterate.**
- [ ] **Fail cheap, fail early** — failed tests are data, not verdicts.

---

### 🖼️ See — converge → prototype → test → iterate

```mermaid
flowchart LR
  IDEAS["🗂️ Idea pile"] --> CRIT["⚖️ Converge with criteria<br/>desirable · feasible · viable"]
  CRIT --> PROTO["🧪 Rough prototype<br/>(question made tangible)"]
  PROTO --> TEST["👥 Test with real people"]
  TEST -->|"learnings"| ITER["🔁 Iterate"]
  ITER --> PROTO
```

![Converge, prototype, test, iterate — generated diagram](../img/atom-5-develop-prototype-and-evaluate.png)

> 🖼️ *Generated image — produced from the prompt below.*

A reusable prompt to generate an on-brand version:

```prompt
Create a clean, modern infographic of an iterative loop: Idea pile → Converge with criteria (desirable,
feasible, viable) → Rough prototype (a question made tangible) → Test with real people → Iterate (loop
back to prototype). Use ADA brand colors (Indigo #1E2A6E, Turquoise #15B5C6, Gold #E0A53C), light
background, flat vector, legible sans-serif. 16:9.
```

---

### 🧪 Practice — *Choose, build, test* (Lab + Simulation + Forum)

1. **Converge.** Take your starred ideas from Atom 4. Score the top 5 on desirability/feasibility/
   viability (or an impact–effort matrix). Pick **one** to prototype, and justify the choice.
2. **Prototype.** Build the **lowest-fidelity** prototype that answers your biggest open question
   (sketch, slides, paper flow, role-play, or landing page). Timebox it — rough is the point.
3. **Test.** Show it to **at least 2 people.** Have them *use* it; note what worked, what confused them,
   what surprised you. Write your **next iteration.**
4. **Share in the forum.** Post your prototype + learnings; give "I like / I wish / what if" feedback to
   ≥2 peers and respond to feedback on yours.

> 🤝 **This is a behavioral-assessment occasion.** Mentors observe *how* you work: Do you share rough
> work without over-polishing? Do you treat a flop as iteration? Do you seek and build on others'
> feedback rather than defend?

---

### ✅ Evaluate — Behavioral assessment (`behavioral`, Abilities)

Observed across this atom + the forum + the capstone (≥3 occasions):

| Ability | Look-for (evidence) |
| ------- | ------------------- |
| 🌱 Creative confidence | Shares unfinished work; treats failed tests as iteration; defers judgment; takes a productive risk |
| 🌱 Curious openness | Seeks disconfirming feedback; asks "what if"; borrows ideas across domains; changes course on evidence |

Rated **Emerging / Developing / Proficient** on the behavioral rubric in [`rubrics.md`](rubrics.md)
(not a quiz — evidenced over time). The **prototype/test quality** (criteria use, fidelity-to-question,
real learnings) is scored on the `skill` rubric.

### 📦 Deliverable

- Your selection matrix, the prototype (photo/file/link), test notes, and your next iteration — plus a
  note: "what the test changed about my idea."

### 🧠 Final reflection

- What surprised you in testing? Was sharing rough work uncomfortable — and did it get easier?

### 🔗 Sources to verify (human-in-the-loop)

- Kelley & Kelley, *Creative Confidence*; IDEO prototyping methods.
- Tom Wujec, *The Marshmallow Challenge* (build early, iterate).
- "Desirability / Feasibility / Viability" (IDEO innovation lens).

### 🧩 Connections

- **Predecessor:** Atom 4. **Successor:** Atom 6 (run the whole loop on a real challenge).
</script>
<script type="text/markdown" data-path="examples/innovation-creativity-micro-credential/atoms/atom-6-capstone-innovation-challenge.md">## ⚛ Learning Atom 6 — *Capstone: Innovation Challenge*

**Phase:** 🐵 4 · Collaboration & Reflection (*share*) · **KSA:** 🛠️ Skill + 🌱 Abilities
· **Target level:** L2 · **Rubric:** `capstone-5`

### 🎯 Learning objective

- **Integrate** the whole course: take a real problem, **reframe** it, **generate** options,
  **prototype** the best, and **pitch** it — demonstrating creative confidence and curious openness
  throughout.

### 🧭 Atom description

The capstone is a single deliverable that proves every component at once: you run a complete innovation
sprint from blank page to pitched, prototyped concept, then present it and review a peer's — showing the
Skills and Abilities in one continuous piece of evidence.

---

### 🧪 The capstone task

**Pick a real problem or opportunity** worth improving — a product, service, process, or experience you
care about (at work, in your community, or a public problem). Then run the full loop:

1. **Reframe (Atom 3).** Observe, find an insight, and write a sharp **"How Might We"** question.
   Include 2–3 alternative frames and why you chose yours.
2. **Diverge (Atom 4).** Generate **30+ varied ideas** (show your raw list); use ≥2 techniques and AI
   as a multiplier. Mark the most original ones.
3. **Converge (Atom 5).** Score a shortlist on desirability/feasibility/viability; choose **one
   concept** and justify it.
4. **Prototype (Atom 5).** Build a **rough prototype** that answers your biggest question (sketch, mock,
   storyboard, role-play, or landing page).
5. **Test & iterate.** Get feedback from ≥2 people; document what you learned and what you changed.
6. **Pitch.** A short (2–3 min or 1-page) pitch: the problem/insight, the concept, why it's valuable
   (desirability/feasibility/viability), and what you'd do next.

**Deliverable:** an **Innovation Brief** (the artifacts above, ~800–1,200 words or a short deck) + the
prototype + the pitch.

---

### 🤝 Collaboration (Phase 4)

- **Showcase / demo day:** present your pitch; field questions on your reframe and concept.
- **Async peer review:** review ≥1 peer's brief — give "I like / I wish / what if" feedback, one
  strength, and one bold suggestion to push the idea further.

> 🌱 **Behavioral evidence:** the showcase + peer review are key occasions for assessing **creative
> confidence** (do you share boldly, handle critique as fuel?) and **curious openness** (do you build on
> others' ideas, ask "what if"?).

---

### ✅ Evaluate — Capstone rubric (`capstone-5`)

| Criterion | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Beginning (≤69%) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Reframe & insight** | Sharp, human-centered insight and HMW; alternative frames show real reframing | Clear insight and usable HMW | Generic problem; weak insight | Solves the obvious/wrong problem | **20 pts** |
| **Idea generation** | High volume, strong variety and genuine originality; techniques + AI used well | Good quantity and some variety | Few ideas; mostly obvious | Minimal/derivative ideas | **20 pts** |
| **Convergence & prototype** | Criteria-based choice; prototype precisely answers the key question | Reasonable choice + working prototype | Weak rationale; superficial prototype | No real criteria or prototype | **25 pts** |
| **Testing, iteration & value** | Real user testing; clear learnings drive iteration; value is well-argued | Tested; some iteration and value case | Little testing/iteration | No testing; value unclear | **20 pts** |
| **Pitch, collaboration & confidence** | Compelling, clear pitch; bold sharing; incisive, generative peer review | Solid pitch and review | Minimal/unclear pitch or review | Avoids sharing; no real review | **15 pts** |
| **TOTAL** | | | | | **100 pts** |

> **Pass = ≥80% overall + no criterion below Developing.** Earns the **🏅 Creative Innovator** badge
> (with `S-reframe-opportunities`, `S-generate-ideas`, `S-develop-prototype` at L2 and both Abilities at
> L2 from behavioral evidence).

---

### 📦 Deliverable

- The **Innovation Brief** + prototype + pitch + one completed peer review.

### 🧠 Final reflection

- Where did your concept improve most — the reframe, the divergence, or the testing? What creative habit
  will you keep using weekly?

### 🔗 Sources to verify (human-in-the-loop)

- See Atoms 1–5. Optionally: IDEO *Design Kit*; Kelley & Kelley, *Creative Confidence*.

### 🧩 Connections

- **Predecessors:** Atoms 1–5 (this integrates all of them).
- **Pairs with:** [Critical Thinking](../../critical-thinking-micro-credential/README.md) (judge which
  ideas hold up) and [Problem Solving](../../problem-solving-micro-credential/README.md) (ship the chosen one).
</script>
<script type="text/markdown" data-path="examples/problem-solving-micro-credential/atoms/atom-1-how-problem-solving-works.md">## ⚛ Learning Atom 1 — *How Problem Solving Works*

**Phase:** 🙉 1 · Self-Guided Introduction (*hear*) · **KSA:** 🧠 Knowledge · **Target level:** L2
· **Component id:** `K-process`

### 🎯 Learning objective

- **Explain** the problem-solving process and **distinguish** a symptom from a root cause, and
  divergent from convergent thinking.

### 🧩 Prerequisites

- None. Bring one nagging problem you keep "fixing" that keeps coming back.

### 🧭 Atom description

Most people "solve problems" by grabbing the first idea that feels right and running with it. That
works for trivial problems and fails for important ones. This atom gives you the mental model that the
whole course hangs on: a repeatable **process** that separates *understanding* the problem from
*solving* it — so you fix the real thing, not the first thing.

---

### 📖 Reading — *Slow down to speed up* (≈ 7 min)

There's a famous (probably apocryphal) line attributed to Einstein: *"If I had an hour to solve a
problem, I'd spend 55 minutes thinking about the problem and 5 minutes thinking about solutions."* The
point survives the misattribution: **most failed solutions are answers to the wrong problem.**

A reliable problem-solving process has six steps:

1. **Define** — What exactly is the problem? Who has it, where, when, how big? Write it down.
2. **Diagnose** — *Why* is it happening? Dig past symptoms to the **root cause** (Atom 4).
3. **Generate** — Produce *several* possible solutions, not one (Atom 5).
4. **Decide** — Choose using explicit criteria and trade-offs (Atom 5).
5. **Implement** — Do it (often as a small test first).
6. **Review** — Did it work? What did you learn? Loop if not.

Three ideas to internalize:

- **Symptom vs. root cause.** A *symptom* is what you notice ("the report is late again"); the *root
  cause* is why it keeps happening ("approvals queue with one person"). Treating symptoms gives you
  temporary relief and a recurring problem. Treating the root cause makes it *stay* fixed.
- **Divergent vs. convergent thinking.** Good problem solving alternates two modes: **divergent**
  (open up — generate many questions, causes, and options without judging) and **convergent**
  (narrow down — analyze, evaluate, decide). The classic mistake is converging too early: judging
  ideas before you've generated enough of them. *Separate the generating from the judging.*
- **Solution-jumping is the default failure.** Under time pressure we leap from a vague problem
  straight to a favorite solution, skipping define and diagnose. The fix is mechanical: **force
  yourself through define → diagnose before you allow a single solution.**

> **Reframe for the whole course:** the quality of your solution is capped by the quality of your
> problem definition. Time spent understanding is not a delay — it's the work.

**Key takeaways**

- [ ] The process: **define → diagnose → generate → decide → implement → review.**
- [ ] Fix the **root cause**, not the **symptom**, or the problem returns.
- [ ] Alternate **divergent** (generate) and **convergent** (decide); don't judge too early.
- [ ] Beware **solution-jumping** — force define + diagnose first.

---

2. Judging/eliminating ideas before generating enough of them — you settle on a mediocre option and
   never discover better ones. **Separate generating from judging.**

<script type="text/markdown" data-path="examples/problem-solving-micro-credential/atoms/atom-2-decisions-and-biases.md">## ⚛ Learning Atom 2 — *Decisions & Cognitive Biases*

**Phase:** 🙉 1 · Self-Guided Introduction (*hear*) · **KSA:** 🧠 Knowledge · **Target level:** L2
· **Component id:** `K-decisions-biases`

### 🎯 Learning objective

- **Recognize** common cognitive biases and **explain** how they distort problem solving and
  decisions — plus the basics of deciding with criteria and trade-offs.

### 🧩 Prerequisites

- Atom 1 (the process). Biases mostly attack the *diagnose* and *decide* steps.

### 🧭 Atom description

Your brain takes shortcuts. Most of the time that's efficient; in problem solving it quietly steers
you toward the wrong cause and the comfortable answer. This atom names the usual suspects so you can
catch them — and introduces the simple idea of deciding *on purpose*, with explicit criteria, instead
of by gut feel.

---

### 📖 Reading — *Your brain's helpful, dangerous shortcuts* (≈ 8 min)

We run on two systems (Kahneman): **System 1** is fast, automatic, intuitive; **System 2** is slow,
effortful, analytical. System 1 is brilliant for routine life and terrible for novel problems, where
it serves up a confident answer that *feels* right and skips the analysis. Biases are the predictable
ways System 1 misfires:

- **Confirmation bias** — you look for evidence that supports your existing hunch and ignore evidence
  against it. *Antidote:* actively seek disconfirming evidence; ask "what would prove me wrong?"
- **Anchoring** — the first number/idea you hear drags your judgment toward it. *Antidote:* generate
  your own estimate before looking at others'.
- **Availability** — you overweight whatever is recent, vivid, or easy to recall. *Antidote:* look at
  base rates / actual data, not just the dramatic example.
- **Sunk-cost fallacy** — you keep pouring effort into something because you've already invested, not
  because it's working. *Antidote:* decide based on future value, not past spend.
- **Premature convergence / "first idea" bias** — you grab the first plausible cause or solution.
  *Antidote:* the divergent step (Atom 1) — force more options.
- **Groupthink / authority bias** — you defer to the loudest or most senior voice. *Antidote:* gather
  views independently first; invite a devil's advocate.
- **Overconfidence** — you trust your judgment more than the evidence warrants. *Antidote:* ask for
  the data and a second opinion.

**Deciding on purpose (preview of Atom 5).** Once you have options, don't decide by vibe. Make the
**criteria explicit** (what does a good solution need — impact, cost, effort, risk, time?), weigh
them, and compare options against them. Writing it down both improves the decision *and* exposes your
biases ("oh, I only liked option A because I thought of it first"). Almost every important decision is
a **trade-off** — naming what you're trading is half the skill.

> **The meta-move:** you can't delete biases, but you can build *habits and checklists* that catch
> them. Slow down, write it down, seek the opposite. That's most of "critical thinking."

**Key takeaways**

- [ ] **System 1** (fast/intuitive) hands you confident answers that skip analysis — engage **System 2.**
- [ ] Know the big biases: **confirmation, anchoring, availability, sunk-cost, premature convergence.**
- [ ] **Antidote pattern:** slow down, write it down, **seek disconfirming evidence.**
- [ ] Decide with **explicit criteria + trade-offs**, not by gut.

---

1. What is confirmation bias, and what's a practical antidote?
2. Why is the sunk-cost fallacy dangerous when deciding whether to continue a project?
3. Why does writing down explicit criteria improve a decision?

<details>

   **seek disconfirming evidence** ("what would prove me wrong?").
2. It makes you continue based on **past** investment rather than **future** value, throwing good
   resources after bad. Decide on expected future outcomes.
3. It forces a structured comparison, makes **trade-offs** visible, and exposes biases (e.g., favoring
   your own idea) instead of deciding by gut.

</details>

---

  would have helped — in 3–5 sentences.

  criteria).

<script type="text/markdown" data-path="examples/problem-solving-micro-credential/atoms/atom-3-define-and-decompose.md">## ⚛ Learning Atom 3 — *Define & Decompose the Problem*

**Phase:** 🙈 2 · Visual Exploration (*see*) · **KSA:** 🛠️ Skill · **Target level:** L2
· **Component id:** `S-frame`

### 🎯 Learning objective

- **Write** a clear problem statement and **decompose** a problem into parts — using first-principles
  thinking to get past assumptions.

### 🧩 Prerequisites

- Atoms 1–2. This is the *define* step, done well.

### 🧭 Atom description

A well-defined problem is half-solved. This atom turns vague complaints ("our process is broken") into
sharp, workable problem statements, and big tangled problems into smaller pieces you can actually
attack. It's in Phase 2 (*see*) because you learn it by watching it modeled, then doing it on a real
problem of your own.

---

### 📖 Reading — *Define it before you fight it* (≈ 8 min)

**1) Write a problem statement.** A good statement is specific, neutral, and solution-free. A simple
template:

> *"[Who] is experiencing [what problem], in [what context/when], which causes [what impact]. Today it
> is [current state] vs. the desired [target state]. Success looks like [measurable outcome]."*

Compare:

- 👎 *"The website is bad."*
- 👍 *"New mobile users abandon checkout (68% drop-off on the payment step) since the April redesign,
  costing ~$X/month. We want drop-off back under 40%."*

The second is **specific** (who, where, how big), **measurable** (68% → 40%), and **doesn't smuggle in
a solution.** Avoid baking the answer into the question ("we need a new payment button" presumes the
button is the cause — that's the diagnose step's job).

**2) Sharpen with questions.** Interrogate the problem before solving:

- **Is it the right problem?** Ask "why does that matter?" up the chain until you hit the problem worth
  solving. (You may discover the real problem is bigger or smaller than you thought.)
- **What's in/out of scope?** State boundaries so you don't boil the ocean.
- **What do we actually know vs. assume?** Separate facts from guesses — guesses become hypotheses to
  test (Atom 4).
- **How will we know it's solved?** Define the success metric *now*.

**3) Decompose.** Break the problem into parts so it's tractable:

- **Issue tree / MECE.** Split the problem into sub-problems that are **M**utually **E**xclusive and
  **C**ollectively **E**xhaustive (no overlaps, no gaps). E.g., "low profit" → "revenue too low" OR
  "costs too high"; then break each down further. Now you can attack branches independently.
- **First principles.** Strip away assumptions and inherited "that's how it's done" until you reach
  the basic truths, then reason up from there. Ask: *what do we actually know to be true? what are we
  assuming just because it's familiar?* First-principles thinking is how you escape "we've always done
  it this way."

> **The payoff:** a sharp statement + a clean decomposition turns an overwhelming blob into a list of
> smaller, solvable questions — and tells you exactly where to point the root-cause analysis next.

**Key takeaways**

- [ ] A good **problem statement** is specific, measurable, neutral, and **solution-free.**
- [ ] **Separate facts from assumptions**; define the **success metric** up front.
- [ ] **Decompose** with a MECE issue tree (no overlaps, no gaps).
- [ ] Use **first principles** to escape inherited assumptions.

---

### 🖼️ See — an issue tree (MECE decomposition)

```mermaid
flowchart TD
  P["🎯 Problem:<br/>profit is too low"] --> R["📈 Revenue too low"]
  P --> C["📉 Costs too high"]
  R --> R1["fewer customers"]
  R --> R2["lower price/order"]
  C --> C1["fixed costs"]
  C --> C2["variable costs"]
```

![Issue tree / MECE decomposition — generated diagram](../img/atom-3-define-and-decompose.png)

(Indigo #1E2A6E, Turquoise #15B5C6, Gold #E0A53C), light background, flat vector, legible

### 🧪 Practice — *Frame a real problem* (Worksheet + AI Prompt Question)

Pick a real problem you face. Then:

1. **Statement.** Write it with the template (who · what · context · impact · current vs. target ·
   success metric). Check that no solution is hidden inside it.
2. **Facts vs. assumptions.** List 3 things you *know* and 3 you're *assuming.*
3. **Decompose.** Draw a 2-level MECE issue tree of possible parts/causes.
4. **First principles.** Name one "that's just how it's done" assumption and challenge it.
5. **AI Prompt Question.** Ask an AI: *"Critique my problem statement — is it specific, measurable, and
   free of a hidden solution? What's missing?"* Improve it based on the critique (then sanity-check the
   critique yourself).

| **Facts vs. assumptions** | Cleanly separated; assumptions flagged | Some separation | Mixed together |
| **Decomposition** | MECE issue tree, no gaps/overlaps | Reasonable breakdown | Flat / overlapping |
| **First principles** | Challenges a real assumption | Some questioning | Accepts the obvious |

> Pass = 2+ each → **L2** evidence for `S-frame`.

### 📦 Deliverable

### 🧠 Final reflection

- Spradlin, *Are You Solving the Right Problem?* (HBR).
- First-principles thinking references (verify before use).

### 🧩 Connections

- **Predecessor:** Atom 2. **Successor:** Atom 4 (diagnose the branches you found).

<script type="text/markdown" data-path="examples/problem-solving-micro-credential/atoms/atom-4-root-cause-analysis.md">## ⚛ Learning Atom 4 — *Find the Root Cause*

**Phase:** 🙊 3 · Applied Practice (*do*) · **KSA:** 🛠️ Skill · **Target level:** L2
· **Component id:** `S-root-cause`

### 🎯 Learning objective

- **Find a root cause** using the **5 Whys**, a **fishbone (Ishikawa)** diagram, and simple
  **hypothesis testing.**

### 🧩 Prerequisites

- Atom 3 (a framed, decomposed problem). Now diagnose *why* it happens.

### 🧭 Atom description

This is the *diagnose* step — and the one most people skip. Without it you treat symptoms forever. This
atom gives you three practical tools to dig from "what's wrong" to "why it's wrong," and the discipline
to **test** your suspected cause instead of assuming it.

---

### 📖 Reading — *Keep asking why* (≈ 8 min)

**Tool 1 — The 5 Whys.** Start with the symptom and ask "why?" repeatedly (roughly five times) until
you reach a cause you can actually act on:

> *Problem: the report was late.*
> 1. Why? — It waited two days for approval.
> 2. Why? — Only one manager can approve, and she was out.
> 3. Why? — There's no backup approver.
> 4. Why? — We never defined one.
> 5. Why? — No one owns the approval process. ← **root cause**

Fixing #5 (assign an owner + backup) prevents recurrence; fixing #1 ("nag the manager") doesn't. Note:
"5" isn't magic — stop when you reach something **actionable** and **systemic**, not a person to blame.
There can be more than one branch ("why?" may have two answers — follow both).

**Tool 2 — Fishbone (Ishikawa) diagram.** When a problem has *many* possible causes, group them into
categories and brainstorm causes under each. Common categories (the "6 Ms" for operations, or adapt
them): **People, Process, Tools/Technology, Materials, Environment, Measurement.** The diagram looks
like a fish skeleton — the problem is the head, the categories are the bones. It forces you to consider
causes you'd otherwise miss and prevents fixating on the first one.

**Tool 3 — Hypothesis testing.** A suspected cause is a **hypothesis**, not a fact. Before you commit
to a fix, **test it**: *"If queue-time is the cause, then reports with single-approver steps should be
late more often — let's check the data."* Look for evidence that would **confirm or disconfirm** it
(remember confirmation bias from Atom 2 — actively look for evidence you're *wrong*). Cheap tests beat
expensive assumptions.

**Watch out for:**

- **Blame instead of cause.** "Who did it?" is rarely the root cause; "what in the *system* allowed it?"
  usually is. Blame ends inquiry; systems thinking continues it.
- **Stopping at the first plausible cause.** Generate several candidate causes (divergent), then test.
- **Correlation ≠ causation.** Two things moving together doesn't mean one caused the other — test.

> **The discipline:** suspect → **test** → confirm before you fix. A confirmed root cause is worth ten
> clever solutions to the wrong cause.

**Key takeaways**

- [ ] **5 Whys:** ask why until you reach an **actionable, systemic** cause (not a person to blame).
- [ ] **Fishbone:** brainstorm causes by category (People, Process, Tools, etc.) to avoid fixation.
- [ ] **Test hypotheses** with confirming *and* disconfirming evidence before committing.
- [ ] **Correlation ≠ causation;** blame ≠ root cause.

---

### 🖼️ See — fishbone (cause categories)

```mermaid
flowchart LR
  PEOPLE["👥 People"] --> PROB["🐟 Problem:<br/>reports late"]
  PROCESS["🔄 Process"] --> PROB
  TOOLS["🛠️ Tools"] --> PROB
  MEAS["📏 Measurement"] --> PROB
  ENV["🌍 Environment"] --> PROB
```

![Ishikawa (fishbone) diagram — generated diagram](../img/atom-4-root-cause-analysis.png)

> 🖼️ *Generated image — produced from the prompt below.*

A reusable prompt to generate an on-brand version:

```prompt
Create a clean, modern fishbone (Ishikawa) diagram infographic: a central spine pointing to a fish
head labeled "Problem", with angled bones labeled People, Process, Tools/Technology, Materials,
Environment, Measurement, each with room for sub-causes. Caption: "Brainstorm causes by category."
Use ADA brand colors (Indigo #1E2A6E, Turquoise #15B5C6, Gold #E0A53C), light background, flat vector,
legible sans-serif. 16:9.
```

---

### 🧪 Practice — *Root-cause a case* (Case Study + Worksheet)

**Case:** *A small online store's customer support is overwhelmed — tickets doubled last month and
replies now take 3 days. The team wants to hire more agents.* Before spending on hires:

1. **5 Whys.** Run at least one "why?" chain on "tickets doubled." (What changed last month?)
2. **Fishbone.** Brainstorm causes across People / Process / Tools / Measurement (e.g., a buggy
   release? a confusing new checkout? a price change? a broken FAQ?).
3. **Hypothesis + test.** Pick the most likely cause and state how you'd **test** it with available
   data before committing to a fix.
4. Then do the same on **your own** problem from Atom 3.

<details>
<summary>Sample insight</summary>

"Hire more agents" treats the symptom (too many tickets). A 5-Whys/fishbone often reveals a root cause
like "a recent release introduced a bug that generates the same complaint" — fixing the bug removes the
tickets entirely, far cheaper than hiring. The point: **diagnose before you spend.**

</details>

---

### ✅ Evaluate — Performance task (`skill`)

Submit your case + own-problem diagnosis. Scored on:

| Criterion | Excellent (3) | Adequate (2) | Needs work (1) |
| --------- | ------------- | ------------ | -------------- |
| **Depth (5 Whys)** | Reaches an actionable, systemic cause | Some digging | Stops at a symptom/blame |
| **Breadth (fishbone)** | Multiple categories & candidate causes | A few causes | One cause only |
| **Testing** | States a real confirm/disconfirm test | Vague test | Assumes the cause |
| **Bias awareness** | Seeks disconfirming evidence | Some | Confirmation-driven |

> Pass = 2+ each → **L2** evidence for `S-root-cause`.

### 📦 Deliverable

- Your 5-Whys chain(s) + fishbone + the hypothesis test, for the case and your own problem.

### 🧠 Final reflection

- Did the root cause differ from your first guess? What would treating only the symptom have cost?

### 🔗 Sources to verify (human-in-the-loop)

- Ohno / Toyota Production System — *The 5 Whys*.
- Ishikawa — *cause-and-effect (fishbone) diagrams*.
- Any reputable root-cause-analysis (RCA) guide (verify before use).

### 🧩 Connections

- **Predecessor:** Atom 3. **Successor:** Atom 5 (generate & choose solutions for the confirmed cause).
</script>
<script type="text/markdown" data-path="examples/problem-solving-micro-credential/atoms/atom-5-generate-and-choose-solutions.md">## ⚛ Learning Atom 5 — *Generate & Choose Solutions*

**Phase:** 🙊 3 · Applied Practice (*do*) · **KSA:** 🛠️ Skill + 🌱 Ability · **Target level:** L2
· **Component ids:** `S-solutions`, `A-persistence`, `A-critical-curious`

### 🎯 Learning objective

- **Generate** several options (divergent) and **choose** one (convergent) using a **decision matrix**
  and explicit **trade-offs** — persisting through ambiguity and questioning assumptions.

### 🧩 Prerequisites

- Atom 4 (a confirmed root cause). Now solve *that*.

### 🧭 Atom description

With the real problem and its root cause in hand, this atom is the *generate + decide* steps. You'll
practice producing many options before judging any, then choosing transparently with criteria and
trade-offs. It's also where the **Abilities** show up: staying with the discomfort of an unclear
problem (persistence) and challenging the obvious answer (critical curiosity).

---

### 📖 Reading — *Diverge to find options, converge to choose* (≈ 8 min)

**Step 1 — Diverge (generate options).** Resist the first idea. Aim for **quantity first**, judgment
later:

- **Brainstorm broadly.** Target 5–10 candidate solutions for the root cause. Include a "do nothing"
  option and at least one "wild" option to stretch the space.
- **Borrow & combine.** How do others solve this? Can two weak ideas combine into a strong one?
- **Use prompts to expand.** *"What if we had no budget? Unlimited budget? Had to solve it in a day?"*
  Constraints provoke fresh options.
- **Don't judge yet.** Write them all down before evaluating — premature judging kills good ideas
  (Atom 1's divergent/convergent rule).

**Step 2 — Converge (choose).** Now apply judgment, on purpose:

- **Define criteria.** What makes a good solution *here*? Typical: **impact, effort/cost, time, risk,
  feasibility.** Weight them (some matter more).
- **Build a decision matrix.** Score each option against each criterion; total the (weighted) scores.
  The matrix doesn't decide *for* you — it makes the **trade-offs visible** and your reasoning
  defensible.

| Option | Impact (×3) | Effort (×2, lower=better) | Risk (×2, lower=better) | Weighted total |
| ------ | ----------- | ------------------------- | ----------------------- | -------------- |
| A: fix the bug | 5 → 15 | 2 → (inverted) | 2 → (inverted) | … |
| B: hire agents | 3 → 9 | 4 | 3 | … |
| C: do nothing | 1 → 3 | 1 | 1 | … |

- **Name the trade-off out loud.** *"We're choosing A over B because it removes the cause for less
  effort, accepting a small rollout risk."* Every real decision trades something — say what.
- **Prefer reversible, testable bets.** When unsure, pick the option you can **pilot small** and undo.
  Run it (implement), then **review** (Atom 1) and iterate.

**Where the Abilities live:**

- **🌱 Persistence & ambiguity tolerance.** Hard problems stay foggy for a while. The skill is to keep
  working the process — generating, testing, refining — without grabbing a premature answer just to
  end the discomfort. Stuck ≠ failed; it's where the work is.
- **🌱 Critical, curious thinking.** Keep asking *"why is that the obvious answer? what are we
  assuming? what would change our mind?"* The best solvers interrogate their own favorite option
  hardest.

> **The discipline:** options before judgment, criteria before choice, trade-off stated out loud,
> small reversible bet when unsure.

**Key takeaways**

- [ ] **Diverge first:** generate 5–10 options (incl. "do nothing" + a wild card) before judging.
- [ ] **Converge with a decision matrix:** explicit, weighted criteria; visible trade-offs.
- [ ] **State the trade-off** and prefer **reversible, testable** bets.

<script type="text/markdown" data-path="examples/problem-solving-micro-credential/atoms/atom-6-capstone-solve-a-real-problem.md">## ⚛ Learning Atom 6 — *Capstone: Solve a Real Problem End-to-End*

**Phase:** 🐵 4 · Collaboration & Reflection (*share*) · **KSA:** 🛠️ Skill + 🌱 Ability
· **Target level:** L2 · **Component ids:** `S-frame`, `S-root-cause`, `S-solutions`,

### 🎯 Learning objective

- **Take a real, messy problem** from definition through root-cause to a **chosen, defended solution** —
  documenting the reasoning and **piloting** where possible — then **defend it** and peer-review.

### 🧩 Prerequisites

- All prior atoms.

### 🧭 Atom description

The capstone proves the whole process on something real. The learner picks an actual problem (work,
study, community, or a provided scenario), runs the full loop — define → diagnose → generate → decide →
(implement/pilot) → review — and presents not just the answer but the **reasoning**: how they framed
it, found the root cause, weighed options, and what they'd do next.

---

### 🚀 The brief

> Pick a **real, non-trivial problem** you can work on within the course window. Run the **full
> problem-solving process** and produce: a sharp **problem statement**, a **root-cause analysis**, a
> set of **options with a decision matrix**, your **chosen solution with the trade-off named**, and a
> **pilot or implementation plan** (with the success metric). Then **defend it** in a short session and
> peer-review a classmate.

Pick something **real and appropriately sized** — the grade is on the *quality of the thinking*, not
the size of the problem or whether the world is fully fixed by Friday.

---

### 📦 What to submit

- [ ] **Problem statement** — specific, measurable, neutral, solution-free (Atom 3), with the success
  metric.
- [ ] **Root-cause analysis** — 5 Whys and/or fishbone, plus how you **tested** the suspected cause
  (Atom 4).
- [ ] **Options + decision matrix** — ≥5 options, weighted criteria, the choice, and the **trade-off
  named** (Atom 5).
- [ ] **Pilot/implementation plan** — the smallest reversible test and what "it worked" looks like.
- [ ] **A reflection** (6–8 sentences) — where you got stuck, an assumption you had to discard, and a
  bias you caught yourself in.
- [ ] **A peer review you gave** — the capstone rubric applied to a classmate, with specific, useful

### 🎤 Showcase / defense structure (≈ 5 minutes)

1. **The problem** (1 min) — your statement and why it matters.
2. **The diagnosis** (1–2 min) — root cause + how you know (your test).
3. **The decision** (1–2 min) — options, the matrix, your choice, and the trade-off.
4. **Next & lessons** (30s) — pilot plan + one thing the process taught you.

Expect **challenge questions** — "what if your root cause is wrong?", "what option did you dismiss?" —
and answer them with your reasoning (that's the critical-curiosity Ability, observed live).

<script type="text/markdown" data-path="examples/python-variables-micro-credential/atoms/atom-1-what-is-a-variable.md">## ⚛ Learning Atom 1 — *What Is a Variable?*

**Phase:** 🙉 1 · Self-Guided Introduction (*hear*) · **KSA:** 🧠 Knowledge · **Target level:** L1
· **Component id:** `K-var-concept`

### 🎯 Learning objective

- **Explain** what a variable is in Python — a *name* bound to a *value* — and describe the
  "label on a box" mental model, including what dynamic typing means.

### 🧩 Prerequisites

- None. If you can open [replit.com](https://replit.com) or Google Colab and run one line of
  Python, you're ready.

### 🧭 Atom description

Every program is just data plus the steps that transform it. A **variable** is how you give a
piece of data a *name* so you can refer to it later. Get this mental model right and the rest of
programming gets dramatically easier; get it fuzzy and you'll fight your code for weeks. This atom
builds the model on purpose, before you write much code.

---

### 📖 Reading — *A name for a value* (≈ 5 min)

> Author: ADA Methodology · aligned with the official Python tutorial.

A **variable** is a **name that refers to a value**. In Python you create one with a single `=`,
the *assignment* operator:

```python
age = 27
name = "Ada"
price = 19.99
is_open = True
```

Read `age = 27` as *"let the name `age` refer to the value `27`"* — **not** "age equals 27" like
in math. The `=` does something: it points a label at a value. A useful mental model is a **label
stuck on a box**: the value `27` lives in memory (the box), and `age` is a label you put on it. To
get the value back, you just use the name:

```python
print(age)          # 27
print(name)         # Ada
print(age + 3)      # 30
```

You can **reassign** a variable any time — move the label to a different box:

```python
age = 27
age = 28            # the name 'age' now refers to 28; the old 27 is forgotten
```

Two ideas that trip up beginners:

- **`=` is not `==`.** A single `=` *assigns* (puts a label on a value). A double `==` *compares*
  (asks "are these equal?", giving `True`/`False`). Using one for the other is the classic first bug.
- **Python is dynamically typed.** You never declare a type; Python figures out the type from the
  value, and a name can later point to a value of a different type. (More in Atom 2.)

```python
x = 5        # x refers to an integer
x = "five"   # totally legal — x now refers to a string
```

Finally, a name on its own — before you assign anything — does **not** exist. Using it raises a
`NameError`. A variable must be *assigned before it is used*:

```python
print(score)   # NameError: name 'score' is not defined
score = 0      # fix: define it first
```

**Key takeaways**

- [ ] A variable is a **name bound to a value** (a label on a box).
- [ ] `=` **assigns**; `==` **compares** — they are different.
- [ ] You can **reassign** a name at any time.
- [ ] Python is **dynamically typed** — the value decides the type, not a declaration.
- [ ] Use a name only **after** assigning it, or you get a `NameError`.

---

  CODE["age = 27"] --> NAME

  NAME -.after reassign.-> VAL2
```

"age = 28  →  reassigned". Use ADA brand colors (Indigo #1E2A6E, Turquoise #15B5C6, Gold #E0A53C

Answer, then check yourself against the key.

2. What is the difference between `=` and `==`?

2. `=` assigns a value to a name; `==` compares two values and returns `True`/`False`.
3. `x` refers to the string `"hi"`. Yes — Python is dynamically typed, so a name can point to a
   value of a different type later.
4. A `NameError` ("name 'count' is not defined") — a variable must be assigned before use.

</details>

<script type="text/markdown" data-path="examples/python-variables-micro-credential/atoms/atom-2-data-types.md">## ⚛ Learning Atom 2 — *Data Types & Dynamic Typing*

**Phase:** 🙈 2 · Visual Exploration (*see*) · **KSA:** 🧠 Knowledge · **Target level:** L2
· **Component id:** `K-data-types`

### 🎯 Learning objective

- **Identify** Python's core built-in data types (`int`, `float`, `str`, `bool`), predict what
  `type()` returns, and explain how and why values get converted.

### 🧩 Prerequisites

- Atom 1 (you know a variable is a name bound to a value).

### 🧭 Atom description

A value isn't just "data" — it has a **type**, and the type decides what you can *do* with it.
`3 + 4` is `7`, but `"3" + "4"` is `"34"`. Most beginner bugs are really *type* bugs in disguise.
This atom gives you the four types you'll use constantly and the rules for moving between them.

---

### 📖 Reading — *The four types you'll use every day* (≈ 6 min)

> Author: ADA Methodology · aligned with the official Python tutorial.

Every value in Python has a **type**. You can always ask with the built-in `type()`:

```python
type(27)        # <class 'int'>
type(19.99)     # <class 'float'>
type("Ada")     # <class 'str'>
type(True)      # <class 'bool'>
```

The four core built-in types for beginners:

| Type | Means | Examples | Note |
| ---- | ----- | -------- | ---- |
| `int` | whole number | `0`, `27`, `-4` | no decimal point |
| `float` | decimal number | `19.99`, `3.0`, `-0.5` | the `.` makes it a float |
| `str` | text ("string") | `"Ada"`, `'hi'`, `"27"` | quotes — single or double |
| `bool` | truth value | `True`, `False` | capital T/F; a kind of int under the hood |

**Why type matters:** the same operator behaves differently by type.

```python
3 + 4            # 7      (int + int = arithmetic)
"3" + "4"        # "34"   (str + str = joining, called concatenation)
"ha" * 3         # "hahaha" (str * int = repeat)
3 + "4"          # TypeError: unsupported operand type(s) — can't add int and str
```

That last error is the most common beginner surprise, and it usually comes from **input**:
anything a user types with `input()` arrives as a **string**, even if it looks like a number.

```python
age = input("Age? ")   # user types 27 → age is the STRING "27"
age + 1                 # 💥 TypeError: can only concatenate str to str
```

The fix is **type conversion** (also called *casting*) — turn a value into another type with the
type's name as a function:

```python
int("27")        # 27      (str → int)
float("19.99")   # 19.99   (str → float)
str(27)          # "27"    (int → str)
int(19.99)       # 19      (float → int, truncates — it does NOT round)
bool(0)          # False   (0, "", and empty things are "falsy")
bool(42)         # True
```

So the input fix is to convert first:

```python
age = int(input("Age? "))   # now age is the number 27
print(age + 1)              # 28 ✅
```

Two nuances worth holding onto:

- **`int()` on a float truncates**, it does not round: `int(19.99)` is `19`. Use `round(19.99)`
  for `20`.
- A conversion can **fail**: `int("hello")` raises a `ValueError`. The value must actually look
  like the target type.

**Key takeaways**

- [ ] Four core types: `int`, `float`, `str`, `bool`; check any value with `type()`.
- [ ] `+` adds numbers but **joins** strings — type changes the behavior.
- [ ] `input()` always returns a **string** — convert before doing math.
- [ ] Convert with `int()`, `float()`, `str()`, `bool()`; `int()` **truncates** floats.
- [ ] A bad conversion raises a `ValueError`.

---

<script type="text/markdown" data-path="examples/python-variables-micro-credential/atoms/atom-3-naming-and-assignment-codelab.md">## ⚛ Learning Atom 3 — *Naming & Assignment (Codelab)*

**Phase:** 🙊 3 · Applied Practice (*do*) · **KSA:** 🛠️ Skill (+ 🌱 Ability) · **Target level:** L2
· **Component ids:** `S-declare-assign`, `A-attention-detail`

### 🎯 Learning objective

- **Declare, assign, and reassign** variables using **valid, readable PEP 8 names**, and fix the
  common naming/assignment errors by reading the error message.

### 🧩 Prerequisites

- Atoms 1–2. A Python runner open ([replit.com](https://replit.com), Colab, or local `python3`).

### 🧭 Atom description

Now you write code. Good variable *names* are not cosmetic — they are how code stays
understandable (to your teammates and to future-you). This codelab drills the mechanics of
assignment and the naming rules until they're automatic, and trains the habit of reading errors
instead of guessing.

---

### 📖 Read — *Naming rules & conventions* (≈ 4 min)

**Hard rules (break these and Python errors):**

- A name may contain letters, digits, and underscores `_`, and **cannot start with a digit**.
- No spaces and no operators in a name (`my var`, `my-var` are invalid).
- Names are **case-sensitive**: `age`, `Age`, and `AGE` are three different variables.
- You can't use Python **keywords** as names (`if`, `for`, `class`, `True`, `def`, `list`…).

**Conventions (PEP 8 — the style that makes you look professional):**

- Use **`snake_case`**: lowercase words joined by underscores → `first_name`, `total_price`.
- Make names **descriptive**: `n` < `num` < `num_students`. Future-you will thank you.
- Constants you won't change go in **`UPPER_CASE`** → `TAX_RATE = 0.19`.
- Avoid shadowing built-ins: don't name a variable `list`, `str`, `sum`, `type`, or `input`.

```python
# 👎 hard to read / risky
x = 19.99
l = 3
str = "hi"          # shadows the built-in str() — now str(5) breaks!

# 👍 clear and safe
unit_price = 19.99
quantity = 3
greeting = "hi"
TAX_RATE = 0.19
```

**Multiple & swap assignment** (handy Python shortcuts):

```python
a, b = 1, 2          # assign several at once
a, b = b, a          # swap! a is now 2, b is now 1 — no temp variable needed
x = y = 0            # both x and y refer to 0
```

---

### 💻 Codelab — *step by step*

Type each step yourself (don't copy-paste) — the muscle memory is the point.

**Step 1 — declare & print**

```python
first_name = "Ada"
birth_year = 1815
print(first_name, "was born in", birth_year)
```

**Step 2 — reassign & compute an age**

```python
current_year = 2026
age = current_year - birth_year
print(first_name, "would be", age, "years old.")
birth_year = 1820          # reassign
age = current_year - birth_year
print("Corrected age:", age)
```

**Step 3 — multiple assignment & swap**

```python
left, right = "🍎", "🍊"
print("Before:", left, right)
left, right = right, left
print("After: ", left, right)
```

**Step 4 — fix the broken code (read the error!)**
Each line below has one bug. Run it, read the error, and fix it.

```python
2nd_place = "silver"        # SyntaxError — why? (rename it)
first name = "Grace"        # SyntaxError — why?
print(First_name)           # NameError — why? (look at the capital F)
TAX RATE = 0.19             # SyntaxError — fix the name
```

<details>
<summary>Fixes</summary>

```python
second_place = "silver"     # names can't start with a digit
first_name = "Grace"        # no spaces in names → use snake_case
print(first_name)           # case-sensitive: First_name ≠ first_name
TAX_RATE = 0.19             # no spaces; constants in UPPER_CASE
```
</details>

---

### 💻🧪 Lab with tests — *put the logic in a function and prove it works*

Real code is organized into **functions** and verified with **unit tests**. Move your age logic
into a well-named function, add a `main()` to run it, and let a test confirm it's correct.

> 📁 Runnable files: [`../labs/profile_card.py`](../labs/profile_card.py) and
> [`../labs/test_profile_card.py`](../labs/test_profile_card.py).

```python
# profile_card.py — logic in functions, I/O in main()
def calculate_age(birth_year, current_year):
    return current_year - birth_year

def make_profile_card(name, birth_year, favorite_language, current_year):
    age = calculate_age(birth_year, current_year)
    return (
        "----- PROFILE -----\n"
        f"Name:     {name}\n"
        f"Age:      {age}\n"
        f"Codes in: {favorite_language}"
    )

def main():
    name = input("Name? ")
    birth_year = int(input("Birth year? "))
    favorite_language = input("Favorite language? ")
    print(make_profile_card(name, birth_year, favorite_language, 2026))

if __name__ == "__main__":   # only runs when you execute the file directly
    main()
```

The test file checks the functions *without* asking for input (that's why the logic is separate
from `main()`):

```python
# test_profile_card.py
import unittest
from profile_card import calculate_age, make_profile_card

class TestProfileCard(unittest.TestCase):
    def test_calculate_age(self):
        self.assertEqual(calculate_age(1990, 2026), 36)

    def test_card_contains_all_fields(self):
        card = make_profile_card("Ada", 2000, "Python", 2026)
        self.assertIn("Ada", card)
        self.assertIn("26", card)
        self.assertIn("Python", card)

if __name__ == "__main__":

<script type="text/markdown" data-path="examples/python-variables-micro-credential/atoms/atom-4-expressions-conversion-fstrings-codelab.md">## ⚛ Learning Atom 4 — *Expressions, Conversion & f-strings (Codelab)*

**Phase:** 🙊 3 · Applied Practice (*do*) · **KSA:** 🛠️ Skill (+ 🌱 Ability) · **Target level:** L2
· **Component ids:** `S-use-values`, `A-attention-detail`

### 🎯 Learning objective

- **Use** variables in expressions, **convert** types safely, and **format** output with
  f-strings to build a small interactive script.

### 🧩 Prerequisites

- Atoms 1–3. A Python runner open.

### 🧭 Atom description

Storing data is only useful if you *do* something with it. This codelab is where variables pay
off: you combine them in expressions, take user input, convert it to the right type, and print
clean, readable results with **f-strings** — the modern, professional way to format output.

---

### 🎬 Watch — f-strings in Python (short)

```youtube
https://www.youtube.com/watch?v=Mfmr_Puhtwc
"Python f-strings" — formatting values into text the modern way (~7 min).
```

### 📖 Read — *Expressions, conversion & f-strings* (≈ 5 min)

**Arithmetic operators** you'll use with number variables:

| Op | Means | Example | Result |
| -- | ----- | ------- | ------ |
| `+ - *` | add, subtract, multiply | `3 * 4` | `12` |
| `/` | divide (always a float) | `7 / 2` | `3.5` |
| `//` | floor divide | `7 // 2` | `3` |
| `%` | remainder (modulo) | `7 % 2` | `1` |
| `**` | power | `2 ** 3` | `8` |

You can update a variable using itself with **augmented assignment**:

```python
total = 100
total += 20      # same as total = total + 20  → 120
total *= 2       # → 240
```

**f-strings** put variables straight into text. Prefix the string with `f` and wrap names in `{}`:

```python
name = "Ada"
score = 92.5
print(f"{name} scored {score} points.")          # Ada scored 92.5 points.
print(f"{name} scored {score:.1f} points.")      # 92.5  (.1f = 1 decimal place)
print(f"Next year bonus: {score * 1.1:.2f}")     # expressions work inside {}
```

Remember the **input → convert → use** pattern from Atom 2:

```python
price = float(input("Price? "))      # "19.99" → 19.99
qty   = int(input("Quantity? "))     # "3" → 3
total = price * qty
print(f"Total for {qty} items: ${total:.2f}")
```

---

### 💻 Codelab — build a tip calculator

Build it step by step; run after each step.

```python
# Step 1 — gather inputs (convert as you read)
bill = float(input("Bill amount? "))
tip_percent = int(input("Tip %? "))
people = int(input("Split between how many? "))

# Step 2 — compute with expressions
tip = bill * tip_percent / 100
grand_total = bill + tip
per_person = grand_total / people

# Step 3 — format the output with f-strings
print(f"Bill:        ${bill:.2f}")
print(f"Tip ({tip_percent}%):    ${tip:.2f}")
print(f"Grand total: ${grand_total:.2f}")
print(f"Each person pays: ${per_person:.2f}")
```

**Extend it (choose at least one):**

- Add a `tax_percent` and include tax before the tip.
- Use `//` and `%` to show the result as whole dollars and remaining cents.
- Print a one-line summary using a single f-string.
