<script type="text/markdown" data-path="examples/ksa-attitude-adaptability.md"># 🌱 Example — Attitude / Ability: Adaptability & Growth Mindset (KSA)

**KSA flavor demonstrated:** a pure **Ability** (an attitude / durable disposition) — the
hardest type to teach and assess, and the one job postings most often demand ("adaptable",
"thrives in ambiguity", "growth mindset") yet rarely develop intentionally.

This example shows how v2 makes an *attitude* trainable and certifiable by: modeling it,
threading it across **multiple authentic occasions**, and assessing it with a **behavioral
rubric + reflection + 360**, never a quiz.

Conforms to [`../specs/micro-credential-v2-schema.md`](../specs/micro-credential-v2-schema.md).

---

## YAML front matter

```yaml
---
schema: ada-microcredential/v2
id: mc-adaptability-growth-mindset
title: "Thriving in Change: Adaptability & Growth Mindset"
language: en
duration_hours: 14
status: published
license: CC-BY-SA-4.0
mentors: ["@sancarbar"]

target_roles:
  - role: "Any role in a fast-changing digital team"
    framework_ref: "O*NET Work Styles: Adaptability/Flexibility, Persistence / ESCO: transversal attitudes"

ksa:
  - { id: K-mindset-science, type: knowledge, label: "Fixed vs. growth mindset; basics of self-regulation", target_level: 1, bloom: understand }
  - { id: S-reframing-technique, type: skill, label: "Apply a reframing/learning-loop technique under setback", target_level: 2, bloom: apply }
  - { id: A-adaptability, type: ability, label: "Adapt approach & stay effective amid change/ambiguity", target_level: 2, primary: true, affective_stage: organize, assessed_occasions: 4 }
  - { id: A-growth-mindset, type: ability, label: "Treat failure as learning; seek challenge & feedback", target_level: 2, affective_stage: value, assessed_occasions: 3 }

atoms:
  - { id: atom-1, title: "The science of mindset", ksa_refs: [K-mindset-science], phase: 1, formats: [read, watch, evaluate], rubric: knowledge-mini }
  - { id: atom-2, title: "Spot the mindset", ksa_refs: [K-mindset-science, A-growth-mindset], phase: 2, formats: [watch, evaluate], rubric: knowledge-mini }
  - { id: atom-3, title: "The curveball lab", ksa_refs: [A-adaptability, S-reframing-technique], phase: 3, formats: [practice, collaborate, evaluate], rubric: ability-behavioral }
  - { id: atom-4, title: "Failure résumé & growth journal", ksa_refs: [A-growth-mindset, A-adaptability], phase: 4, formats: [practice, collaborate, evaluate], rubric: ability-behavioral }

capstone:
  title: "The pivot challenge"
  integrates_ksa: [K-mindset-science, S-reframing-technique, A-adaptability, A-growth-mindset]
  rubric: capstone-5

badge:
  name: "Thriving in Change"
  evidence_required: ["atom-3", "atom-4", "capstone"]
  issued_on: verified-evidence
---
```

---

## 🎯 Target Job Competency
Stay effective and keep learning when **goals, tools, or requirements change** — listed in
postings as *adaptability, flexibility, resilience, growth mindset* (O\*NET Work Styles;
ESCO transversal attitudes).

## 🧬 KSA breakdown — an attitude, modeled as Abilities

| KSA | Component | Why this type | Target |
| --- | --------- | ------------- | ------ |
| 🧠 Knowledge | Fixed vs. growth mindset; self-regulation basics | Concepts to understand (small enabling layer) | L1 |
| 🛠️ Skill | A reframing / learning-loop technique | A *teachable move* you can practice in reps | L2 |
| 🌱 Ability | Adaptability amid change | A disposition shown across many situations | L2 |
| 🌱 Ability | Growth mindset (failure = learning) | A disposition / attitude shown over time | L2 |

> **Why two Abilities + one Skill:** an attitude isn't taught by lecturing it. v2 gives the
> learner a small **Knowledge** base, a concrete **Skill** (a reframing move they can
> actually do), and then builds the **Abilities** through repeated, real exposure to
> change — because dispositions are proven by *behavior across contexts*, not by a test.

## 📘 Learning Objectives (Bloom + Affective + KSA)

| Objective | Bloom / Affective | KSA | Component | Target |
| --------- | ----------------- | --- | --------- | ------ |
| Explain fixed vs. growth mindset | Understand | 🧠 K | K-mindset-science | L1 |
| Apply a reframing technique to a setback | Apply | 🛠️ S | S-reframing-technique | L2 |
| Adapt approach when conditions change | Organize (affective) | 🌱 A | A-adaptability | L2 |
| Treat failure as learning; seek challenge | Value (affective) | 🌱 A | A-growth-mindset | L2 |

---

## ⚛ Learning Atoms — *attitude-appropriate design*

> Modalities below are chosen from the [Learning Atom Topology](../specs/learning-atom-topology.md):
> 🖼️ *Mental Model* · 🎬 *case clips* · 🧪 *Simulation / Role-Play* · 📖 *Journal* · 🤝 *Study Group* · ✅ *Behavioral Assessment*.

### Atom 1 · "The science of mindset" — 🧠 Knowledge *(Phase 1)*
- **Read/Watch:** growth-mindset overview; what self-regulation is.
- **Evaluate:** quick concept check. **Evidence:** K-mindset-science **L1**.
- *(Knowledge here is intentionally light — L1 — it only enables the Abilities.)*

### Atom 2 · "Spot the mindset" — 🧠 K → 🌱 A modeling *(Phase 2: see)*
- **Watch:** clips/cases of people facing setbacks with fixed vs. growth responses.
- **Evaluate:** identify the language and behaviors of each; predict outcomes.
- **Purpose:** lets learners *recognize* the target Ability before being asked to live it.

### Atom 3 · "The curveball lab" — 🌱 Ability + 🛠️ Skill *(Phase 3: do)*
- **Practice:** mid-task, the brief **changes twice** (new constraint, then a removed
  resource). Learner replans using the reframing technique. *(occasions 1 & 2)*
- **Collaborate:** debrief with peers; mentor observes how the learner responded to change.
- **Evaluate:** behavioral rubric on *adaptation* (did they re-plan vs. freeze?) + correct
  use of the reframing move.
- **Evidence:** effective response to 2 changes → S-reframing-technique **L2**; partial
  A-adaptability evidence.

### Atom 4 · "Failure résumé & growth journal" — 🌱 Ability *(Phase 4: share)*
- **Practice:** write a *failure résumé* (a real setback + what was learned); set a
  stretch goal and pursue feedback on it. *(occasion 3)*
- **Collaborate:** share with the cohort; give/receive supportive challenge.
- **Reflect:** ongoing growth journal across the 2–3 weeks *(occasion 4 — sustained)*.
- **Evaluate:** behavioral rubric + peer/mentor 360 on sustained behavior.
- **Evidence:** A-growth-mindset **L2** (3 occasions) and A-adaptability **L2** (4 occasions).

---

## 🔍 Phase planner

| Phase | Atom(s) | KSA focus | Activity | Assessment |
| ----- | ------- | --------- | -------- | ---------- |
| 🙉 1 | Atom 1 | 🧠 K | mindset readings/video | knowledge-mini |
| 🙈 2 | Atom 2 | 🧠 K → 🌱 A | analyze case clips | formative |
| 🙊 3 | Atom 3 | 🌱 A + 🛠️ S | curveball lab (change ×2) | behavioral |
| 🐵 4 | Atom 4 | 🌱 A | failure résumé + journal + 360 | behavioral + 360 |

---

## 📊 Behavioral rubric (the right tool for an attitude)

| Criterion | Excellent (3) | Adequate (2) | Needs Improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Consistency across contexts** | Adapted effectively across all 4 occasions | Adapted in 2–3 | Froze/resisted; only when pushed |
| **Self-awareness (reflection)** | Names triggers, choices, and growth with insight | Some reflection | Minimal/none |
| **Response to setback/feedback** | Reframes as learning, seeks the challenge | Accepts but passive | Defensive or avoidant |

> An attitude can't be certified from one moment or a quiz. The rubric explicitly requires
> evidence **across occasions** — that's what separates an Ability from a Skill.

## 🚀 Capstone — "The pivot challenge"
A multi-day project whose goal **pivots partway through**. Learners must re-scope, keep the
team moving, document what they changed and why, and reflect on how they handled it.
Capstone criteria map to KSA:

| Capstone criterion | Evidences |
| ------------------ | --------- |
| Relevance | adapting to a realistic pivot |
| Application of Skills | S-reframing-technique |
| Problem-Solving & Creativity | A-adaptability |
| Clarity & Communication | reflection + change log |
| Collaboration & Reflection | A-growth-mindset + peer 360 |

## 🏅 Badge → skills map
Sets `A-adaptability=2` and `A-growth-mindset=2` — exactly the durable Abilities that
employers list as `must_have` "attitude/fit" and that a Knowledge-only course can never
certify. This badge is what closes the **Ability** gaps in a job-match skills map.
</script>
<script type="text/markdown" data-path="examples/ksa-human-skill-feedback.md"># 🤝 Example — Human Skill: Giving & Receiving Feedback (KSA)

**KSA flavor demonstrated:** a **human/durable Skill** (the technique of structuring
feedback) explicitly paired with an **Ability** (empathetic, psychologically-safe
communication) and grounded in **Knowledge** (feedback models).

This example shows that "soft" competencies decompose with the **same KSA rigor** as
technical ones — and why human competencies usually need **both** a Skill layer (the
repeatable technique) **and** an Ability layer (the disposition shown across situations).

Conforms to [`../specs/micro-credential-v2-schema.md`](../specs/micro-credential-v2-schema.md).

---

## YAML front matter

```yaml
---
schema: ada-microcredential/v2
id: mc-feedback-conversations
title: "Feedback That Helps: Giving & Receiving Feedback"
language: en
duration_hours: 12
status: published
license: CC-BY-SA-4.0
mentors: ["@sancarbar"]

target_roles:
  - role: "Team Lead / Senior Individual Contributor"
    framework_ref: "ESCO: transversal skills – communication, teamwork / O*NET: Social Skills"

ksa:
  - { id: K-feedback-models, type: knowledge, label: "Feedback models (SBI, radical candor, growth feedback)", target_level: 2, bloom: understand }
  - { id: S-structure-feedback, type: skill, label: "Structure a feedback conversation (SBI: Situation-Behavior-Impact)", target_level: 2, bloom: apply, primary: true, prerequisites: [K-feedback-models] }
  - { id: S-receive-feedback, type: skill, label: "Receive feedback without defensiveness; ask clarifying questions", target_level: 2, bloom: apply }
  - { id: A-empathetic-communication, type: ability, label: "Communicate with empathy & create psychological safety", target_level: 2, affective_stage: value, assessed_occasions: 3 }

atoms:
  - { id: atom-1, title: "Why feedback fails — and the models that work", ksa_refs: [K-feedback-models], phase: 1, formats: [read, listen, evaluate], rubric: knowledge-mini }
  - { id: atom-2, title: "Watch good & bad feedback", ksa_refs: [K-feedback-models, A-empathetic-communication], phase: 2, formats: [watch, evaluate], rubric: knowledge-mini }
  - { id: atom-3, title: "Role-play: give SBI feedback", ksa_refs: [S-structure-feedback, A-empathetic-communication], phase: 3, formats: [practice, collaborate, evaluate], rubric: ability-behavioral }
  - { id: atom-4, title: "Receive feedback & reflect", ksa_refs: [S-receive-feedback, A-empathetic-communication], phase: 4, formats: [practice, collaborate, evaluate], rubric: ability-behavioral }

capstone:
  title: "Run a real feedback conversation"
  integrates_ksa: [K-feedback-models, S-structure-feedback, S-receive-feedback, A-empathetic-communication]
  rubric: capstone-5

badge:
  name: "Feedback That Helps"
  evidence_required: ["atom-3", "atom-4", "capstone"]
  issued_on: verified-evidence
---
```

---

## 🎯 Target Job Competency
Give and receive **actionable, respectful feedback** — a transversal competency for any
leadership or senior IC role (ESCO transversal skills: communication, teamwork).

## 🧬 KSA breakdown — and the Skill ↔ Ability distinction

| KSA | Component | Why this type | Target |
| --- | --------- | ------------- | ------ |
| 🧠 Knowledge | Feedback models (SBI, growth feedback) | Concepts you recall & reason with | L2 |
| 🛠️ Skill | Structure a feedback conversation (SBI) | A **repeatable technique** that improves with reps | L2 |
| 🛠️ Skill | Receive feedback constructively | Also a practiced procedure | L2 |
| 🌱 Ability | Empathetic communication / psychological safety | A **disposition** shown consistently across people & moments | L2 |

> **Key teaching point:** the *technique* of SBI is a **Skill** (learnable in reps). Doing
> it with genuine empathy that makes others feel safe is an **Ability** (a disposition
> proven across many conversations). v2 develops and assesses **both**.

## 📘 Learning Objectives (Bloom + KSA)

| Objective | Bloom | KSA | Component | Target |
| --------- | ----- | --- | --------- | ------ |
| Compare common feedback models | Understand | 🧠 K | K-feedback-models | L2 |
| Deliver feedback using SBI | Apply | 🛠️ S | S-structure-feedback | L2 |
| Receive feedback without defensiveness | Apply | 🛠️ S | S-receive-feedback | L2 |
| Communicate with empathy / safety | Value | 🌱 A | A-empathetic-communication | L2 |

---

## ⚛ Learning Atoms — *taught & assessed to type*

> Modalities below are chosen from the [Learning Atom Topology](../specs/learning-atom-topology.md):
> 📖 *Article* · 🎧 *Podcast* · 🎬 *paired clips* · 🧪 *Role-Play* · 🤝 *Peer 360* · ✅ *Behavioral Assessment*.

### Atom 1 · "Why feedback fails — and what works" — 🧠 Knowledge *(Phase 1)*
- **Read:** SBI model + growth-feedback overview. **Listen:** podcast on candor vs. kindness.
- **Evaluate:** concept check — classify statements as observation vs. judgment.
- **Evidence:** ≥80% quiz → K-feedback-models **L2**. **Rubric:** `knowledge-mini`.

### Atom 2 · "Watch good & bad feedback" — 🧠 K → 🌱 A modeling *(Phase 2: see)*
- **Watch:** paired clips of effective vs. damaging feedback.
- **Evaluate:** annotate what created (or destroyed) psychological safety.
- **Purpose:** builds the mental model of what the Ability *looks like* before practicing it.

### Atom 3 · "Role-play: give SBI feedback" — 🛠️ Skill + 🌱 Ability *(Phase 3: do)*
- **Practice:** role-play giving feedback to a peer on a real-ish scenario (occasion 1),
  then a second, different scenario (occasion 2).
- **Collaborate:** peers + mentor observe and coach.
- **Evaluate:** behavioral rubric on **both** the SBI structure (Skill) and the empathy /
  safety created (Ability).
- **Evidence:** structured, empathetic delivery in 2 scenarios → S-structure-feedback **L2**
  + partial A evidence. **Rubric:** `ability-behavioral`.

### Atom 4 · "Receive feedback & reflect" — 🛠️ Skill + 🌱 Ability *(Phase 4: share)*
- **Practice:** receive live feedback; respond with clarifying questions, no defensiveness.
- **Collaborate:** 360 mini-survey from 2 peers + mentor (occasion 3).
- **Reflect:** journal on your default reaction and how you regulated it.
- **Evidence:** corroborated calm, curious reception → S-receive-feedback **L2**; combined
  with Atoms 2–3 → A-empathetic-communication **L2** (3 occasions met).

---

## 🔍 Phase planner

| Phase | Atom(s) | KSA focus | Activity | Assessment |
| ----- | ------- | --------- | -------- | ---------- |
| 🙉 1 | Atom 1 | 🧠 K | read/listen + quiz | knowledge-mini |
| 🙈 2 | Atom 2 | 🧠 K → 🌱 A | annotate clips | formative |
| 🙊 3 | Atom 3 | 🛠️ S + 🌱 A | role-play ×2 | behavioral |
| 🐵 4 | Atom 4 | 🛠️ S + 🌱 A | receive + 360 + reflect | behavioral + 360 |

---

## 🚀 Capstone — "Run a real feedback conversation"
Conduct an actual (or high-fidelity simulated) feedback conversation, recorded or observed,
then receive feedback on your feedback. Submit a reflection. Scored with the 5-criteria
capstone rubric:

| Capstone criterion | Evidences |
| ------------------ | --------- |
| Relevance | K-feedback-models |
| Application of Skills | S-structure-feedback, S-receive-feedback |
| Problem-Solving & Creativity | adapting tone to the person/situation |
| Clarity & Communication | A-empathetic-communication |
| Collaboration & Reflection | 360 + reflection journal |

## 🌱 Why the Ability needs ≥3 occasions
A single good conversation could be luck. v2 certifies `A-empathetic-communication` only
after it shows up across **Atom 2 (recognize), Atom 3 (×2 role-plays), Atom 4 (live + 360)**
— consistency across contexts is the definition of an Ability.

## 🏅 Badge → skills map
Sets `K-feedback-models=2`, `S-structure-feedback=2`, `S-receive-feedback=2`,
`A-empathetic-communication=2` — the human-skill cluster many leadership roles list as a
`must_have` Ability that postings rarely teach.
</script>
<script type="text/markdown" data-path="examples/ksa-technical-skill-rest-api.md"># 🛠️ Example — Technical Skill: REST API Fundamentals (KSA)

**KSA flavor demonstrated:** primarily a **Skill** (technical/hard), built on top of
**Knowledge**, and threaded with one **Ability**.

This worked example shows an ADA **v2** micro-credential conforming to
[`../specs/micro-credential-v2-schema.md`](../specs/micro-credential-v2-schema.md). It
illustrates how a *technical skill* is decomposed into Knowledge (know-what), Skill
(know-how), and Ability (durable disposition).

---

## YAML front matter (machine-readable)

```yaml
---
schema: ada-microcredential/v2
id: mc-rest-api-fundamentals
title: "REST API Fundamentals with Flask"
language: en
duration_hours: 18
status: published
license: CC-BY-SA-4.0
authors: ["Ada School Team"]
mentors: ["@sancarbar"]

target_roles:
  - role: "Junior Backend Developer"
    framework_ref: "O*NET 15-1254.00 Web Developers / SFIA:PROG"

ksa:
  - { id: K-http-semantics,    type: knowledge, label: "HTTP methods, status codes & REST design", target_level: 2, bloom: understand }
  - { id: S-build-rest-endpoint, type: skill,   label: "Build & test a CRUD REST endpoint", target_level: 2, bloom: create, primary: true, prerequisites: [K-http-semantics] }
  - { id: S-write-unit-tests,  type: skill,     label: "Write unit tests for an endpoint", target_level: 2, bloom: apply }
  - { id: A-adaptability,      type: ability,   label: "Adapt the API when requirements change", target_level: 2, affective_stage: respond, assessed_occasions: 3 }

atoms:
  - { id: atom-1, title: "How the web talks", ksa_refs: [K-http-semantics], phase: 1, modalities: [{dimension: read, subtype: "Technical Article"}, {dimension: watch, subtype: "Video Explainer"}, {dimension: see, subtype: "Diagram"}, {dimension: evaluate, subtype: "Pop Quiz"}], rubric: knowledge-mini }
  - { id: atom-2, title: "Build your first endpoint", ksa_refs: [S-build-rest-endpoint, K-http-semantics], phase: 3, modalities: [{dimension: watch, subtype: "Tutorial / Screencast"}, {dimension: practice, subtype: "Codelab"}, {dimension: evaluate, subtype: "Performance Task"}], rubric: skill-performance }
  - { id: atom-3, title: "Prove it works: unit testing", ksa_refs: [S-write-unit-tests], phase: 3, modalities: [{dimension: practice, subtype: "Test Challenge"}, {dimension: evaluate, subtype: "Mini-Rubric"}], rubric: skill-performance }
  - { id: atom-4, title: "Requirements changed — adapt", ksa_refs: [A-adaptability, S-build-rest-endpoint], phase: 4, modalities: [{dimension: practice, subtype: "Project Task"}, {dimension: collaborate, subtype: "Pair Programming"}, {dimension: evaluate, subtype: "Behavioral Assessment"}], rubric: ability-behavioral }

capstone:
  title: "Ship a small Tasks API"
  integrates_ksa: [K-http-semantics, S-build-rest-endpoint, S-write-unit-tests, A-adaptability]
  rubric: capstone-5

badge:
  name: "REST API Fundamentals"
  evidence_required: ["capstone", "atom-3", "atom-4"]
  issued_on: verified-evidence
---
```

---

## 🎓 Title
**REST API Fundamentals with Flask** · ⏳ 18 hours · 3 weeks

## 🎯 Target Job Competency
Build, test, and adapt RESTful web services — a core task for a **Junior Backend Developer**
(O\*NET 15-1254.00 / SFIA:PROG).

## 🧬 KSA breakdown of this competency

| KSA | Component | Why this type | Target |
| --- | --------- | ------------- | ------ |
| 🧠 Knowledge | HTTP methods, status codes, REST resource design | Information you must recall & reason with | L2 Working |
| 🛠️ Skill | Build & test a CRUD endpoint | A procedure that improves with reps & produces an artifact | L2 Working |
| 🛠️ Skill | Write unit tests | Same — procedural, artifact-producing | L2 Working |
| 🌱 Ability | Adaptability when requirements change | A disposition shown across situations | L2 Working |

> Note how a "technical" competency is **not just a skill** — it rests on Knowledge and is
> only job-real when paired with the Ability to adapt.

## 📘 Learning Objectives (Bloom + KSA)

| Objective | Bloom | KSA | Component | Target |
| --------- | ----- | --- | --------- | ------ |
| Explain HTTP methods, status codes & REST design | Understand | 🧠 K | K-http-semantics | L2 |
| Build & test a CRUD endpoint in Flask | Create | 🛠️ S | S-build-rest-endpoint | L2 |
| Write unit tests covering happy + error paths | Apply | 🛠️ S | S-write-unit-tests | L2 |
| Adapt the API to a changed spec | Apply | 🌱 A | A-adaptability | L2 |

## 🧱 Atom & Modality Map

Each atom selects concrete sub-types from the [Learning Atom Topology](../specs/learning-atom-topology.md), matched to its KSA type.

```mermaid
flowchart TD
  MC["🎓 REST API Fundamentals"]
  MC --> A1["⚛ Atom 1 · 🧠 K · P1<br/>📖 Technical Article<br/>🎬 Video Explainer<br/>🖼️ Diagram<br/>✅ Pop Quiz"]
  MC --> A2["⚛ Atom 2 · 🛠️ S · P3<br/>🎬 Screencast<br/>🧪 Codelab<br/>✅ Performance Task"]
  MC --> A3["⚛ Atom 3 · 🛠️ S · P3<br/>🧪 Test Challenge<br/>✅ Mini-Rubric"]
  MC --> A4["⚛ Atom 4 · 🌱 A · P4<br/>🧪 Project Task<br/>🤝 Pair Programming<br/>✅ Behavioral Assessment"]
  A1 --> CAP["🚀 Capstone: Ship a Tasks API"]
  A2 --> CAP
  A3 --> CAP
  A4 --> CAP
  CAP --> B["🏅 Badge → 🗺️ Skills Map"]
```

---

## ⚛ Learning Atoms — *taught & assessed to type*

### Atom 1 · "How the web talks" — 🧠 Knowledge *(Phase 1: hear)*
- **📖 Read** *(Technical Article)*: REST/HTTP primer (MDN HTTP overview).
- **🎬 Watch** *(Video Explainer)*: 10-min animated request/response lifecycle.
- **🖼️ See** *(Diagram)*: annotate a client–server request/response diagram.
- **🧪 Practice** *(retrieval)*: map verbs ↔ CRUD.
- **✅ Evaluate** *(Pop Quiz)*: 10-question check (status codes, idempotency).
- **Evidence → level:** ≥80% on quiz + correct diagram → K-http-semantics **L2**.
- **Rubric:** `knowledge-mini` (Accuracy-weighted).

### Atom 2 · "Build your first endpoint" — 🛠️ Skill *(Phase 3: do)*
- **🎬 Watch** *(Tutorial / Screencast)*: walkthrough (mirrors `templates/codelab-ada-template.md`).
- **🧪 Practice** *(Codelab)*: implement `GET/POST/PUT/DELETE /items` in Flask with JSON +
  error handling; commit to a repo.
- **✅ Evaluate** *(Performance Task)*: rubric on the running endpoint + code review.
- **Evidence → level:** working CRUD endpoint reviewed by mentor → S-build-rest-endpoint **L2**.
- **Rubric:** `skill-performance` (Application-weighted).

### Atom 3 · "Prove it works: unit testing" — 🛠️ Skill *(Phase 3: do)*
- **🧪 Practice** *(Test Challenge)*: write `pytest` tests covering happy path + 404/400
  cases; reach ≥80% coverage of the endpoint.
- **✅ Evaluate** *(Mini-Rubric)*: passing suite + coverage report.
- **Evidence → level:** green suite, ≥80% coverage → S-write-unit-tests **L2**.
- **Rubric:** `skill-performance`.

### Atom 4 · "Requirements changed — adapt & review" — 🌱 Ability *(Phase 4: share)*
- **🧪 Practice** *(Project Task)*: a new spec arrives (add filtering + pagination);
  implement via a PR.
- **🤝 Collaborate** *(Pair Programming + Async Peer Review)*: pair on the change; review one
  peer's PR; receive a review on yours.
- **📖 Read/Write** *(Journal)*: reflect — *what changed, what you changed, what you'd do differently.*
- **✅ Evaluate** *(Behavioral Assessment)*: behavioral rubric across **3 occasions** (the
  change, the peer review, the reflection) + mentor observation.
- **Evidence → level:** adaptation handled + constructive review + reflection → A-adaptability **L2**.
- **Rubric:** `ability-behavioral`.

---

## 🔍 Phase planner

| Phase | Atom(s) | KSA focus | Activity | Assessment |
| ----- | ------- | --------- | -------- | ---------- |
| 🙉 1 Self-Guided | Atom 1 | 🧠 K | readings + video + diagram | quiz |
| 🙈 2 Visual | Atom 2 (demo) | 🧠 K→🛠️ S | codelab walkthrough | formative |
| 🙊 3 Applied | Atoms 2–3 | 🛠️ S | build + test labs | performance rubric |
| 🐵 4 Collaboration | Atom 4 | 🌱 A | PR + peer review + reflection | behavioral rubric |

---

## 🚀 Capstone — "Ship a small Tasks API"
Design, build, test, and **adapt** a multi-resource REST API (tasks + tags), submit via PR,
and review a peer's submission. Scored with the 5-criteria capstone rubric; each criterion
maps to a KSA it evidences:

| Capstone criterion | Evidences |
| ------------------ | --------- |
| Relevance (job alignment) | K-http-semantics |
| Application of Skills | S-build-rest-endpoint, S-write-unit-tests |
| Problem-Solving & Creativity | S-build-rest-endpoint |
| Clarity & Communication | reflection + PR description |
| Collaboration & Reflection | A-adaptability + peer review |

## 🏅 Badge → skills map
Earning **REST API Fundamentals** sets `K-http-semantics=2`, `S-build-rest-endpoint=2`,
`S-write-unit-tests=2`, `A-adaptability=2` in the learner profile — directly raising the
**Junior Backend Developer** job-match score (see
[`skills-map-job-match-frontend.md`](skills-map-job-match-frontend.md) for the matching math
on an analogous role).

---

## 🤖 How Gen AI authored this
Generated via [`../specs/genai-authoring-workflow.md`](../specs/genai-authoring-workflow.md):
Stage 1 extracted the KSA from a backend-dev posting → Stage 3–5 designed the atoms and
typed rubrics → a mentor validated the proficiency targets before publishing.

<script type="text/markdown" data-path="examples/learning-atom-art.md"># 🎨 Learning Atom: Exploring Color Theory

## 🎯 Objective

Explain how primary, secondary, and complementary colors interact to create balanced compositions. *(Bloom: Understand)*

---

## 🔑 Job Competency Link

This atom develops foundational knowledge in **visual design and art fundamentals**, supporting broader competencies in **graphic design, digital illustration, and creative industries**.

---

## 📚 Resource Stack

* **Read:** ["Color Wheel Basics"](https://www.colormatters.com/color-and-design/basic-color-theory) article introducing primary and secondary colors.
* **Listen:** Short podcast episode on the emotional impact of different hues.
* **Watch:** Video demonstration of mixing paints to build a color wheel.
* **Practice:** Create a digital color wheel using free tools like Canva, Figma, or GIMP.
* **Evaluate:** Quiz identifying color harmonies and complementary pairs.
* **Collaborate:** Share your color wheel in the community channel and give feedback to a peer.

---

## 🧪 Practice Activity

Learners design their own **digital color wheel** and use it to create a **simple composition (poster, illustration, or logo)** demonstrating at least one complementary pair.

---

## 📊 Evaluation (Mini-Rubric)

| Criterion       | Excellent (3)                                                          | Adequate (2)                                  | Needs Improvement (1)                |
| --------------- | ---------------------------------------------------------------------- | --------------------------------------------- | ------------------------------------ |
| **Accuracy**    | Correct identification of primary, secondary, and complementary colors | Minor mistakes in color placement             | Several mistakes or missing elements |
| **Application** | Demonstrates clear use of color theory in the composition              | Partial use of color theory, somewhat applied | Weak or missing application          |
| **Clarity**     | Clean, professional, well-organized submission                         | Some clarity, could be improved               | Unclear, messy, or hard to interpret |

---

## 📦 Resources & Tools

* Canva / Figma / GIMP (free design tools)
* Color theory reference charts
* Example digital color wheels

---

## 👥 Collaboration (Optional)

Post your color wheel in the learning forum and exchange **peer feedback** on how well complementary colors were used in the sample compositions.

---

## ✅ Completion Criteria

* [ ] Digital color wheel uploaded.
* [ ] Quiz completed with 80% or higher.
* [ ] Commented on at least one peer’s color wheel.

<script type="text/markdown" data-path="examples/role-data-scientist-pathway.md"># 📘 Worked Example — *Data Processing → Data Scientist* Pathway

An end-to-end application of the
[Role-to-Credential Mapping methodology](../specs/role-to-credential-mapping.md): we take a
**real role with placement demand** (*Data Scientist*), **deconstruct** it into duties →
tasks → KSA at a **high-performer bar**, **cluster** those into a **pathway of connected
micro-credentials** (starting with *data processing*), and **measure a learner's skills gap**
toward the role.

> Reads alongside: [`ksa-taxonomy.md`](../specs/ksa-taxonomy.md) ·
> [`skills-map-and-job-matching.md`](../specs/skills-map-and-job-matching.md) ·
> [`genai-authoring-workflow.md`](../specs/genai-authoring-workflow.md).

---

## Stage 0 — Target role & demand 🔒

```yaml
role: "Data Scientist"
framework_refs: ["O*NET:15-2051.00", "ESCO:data scientist", "ILO ISCO-08:2511", "SFIA:DATS"]
purpose: "Turn data into validated, decision-ready insight and ML systems."
demand_signals:
  - { signal: "high and growing demand for data/ML roles", value: "high", verified: false }   # NEEDS HUMAN VALIDATION
validated_by: "employer:AcmeData / mentor:@sancarbar"
```

**Why this role:** consistent hiring demand and a clear, *learnable* skill structure that
builds from an accessible entry point — **data processing** — which is itself a job-relevant
competency (data/analytics assistants) and the foundation every downstream duty depends on.

---

## Stages 1–2 — Triangulated duty → task analysis 🔒

Signals used: O\*NET/ESCO task lists (A) + 8 job postings (B) + shadowing & a BEI with 2
senior data scientists (C). Reconciled into duties and observable tasks.

```mermaid
flowchart TD
  R["💼 Data Scientist"] --> D1["🗂️ D1 Acquire &amp; prepare data"]
  R --> D2["🗂️ D2 Explore &amp; visualize"]
  R --> D3["🗂️ D3 Model &amp; validate"]
  R --> D4["🗂️ D4 Operationalize"]
  R --> D5["🗂️ D5 Communicate &amp; influence"]
  D1 --> T1["🔧 Clean &amp; validate a raw dataset"]
  D1 --> T2["🔧 Build a reproducible data pipeline"]
  D2 --> T3["🔧 Run EDA &amp; visualize patterns"]
  D3 --> T4["🔧 Frame &amp; test a hypothesis"]
  D3 --> T5["🔧 Train &amp; evaluate an ML model"]
  D4 --> T6["🔧 Deploy &amp; monitor a model"]
  D5 --> T7["🔧 Turn results into a decision recommendation"]
```

---

## Stages 3–4 — KSA at the high-performer bar

For each task we extract Knowledge / Skill / Ability with a **target level (0–4)** defined as
*"what a strong performer does,"* plus **observable performance criteria** taken from the
observation notes. (Abbreviated to the core components.)

| KSA id | Type | Label | Bar (0–4) | Performance criterion (from observation) | Must-have |
| ------ | ---- | ----- | --------- | ---------------------------------------- | --------- |
| `K-data-types-quality` | 🧠 K | Data types, missingness & quality concepts | 2 | Names failure modes before touching data | yes |
| `S-data-wrangling` | 🛠️ S | Clean/transform data reproducibly | 3 | Justified missing/outlier strategy; rerunnable pipeline | yes |
| `S-pipeline-build` | 🛠️ S | Build a parameterized data pipeline | 2 | Idempotent, documented, version-controlled | yes |
| `K-stats-foundations` | 🧠 K | Probability & inferential statistics | 2 | Chooses the right test; states assumptions | yes |
| `S-eda-visualization` | 🛠️ S | EDA & honest visualization | 3 | Charts answer a question; no misleading scales | yes |
| `S-ml-modeling` | 🛠️ S | Train/evaluate ML models | 3 | Proper train/val/test; metric fits the problem | yes |
| `S-ml-production` | 🛠️ S | Deploy & monitor a model | 2 | Tracks drift; can roll back | no |
| `S-insight-communication` | 🛠️ S | Communicate results to deciders | 3 | Leads with the decision, not the method | yes |
| `A-rigor` | 🌱 A | Analytical rigor / skepticism | 3 | Verifies assumptions; distrusts "too good" results | yes |
| `A-stakeholder-empathy` | 🌱 A | Stakeholder empathy & communication | 2 | Frames work in the audience's terms | yes |
| `A-adaptability` | 🌱 A | Adaptability under changing data/goals | 2 | Re-plans when data invalidates the approach | no |

> Note the **differentiators** the postings didn't list — `A-rigor`, `A-stakeholder-empathy`
> — surfaced by the Behavioral Event Interviews. These often decide who performs well.

---

## Stages 5–6 — Cluster into a sequenced pathway

KSA cluster into six micro-credentials, sequenced by prerequisite and rising proficiency
across the four ADA phases.

```mermaid
flowchart LR
  MC1["📦 Data Wrangling<br/>(data processing)"] --> MC2["📊 EDA &amp; Visualization"]
  MC2 --> MC3["📐 Statistical Inference"]
  MC3 --> MC4["🤖 ML Foundations"]
  MC4 --> MC5["🚀 ML in Production"]
  MC2 --> MC6["🗣️ Insight Communication"]
  MC5 --> JOB["🎯 Data Scientist<br/>job-ready"]
  MC6 --> JOB
```

| # | Micro-credential | Closes (KSA) | Phase | Capstone (mirrors a real task) |
| - | ---------------- | ------------ | ----- | ------------------------------ |
| 1 | **Data Wrangling** *(data processing)* | `K-data-types-quality`, `S-data-wrangling`, `S-pipeline-build`, `A-rigor` | 1·3 | Ship a reproducible cleaning pipeline + data-quality report on a messy real dataset |
| 2 | **EDA & Visualization** | `S-eda-visualization`, `A-stakeholder-empathy` | 2 | Produce an EDA notebook that answers 3 stakeholder questions honestly |
| 3 | **Statistical Inference** | `K-stats-foundations`, `A-rigor` | 3 | Design + run a valid A/B-style test and defend the assumptions |
| 4 | **ML Foundations** | `S-ml-modeling`, `A-rigor` | 3 | Train, evaluate, and error-analyze a model with leakage-free splits |
| 5 | **ML in Production** | `S-ml-production`, `A-adaptability` | 3 | Deploy a model behind an API with drift monitoring + rollback |
| 6 | **Insight Communication** | `S-insight-communication`, `A-stakeholder-empathy` | 4 | Present a decision recommendation to a non-technical panel |

Each is a standalone **ADA v2 micro-credential** (design them with the
[v2 schema](../specs/micro-credential-v2-schema.md)); **earning all required ones accumulates
into the Data Scientist role profile.**

---

## Stage 8 — Skills-gap analysis for a learner

A learner arrives having done some data work. We evidence their current levels and diff
against the role bar (mechanics: [skills-map spec](../specs/skills-map-and-job-matching.md)).

```yaml
learner: "ada-learner-042"
evidenced:
  - { ref: K-data-types-quality, level: 2, evidence: "quiz:mc-wrangling", verified: true }
  - { ref: S-data-wrangling,     level: 2, evidence: "artifact:cleaning-nb", verified: true }
  - { ref: S-pipeline-build,     level: 1, evidence: "lab:pipeline-1", verified: true }
  - { ref: S-eda-visualization,  level: 1, evidence: "artifact:eda-1", verified: true }
  - { ref: A-rigor,              level: 2, evidence: "360:cohort-3", verified: true }
  # statistics, ML, production, communication, stakeholder-empathy: not yet evidenced (L0)
```

### Resulting skills map (core/must-have rows)

| Component | Type | Bar | Have | Gap | Status |
| --------- | ---- | --- | ---- | --- | ------ |
| K-data-types-quality | 🧠 K | 2 | 2 | 0 | ✅ met |
| S-data-wrangling | 🛠️ S | 3 | 2 | 1 | 🟡 partial |
| S-pipeline-build | 🛠️ S | 2 | 1 | 1 | 🟡 partial |
| K-stats-foundations | 🧠 K | 2 | 0 | 2 | 🔴 missing |
| S-eda-visualization | 🛠️ S | 3 | 1 | 2 | 🟡 partial |
| S-ml-modeling | 🛠️ S | 3 | 0 | 3 | 🔴 missing |
| S-insight-communication | 🛠️ S | 3 | 0 | 3 | 🔴 missing |
| A-rigor | 🌱 A | 3 | 2 | 1 | 🟡 partial |
| A-stakeholder-empathy | 🌱 A | 2 | 0 | 2 | 🔴 missing |

**Ordered plan (prerequisite, then weight):** finish **Data Wrangling** (close
`S-data-wrangling` 2→3, `S-pipeline-build` 1→2) → **EDA & Visualization** → **Statistical
Inference** → **ML Foundations** → **Insight Communication** → **ML in Production**.

The learner is **strongest where they've worked (data processing) and the gap is largest in
modeling, statistics, and communication** — exactly the route the pathway sequences. Re-run
the match after each badge; *job-ready* when every must-have gap is 0 and the match clears the
threshold.

---

## What this demonstrates

- A **real role** becomes a **measurable tree** of duties → tasks → KSA.
- The **bar is set by high performers**, captured through observation, so "passing" means
  "can do the job well," not "saw the material."
- **Connected micro-credentials** form a **pathway**; the first (*data processing*) is both
  immediately useful and the foundation for the rest.
- The learner always has a **number** (the gap / match %) showing exactly what to earn next.

> ⚠️ All KSA levels, demand signals, and mappings above are **illustrative** and must be
> validated by mentors/employers before use — per the methodology's human gates.
</script>
<script type="text/markdown" data-path="examples/skills-map-job-match-frontend.md"># 🗺️ Example — End-to-End: From Job Posting to Job-Ready (Skills Map + Match)

This is the **full ADA v2 loop** on a realistic role: a **Junior Frontend Developer**. It
shows how Gen AI turns a job posting into a **target KSA profile**, diffs it against a
learner to build a **skills map**, computes a **job-match score**, prescribes
micro-credentials (covering technical, human, and attitude competencies), and re-scores to
**job-ready**.

Specs used: [`../specs/genai-authoring-workflow.md`](../specs/genai-authoring-workflow.md),
[`../specs/skills-map-and-job-matching.md`](../specs/skills-map-and-job-matching.md),
[`../specs/ksa-taxonomy.md`](../specs/ksa-taxonomy.md).

---

## Step 0 · The job posting (input)

> **Junior Frontend Developer — AcmeApps**
> Build and maintain responsive UIs in React. Turn Figma designs into accessible
> components. Write tests. Collaborate in code review and daily standups. We move fast and
> requirements change — we want someone **adaptable**, **communicative**, and eager to
> learn. JavaScript + HTML/CSS required; Git essential.

---

## Step 1 · Extract Target KSA Profile  🔒 *(Gen AI → human validated)*

The assistant classifies each requirement as K / S / A, assigns a minimum level and weight,
and — importantly — **adds the Abilities the posting implies**. The mentor/employer then
validated levels and confirmed inferred Abilities.

```yaml
role: "Junior Frontend Developer"
source: "AcmeApps posting"
framework_ref: "O*NET 15-1254.00 Web Developers / ESCO: front-end developer"
validated_by: "employer:AcmeApps + mentor:@sancarbar"
requirements:
  - { ref: K-html-css,            type: knowledge, min_level: 2, weight: 3, must_have: true }
  - { ref: K-accessibility-basics, type: knowledge, min_level: 2, weight: 3, must_have: true }
  - { ref: S-javascript,          type: skill,     min_level: 2, weight: 5, must_have: true }
  - { ref: S-react-components,     type: skill,     min_level: 2, weight: 5, must_have: true }
  - { ref: S-figma-to-ui,          type: skill,     min_level: 2, weight: 4, must_have: true }
  - { ref: S-frontend-testing,     type: skill,     min_level: 2, weight: 3, must_have: true }
  - { ref: S-use-git,             type: skill,     min_level: 2, weight: 3, must_have: true }
  - { ref: A-adaptability,        type: ability,   min_level: 2, weight: 3, must_have: false, inferred: true }
  - { ref: A-communication,       type: ability,   min_level: 2, weight: 4, must_have: true }
  - { ref: A-growth-mindset,      type: ability,   min_level: 2, weight: 3, must_have: false, inferred: true }
```

> 🔎 **Human-in-the-loop value:** the posting only said "adaptable, communicative, eager to
> learn." The AI translated those into three concrete, level-rated **Abilities** — and the
> employer confirmed **communication** is actually a `must_have`.

---

## Step 2 · The learner's current profile

From self-assessment + previously earned ADA badges (each level backed by evidence):

```yaml
learner: "ada-learner-042"
evidenced:
  - { ref: K-html-css,            level: 2, evidence: "badge:mc-web-basics", verified: true }
  - { ref: K-accessibility-basics, level: 1, evidence: "self+quiz",          verified: true }
  - { ref: S-javascript,          level: 2, evidence: "badge:mc-js-foundations", verified: true }
  - { ref: S-react-components,     level: 1, evidence: "tutorial project",   verified: true }
  - { ref: S-use-git,             level: 2, evidence: "badge:mc-git-basics", verified: true }
  - { ref: A-communication,       level: 1, evidence: "cohort peer notes",   verified: true }
  # absent (level 0): S-figma-to-ui, S-frontend-testing, A-adaptability, A-growth-mindset
```

---

<script type="text/markdown" data-path="examples/growth-mindset-micro-credential/capstone.md"># 🚀 Capstone — *Growth in the Wild: a 21-Day Stretch Challenge*

The capstone is delivered as [Atom 6](atoms/atom-6-growth-in-the-wild-capstone.md). This file is
the **grading brief**: what learners submit, how it maps to KSA, and the showcase format.

---

## 🎯 The brief

> Choose a real, slightly scary **stretch goal** and pursue it for **21 days** using everything
> in this course — deliberate-practice loops, the YET Loop for setbacks, weekly feedback asks,
> and a growth journal — then **showcase** it to your cohort for a peer + mentor 360.

The point is not a polished outcome. The point is **documented behavior under real difficulty**.
A capstone where everything went smoothly scores *lower* than one full of setbacks that were
reframed and learned from — because the Ability is only visible when things get hard.

---

## 📦 What to submit

- [ ] **Goal one-pager** — the stretch goal, why it's at your edge, and your loop design (targets, feedback sources, practice block).
- [ ] **Growth journal** — most-days entries across 21 days (template in Atom 6).
- [ ] **Deliberate-practice logs** — at least 8 rep logs showing target → feedback → correction.
- [ ] **Feedback-ask records ×3** — one specific ask per week (question / response / change made).
- [ ] **Setback log** — at least 3 YET-Loop reframes of real walls you hit.
- [ ] **Showcase** — a 5-minute talk or recording (structure below).
- [ ] **Peer 360 forms** — your ratings of 2 peers + the ratings you received.

---

## 🎤 Showcase structure (5 minutes)

1. **The reach (30s)** — what you went after and why it scared you a little.
2. **The best failure (90s)** — the most *useful* thing that went wrong, and the YET-Loop reframe.
3. **What feedback changed (90s)** — a before/after from your weekly asks.
4. **The evidence (60s)** — journal + logs; your Day-0 vs Day-21 mindset self-rating.
5. **What you'll keep (30s)** — the one habit that outlives the badge.

---

## 🧬 How the capstone maps to KSA

| Capstone element | Evidences | Component |
| ---------------- | --------- | --------- |
| Accurate framing of mindset in the goal one-pager | Understanding the construct | 🧠 K-mindset-science, K-mindset-nuance |
| YET-Loop reframes in the setback log | The reframing move under pressure | 🛠️ S-yet-reframe |
| Deliberate-practice rep logs | Designed + ran feedback loops | 🛠️ S-deliberate-practice |
| Journal + feedback asks + showcase across 21 days | Failure-as-learning, feedback-seeking, persistence | 🌱 A-growth-mindset (**L3**) |
| Handling pivots/walls without stalling | Stayed effective amid change | 🌱 A-adaptability (L2) |

---

## ✅ Grading

Two instruments, both in [`rubrics.md`](rubrics.md):

- **Behavioral rubric** — consistency across the **5 assessed occasions**, self-awareness, and
  response to setback/feedback. *(This is what certifies the Ability.)*
- **Capstone-5 rubric** — the standard 5-criteria ADA capstone rubric (relevance, application,
  problem-solving, clarity, collaboration).

> **Pass for the badge:** behavioral rubric ≥ 2 on every criterion **across occasions** AND
> capstone-5 weighted score ≥ 60%, **verified by a mentor**. See
> [`skills-map.md`](skills-map.md) for what the badge unlocks.
</script>

<script type="text/markdown" data-path="examples/growth-mindset-micro-credential/rubrics.md"># 📊 Rubrics — Growth Mindset Micro-Credential

All assessment instruments used across the course. Atoms reference these by `rubric` flavor:
`knowledge-mini`, `skill`, `ability-behavioral`, `capstone-5`.

---

## 🔹 `knowledge-mini` — concept checks (Atoms 1–2)

Quick formative check; used for pop quizzes and AI Q&A checks.

| Criterion | Excellent (3) | Adequate (2) | Needs improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Accuracy** | Correct, and avoids the common myths | Mostly correct | Repeats a myth as fact |
| **Precision** | States the *bounded* claim (developable ability + response to struggle) | Roughly right | Slogan-level ("just try harder") |
| **Self-application** | Connects to a real personal example | Generic example | None |

> Pass = 2+ on each. Knowledge here is intentionally **L1** — it only enables the Abilities.

---

## 🔹 `skill` — performance mini-rubric (Atoms 3–4)

For the YET Loop reframe and the deliberate-practice lab.

| Criterion | Excellent (3) | Adequate (2) | Needs improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Correct move** | Executes the technique as designed (reframe / loop) | Minor gaps | Technique not really used |
| **Strategy + feedback** | Specific strategy AND a real feedback source | One present, vague | Missing |
| **Visible improvement** | Clear change/correction between attempts | Slight change | No change |
| **Reframe under struggle** | Uses YET Loop when stuck | Sometimes | Defaults to fixed read |

> Pass = 2+ on each → **L2** evidence for the relevant Skill component.

---

## 🔹 `ability-behavioral` — the attitude rubric (Atoms 5–6) ⭐

The instrument that **certifies the Ability**. An attitude cannot be proven by one moment or a
quiz — this rubric explicitly requires evidence **across the 5 assessed occasions** (2 curveball
reframes, 3 feedback asks, sustained journal, showcase).

| Criterion | Excellent (3) | Adequate (2) | Needs improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Consistency across occasions** | Growth behavior shown across all 5 occasions | Shown in 3–4 | Only when pushed |
| **Failure as learning** | Reframes setbacks as data; reaches again | Accepts setbacks passively | Defensive / avoids reaching |
| **Feedback seeking** | Proactively seeks specific, hard feedback and acts on it | Seeks occasionally | Avoids; only receives |
| **Self-awareness (reflection)** | Names triggers, choices, and growth with insight | Some reflection | Minimal / none |
| **Persistence / adaptability** | Stays effective and re-plans amid walls & change | Recovers slowly | Stalls or quits |

> Pass = 2+ on **every** criterion. Excellent across the board supports **L3** for
> `A-growth-mindset`.

---

## ✨ `capstone-5` — standard ADA capstone rubric

| Criterion | Excellent (5) | Good (3–4) | Needs improvement (1–2) | Weight |
| --------- | ------------- | ---------- | ----------------------- | ------ |
| **Relevance (competency alignment)** | Goal is a real, job-relevant stretch; mindset framing accurate | Mostly relevant | Weak / off-target | 20% |

<script type="text/markdown" data-path="examples/growth-mindset-micro-credential/atoms/atom-1-science-of-mindset.md">## ⚛ Learning Atom 1 — *The Science of Mindset*

**Phase:** 🙉 1 · Self-Guided Introduction (*hear*) · **KSA:** 🧠 Knowledge · **Target level:** L1
· **Component id:** `K-mindset-science`

### 🎯 Learning objective

- **Explain** the difference between a fixed and a growth mindset, and describe the
  neuroscience (neuroplasticity) that makes "abilities can grow" literally true.

### 🧩 Prerequisites

- None. Curiosity and a recent example of something you found hard to learn.

### 🧭 Atom description

Before you can *practice* a growth mindset, you need an accurate mental model of what it is —
and what it is not. This atom gives you the core science from the researchers who built the
field, so the rest of the course rests on evidence, not slogans.

---

### 📖 Reading — *What "mindset" actually means* (≈ 6 min)

> Author: ADA Methodology · concepts attributed to Carol Dweck and colleagues.

A **mindset** is a belief about where ability comes from. People with a more **fixed mindset**
tend to believe that intelligence and talent are largely *traits you either have or don't*.
People with a more **growth mindset** believe ability is more like a *muscle* — it grows with
effort, good strategy, and help from others. Almost nobody is purely one or the other; we each
hold a *blend* that shifts by domain ("I'm a math person but not a creative person") and by
situation (a public failure can push anyone toward the fixed end for a while).

Why does this belief matter? Because it changes **what you do when something gets hard** — the
exact moment that decides whether you learn. Carol Dweck's research at Stanford found that the
two mindsets produce different responses to difficulty:

- A **fixed** orientation treats a struggle as a *verdict*: "this is hard → maybe I'm not good
  at this → I should protect my image and stop." Effort feels like evidence of low ability, so
  feedback stings and challenges are avoided.
- A **growth** orientation treats the same struggle as *information*: "this is hard → I haven't
  learned it *yet* → what strategy or feedback do I need?" Effort is the path, feedback is fuel,
  and challenge is where the growth happens.

The biology backs this up. The brain is **neuroplastic**: when you practice something
difficult, neurons form and strengthen connections, and well-used pathways get myelinated so
signals travel faster. In other words, the discomfort of effortful practice is the *felt sense
of your brain physically rewiring*. This is why "I can't do this" is more accurately "I can't
do this **yet**."

A crucial nuance you'll go deeper on in Atom 2: a growth mindset is **not** "everyone can be
anything," "just try harder," or "praise all effort." It is a precise claim — *that ability is
developable, and that the response to difficulty (strategy + effort + help) is what develops
it.* Hold onto that precision; it's what separates a real practitioner from someone repeating a
poster.

**Key takeaways**

- [ ] Mindset = a belief about the *source* of ability (trait vs. developable).
- [ ] It's a *blend*, domain- and situation-specific — not a fixed label for a person.
- [ ] It matters because it changes behavior **at the point of difficulty**.
- [ ] Neuroplasticity makes "abilities can grow" a physical fact, not a metaphor.
- [ ] Growth mindset ≠ "try harder"; it = *developable ability + the right response to struggle.*

---

<details>
<summary>Answer key</summary>

   strategy + effort + help, not that outcomes are unlimited or guaranteed.
2. Fixed → avoids the challenge / withdraws effort / rejects feedback; growth → engages the
   challenge / invests effort / seeks and uses feedback.
3. Effortful practice physically strengthens and myelinates neural pathways, so "I can't" is
   better stated as "I can't **yet**" — the capacity is built by the practice itself.

</details>

<script type="text/markdown" data-path="examples/growth-mindset-micro-credential/atoms/atom-2-myths-and-nuance.md">## ⚛ Learning Atom 2 — *Myths & Nuance: the "false" growth mindset*

**Phase:** 🙈 2 · Visual Exploration (*see*) · **KSA:** 🧠 Knowledge · **Target level:** L1
· **Component id:** `K-mindset-nuance`

### 🎯 Learning objective

- **Distinguish** a real, evidence-based growth mindset from the watered-down "*false* growth
  mindset," and **explain** when and for whom mindset interventions actually move outcomes.

### 🧩 Prerequisites

- Atom 1 (the core science).

### 🧭 Atom description

The biggest risk with growth mindset is *shallow adoption* — turning a precise psychological
construct into a motivational poster. This atom inoculates you against the hype by going to the
primary evidence, including the researchers' own self-corrections and the large-scale trials
and meta-analyses that map the limits.

---

### 📖 Reading — *Three myths that quietly kill a growth mindset* (≈ 7 min)

> Author: ADA Methodology · grounded in Dweck & Yeager's later work and replication research.

**Myth 1 — "Growth mindset = praising effort."** Dweck has been explicit that *praising effort
alone*, especially when a learner is stuck, can become a consolation prize ("great effort!"
after failure with no path forward). Real practice praises **effort linked to strategy and
progress**: *"that approach didn't work — which other strategy, or whose help, gets you
unstuck?"* Effort without strategy is just noise; the mindset is about the **learning process**,
not cheerleading.

**Myth 2 — "I already have a growth mindset."** Dweck calls this the *false growth mindset*:
most of us claim it, then behave from the fixed end the moment our competence feels threatened —
when we're criticized, when a peer outshines us, when we fail publicly. A growth mindset isn't a
badge you own; it's a response you choose, repeatedly, under threat. Knowing your personal
**fixed-mindset triggers** is more useful than declaring you're "a growth-mindset person."

**Myth 3 — "Mindset fixes everything."** It doesn't. Large studies show the effect is **real
but bounded**. The *National Study of Learning Mindsets* (Yeager et al., 2019, *Nature*) ran a
short online growth-mindset intervention across a nationally representative sample of U.S. high
schools and found a *modest but meaningful* improvement in grades — concentrated among
**lower-achieving students** and strongest where the **school culture** supported the message
(peers and norms made challenge-seeking safe). Meta-analyses (e.g., Sisk et al., 2018) likewise
find **small average effects** that are **larger for at-risk and disadvantaged learners**. The
honest summary: mindset is a *lever*, not a magic wand — most powerful for those facing real
barriers, and only when the surrounding environment makes effort and help-seeking safe.

**Why a professional should care.** In a team, your mindset is *contagious through systems*: how
you respond to a teammate's mistake, whether feedback is treated as attack or asset, whether
"I don't know yet" is sayable. The organizational research is blunt about this — culture either
amplifies or silences individual growth mindset.

**Key takeaways**

- [ ] Praise **strategy + progress**, not raw effort or innate talent.
- [ ] Everyone has **fixed-mindset triggers**; naming yours beats claiming a label.
- [ ] Effects are **real but modest**, **largest for at-risk learners**, and **culture-dependent**.
- [ ] Your individual mindset shapes a **team's** psychological safety to struggle out loud.

---

### 📖 Reading — Evidence & industry context (skim the primary sources)

- **Stanford / *Nature* (2019):** Yeager, Dweck et al., *A national experiment reveals where a
  growth mindset improves achievement.* The canonical large-scale RCT.
- **Meta-analysis (2018):** Sisk, Burnette et al., *To what extent and under which circumstances
  are growth mindsets important to academic achievement?* — *Psychological Science.*
- **Dweck & Yeager (2019):** *Mindsets: A View From Two Eras*, *Perspectives on Psychological
  Science* — the field's own maturation and caveats.
- **McKinsey (2020):** Brassey, van Dam et al., *The most fundamental skill: Intentional
  learning and the career advantage* — why a deliberate learning stance is an economic edge.
- **BCG / Accenture:** reskilling and learning-culture reports (e.g., Accenture, *"It's
  learning. Just not as we know it."*) — the business case for a learning workforce.
- **Y Combinator / Paul Graham:** *How to Do Great Work* (2023) — curiosity, persistence, and
  treating not-knowing as the start of the work, in a builder's voice.

> ⚠️ Verify each link, edition, and license before delivery (human-in-the-loop).

<script type="text/markdown" data-path="examples/growth-mindset-micro-credential/atoms/atom-3-power-of-yet.md">## ⚛ Learning Atom 3 — *The Power of Yet: a reframing protocol*

**Phase:** 🙈 2 · Visual Exploration (*see*) → first reps · **KSA:** 🛠️ Skill · **Target level:** L2
· **Component id:** `S-yet-reframe`

### 🎯 Learning objective

- **Apply** a concrete "power of yet" reframing move that converts a fixed-mindset reaction into
  a next learning action — on a *real* setback, on demand.

### 🧩 Prerequisites

- Atoms 1–2. A current, genuine struggle you can practice on.

### 🧭 Atom description

Knowledge doesn't change behavior; a **rehearsed move** does. This atom turns the science into a
4-step protocol you can run in under two minutes whenever you hit a wall. It's the first thing in
this course you'll be assessed on *doing*, not *knowing*.

---

### 🖼️ See — Mental model: the **YET Loop**

![The YET Loop mental model — generated diagram](../img/atom-3-power-of-yet.png)

> 🖼️ *Generated image — produced from the prompt below.*

```prompt
Create a circular "loop" diagram titled "The YET Loop". Four nodes around a circle connected by
arrows, each with a small icon: 1) "NAME the fixed thought" (icon: thought bubble), 2) "ADD the
word 'yet'" (icon: small gold key), 3) "CHOOSE one strategy or source of help" (icon: compass),
4) "TAKE the smallest next action" (icon: footstep). Center label: "YET". Use ADA brand colors
(Indigo #1E2A6E nodes with white text, Turquoise #15B5C6 arrows, one Gold #E0A53C accent on the
'yet' step). Flat vector, clean, high contrast, dark Ink #0A1124 background. Square 1:1.
```

```mermaid
flowchart LR
  N1["1 · NAME<br/>the fixed thought"] --> N2["2 · ADD 'yet'<br/>reframe the claim"]
  N2 --> N3["3 · CHOOSE<br/>one strategy / source of help"]
  N3 --> N4["4 · ACT<br/>smallest next step"]
  N4 -. repeat on next wall .-> N1
```

**The protocol, in words**

1. **Name** the fixed thought out loud or on paper, verbatim: *"I'm just not good at public
   speaking."* (Naming it strips its authority.)
2. **Add "yet"** to convert a verdict into a status: *"I'm not good at public speaking **yet**."*
   "Yet" smuggles in time, growth, and agency.
3. **Choose one** strategy or source of help — not ten. *"I'll record a 2-minute version and get
   one piece of feedback from Priya."* Strategy + help is the part Atom 2 said most people skip.
4. **Act** on the smallest next step *today*. Momentum, not a master plan, breaks the fixed
   spiral.

<script type="text/markdown" data-path="examples/growth-mindset-micro-credential/atoms/atom-4-deliberate-practice-lab.md">## ⚛ Learning Atom 4 — *The Deliberate-Practice Lab*

**Phase:** 🙊 3 · Applied Practice (*do*) · **KSA:** 🛠️ Skill · **Target level:** L2
· **Component id:** `S-deliberate-practice`

### 🎯 Learning objective

- **Design and run** a deliberate-practice loop on a real skill: a stretch target, focused reps,
  immediate feedback, and a correction — proving the mindset by *operationalizing* it.

### 🧩 Prerequisites

- Atoms 1–3 (you can already run the YET Loop).

### 🧭 Atom description

A growth mindset without a *method* stalls at motivation. **Deliberate practice** (Anders
Ericsson's research) is that method: it's not "more hours," it's a tight loop of *edge-of-ability
targets + full attention + immediate feedback + correction*. This lab makes the loop concrete on
a skill you actually need.

---

### 📖 Reading — *Deliberate practice, minus the 10,000-hour myth* (≈ 6 min)

> Author: ADA Methodology · grounded in Ericsson & Pool, *Peak* (2016), and Ericsson, Krampe &
> Tesch-Römer (1993).

Popular culture compressed Ericsson's work into "10,000 hours" — and got it wrong. The hours
were a *correlation in one study of violinists*, not a magic threshold, and Ericsson spent years
correcting it. The real finding is about the **structure** of practice, not the volume. Ordinary
practice plateaus: once you can do something "well enough," autopilot takes over and you stop
improving even with years of repetition (think of your driving). **Deliberate practice** breaks
the plateau with four ingredients:

1. **A specific stretch target** just beyond your current reliable ability — concrete enough to
   tell if you hit it (*"land the talk's opening in 30s without filler words,"* not "get better
   at speaking").
2. **Focused repetition** with full attention — short, intense, deliberate reps, not background
   grinding.
3. **Immediate, specific feedback** — from a coach, a rubric, a recording, tests, or a metric —
   so error is visible *now*.
4. **Correction** — adjust the next rep based on the feedback. Feedback you don't act on is
   trivia.

This is where mindset becomes muscle: the loop *requires* you to seek the edge (challenge), treat
errors as data (failure = learning), and use feedback (coachability). McKinsey's work on
*intentional learning* makes the same point for careers — the differentiator isn't talent, it's
turning everyday work into reps with feedback. Y Combinator gives founders the builder's version:
ship, measure, learn, iterate — a deliberate-practice loop pointed at a product.

**Key takeaways**

- [ ] "10,000 hours" is a myth; **structure** beats volume.
- [ ] The loop = *stretch target → focused reps → immediate feedback → correction.*
- [ ] Ordinary practice plateaus; deliberate practice keeps you at the edge on purpose.
- [ ] The loop *is* a growth mindset, made operational.

---

### 🎬 Watch — Trevor Ragan (The Learner Lab) on the practice that actually works

```youtube
https://www.youtube.com/watch?v=5eW6Eagr9XA
"The Struggle Switch" / learning how to learn — embracing productive struggle in practice.
```

---

### 🖼️ See — Diagram: the deliberate-practice loop vs. the plateau

![Deliberate practice loop vs. the plateau — generated diagram](../img/atom-4-deliberate-practice-lab.png)

> 🖼️ *Generated image — produced from the prompt below.*

```prompt
Create a diagram titled "Why Deliberate Practice Beats the Plateau". Top: a flat dotted line
labeled "Ordinary practice (autopilot) → plateau", with a small grey figure coasting. Bottom: a
rising staircase made of repeating loop icons; each step labeled in sequence "Stretch target →
Focused reps → Immediate feedback → Correction", climbing upward and to the right toward a gold
flag "New ceiling". Use ADA brand colors (Indigo #1E2A6E, Turquoise #15B5C6 arrows, Gold
#E0A53C flag) on a light background, flat vector, clean sans-serif, high contrast. 16:9.
```

```mermaid
flowchart LR
  T["🎯 Stretch target<br/>(just past your edge)"] --> R["🔁 Focused reps<br/>(full attention)"]
  R --> F["📣 Immediate feedback<br/>(coach · rubric · metric)"]
  F --> C["🛠️ Correction<br/>(adjust next rep)"]
  C -. raise the target .-> T
```

---

### 🧪 Practice — The Lab (Lab + Pair Programming)

Run **two full loops** on a real skill you need in your role.

- **Step 0 — Pick a skill** that matters at work and is currently *uncomfortable* (e.g.,
  reviewing a PR, explaining a design, writing a test, facilitating a stand-up).
- **Step 1 — Define a stretch target** for one rep, measurable in ≤ 10 minutes.
- **Step 2 — Set the feedback source** *before* you start: a peer, a checklist/rubric, a
  recording, or a test you can run.
- **Step 3 — Rep 1:** do it. Capture feedback immediately.
- **Step 4 — Correction:** write the single change you'll make.
- **Step 5 — Rep 2:** do it again with the correction. Capture feedback again.
- **Pair step:** swap with a partner — you observe their loop and give feedback against the
  rubric; they do the same for you. (This is your `collaborate` modality.)

**Lab log template**

| | Rep 1 | Rep 2 |
| --- | --- | --- |
| Stretch target | | |
| Feedback source | | |
| What happened | | |
| Specific feedback | | |
| Correction applied | | |

---

### ✅ Evaluate — Performance task (skill rubric)

| Criterion | Excellent (3) | Adequate (2) | Needs improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Target quality** | Specific, measurable, genuinely at the edge | Somewhat specific | Vague ("get better") |
| **Feedback loop** | Real, immediate feedback captured both reps | Feedback once / delayed | No usable feedback |
| **Visible correction** | Rep 2 clearly changed based on feedback | Minor/uncertain change | No change between reps |
| **Reframe under struggle** | Used the YET Loop when it got hard | Some reframing | Defaulted to fixed read |

> Pass = **2+ on all four** → **L2** evidence for `S-deliberate-practice` (and partial
> `A-growth-mindset`).

---

### 📦 Deliverable

- The completed two-rep lab log + a 3-sentence note: what improved between reps, and the
  feedback that caused it.

### 🧠 Final reflection

- Where in your *normal week* could you quietly insert one deliberate-practice loop with a
  feedback source — turning routine work into reps?

### 🔗 Sources to verify

- Ericsson & Pool, *Peak* (2016) · Ericsson, Krampe & Tesch-Römer (1993), *Psychological Review*
  · McKinsey (2020), *Intentional learning* · YC Startup School (startupschool.org).

### 🧩 Connections

- **Predecessors:** Atom 3. **Successors:** Atom 5 (feedback + failure as identity), Atom 6
  (the loop, sustained for 21 days).
