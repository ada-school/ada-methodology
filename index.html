<script type="text/markdown" data-path="examples/critical-thinking-micro-credential/atoms/atom-3-evaluate-arguments-and-evidence.md">## ⚛ Learning Atom 3 — *Evaluate Arguments & Evidence*

**Phase:** 🙈 2 · Visual Exploration (*see*) · **KSA:** 🛠️ Skill · **Target level:** L2
· **Component id:** `S-evaluate-arguments`

### 🎯 Learning objective

- **Deconstruct** an argument and **evaluate** its evidence and logical strength.

### 🧩 Prerequisites

- Atoms 1–2. This is where the vocabulary becomes a repeatable analysis.

### 🧭 Atom description

This atom turns the concepts into a procedure: take any argument, break it into its parts, and judge
each part. It's in Phase 2 (*see*) because you learn it by watching it modeled, then doing it on a real
piece of writing. By the end you'll have a checklist you can run on any claim.

---

### 📖 Reading — *A procedure for judging any argument* (≈ 8 min)

**Step 1 — Map the argument.** Find and label the parts (Atom 1):

- What's the **main claim** (conclusion)? (Look for "therefore," "so," "we should…")
- What **premises** support it? List them.
- What's **assumed but unstated**? (The make-or-break step — surface the hidden premises.)
- What **evidence** is offered for each premise?

**Step 2 — Evaluate the logic.** Does the conclusion actually **follow**?

- Is the inference **valid/strong**, or is there a gap (a fallacy from Atom 2)?
- Are there **counter-examples** that would break it?
- Does it **overreach** — claiming more than the premises support? (e.g., "some" quietly becomes "all").

**Step 3 — Evaluate the evidence.** Premises are only as good as their support:

- **Quality:** Is the source credible and relevant (Atom 4)? Primary or hearsay? Recent enough?
- **Quantity/representativeness:** Enough cases, or a hasty generalization? Is the sample biased?
- **Relevance:** Does the evidence actually bear on *this* claim, or is it a red herring?
- **Type:** Is it data, expert judgment, anecdote, or assertion? (Anecdote ≠ data.)
- **Correlation vs. causation:** If a causal claim is made, is causation actually shown, or just
  correlation?

**Step 4 — Weigh and judge.** Critical thinking is not "find one flaw, reject everything." Weigh the
**overall strength**: How strong is the support? How serious are the flaws? What would change your
assessment? Reach a **proportioned** judgment — "well-supported," "partly supported," "unsupported" —
rather than a binary.

> **Charity first.** Before attacking, restate the argument in its **strongest, fairest** form (you'll
> formalize this as *steelmanning* in Atom 4). Evaluating a fair version is the honest — and more
> useful — move.

**A pocket checklist:** *Claim? Premises? Hidden assumptions? Does it follow? Is the evidence good and
relevant? What would change my mind?*

**Key takeaways**

- [ ] **Map** the argument (claim, premises, assumptions, evidence) before judging.
- [ ] Evaluate **logic** (does it follow? any fallacy/gap?) and **evidence** (quality, quantity,
  relevance, type) separately.
- [ ] Beware **overreach** and **correlation≠causation.**
- [ ] Reach a **proportioned** judgment; evaluate the **strongest** version (charity).

---

### 🖼️ See — the evaluation flow

```mermaid
flowchart LR
  A["🗣️ Argument"] --> MAP["🗺️ Map it<br/>claim · premises · assumptions"]
  MAP --> LOG["🧮 Evaluate logic<br/>does it follow?"]
  MAP --> EVI["📊 Evaluate evidence<br/>quality · relevance · type"]
  LOG --> JUDGE["⚖️ Proportioned judgment"]
  EVI --> JUDGE
```

![Argument evaluation flow — generated diagram](../img/atom-3-evaluate-arguments-and-evidence.png)

> 🖼️ *Generated image — produced from the prompt below.*

A reusable prompt to generate an on-brand version:

```prompt
Create a clean, modern infographic of an "argument evaluation flow": Argument → Map it (claim,
premises, assumptions) → two parallel checks "Evaluate logic (does it follow?)" and "Evaluate evidence
(quality, relevance, type)" → "Proportioned judgment". Use ADA brand colors (Indigo #1E2A6E, Turquoise
#15B5C6, Gold #E0A53C), light background, flat vector, legible sans-serif. 16:9.
```

---

### 🧪 Practice — *Deconstruct a real argument* (Worksheet + Case Study)

Pick a real **opinion piece, ad, or persuasive post** (200–600 words). Then:

1. **Map it.** Write the main claim, the premises, and at least one **hidden assumption.**
2. **Logic check.** Does the conclusion follow? Name any **fallacy** or gap (Atom 2).
3. **Evidence check.** For each premise, rate the evidence (quality / relevance / type) and flag any
   anecdote-as-data or correlation-as-causation.
4. **Judgment.** Write a 3–4 sentence **proportioned** verdict: how well-supported is the claim, and
   what evidence would change your mind?
5. **Steelman preview.** State the argument's strongest possible version (even if you disagree).

---

### ✅ Evaluate — Performance task (`skill`)

Submit your deconstruction. Scored on:

| Criterion | Excellent (3) | Adequate (2) | Needs work (1) |
| --------- | ------------- | ------------ | -------------- |
| **Mapping** | Accurately identifies claim, premises, hidden assumptions | Mostly identifies parts | Misreads the argument |
| **Logic evaluation** | Correctly assesses inference; names real gaps/fallacies | Some evaluation | Misses or invents flaws |
| **Evidence evaluation** | Judges quality/relevance/type; catches anecdote/causation issues | Some judging | Takes evidence at face value |
| **Proportioned judgment** | Weighed, fair, states what would change view | Some nuance | Binary / one-sided |

> Pass = 2+ each → **L2** evidence for `S-evaluate-arguments`.

### 📦 Deliverable

- Your mapped + evaluated argument with the proportioned verdict and the steelman.

### 🧠 Final reflection

- Was the argument stronger or weaker than it first *felt*? What drove the gap — logic or evidence?

### 🔗 Sources to verify (human-in-the-loop)

- Weston, *A Rulebook for Arguments*.
- Browne & Keeley, *Asking the Right Questions*.
- Booth, Colomb & Williams, *The Craft of Research* (evidence quality).

### 🧩 Connections

- **Predecessor:** Atom 2. **Successor:** Atom 4 (question & verify the claims and sources you found).
</script>
<script type="text/markdown" data-path="examples/critical-thinking-micro-credential/atoms/atom-4-question-and-verify.md">## ⚛ Learning Atom 4 — *Question & Verify*

**Phase:** 🙊 3 · Applied Practice (*do*) · **KSA:** 🛠️ Skill · **Target level:** L2
· **Component id:** `S-question-verify`

### 🎯 Learning objective

- **Apply** Socratic questioning and source/credibility evaluation to test a claim — and **steelman**
  it before judging.

### 🧭 Atom description

Evaluating an argument that's handed to you is half the job. The other half is **actively
interrogating** a claim: asking the questions that expose hidden assumptions, checking whether the
sources hold up, and fairly representing the opposing view. This is the most practical, repeatable
critical-thinking habit — and it's exactly what keeps you from being fooled by confident AI output.

---

### 📖 Reading — *Three tools: question, verify, steelman* (≈ 8 min)

**Tool 1 — Socratic questioning.** A small set of questions does most of the work. Run a claim through:

- **Clarify:** *What exactly do you mean? Can you give an example?*
- **Probe assumptions:** *What are you taking for granted here? What if the opposite were true?*
- **Probe evidence:** *How do you know? What's the source? Is there evidence against it?*
- **Probe alternatives:** *What's another way to see this? Who would disagree, and why?*
- **Probe implications:** *If that's true, what follows? Is that consequence acceptable?*
- **Question the question:** *Is this even the right question to be asking?*

**Tool 2 — Evaluate the source (the "verify" step).** Don't just read *vertically* (deeper into one
page) — read **laterally**: open new tabs and check what *other* sources say about the claim and the
author. Fact-checkers do this. Quick lenses (a riff on the **CRAAP** test):

- **Currency** — how recent is it? Does recency matter for this claim?
- **Relevance** — does it actually address *this* question?
- **Authority** — who wrote it, and what's their relevant expertise / track record? Who funds them?
- **Accuracy** — is it supported by evidence and corroborated elsewhere? Can you trace the original
  source (or is it "a study says…" with no link)?
- **Purpose** — is it informing, selling, or persuading? What's the incentive?

For AI output specifically: treat it as a **confident first draft, not a source.** Ask it for its
sources, then verify those sources actually exist and say what it claims (Atom 2's biases apply to
models too).

**Tool 3 — Steelman before you strike.** The opposite of a straw man. Restate the *other side's*
argument in its **strongest, most charitable** form — so strong its supporters would say "yes, exactly."
*Then* engage. Steelmanning does three things: it keeps you honest, it earns trust, and it often reveals
that the other side has a point you missed (the intellectual-humility Ability in action).

> **The habit:** confident claim → *clarify → probe assumptions & evidence → verify laterally →
> steelman → then judge.*

**Key takeaways**

- [ ] A few **Socratic questions** (clarify, assumptions, evidence, alternatives, implications) crack
  most claims open.
- [ ] **Verify laterally** — check other sources about the claim *and* the author; trace the original.
- [ ] Use a source lens (**currency, relevance, authority, accuracy, purpose**).
- [ ] **Steelman** the opposing view before you argue against it.

---

### 🖼️ See — interrogate a claim

```mermaid
flowchart TD
  CLAIM["🗣️ Confident claim<br/>(human or AI)"] --> SOC["❓ Socratic questions<br/>clarify · assumptions · evidence"]
  SOC --> VER["🔎 Verify laterally<br/>other sources · trace original"]
  VER --> STEEL["💪 Steelman the other side"]
  STEEL --> JUDGE["⚖️ Now judge"]
```

![Interrogate a claim — generated diagram](../img/atom-4-question-and-verify.png)

> 🖼️ *Generated image — produced from the prompt below.*

A reusable prompt to generate an on-brand version:

```prompt
Create a clean, modern infographic "Interrogate a Claim": a confident claim (human or AI) flows
through "Socratic questions (clarify, assumptions, evidence)" → "Verify laterally (other sources, trace
original)" → "Steelman the other side" → "Now judge". Use ADA brand colors (Indigo #1E2A6E, Turquoise
#15B5C6, Gold #E0A53C), light background, flat vector, legible sans-serif. 16:9.
```

---

### 🧪 Practice A — *Socratic + lateral verification* (Worksheet)

Take a **claim you've seen shared recently** (news, social, or workplace). Then:

1. Write **6 Socratic questions** about it (one per category above).
2. **Read laterally:** find 2–3 *independent* sources on the claim. What do they agree/disagree on?
   Can you trace the **original** source?
3. Run the source through the **CRAAP** lens (authority, accuracy, purpose at minimum).
4. **Steelman** the strongest opposing view in 3–4 sentences.

### 🧪 Practice B — *Interrogate an AI answer* (AI Prompt Question)

Ask an AI a debatable question, then verify it:

```prompt
You are my critical-thinking sparring partner. I'll give you a claim. Do NOT just agree.
1) State the single strongest argument FOR it.
2) State the single strongest argument AGAINST it (steelman).
3) List the key assumptions both sides depend on.
4) Tell me exactly what evidence I should check to decide, and where to find it.
Claim: """[paste a debatable claim]"""
```

Then **fact-check the AI's response** with lateral reading. Note at least one thing it got wrong,
overstated, or couldn't source.

---

### ✅ Evaluate — Performance task (`skill`)

Submit Practice A + B. Pass = sharp, category-spanning questions; **real** lateral verification (named
independent sources, original traced); a fair steelman; and a documented AI fact-check. → **L2**
evidence for `S-question-verify`.

### 📦 Deliverable

- Your question set, verification notes (with sources), steelman, and AI fact-check.

### 🧠 Final reflection

- Did verifying change your view of the claim? Did the AI sound *more* confident than it deserved to be?

### 🔗 Sources to verify (human-in-the-loop)

- Caulfield, *Web Literacy for Student Fact-Checkers* (SIFT / lateral reading) — free, open.
- Stanford History Education Group — lateral reading research.
- Paul & Elder, *The Art of Socratic Questioning*.

### 🧩 Connections

- **Predecessor:** Atom 3. **Successor:** Atom 5 (now build your *own* defensible argument).
</script>
<script type="text/markdown" data-path="examples/critical-thinking-micro-credential/atoms/atom-5-build-and-defend-an-argument.md">## ⚛ Learning Atom 5 — *Build & Defend a Reasoned Argument*

**Phase:** 🙊 3 · Applied Practice (*do*) · **KSA:** 🛠️ Skill + 🌱 Abilities · **Target level:** L2
· **Component ids:** `S-construct-argument`, `A-intellectual-humility`, `A-skepticism-curiosity`

### 🎯 Learning objective

- **Create** a well-reasoned argument (claim → reasons → evidence → counterarguments) — and demonstrate
  **intellectual humility** and **skeptical curiosity** while defending it.

### 🧭 Atom description

Now you flip from critic to builder. Evaluating others is easier than constructing something that
*survives* evaluation. This atom teaches **argument mapping** and the discipline of **engaging
counterarguments** — and it's where the two Abilities get assessed, because how you handle being
challenged reveals whether the humility and curiosity are real.

---

### 📖 Reading — *Build something that survives scrutiny* (≈ 7 min)

**The structure of a strong argument:**

1. **Claim** — state your position clearly and precisely (avoid vague or overreaching claims).
2. **Reasons** — 2–4 distinct reasons, each one a complete thought, not a restatement of the claim.
3. **Evidence** — back each reason with the *best available* evidence (verified per Atom 4).
4. **Counterarguments** — name the **strongest** objections (steelman them) and respond honestly.
   This is what separates a reasoned argument from a rant. You can: rebut it, or **concede** it and
   show your claim still holds (or narrow your claim — that's a win, not a loss).
5. **Qualified conclusion** — state your claim with the **right confidence**: "strongly," "on balance,"
   "tentatively." Calibration is a sign of good thinking, not weakness.

**Argument mapping** — sketch it before you write: claim at the top, reasons branching below, evidence
under each, objections off to the side with your responses. Seeing it as a structure exposes weak
branches and missing support.

**The two Abilities, made visible.** This atom is where dispositions show up under pressure:

- **🌱 Intellectual humility** — you hold your claim *open*: you invite the strongest objections,
  acknowledge uncertainty, give credit to opposing points, and **change your position when the evidence
  warrants.** The willingness to say *"good point — I was wrong about that part"* is the whole game.
- **🌱 Skeptical curiosity** — you keep questioning, including your *own* claim: *"What would prove me
  wrong? What am I still assuming? What don't I know yet?"*

> **The mark of a strong thinker:** not winning every exchange, but holding **calibrated** beliefs —
> confident where evidence is strong, tentative where it's thin, and willing to update.

**Key takeaways**

- [ ] Strong argument = **claim → reasons → evidence → counterarguments → qualified conclusion.**
- [ ] **Engage the strongest objection** honestly (rebut, concede, or narrow your claim).
- [ ] **Calibrate** your confidence to your evidence.
- [ ] Defend with **humility** (update when warranted) and **curiosity** (keep questioning yourself).

---

### 🖼️ See — an argument map

```mermaid
flowchart TD
  CLAIM["🎯 Claim (qualified)"] --> R1["📌 Reason 1"]
  CLAIM --> R2["📌 Reason 2"]
  R1 --> E1["📊 Evidence"]
  R2 --> E2["📊 Evidence"]
  OBJ["⚔️ Strongest objection"] --> RESP["💬 Honest response<br/>(rebut · concede · narrow)"]
  RESP --> CLAIM
```

![The anatomy of a strong argument — generated diagram](../img/atom-5-build-and-defend-an-argument.png)

> 🖼️ *Generated image — produced from the prompt below.*

A reusable prompt to generate an on-brand version:

```prompt
Create a clean, modern "argument map" infographic: a qualified Claim at top, two Reasons branching
below, Evidence under each reason, and a side branch "Strongest objection → Honest response (rebut,
concede, or narrow)" feeding back into the claim. Use ADA brand colors (Indigo #1E2A6E, Turquoise
#15B5C6, Gold #E0A53C), light background, flat vector, legible sans-serif. 16:9.
```

---

### 🧪 Practice — *Build it, then defend it* (Essay + Simulation + Forum)

1. **Map & write.** Pick a position you hold. Build the full structure: claim, 2–4 reasons, evidence
   (verified), the **strongest** counterargument with your honest response, and a **qualified**
   conclusion. ~400–600 words.
2. **Simulate the defense.** Have a peer (or the AI) attack your argument hard. Respond in real time.
3. **Post & defend in the forum.** Share your argument; respond to ≥2 peers' challenges and challenge
   ≥2 others' arguments — using the steelman + Socratic habits from Atom 4.

> 🤝 **This is a behavioral-assessment occasion.** Mentors observe *how* you defend: Do you steelman
> challengers? Do you concede good points? Do you update your claim when the evidence warrants? Do you
> keep questioning your own position?

---

### ✅ Evaluate — Behavioral assessment (`behavioral`, Abilities)

Observed across this atom + the forum + the capstone (≥3 occasions):

| Ability | Look-for (evidence) |
| ------- | ------------------- |
| 🌱 Intellectual humility | Invites the strongest objections; concedes valid points; **revises** position when warranted; calibrates confidence |
| 🌱 Skeptical curiosity | Questions own assumptions; asks "what would prove me wrong?"; pursues the strongest version of every side |

Rated **Emerging / Developing / Proficient** on the behavioral rubric in [`rubrics.md`](rubrics.md)
(not a quiz — evidenced over time). The **argument quality** (structure, counterargument handling) is
scored on the `skill` rubric.

### 📦 Deliverable

- Your argument map + written argument, plus a short note: "what I changed after the defense, and why."

### 🧠 Final reflection

- What objection landed hardest? Did you update, narrow, or hold your claim — and was that the honest call?

### 🔗 Sources to verify (human-in-the-loop)

- Toulmin, *The Uses of Argument* (claim/grounds/warrant/rebuttal).
- Graff & Birkenstein, *They Say / I Say* (engaging counterarguments).
- *The Scout Mindset* (Galef) — calibration & intellectual humility.

### 🧩 Connections

- **Predecessor:** Atom 4. **Successor:** Atom 6 (apply the whole stack to a real, contested issue).
</script>
<script type="text/markdown" data-path="examples/critical-thinking-micro-credential/atoms/atom-6-capstone-reason-through-a-real-issue.md">## ⚛ Learning Atom 6 — *Capstone: Reason Through a Real Issue*

**Phase:** 🐵 4 · Collaboration & Reflection (*share*) · **KSA:** 🛠️ Skill + 🌱 Abilities
· **Target level:** L2 · **Rubric:** `capstone-5`

### 🎯 Learning objective

- **Integrate** the whole course: take a real, contested issue, evaluate the evidence on all sides,
  reach a **reasoned, calibrated conclusion**, and **defend** it under peer scrutiny.

### 🧭 Atom description

The capstone is a single deliverable that proves every component at once: you analyze a genuinely
contested claim/issue, deconstruct the strongest arguments on each side, verify the key evidence, build
your own reasoned position, address the strongest counterargument, and present + defend it in a
showcase + peer review — demonstrating intellectual humility and skeptical curiosity throughout.

---

### 🧪 The capstone task

**Pick a real, contested issue** where reasonable people disagree and evidence exists on multiple sides.
It should be something you can research but *haven't already firmly decided.* Examples:

- "Should our team adopt a 4-day work week?" / "Is remote work better for *this* role?"
- "Does this popular productivity claim actually hold up?" / "Is [a trending tech] over-hyped?"
- A contested claim in your field, or a real decision your org/community faces.

**Produce a "Reasoned Position Brief" (≈ 800–1,200 words or a short deck) with:**

1. **The question.** State the issue precisely and why it's genuinely contested.
2. **Steelman both sides.** Present the **strongest** argument for *each* position — fairly (Atom 4).
3. **Evaluate the evidence.** For the key claims on each side, assess evidence quality and flag
   fallacies/biases (Atoms 2–3). Verify the most important evidence laterally (Atom 4) and cite sources.
4. **Your reasoned position.** Build your argument: claim → reasons → evidence → strongest
   counterargument + honest response → **qualified** conclusion (Atom 5).
5. **What would change your mind.** State the evidence that would move you — and your confidence level.
6. **Reflection.** What did you believe at the start, and did your view shift? Where were you most
   wrong or most uncertain?

**Then present & defend:** a short showcase where peers/mentors challenge your reasoning, and you do at
least one structured **peer review** of someone else's brief.

---

### 🤝 Collaboration (Phase 4)

- **Showcase / defense:** present your brief; field the strongest objections live.
- **Async peer review:** review ≥1 peer's brief — steelman *their* view, then give one sharp,
  constructive challenge and one thing they reasoned well.

> 🌱 **Behavioral evidence:** the defense + peer review are key occasions for assessing **intellectual
> humility** (do you concede and update?) and **skeptical curiosity** (do you keep questioning,
> including yourself?).

---

### ✅ Evaluate — Capstone rubric (`capstone-5`)

| Criterion | Excellent (100–90%) | Competent (89–80%) | Developing (79–70%) | Beginning (≤69%) | Weight |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Issue framing & charity (steelman)** | Frames a genuinely contested issue precisely; steelmans *all* sides so fairly supporters would agree | Frames clearly; represents sides fairly | Frames loosely; one side is weak/strawmanned | Vague issue; one-sided | **20 pts** |
| **Evidence evaluation & verification** | Rigorously judges evidence quality, names fallacies/biases, verifies key evidence laterally with cited sources | Solid evaluation; sources mostly verified | Surface evaluation; little verification | Takes evidence at face value | **25 pts** |
| **Reasoning & argument construction** | Tight claim→reasons→evidence; engages the strongest counterargument honestly; conclusion is well-supported | Clear argument; addresses a counterargument | Loose structure; weak counterargument handling | Assertion without real support | **25 pts** |
| **Calibration & intellectual humility** | Confidence precisely matched to evidence; states what would change their mind; updates when warranted | Mostly calibrated; some openness | Over/under-confident; little openness | Unqualified certainty; no openness | **15 pts** |
| **Defense, peer review & curiosity** | Defends with poise, concedes valid points, asks sharp questions; peer review is fair and incisive | Defends and reviews competently | Minimal/ defensive engagement | Avoids challenge; no real review | **15 pts** |
| **TOTAL** | | | | | **100 pts** |

> **Pass = ≥80% overall + no criterion below Developing.** Earns the **🏅 Critical Thinker** badge
> (with `S-evaluate-arguments`, `S-question-verify`, `S-construct-argument` at L2 and both Abilities at
> L2 from behavioral evidence).

---

### 📦 Deliverable

- The **Reasoned Position Brief** + showcase/defense + one completed peer review.

### 🧠 Final reflection

- Where did your reasoning improve most across the course — evaluating others, verifying, or building
  your own argument? What's the one critical-thinking habit you'll keep using weekly?

### 🔗 Sources to verify (human-in-the-loop)

- See Atoms 1–5. Optionally: Galef, *The Scout Mindset*; Rapoport's rules for honest disagreement.

### 🧩 Connections

- **Predecessors:** Atoms 1–5 (this integrates all of them).
- **Pairs with:** [Problem Solving](../../problem-solving-micro-credential/README.md) (apply reasoning
  to decisions) and [Self-Learning](../../self-learning-micro-credential/README.md) (judge sources & AI).
</script>
<script type="text/markdown" data-path="examples/effective-communication-micro-credential/atoms/atom-1-how-communication-works.md">## ⚛ Learning Atom 1 — *How Communication Works*

**Phase:** 🙉 1 · Self-Guided Introduction (*hear*) · **KSA:** 🧠 Knowledge · **Target level:** L2
· **Component id:** `K-comm-model`

### 🎯 Learning objective

- **Explain** the communication process model and **name** the common barriers ("noise") that make
  messages fail.

### 🧩 Prerequisites

- None. Just situations where you've been misunderstood — we'll explain why.

### 🧭 Atom description

"Strong communication" sounds vague until you see the *mechanism*. This atom gives you a simple model
of how a message travels from one mind to another, and where it breaks. Once you can name the failure
points, you can fix them deliberately — that's the whole rest of the course.

---

### 📖 Reading — *A message is a relay, not a transfer* (≈ 6 min)

We like to think communication is **transferring** an idea from our head to someone else's. It isn't.
You **encode** an idea into words/tone/body language; it travels through a **channel**; the other
person **decodes** it through their own experience, mood, and assumptions. What they reconstruct is
never exactly what you meant — the question is how *close* you can get.

The classic **sender → message → channel → receiver → feedback** model (Shannon–Weaver, extended by
Schramm) adds two crucial ideas:

- **Noise** — anything that distorts the message: literal noise, jargon, vague words, a bad channel,
  stress, bias, distraction, cultural difference, or unstated assumptions.
- **Feedback** — the receiver's response that tells you whether it landed. Communication without
  feedback is just *broadcasting*; you don't actually know if you communicated.

A few consequences worth internalizing:

- **Meaning lives in the receiver, not the message.** "But I *said* it clearly" is irrelevant if they
  didn't reconstruct your meaning. Effectiveness is measured at *their* end.
- **Most conflict is decoding error**, not disagreement. People often agree but *think* they disagree
  because words carried different meanings.
- **You can only manage noise you can name.** That's why the next atoms target specific sources:
  wrong channel/audience (Atom 2), not listening (Atom 3), unstructured messages (Atom 4), and
  emotional noise in hard conversations (Atom 5).

A handy distinction: **verbal** (the words), **paraverbal** (tone, pace, volume), and **nonverbal**
(face, posture, gesture). When they conflict, people believe the nonverbal/paraverbal — so "I'm fine"
in a flat tone reads as *not* fine.

**Key takeaways**

- [ ] Communication is **encode → channel → decode → feedback**, not a clean transfer.
- [ ] **Noise** is anything that distorts the message; **feedback** confirms it landed.
- [ ] **Meaning is reconstructed by the receiver** — effectiveness is judged at their end.
- [ ] Verbal, paraverbal, and nonverbal must **align** or the nonverbal wins.

---

### 🎬 Watch — Communication, clearly explained (pick one, ~5–12 min)

```youtube
https://www.youtube.com/watch?v=eIho2S0ZahI
Julian Treasure — "How to speak so that people want to listen" (TED).
```

```youtube
https://www.youtube.com/watch?v=R1vskiVDwl4

```

  C -->|message| R["🧑 Receiver<br/>decodes idea"]

```

<script type="text/markdown" data-path="examples/effective-communication-micro-credential/atoms/atom-2-audience-and-channel.md">## ⚛ Learning Atom 2 — *Audience & Channel*

**Phase:** 🙉 1 · Self-Guided Introduction (*hear*) · **KSA:** 🧠 Knowledge · **Target level:** L2
· **Component id:** `K-audience-channel`

### 🎯 Learning objective

- **Analyze** an audience and **choose** an appropriate channel for a given message.

### 🧩 Prerequisites

- Atom 1 (the communication model) — channel and audience are two of the biggest noise sources.

### 🧭 Atom description

The same words can succeed or fail depending on *who* hears them and *how* they're delivered. A great
message sent on the wrong channel (a complex decision buried in a chat message; bad news by email) is
a failed message. This atom gives you two quick analyses to run before you communicate anything that
matters.

---

### 📖 Reading — *Right message, right person, right pipe* (≈ 7 min)

**1) Analyze the audience.** Before composing, answer four questions:

- **Who** are they (role, seniority, relationship to you)?
- **What do they already know** (so you don't over- or under-explain)?
- **What do they care about** (their goals, pressures, "what's in it for them")?
- **What do you want them to *do*** after (the call to action)?

Adapt vocabulary, level of detail, and framing to the answers. An exec wants the decision and the
"so what"; a teammate wants the how; a customer wants the benefit and reassurance.

**2) Choose the channel by *media richness*.** Channels differ in how much nuance they carry:

| Richness | Channel | Best for |
| -------- | ------- | -------- |
| 🔴 Richest | In-person / video call | emotion, conflict, negotiation, ambiguity, relationship building |
| 🟠 Rich | Phone / voice | quick nuance, tone matters, back-and-forth |
| 🟡 Lean | Chat / DM | quick coordination, simple questions, low stakes |
| 🟢 Leaner | Email | records, async detail, non-urgent, multiple recipients |
| 🔵 Leanest | Doc / announcement | one-to-many reference, durable information |

**Rules of thumb**

- **Match richness to stakes/ambiguity.** Emotional or ambiguous → richer (talk). Simple/record-worthy
  → leaner (write). *Hard feedback over chat* is the classic mismatch.
- **Sync vs. async.** Synchronous (call/meeting) for fast convergence and rapport; asynchronous
  (email/doc) to respect time, allow thinking, and create a record. Don't call a meeting an email
  could do — or email a decision a 5-minute call would settle.
- **Follow rich with lean.** After an important conversation, send a short written recap so the
  decisions persist and everyone decodes the same thing.

**Key takeaways**

- [ ] Run the **4-question audience analysis** (who · know · care · do) before composing.
- [ ] Match **channel richness** to the message's **stakes and ambiguity**.
- [ ] **Talk** for emotion/ambiguity; **write** for records/detail/many recipients.
- [ ] **Recap rich conversations in writing** so meaning persists.

---

### 🖼️ See — choosing a channel

```mermaid
flowchart TD
  Q1{"Emotional, sensitive,<br/>or ambiguous?"} -->|yes| RICH["🔴 Talk: in-person / video / call"]
  Q1 -->|no| Q2{"Need a record or<br/>many recipients?"}
  Q2 -->|yes| LEAN["🟢 Write: email / doc"]
  Q2 -->|no| Q3{"Quick & low-stakes?"}
  Q3 -->|yes| CHAT["🟡 Chat / DM"]
  Q3 -->|no| RICH
  RICH -.recap.-> LEAN
```

![Which channel should I use? — generated decision tree](../img/atom-2-audience-and-channel.png)

light background, flat vector, legible sans-serif. 16:9.

### 🧪 Practice — *Audience & channel worksheet*

For each scenario, write the **audience analysis (who/know/care/do)** and the **channel** you'd pick,
with one sentence of reasoning:

1. You must tell a teammate their part of the project slipped the deadline.
2. You're announcing a new process to 40 people.
3. You need a quick yes/no on a meeting time.
4. You're proposing a budget to a busy executive.

<details>
<summary>Sample key</summary>

1. **Talk** (video/in-person) — sensitive, relational; recap in writing after.
2. **Write** (doc/announcement) — one-to-many, durable reference; offer a Q&A channel.
3. **Chat** — quick, low-stakes.
4. **Write** a one-page BLUF memo (exec cares about decision + impact) → **then** a short meeting if
   needed. (You'll build that message in Atom 4.)

</details>

---

### ✅ Evaluate — Pop quiz (formative, `knowledge-mini`)

1. Which channel for delivering difficult, emotional news — and why?
2. What are the four audience-analysis questions?
3. Why send a written recap after an important meeting?

<details>
<summary>Answer key</summary>

1. A **rich** channel (in-person/video/call): emotion and ambiguity need tone, nuance, and immediate
   feedback.
2. **Who** they are · **what they know** · **what they care about** · **what you want them to do.**
3. So decisions **persist** and everyone **decodes the same meaning** (reduces later noise).

</details>

---

### 📦 Deliverable

- Your completed worksheet for the 4 scenarios (audience analysis + channel + reasoning).

### 🧠 Final reflection

- What's your *default* channel? Where does that default cost you (e.g., chatting things that deserve
  a call)?

### 🔗 Sources to verify (human-in-the-loop)

- Daft & Lengel, *Media Richness Theory*.
- Minto, *The Pyramid Principle* (audience-first structuring — preview of Atom 4).

### 🧩 Connections

- **Predecessor:** Atom 1. **Successors:** Atom 3 (listen to the audience), Atom 4 (structure for them).
</script>
<script type="text/markdown" data-path="examples/effective-communication-micro-credential/atoms/atom-3-active-listening.md">## ⚛ Learning Atom 3 — *Active Listening*

**Phase:** 🙈 2 · Visual Exploration (*see*) · **KSA:** 🛠️ Skill + 🌱 Ability · **Target level:** L2
· **Component ids:** `S-active-listening`, `A-empathy`

### 🎯 Learning objective

- **Listen actively** — attend fully, paraphrase, ask clarifying questions, and check understanding —
  while showing empathy for the speaker.

### 🧩 Prerequisites

- Atoms 1–2. A partner (or a willing colleague/friend) for the practice.

### 🧭 Atom description

Most people think communication is about *talking*. The highest-leverage skill is the opposite:
listening so well the other person feels understood. This atom is in Phase 2 (*see*) because you learn
listening best by **watching it modeled** and then **doing it** in a low-stakes pair. It builds a
Skill (a technique) *and* an Ability (empathy) at once.

---

### 🎬 Watch — what great listening looks like (~5–10 min)

```youtube
https://www.youtube.com/watch?v=R1vskiVDwl4
Celeste Headlee — "10 ways to have a better conversation" (TED).
```

```youtube
https://www.youtube.com/watch?v=saXfavo1OQo
"Active Listening" — a short skills explainer (verify before delivery).
```

---

### 📖 Reading — *Listening is a skill you perform* (≈ 6 min)

There are levels of listening: **ignoring → pretending → selective → attentive → empathetic**. Most
workplace listening stalls at "selective" (waiting to talk, half-listening). Active listening is a
deliberate performance with observable moves:

- **Attend.** Put the phone away, face them, make eye contact, leave a beat of silence. Your body says
  "you have my attention" before any word.
- **Paraphrase / reflect.** Say back the *content* in your words: *"So the deadline moved and now the
  test plan is at risk — is that right?"* This proves you decoded correctly and lets them correct you.
- **Name the feeling (empathy).** Reflect the *emotion*, tentatively: *"Sounds frustrating."* Naming
  emotion lowers it and signals you see the person, not just the task.
- **Ask open, clarifying questions.** Prefer "what" and "how" over "why" (why feels accusatory).
  *"What would make this easier?"* beats *"Why didn't you flag it?"*
- **Don't fix yet.** Resist jumping to solutions. People first need to feel heard; advice given too
  early reads as dismissal.
- **Check understanding.** Summarize and confirm before moving on or responding.

Two anti-patterns to kill: **the autobiographical hijack** ("Oh that happened to me too, when I…")
and **solution-first** (fixing before understanding). Both move the spotlight off the speaker.

> **Empathy vs. agreement.** Reflecting a feeling ("that sounds stressful") is *not* agreeing or
> conceding — it's acknowledging their experience. You can empathize and still disagree.

**Key takeaways**

- [ ] Active listening is **observable**: attend · paraphrase · name feeling · ask open Qs · check.
- [ ] **Paraphrasing** proves (and corrects) your decoding — the core move.
- [ ] **Name the emotion** to show empathy; it lowers the temperature.
- [ ] **Don't fix first.** Understand, then (if wanted) help.

---

### 🖼️ See — the active-listening loop

```mermaid
flowchart LR
  ATT["👂 Attend<br/>(full attention)"] --> PAR["🔁 Paraphrase<br/>content"]
  PAR --> EMP["💙 Name the feeling<br/>(empathy)"]
  EMP --> ASK["❓ Ask open<br/>clarifying questions"]
  ASK --> CHK["✅ Check<br/>understanding"]
  CHK -.loop.-> ATT
```

---

### 🧪 Practice — *Paired listening drill* (Role-Play + Pair)

In pairs, 12–15 minutes total:

1. **Speaker (3 min):** talk about a real (mild) frustration or a project decision.
2. **Listener:** use only active-listening moves — **no advice**. Paraphrase, name the feeling, ask
   open questions, check understanding.
3. **Swap.** Then debrief 2 min: *"When did you feel most understood?"*

Solo option: watch a 5-min interview, pause, and write the paraphrase + feeling-name + one open
question you'd offer.

---

### ✅ Evaluate — Skill mini-rubric (`skill`) + first behavioral occasion

Self/peer-score the drill:

| Criterion | Excellent (3) | Adequate (2) | Needs work (1) |
| --------- | ------------- | ------------ | -------------- |
| **Attending** | Full attention, no interrupting | Mostly attentive | Distracted / interrupts |
| **Paraphrasing** | Accurate, in own words; invites correction | Some reflecting | Repeats verbatim or none |
| **Empathy (🌱)** | Names feeling; speaker felt understood | Some acknowledgment | Jumps to self/solution |
| **Questions** | Open, clarifying, non-leading | Mix | Closed/leading only |

> Pass = 2+ each. This is **occasion 1 of 3** for the Ability `A-empathy` (also observed in Atoms 5–6).

### 📦 Deliverable

- A short note from your partner (or self-reflection) on **when they felt most understood**, plus the
  filled mini-rubric.

### 🧠 Final reflection

- Which move is hardest for you — staying silent, paraphrasing, or not fixing? Pick one to practice
  this week.

### 🔗 Sources to verify (human-in-the-loop)

- Covey, *The 7 Habits* — Habit 5, "Seek first to understand."
- Rogers & Farson, *Active Listening* (1957).
- Headlee, *We Need to Talk*.

### 🧩 Connections

- **Predecessor:** Atom 2. **Successors:** Atom 4 (now structure what *you* say), Atom 5 (listening
  under pressure).
</script>
<script type="text/markdown" data-path="examples/effective-communication-micro-credential/atoms/atom-4-structure-your-message.md">## ⚛ Learning Atom 4 — *Structure Your Message (BLUF · SBI · Pyramid)*

**Phase:** 🙊 3 · Applied Practice (*do*) · **KSA:** 🛠️ Skill · **Target level:** L2
· **Component id:** `S-structure-message`

### 🎯 Learning objective

- **Structure** a clear message — in writing and out loud — using **BLUF**, **SBI**, and the
  **Pyramid Principle**.

### 🧩 Prerequisites

- Atom 2 (audience analysis) — structure serves the audience.

### 🧭 Atom description

Clarity isn't a personality trait; it's a structure. Three reusable frameworks cover most workplace
messages: lead with the point (BLUF), give specific behavioral feedback (SBI), and organize support
top-down (Pyramid). This atom turns "I'll just wing the email/update" into a fast, repeatable move.

---

### 📖 Reading — *Three structures that make you clear* (≈ 8 min)

**1) BLUF — Bottom Line Up Front.** Put the conclusion / ask / decision in the **first sentence**,
then support it. Readers are busy and skim; burying the point in paragraph three guarantees it's
missed. Compare:

- 👎 *"Following up on yesterday's discussion, there were several considerations, and after looking
  into the vendor options and timelines… [200 words] …so we should probably go with Option B."*
- 👍 *"**Recommendation: choose Option B (ships 2 weeks sooner, same cost).** Details below."*

**2) The Pyramid Principle (Minto).** Structure any explanation top-down: **answer/main point →
grouped supporting arguments → evidence**. Each level summarizes the one below. It's BLUF applied
recursively, and it's how you turn a messy brain-dump into a logical flow. Use signposting: *"There
are three reasons… First… Second… Third…"*

**3) SBI — Situation · Behavior · Impact** (for feedback or describing an issue). Keep it specific
and non-judgmental:

- **Situation:** when/where — *"In this morning's standup…"*
- **Behavior:** the observable action (not character) — *"…you cut off Maria twice before she
  finished."*
- **Impact:** the effect — *"…so we lost her point and she went quiet for the rest of the meeting."*

SBI keeps feedback about **behavior**, not labels ("you're rude"), which is what makes it hearable.
(You'll use SBI live in Atom 5.)

**General clarity habits:** one idea per sentence; concrete words over abstractions; cut filler and
hedging; define jargon or drop it; end with a clear **call to action** ("Can you confirm by Friday?").
For spoken messages: state the headline, preview the structure ("two things"), then deliver.

**Key takeaways**

- [ ] **BLUF:** lead with the point/ask; support after.
- [ ] **Pyramid:** main point → grouped reasons → evidence; signpost the structure.
- [ ] **SBI:** Situation → Behavior (observable) → Impact — for issues/feedback.
- [ ] Always end with a **clear call to action.**

---

### 🖼️ See — the pyramid

```mermaid
flowchart TD
  TOP["🎯 Main point / answer / ask<br/>(BLUF)"] --> R1["Reason 1"]
  TOP --> R2["Reason 2"]
  TOP --> R3["Reason 3"]
  R1 --> E1["evidence"]
  R2 --> E2["evidence"]
  R3 --> E3["evidence"]
```

![The Pyramid Principle — generated diagram](../img/atom-4-structure-your-message.png)

> 🖼️ *Generated image — produced from the prompt below.*

A reusable prompt to generate an on-brand version:

```prompt
Create a clean, modern infographic of the "Pyramid Principle" for communication: a top box "Main
point / ask (BLUF)" connected down to three "Reason" boxes, each connected to an "Evidence" box.
Caption: "Lead with the answer, then group your support." Use ADA brand colors (Indigo #1E2A6E,
Turquoise #15B5C6, Gold #E0A53C), light background, flat vector, legible sans-serif. 16:9.
```

---

### 🧪 Practice — *Rewrite for clarity* (Worksheet + AI Prompt Question)

1. **BLUF rewrite.** Take a rambling update (yours or this one) and rewrite it so the **first
   sentence** carries the point; trim 30% of the words.
2. **Pyramid a recommendation.** Pick a small decision and structure it: main point → 3 reasons →
   evidence. Write it as a 5–6 line message.
3. **SBI draft.** Write one piece of feedback in strict SBI (situation, behavior, impact) — you'll
   deliver it in Atom 5.
4. **AI Prompt Question.** Ask an AI: *"Rewrite this message using BLUF and the Pyramid Principle, and
   point out where I buried the lead."* Critique its output — did it actually lead with the point?

---

### ✅ Evaluate — Performance task (`skill`)

Submit your BLUF rewrite + pyramid recommendation. Scored on:

| Criterion | Excellent (3) | Adequate (2) | Needs work (1) |
| --------- | ------------- | ------------ | -------------- |
| **Lead with the point** | Point/ask in sentence 1 | Point early | Buried |
| **Logical structure** | Clear pyramid; signposted | Mostly ordered | Rambling |
| **Concision & clarity** | Tight, concrete, jargon-managed | Some filler | Wordy/vague |
| **Call to action** | Specific & clear | Present | Missing |

> Pass = 2+ each → **L2** evidence for `S-structure-message`.

### 📦 Deliverable

- Your rewritten BLUF message, your pyramid recommendation, and your SBI feedback draft.

### 🧠 Final reflection

- Where do you tend to bury the lead — emails, updates, or asks? What's the cost when you do?

### 🔗 Sources to verify (human-in-the-loop)

- Minto, *The Pyramid Principle*.
- Center for Creative Leadership — *SBI feedback model*.
- US Army / general business usage — *BLUF*.

### 🧩 Connections

- **Predecessor:** Atom 3. **Successor:** Atom 5 (deliver SBI feedback live, under pressure).

<script type="text/markdown" data-path="examples/effective-communication-micro-credential/atoms/atom-5-feedback-and-difficult-conversations.md">## ⚛ Learning Atom 5 — *Feedback & Difficult Conversations*

**Phase:** 🙊 3 · Applied Practice (*do*) · **KSA:** 🛠️ Skill + 🌱 Ability · **Target level:** L2
· **Component ids:** `S-feedback-difficult`, `A-assertiveness`, `A-empathy`

### 🎯 Learning objective

- **Give and receive feedback** and **de-escalate a difficult conversation**, expressing your view
  assertively *and* respectfully.

### 🧩 Prerequisites

- Atom 3 (active listening) and Atom 4 (SBI). This is where they combine under pressure.

### 🧭 Atom description

This is the highest-stakes communication moment: telling someone something they may not want to hear,
or staying composed when *you're* on the receiving end. It fuses everything so far — listen (Atom 3),
structure with SBI (Atom 4), pick a rich channel (Atom 2) — and adds the **Abilities** of empathy and
assertiveness. It's practiced through role-play because you can't learn this from reading alone.

---

### 📖 Reading — *Candor with care* (≈ 8 min)

Two failure modes bracket difficult conversations: **aggression** (blunt, blaming — wins the point,
loses the person) and **avoidance** (sugarcoating or silence — keeps the peace, loses the truth).
**Assertiveness** is the middle: say the honest thing *and* protect the relationship.

A reliable structure for **giving feedback**:

1. **Ask permission / set context.** *"Can I share something about this morning?"* Invites, not ambushes.
2. **SBI.** Situation → observable Behavior → Impact (from Atom 4). Stay on behavior, not character.
3. **Pause & listen.** Hand them the mic; use active listening (Atom 3). Their view may change yours.
4. **Move forward together.** Agree a concrete next step. *"What would help?"*

Tools that lower the temperature:

- **"I" statements** over "you" accusations: *"I felt blocked when the update was late"* vs. *"You
  never update me."* "I" statements own your experience and are far harder to argue with.
- **Nonviolent Communication (NVC):** Observation → Feeling → Need → Request. *"When the deadline
  moved without a heads-up (observation), I felt anxious (feeling) because I need predictability to
  plan (need). Could we agree to flag slips within a day? (request)."*
- **Separate the person from the problem.** Attack the issue side by side, not each other.
- **Regulate first.** If you're flooded (heart pounding), name it and take a beat — *"I want to get
  this right; can we take five?"* You cannot listen or be precise while flooded.

**Receiving feedback** is also a skill: listen without defending, paraphrase to confirm you got it,
ask for specifics, thank them, then decide what to act on. Treat it as data, not a verdict.

> **Empathy + assertiveness are not opposites.** The goal is *"I respect you enough to be honest, and
> I care enough to be kind."* Reflect their view (empathy) *and* hold your own (assertiveness).

**Key takeaways**

- [ ] Aim for the middle: **assertive (honest) + respectful (kind)** — not aggressive or avoidant.
- [ ] Give feedback with **permission → SBI → listen → next step**.
- [ ] Use **"I" statements** and **NVC** (observation/feeling/need/request) to de-escalate.
- [ ] **Regulate yourself first**; receive feedback as **data**, not a verdict.

---

### 🖼️ See — the assertiveness middle path

```mermaid
flowchart LR
  AGG["😤 Aggressive<br/>wins point, loses person"] --- ASSERT["💪💙 Assertive + respectful<br/>honest AND kind"]
  ASSERT --- AVOID["🙈 Avoidant<br/>keeps peace, loses truth"]
  SBI["SBI + 'I' statements<br/>+ active listening"] --> ASSERT
```

![The assertiveness middle path — generated diagram](../img/atom-5-feedback-and-difficult-conversations.png)

> 🖼️ *Generated image — produced from the prompt below.*

A reusable prompt to generate an on-brand version:

```prompt
Create a clean, modern infographic showing a spectrum with three points: "Aggressive" (left),
"Assertive + Respectful" (center, highlighted), "Avoidant/Passive" (right). Below the center, list
tools: "I-statements, SBI, active listening, NVC". Caption: "Candor with care." Use ADA brand colors
(Indigo #1E2A6E, Turquoise #15B5C6, Gold #E0A53C), light background, flat vector, legible
sans-serif. 16:9.
```

---

### 🧪 Practice — *Difficult-conversation role-plays* (Role-Play + Simulation)

In trios (speaker · receiver · observer), run **three** 6–8 min scenarios so each person plays each
role at least once:

1. **Give feedback:** a teammate keeps missing handoffs (deliver your SBI draft from Atom 4).
2. **Receive feedback:** your "manager" says your updates are too vague — practice receiving well.
3. **De-escalate:** a "stakeholder" is upset about a delay — acknowledge, use NVC, agree a next step.

The **observer** scores against the rubric and gives SBI feedback afterward (meta-practice!).

---

### ✅ Evaluate — Behavioral assessment (`behavioral`)

Scored by the observer across the role-plays — this is a key occasion for the Abilities:

| Criterion | Excellent (3) | Adequate (2) | Needs work (1) |
| --------- | ------------- | ------------ | -------------- |
| **Assertiveness (🌱)** | Honest and clear; holds position calmly | Mostly clear | Aggressive or avoidant |
| **Empathy (🌱)** | Acknowledges feeling/need; person feels respected | Some acknowledgment | Dismissive |
| **Structure (🛠️)** | Clean SBI / "I" statements / NVC | Partial | Blame/labels |
| **Listening (🛠️)** | Paraphrases, asks, adjusts | Some | Talks over |
| **Repair** | Lands a concrete next step | Vague step | None |

> Pass = 2+ each. This is **occasion 2 of 3** for `A-empathy` and `A-assertiveness` (capstone is the 3rd).

### 📦 Deliverable

- The observer's completed rubric for your role-plays + a 3–4 sentence reflection on your hardest
  moment and how you handled it.

### 🧠 Final reflection

- Do you default to aggression or avoidance under pressure? What's your one cue to find the middle?

### 🔗 Sources to verify (human-in-the-loop)

- Stone, Patton & Heen, *Difficult Conversations* (Harvard Negotiation Project).
- Patterson et al., *Crucial Conversations*.
- Rosenberg, *Nonviolent Communication*.

### 🧩 Connections

<script type="text/markdown" data-path="examples/effective-communication-micro-credential/atoms/atom-6-communication-capstone.md">## ⚛ Learning Atom 6 — *Communication Capstone*

**Phase:** 🐵 4 · Collaboration & Reflection (*share*) · **KSA:** 🛠️ Skill + 🌱 Ability
· **Target level:** L2 · **Component ids:** `S-active-listening`, `S-structure-message`,
`S-feedback-difficult`, `A-empathy`, `A-assertiveness`

### 🎯 Learning objective

- **Deliver** a clear, structured message **and lead a real conversation** — listening actively and
  expressing yourself with empathy and appropriate assertiveness — then **reflect** and **peer-review**.

### 🧩 Prerequisites

- All prior atoms.

### 🧭 Atom description

The capstone is a single, realistic communication performance that integrates the whole course:
audience analysis + channel choice (Atoms 1–2), active listening (Atom 3), a structured message
(Atom 4), and assertive-yet-empathetic handling of a real exchange (Atom 5). It's delivered live (or
recorded) and reviewed by peers and a mentor.

---

### 🚀 The brief

> Pick a **real** communication you actually need to do (a project update, a proposal, a piece of
> feedback, a tough ask). **(1)** Plan it (audience + channel + structured message), **(2)** deliver
> it as a 3–5 minute spoken message or a written piece, and **(3)** lead the follow-up conversation —
> listening actively and handling at least one question, pushback, or hard moment. Then reflect and
> peer-review a classmate.

Keep it **real and modest**. The goal is a genuine, well-handled exchange you can explain — not a
TED talk.

---

### 📦 What to submit

- [ ] **A one-page plan** — audience analysis (who/know/care/do), chosen channel + why, and your
  message outlined with **BLUF + Pyramid** (and **SBI** if it's feedback).
- [ ] **The performance** — a recording, live observation, or the written piece + a transcript/notes
  of the follow-up conversation.
- [ ] **A reflection** (6–8 sentences) — what landed, one noise source you managed, and how you
  handled the hardest moment (empathy + assertiveness).
- [ ] **A peer review you gave** — apply the capstone rubric to a classmate's performance with
  specific, kind, useful (SBI) feedback.

---

### 🎤 Showcase / observation structure (≈ 5 minutes)

1. **Context** (30s) — the audience and why this channel.
2. **The message** (2–3 min) — deliver it, leading with the point.
3. **The conversation** (1–2 min) — field a question/pushback live; listen, then respond.
4. **One choice** (30s) — a deliberate communication choice you made and why.

---

### ✅ Evaluate — Capstone (`capstone-5`)

Graded with the standard 5-criteria Assessment Rubric in [`../rubrics.md`](rubrics.md) /
[`../capstone.md`](capstone.md). This is the **third and decisive occasion** for the Abilities
`A-empathy` and `A-assertiveness` (observed live), alongside the Skills.

### 📦 Deliverable

- Your plan + performance + reflection + the peer review you gave.

### 🧠 Final reflection

- Compare a conversation from week 1 to this one. What changed in *how you listen* and *how you say
  hard things*? Name one habit you'll keep practicing.

### 🔗 Sources to verify (human-in-the-loop)

- Anderson, *TED Talks: The Official TED Guide to Public Speaking* (for the spoken option).

### 🧩 Connections

- **Predecessor:** Atom 5. **Outcome:** 🏅 *Effective Communicator* badge → boosts almost any role
  (see [`../skills-map.md`](skills-map.md)).

<script type="text/markdown" data-path="examples/growth-mindset-micro-credential/atoms/atom-1-science-of-mindset.md">## ⚛ Learning Atom 1 — *The Science of Mindset*

**Phase:** 🙉 1 · Self-Guided Introduction (*hear*) · **KSA:** 🧠 Knowledge · **Target level:** L1
· **Component id:** `K-mindset-science`

### 🎯 Learning objective

- **Explain** the difference between a fixed and a growth mindset, and describe the
  neuroscience (neuroplasticity) that makes "abilities can grow" literally true.

### 🧩 Prerequisites

- None. Curiosity and a recent example of something you found hard to learn.

### 🧭 Atom description

Before you can *practice* a growth mindset, you need an accurate mental model of what it is —
and what it is not. This atom gives you the core science from the researchers who built the
field, so the rest of the course rests on evidence, not slogans.

---

### 📖 Reading — *What "mindset" actually means* (≈ 6 min)

> Author: ADA Methodology · concepts attributed to Carol Dweck and colleagues.

A **mindset** is a belief about where ability comes from. People with a more **fixed mindset**
tend to believe that intelligence and talent are largely *traits you either have or don't*.
People with a more **growth mindset** believe ability is more like a *muscle* — it grows with
effort, good strategy, and help from others. Almost nobody is purely one or the other; we each
hold a *blend* that shifts by domain ("I'm a math person but not a creative person") and by
situation (a public failure can push anyone toward the fixed end for a while).

Why does this belief matter? Because it changes **what you do when something gets hard** — the
exact moment that decides whether you learn. Carol Dweck's research at Stanford found that the
two mindsets produce different responses to difficulty:

- A **fixed** orientation treats a struggle as a *verdict*: "this is hard → maybe I'm not good
  at this → I should protect my image and stop." Effort feels like evidence of low ability, so
  feedback stings and challenges are avoided.
- A **growth** orientation treats the same struggle as *information*: "this is hard → I haven't
  learned it *yet* → what strategy or feedback do I need?" Effort is the path, feedback is fuel,
  and challenge is where the growth happens.

The biology backs this up. The brain is **neuroplastic**: when you practice something
difficult, neurons form and strengthen connections, and well-used pathways get myelinated so
signals travel faster. In other words, the discomfort of effortful practice is the *felt sense
of your brain physically rewiring*. This is why "I can't do this" is more accurately "I can't
do this **yet**."

A crucial nuance you'll go deeper on in Atom 2: a growth mindset is **not** "everyone can be
anything," "just try harder," or "praise all effort." It is a precise claim — *that ability is
developable, and that the response to difficulty (strategy + effort + help) is what develops
it.* Hold onto that precision; it's what separates a real practitioner from someone repeating a
poster.

**Key takeaways**

- [ ] Mindset = a belief about the *source* of ability (trait vs. developable).
- [ ] It's a *blend*, domain- and situation-specific — not a fixed label for a person.
- [ ] It matters because it changes behavior **at the point of difficulty**.
- [ ] Neuroplasticity makes "abilities can grow" a physical fact, not a metaphor.
- [ ] Growth mindset ≠ "try harder"; it = *developable ability + the right response to struggle.*

---

### 🎬 Watch — Carol Dweck, "The power of believing that you can improve" (TED, ~10 min)

```youtube
https://www.youtube.com/watch?v=_X0mgOOSpLU

```

```

```youtube
https://www.youtube.com/watch?v=JC82Il2cjqA
Khan Academy — "You Can Learn Anything" (90s; neuroplasticity framing).
```

---

![Two mindsets at the moment of difficulty — generated infographic](../img/atom-1-science-of-mindset.png)

> 🖼️ *Generated image — produced from the prompt below. Reuse this prompt with any image model to regenerate the on-brand visual.*

Split the canvas vertically into two columns that meet at a central icon of a brain with a

of cards: "This is hard" -> "Maybe I'm not good at this" -> "Protect my image" -> "Avoid /
quit". RIGHT column = "Growth mindset" using ADA brand colors (Indigo #1E2A6E, Turquoise
#15B5C6, Gold #E0A53C accents on dark Ink #0A1124); show: "This is hard" -> "I haven't learned

  DIFF --> GRO["🌱 Growth read:<br/>'information — not yet'"]

### ✅ Evaluate — Pop quiz (formative, `knowledge-mini`)

Answer, then check yourself against the key.

1. True/False: "A growth mindset means anyone can become anything if they try hard enough."
2. In one sentence, what *behavioral* difference shows up at the moment a task gets hard?
3. What does neuroplasticity have to do with the word **yet**?

<details>
<summary>Answer key</summary>

1. **False** — that's a common distortion. Growth mindset claims ability is *developable* via
   strategy + effort + help, not that outcomes are unlimited or guaranteed.
2. Fixed → avoids the challenge / withdraws effort / rejects feedback; growth → engages the
   challenge / invests effort / seeks and uses feedback.
3. Effortful practice physically strengthens and myelinates neural pathways, so "I can't" is
   better stated as "I can't **yet**" — the capacity is built by the practice itself.

</details>

---

### 📦 Deliverable

  "not yet," with the next strategy or source of help you'd try.* (Carries into Atom 3.)

  treated that exact moment as information instead of a verdict?

- Stanford **Mindset Kit** / PERTS — mindsetkit.org (practitioner resources).
- Blackwell, Trzesniewski & Dweck (2007), *Child Development* — the "brainology" study.
- MIT News / Brain & Cognitive Sciences — neuroplasticity & learning (verify a current piece).

<script type="text/markdown" data-path="examples/growth-mindset-micro-credential/atoms/atom-2-myths-and-nuance.md">## ⚛ Learning Atom 2 — *Myths & Nuance: the "false" growth mindset*

**Phase:** 🙈 2 · Visual Exploration (*see*) · **KSA:** 🧠 Knowledge · **Target level:** L1
· **Component id:** `K-mindset-nuance`

### 🎯 Learning objective

- **Distinguish** a real, evidence-based growth mindset from the watered-down "*false* growth
  mindset," and **explain** when and for whom mindset interventions actually move outcomes.

### 🧩 Prerequisites

- Atom 1 (the core science).

### 🧭 Atom description

The biggest risk with growth mindset is *shallow adoption* — turning a precise psychological
construct into a motivational poster. This atom inoculates you against the hype by going to the
primary evidence, including the researchers' own self-corrections and the large-scale trials
and meta-analyses that map the limits.

---

### 📖 Reading — *Three myths that quietly kill a growth mindset* (≈ 7 min)

> Author: ADA Methodology · grounded in Dweck & Yeager's later work and replication research.

**Myth 1 — "Growth mindset = praising effort."** Dweck has been explicit that *praising effort
alone*, especially when a learner is stuck, can become a consolation prize ("great effort!"
after failure with no path forward). Real practice praises **effort linked to strategy and
progress**: *"that approach didn't work — which other strategy, or whose help, gets you
unstuck?"* Effort without strategy is just noise; the mindset is about the **learning process**,
not cheerleading.

**Myth 2 — "I already have a growth mindset."** Dweck calls this the *false growth mindset*:
most of us claim it, then behave from the fixed end the moment our competence feels threatened —
when we're criticized, when a peer outshines us, when we fail publicly. A growth mindset isn't a
badge you own; it's a response you choose, repeatedly, under threat. Knowing your personal
**fixed-mindset triggers** is more useful than declaring you're "a growth-mindset person."

**Myth 3 — "Mindset fixes everything."** It doesn't. Large studies show the effect is **real
but bounded**. The *National Study of Learning Mindsets* (Yeager et al., 2019, *Nature*) ran a
short online growth-mindset intervention across a nationally representative sample of U.S. high
schools and found a *modest but meaningful* improvement in grades — concentrated among
**lower-achieving students** and strongest where the **school culture** supported the message
(peers and norms made challenge-seeking safe). Meta-analyses (e.g., Sisk et al., 2018) likewise
find **small average effects** that are **larger for at-risk and disadvantaged learners**. The
honest summary: mindset is a *lever*, not a magic wand — most powerful for those facing real
barriers, and only when the surrounding environment makes effort and help-seeking safe.

**Why a professional should care.** In a team, your mindset is *contagious through systems*: how
you respond to a teammate's mistake, whether feedback is treated as attack or asset, whether
"I don't know yet" is sayable. The organizational research is blunt about this — culture either
amplifies or silences individual growth mindset.

**Key takeaways**

- [ ] Praise **strategy + progress**, not raw effort or innate talent.
- [ ] Everyone has **fixed-mindset triggers**; naming yours beats claiming a label.
- [ ] Effects are **real but modest**, **largest for at-risk learners**, and **culture-dependent**.
- [ ] Your individual mindset shapes a **team's** psychological safety to struggle out loud.

---

### 📖 Reading — Evidence & industry context (skim the primary sources)

- **Stanford / *Nature* (2019):** Yeager, Dweck et al., *A national experiment reveals where a
  growth mindset improves achievement.* The canonical large-scale RCT.
- **Meta-analysis (2018):** Sisk, Burnette et al., *To what extent and under which circumstances
  are growth mindsets important to academic achievement?* — *Psychological Science.*
- **Dweck & Yeager (2019):** *Mindsets: A View From Two Eras*, *Perspectives on Psychological
  Science* — the field's own maturation and caveats.
- **McKinsey (2020):** Brassey, van Dam et al., *The most fundamental skill: Intentional
  learning and the career advantage* — why a deliberate learning stance is an economic edge.
- **BCG / Accenture:** reskilling and learning-culture reports (e.g., Accenture, *"It's
  learning. Just not as we know it."*) — the business case for a learning workforce.
- **Y Combinator / Paul Graham:** *How to Do Great Work* (2023) — curiosity, persistence, and
  treating not-knowing as the start of the work, in a builder's voice.

> ⚠️ Verify each link, edition, and license before delivery (human-in-the-loop).

---

```youtube
https://www.youtube.com/watch?v=U9FBpJVwsps
The "Learning Zone vs. Performance Zone" — why always performing blocks improvement.
```

---

<script type="text/markdown" data-path="examples/growth-mindset-micro-credential/atoms/atom-3-power-of-yet.md">## ⚛ Learning Atom 3 — *The Power of Yet: a reframing protocol*

**Phase:** 🙈 2 · Visual Exploration (*see*) → first reps · **KSA:** 🛠️ Skill · **Target level:** L2
· **Component id:** `S-yet-reframe`

### 🎯 Learning objective

- **Apply** a concrete "power of yet" reframing move that converts a fixed-mindset reaction into
  a next learning action — on a *real* setback, on demand.

### 🧩 Prerequisites

- Atoms 1–2. A current, genuine struggle you can practice on.

### 🧭 Atom description

Knowledge doesn't change behavior; a **rehearsed move** does. This atom turns the science into a
4-step protocol you can run in under two minutes whenever you hit a wall. It's the first thing in
this course you'll be assessed on *doing*, not *knowing*.

---

### 🖼️ See — Mental model: the **YET Loop**

![The YET Loop mental model — generated diagram](../img/atom-3-power-of-yet.png)

> 🖼️ *Generated image — produced from the prompt below.*

```prompt
Create a circular "loop" diagram titled "The YET Loop". Four nodes around a circle connected by
arrows, each with a small icon: 1) "NAME the fixed thought" (icon: thought bubble), 2) "ADD the
word 'yet'" (icon: small gold key), 3) "CHOOSE one strategy or source of help" (icon: compass),
4) "TAKE the smallest next action" (icon: footstep). Center label: "YET". Use ADA brand colors
(Indigo #1E2A6E nodes with white text, Turquoise #15B5C6 arrows, one Gold #E0A53C accent on the
'yet' step). Flat vector, clean, high contrast, dark Ink #0A1124 background. Square 1:1.
```

```mermaid
flowchart LR
  N1["1 · NAME<br/>the fixed thought"] --> N2["2 · ADD 'yet'<br/>reframe the claim"]
  N2 --> N3["3 · CHOOSE<br/>one strategy / source of help"]
  N3 --> N4["4 · ACT<br/>smallest next step"]
  N4 -. repeat on next wall .-> N1
```

**The protocol, in words**

1. **Name** the fixed thought out loud or on paper, verbatim: *"I'm just not good at public
   speaking."* (Naming it strips its authority.)
2. **Add "yet"** to convert a verdict into a status: *"I'm not good at public speaking **yet**."*
   "Yet" smuggles in time, growth, and agency.
3. **Choose one** strategy or source of help — not ten. *"I'll record a 2-minute version and get
   one piece of feedback from Priya."* Strategy + help is the part Atom 2 said most people skip.
4. **Act** on the smallest next step *today*. Momentum, not a master plan, breaks the fixed
   spiral.

---

### 🎬 Watch — Demo screencast: running the YET Loop live (~5 min)

```youtube
https://www.youtube.com/watch?v=pN34FNbOKXc
Eduardo Briceño / Mindset Works — "The Power of belief: mindset and success" (model the reframe).
```

> real example from your team — modeling beats explaining.

| Fixed thought (verbatim) | + "yet" reframe | One strategy / source of help | Smallest next action (today) |
| ------------------------ | --------------- | ----------------------------- | ---------------------------- |
| *e.g. "I can't read this codebase."* | *"…can't read this codebase **yet**."* | *Pair with the module owner for 20 min* | *Open the entry file; map 3 functions* |
| | | | |
| | | | |
| | | | |

**AI rehearsal (optional):**

```prompt

YET Loop: make me (1) restate it with "yet", (2) propose exactly ONE strategy AND one specific
person/resource for help, (3) commit to the smallest action I can finish today. Reject vague
strategies ("study more") and push for specifics. Then have me run it again on a second thought.
```

---

### ✅ Evaluate — Skill mini-rubric

| Criterion | Excellent (3) | Adequate (2) | Needs improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Accurate reframe** | "Yet" used to change a *verdict* into a *status*, not as filler | Reframe present but generic | Restates the complaint; no real shift |
| **Strategy + help** | One *specific* strategy **and** a named person/resource | Strategy or help, but vague | Missing or "just try harder" |
| **Actionability** | Next step is concrete and doable *today* | Doable but fuzzy/large | No real next step |

> Pass = **2+ on every criterion across all three rows.** This is your first **L2 Skill**
> evidence for `S-yet-reframe`.

---

### 📦 Deliverable

  Atom 5 (use it on real failure).

<script type="text/markdown" data-path="examples/growth-mindset-micro-credential/atoms/atom-4-deliberate-practice-lab.md">## ⚛ Learning Atom 4 — *The Deliberate-Practice Lab*

**Phase:** 🙊 3 · Applied Practice (*do*) · **KSA:** 🛠️ Skill · **Target level:** L2
· **Component id:** `S-deliberate-practice`

### 🎯 Learning objective

- **Design and run** a deliberate-practice loop on a real skill: a stretch target, focused reps,
  immediate feedback, and a correction — proving the mindset by *operationalizing* it.

### 🧩 Prerequisites

- Atoms 1–3 (you can already run the YET Loop).

### 🧭 Atom description

A growth mindset without a *method* stalls at motivation. **Deliberate practice** (Anders
Ericsson's research) is that method: it's not "more hours," it's a tight loop of *edge-of-ability
targets + full attention + immediate feedback + correction*. This lab makes the loop concrete on
a skill you actually need.

---

### 📖 Reading — *Deliberate practice, minus the 10,000-hour myth* (≈ 6 min)

> Author: ADA Methodology · grounded in Ericsson & Pool, *Peak* (2016), and Ericsson, Krampe &
> Tesch-Römer (1993).

Popular culture compressed Ericsson's work into "10,000 hours" — and got it wrong. The hours
were a *correlation in one study of violinists*, not a magic threshold, and Ericsson spent years
correcting it. The real finding is about the **structure** of practice, not the volume. Ordinary
practice plateaus: once you can do something "well enough," autopilot takes over and you stop
improving even with years of repetition (think of your driving). **Deliberate practice** breaks
the plateau with four ingredients:

1. **A specific stretch target** just beyond your current reliable ability — concrete enough to
   tell if you hit it (*"land the talk's opening in 30s without filler words,"* not "get better
   at speaking").
2. **Focused repetition** with full attention — short, intense, deliberate reps, not background
   grinding.
3. **Immediate, specific feedback** — from a coach, a rubric, a recording, tests, or a metric —
   so error is visible *now*.
4. **Correction** — adjust the next rep based on the feedback. Feedback you don't act on is
   trivia.

This is where mindset becomes muscle: the loop *requires* you to seek the edge (challenge), treat
errors as data (failure = learning), and use feedback (coachability). McKinsey's work on
*intentional learning* makes the same point for careers — the differentiator isn't talent, it's
turning everyday work into reps with feedback. Y Combinator gives founders the builder's version:
ship, measure, learn, iterate — a deliberate-practice loop pointed at a product.

**Key takeaways**

- [ ] "10,000 hours" is a myth; **structure** beats volume.
- [ ] The loop = *stretch target → focused reps → immediate feedback → correction.*
- [ ] Ordinary practice plateaus; deliberate practice keeps you at the edge on purpose.
- [ ] The loop *is* a growth mindset, made operational.

---

### 🧪 Practice — The Lab (Lab + Pair Programming)

Run **two full loops** on a real skill you need in your role.

- **Step 4 — Correction:** write the single change you'll make.
- **Step 5 — Rep 2:** do it again with the correction. Capture feedback again.
- **Pair step:** swap with a partner — you observe their loop and give feedback against the

<script type="text/markdown" data-path="examples/growth-mindset-micro-credential/atoms/atom-5-failure-resume-feedback.md">## ⚛ Learning Atom 5 — *Failure Résumé & Feedback Seeking*

**Phase:** 🙊 3 (*do*) → 🐵 4 (*share*) · **KSA:** 🌱 Ability · **Target level:** L2→L3
· **Component id:** `A-growth-mindset` (+ `A-adaptability`)

### 🎯 Learning objective

- **Demonstrate** growth-mindset *behavior*: reinterpret real failures as learning, and
  proactively seek challenging feedback — across more than one occasion, with peers watching.

### 🧩 Prerequisites

- Atoms 1–4. Willingness to be a little uncomfortable in front of peers (that's the point).

### 🧭 Atom description

You can't quiz your way to an attitude. This atom builds the **Ability** through two authentic,
slightly vulnerable acts that high performers do on purpose: writing a **failure résumé** and
**actively soliciting hard feedback** — then sharing both with a peer group. This is your first
*behavioral* evidence, assessed across occasions.

---

### 📖 Reading — *Why the best professionals collect their failures* (≈ 5 min)

> Author: ADA Methodology.

Most résumés are highlight reels. A **failure résumé** (popularized by Stanford's Tina Seelig
and economist Johannes Haushofer, who published his own) is the inverse: a deliberate record of
rejections, flops, and dead ends — *plus what each one taught you.* Writing one does three
things. It **normalizes failure** as the cost of attempting hard things (if your résumé has no
failures, you haven't reached far enough). It **converts events into data** — the core
growth-mindset move from Atom 1, now applied to your own history. And it **builds the muscle of
saying it out loud**, which is what makes feedback-seeking possible.

**Feedback seeking** is the second behavior, and it's a stronger signal of a growth mindset than
feedback *receiving*. Research on feedback-seeking behavior shows that people who actively ask
for critical input learn and adapt faster — but most of us avoid it because, in the moment, it
threatens our competence image (the fixed trigger from Atom 2). The fix is structural: ask a
**specific** question to a **specific** person at a **specific** time, so it's easy to give and
hard to dodge. *"What's one thing I could have done better in that review?"* beats *"any
feedback?"* every time.

The workplace stakes are real: McKinsey, BCG, and Accenture all tie organizational performance
to a *learning culture* where people surface mistakes and ask for help without fear. You can't
control the whole culture — but you can be the person who models it.

**Key takeaways**

- [ ] A failure résumé turns your own history into learning data and normalizes reaching far.
- [ ] **Seeking** feedback signals growth mindset more than passively receiving it.
- [ ] Make feedback easy to give: specific question + specific person + specific moment.
- [ ] Modeling this behavior quietly upgrades your team's psychological safety.

---

### 🎬 Watch — Failure & feedback as fuel

```youtube
https://www.youtube.com/watch?v=H14bBuluwB8
Angela Duckworth — "Grit: the power of passion and perseverance" (TED) — persistence + learning.
```

```youtube
https://www.youtube.com/watch?v=FWTNMzK9vG4
Sheila Heen — "How to use others' feedback to learn and grow" (receiving feedback well).
```

---

### 🖼️ See — Template: the Failure Résumé

![Failure résumé template — generated graphic](../img/atom-5-failure-resume-feedback.png)

> 🖼️ *Generated image — produced from the prompt below.*

```prompt

icon and title "Failure Résumé — a record of reaches and lessons". Below, a 3-column table
styled like a résumé: column 1 "The reach / attempt", column 2 "What went wrong", column 3
"What it taught me → next reach". Add a sidebar callout: "If there are no failures here, aim
higher." Use ADA brand colors (Indigo #1E2A6E headers, Turquoise #15B5C6 rules, Gold #E0A53C
accent on the callout) on white, flat vector, professional, legible. A4 portrait.
```

---

### 🧪 Practice — Two behavioral acts (Project Task + Study Group)

**Act 1 — Write your Failure Résumé (occasion 1).** List 4–6 real reaches that didn't work out
(a rejected proposal, a missed deadline, a skill you bailed on). For each, add *what it taught
you* and *the next reach it points to.* No sugar-coating, no false modesty.

| The reach / attempt | What went wrong | What it taught me → next reach |
| ------------------- | --------------- | ------------------------------ |
| | | |
| | | |
| | | |

**Act 2 — Run a real feedback-seeking ask (occasion 2).** Pick something you did recently. Ask
**one specific person** a **specific** question within 48 hours. Record: the question you asked,
what you heard, and the one change you'll make. Resist defending yourself — your job is to
collect data.

**Share (Study Group).** Bring both to a small peer group (3–5 people). Each person reads one
failure-résumé line aloud and shares one piece of feedback they sought. Peers give *supportive
challenge*, not comfort. (occasion 3)

---

### ✅ Evaluate — Behavioral assessment (`ability-behavioral`)

| Criterion | Excellent (3) | Adequate (2) | Needs improvement (1) |
| --------- | ------------- | ------------ | --------------------- |
| **Failure as data** | Names real failures *and* the specific learning + next reach | Lists failures, thin on learning | Vague, defensive, or sanitized |
| **Feedback seeking** | Specific ask to a specific person; acted on it | Asked, but generic or unacted | Avoided / only received passively |
| **Out-loud vulnerability** | Shared candidly; gave peers supportive challenge | Shared with hedging | Withheld / deflected |
| **Across occasions** | Behavior consistent across all 3 occasions | 2 of 3 | Only when pushed |

> This produces **behavioral evidence** toward `A-growth-mindset` **L2→L3**. The Ability is not
> certified here alone — Atom 6 sustains it across weeks.

---

### 📦 Deliverable

- Failure résumé (4–6 lines) + a feedback-seeking log (question / response / change) + a
  one-line peer reflection from the study group.

### 🧠 Final reflection

- Which was harder — writing the failures or asking for the feedback? What does that tell you
  about your fixed-mindset triggers?

### 🔗 Sources to verify

- Tina Seelig (Stanford d.school) on the "failure résumé" · Johannes Haushofer's published "CV
  of Failures" · Stone & Heen, *Thanks for the Feedback* · feedback-seeking behavior research
  (Ashford et al.).

### 🧩 Connections

- **Predecessors:** Atoms 1–4. **Successors:** Atom 6 / capstone (sustain across 21 days + 360).
